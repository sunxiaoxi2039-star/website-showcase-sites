<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型查看器</title>
<link rel="icon" href="data:,">
<!-- 展示页「资产」区点开才加载的实时查看器：?src=模型路径&yaw=朝向（度）。
     和章节的实时场景共用「全页只开 1 个 iframe」的规则，所以它自己就是一个独立页面。 -->
<style>
  html, body { margin: 0; height: 100%; background: #10141a; color: #ece6da; font: 12px/1.4 -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #info { position: absolute; right: 10px; bottom: 10px; padding: 6px 10px; border-radius: 99px; background: rgba(0,0,0,.5); color: rgba(236,230,218,.75); pointer-events: none; }
  #info:empty { display: none; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(236,230,218,.7); pointer-events: none; }
  /* 绑过骨的模型：左上角一排动作按钮 */
  #clips { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  #clips button { font: inherit; color: rgba(236,230,218,.85); background: rgba(0,0,0,.5); border: 1px solid rgba(236,230,218,.25);
    border-radius: 99px; padding: 5px 11px; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
  #clips button:hover { border-color: rgba(236,230,218,.6); }
  #clips button[aria-pressed="true"] { background: #e8c27a; color: #1a140a; border-color: #e8c27a; }
  #clips button:focus-visible { outline: 2px solid #e8c27a; outline-offset: 2px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="msg">加载模型中…</div>
<div id="info"></div>
<div id="clips" role="group" aria-label="切换动作" hidden></div>
<script>
  // three.js 走 CDN：CDN 连不上时模块脚本根本不会执行，这里 20 秒后给一句说明，不让人一直等
  setTimeout(() => { const m = document.getElementById('msg'); if (m && !window.__viewerStarted) m.textContent = '三维库没加载上（需要能访问 jsDelivr），点「停止」回到转台录像'; }, 20000);
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

window.__viewerStarted = true;
const q = new URLSearchParams(location.search);
const src = q.get('src');
const yaw = THREE.MathUtils.degToRad(parseFloat(q.get('yaw')) || 0);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// 输出 sRGB + ACES 色调映射 + PMREM 环境光：和第 6 条 v3 游戏里用的是同一套设置
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#10141a');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight('#fff1dc', 2.2);
sun.position.set(3, 6, 4); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
scene.add(sun, new THREE.HemisphereLight('#bcd0ff', '#1a1510', 0.5));
const ground = new THREE.Mesh(new THREE.CircleGeometry(4, 64), new THREE.ShadowMaterial({ opacity: 0.35 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = !reduced && q.get('spin') !== '0';   // ?spin=0：不自动转（截图对朝向用） controls.autoRotateSpeed = 1.2;

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const msg = document.getElementById('msg'), info = document.getElementById('info');
if (!src) { msg.textContent = '没有指定模型'; }
else new GLTFLoader().load(src, (gltf) => {
  const model = gltf.scene;
  model.rotation.y = yaw;
  let tris = 0;
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
  });
  // 缩放到高 2 个单位，脚底落在地面，镜头按包围盒取景
  const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3());
  model.scale.setScalar(2 / Math.max(size.x, size.y, size.z));
  const b2 = new THREE.Box3().setFromObject(model), c = b2.getCenter(new THREE.Vector3());
  model.position.set(-c.x, -b2.min.y, -c.z);
  scene.add(model);
  const h = b2.max.y - b2.min.y;
  const r = b2.getBoundingSphere(new THREE.Sphere()).radius;
  const dist = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * (camera.aspect < 1 ? 1.35 : 1.08);
  controls.target.set(0, h * 0.48, 0);
  camera.position.copy(new THREE.Vector3(0.55, 0.28, 0.8).normalize().multiplyScalar(dist)).add(controls.target);
  msg.remove();
  info.textContent = `${Math.round(tris).toLocaleString()} 面 · 拖动旋转，滚轮缩放`;
  if (gltf.animations.length) initClips(model, gltf.animations);
  console.info('[viewer] loaded', src, Math.round(tris), gltf.animations.length ? `${gltf.animations.length} clips` : '');
}, undefined, (err) => { msg.textContent = '模型加载失败'; console.warn('[viewer] load failed', src, err?.message || err); });

// 绑过骨的模型：每段动作一个按钮，切换时 0.35 秒交叉淡入淡出。减弱动效时不自动播放，点了才动。
const CLIP_ZH = { idle: '待机', walk: '走', run: '跑', dodge: '闪避', die: '倒下', cheer: '欢呼', attack: '蓄力砸地' };
let mixer = null;
function initClips(model, clips) {
  mixer = new THREE.AnimationMixer(model);
  const bar = document.getElementById('clips');
  let current = null;
  const play = (clip, btn) => {
    const next = mixer.clipAction(clip);
    if (current && current !== next) { next.reset().play(); current.crossFadeTo(next, 0.35, false); }
    else next.reset().play();
    current = next;
    for (const b of bar.children) b.setAttribute('aria-pressed', String(b === btn));
  };
  for (const clip of clips) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = CLIP_ZH[clip.name] || clip.name; b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => play(clip, b));
    bar.appendChild(b);
  }
  bar.hidden = false;
  if (!reduced) play(clips.find((c) => c.name === 'idle') || clips[0], bar.children[clips.findIndex((c) => c.name === 'idle')] || bar.children[0]);
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), 0.1); if (mixer) mixer.update(dt); controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
