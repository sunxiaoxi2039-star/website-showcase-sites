<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prehistoric Island — Interactive 3D</title>
<link rel="icon" href="data:,">
<style>
  :root{--glass:rgba(16,22,20,.62);--line:rgba(255,255,255,.14);--ink:#eef3ea;--dim:#aab8a8;--acc:#e8b86a;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1210;font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .glass{background:var(--glass);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  #brand{position:fixed;left:14px;top:12px;padding:8px 12px;pointer-events:none}
  #brand b{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  #brand span{color:var(--dim);font-size:11px}
  #card{position:fixed;left:14px;top:66px;width:230px;padding:10px 12px}
  #card h3{margin:0 0 2px;font-size:14px}
  #card .meta{color:var(--dim);font-size:11px}
  #card .state{margin:6px 0 8px;font-size:12px}
  #card .state i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7fd37f;margin-right:6px;vertical-align:1px}
  #card .row{display:flex;gap:6px}
  #bar{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));margin:0 auto;width:fit-content;max-width:calc(100% - 16px);display:flex;gap:6px;align-items:center;padding:6px;overflow-x:auto;scrollbar-width:none}
  #bar::-webkit-scrollbar{display:none}
  .grp{display:flex;gap:3px;align-items:center;padding-right:6px;border-right:1px solid var(--line)}
  .grp:last-child{border-right:0;padding-right:0}
  button,select{font:inherit;font-size:12px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;height:30px;padding:0 10px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
  button:hover,select:hover{background:rgba(255,255,255,.14)}
  button.on{background:rgba(232,184,106,.28);border-color:rgba(232,184,106,.7);color:#fff}
  select{max-width:170px;padding:0 6px}
  select option{background:#1a2320;color:#eee}
  #env{position:fixed;right:14px;bottom:62px;width:240px;padding:10px 12px}
  #env label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0;font-size:12px}
  #env input[type=range]{width:130px;accent-color:var(--acc)}
  #env h4{margin:0 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  #toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);padding:7px 14px;opacity:0;transition:opacity .35s;pointer-events:none;font-size:12px;max-width:80vw;text-align:center}
  #toast.show{opacity:1}
  #hint{position:fixed;right:14px;top:14px;padding:7px 11px;font-size:11px;color:var(--dim);transition:opacity .6s}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#0b1210;z-index:10;transition:opacity .6s}
  #loading div{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  #err{position:fixed;left:14px;bottom:62px;max-width:420px;padding:8px 12px;color:#ffb4a8;display:none;font-size:12px}
  [hidden]{display:none!important}
  @media (max-width:760px){
    #brand{top:8px;left:8px;padding:6px 10px}
    #brand span{display:none}
    #card{top:48px;left:8px;width:200px}
    #hint{display:none}
    #env{right:8px;left:8px;width:auto;bottom:58px}
    button,select{height:32px;padding:0 9px}
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<body>
<canvas id="c"></canvas>
<div id="brand" class="glass"><b>Prehistoric Island</b><span>Field Research Station · live simulation</span></div>
<div id="card" class="glass" hidden>
  <h3 id="cName">—</h3>
  <div class="meta" id="cMeta">—</div>
  <div class="state"><i id="cDot"></i><span id="cState">Idle</span></div>
  <div class="row"><button id="cFollow">Follow</button><button id="cClose">Deselect</button></div>
</div>
<div id="hint" class="glass">Drag to orbit · Scroll / pinch to zoom · Click a dinosaur or a nest</div>
<div id="toast" class="glass"></div>
<div id="err" class="glass"></div>
<div id="env" class="glass" hidden>
  <h4>Environment</h4>
  <label>Rain <input id="sRain" type="range" min="0" max="1" step="0.01" value="0"></label>
  <label>Wind <input id="sWind" type="range" min="0" max="1" step="0.01" value="0.35"></label>
  <label>Volcano <input id="sVolc" type="range" min="0" max="1" step="0.01" value="0.25"></label>
  <h4 style="margin-top:10px">Audio</h4>
  <label>Music <button id="bMusic2">On</button></label>
  <label>Volume <input id="sVol" type="range" min="0" max="1" step="0.01" value="0.6"></label>
</div>
<div id="bar" class="glass">
  <div class="grp"><select id="sel" aria-label="Select dinosaur"></select><button id="bFollow">Follow</button><button id="bView">View</button></div>
  <div class="grp"><button id="bFood">Place food</button><button id="bFoodType">Plants</button></div>
  <div class="grp"><button id="bDrink">Drink</button><button id="bRest">Rest</button><button id="bCall">Call</button><button id="bHerd">Herd</button></div>
  <div class="grp"><button id="bHatch">Hatch</button><button id="bSurface">Surface</button></div>
  <div class="grp"><button data-time="day" class="on">Day</button><button data-time="sunset">Sunset</button><button data-time="night">Night</button></div>
  <div class="grp"><button id="bEnv">Weather</button><button id="bMusic">Music</button></div>
  <div class="grp"><button id="bPause">Pause</button><button id="bReset">Reset</button></div>
</div>
<div id="loading"><div>Growing the island…</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = id => document.getElementById(id);
function showError(msg){ const e=$('err'); e.style.display='block'; e.textContent='⚠ '+msg; }
addEventListener('error', e => showError(e.message || 'Unexpected error'));
addEventListener('unhandledrejection', e => showError(String(e.reason)));

/* ------------------------------------------------------------------ utils */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const damp=(a,b,k,dt)=>a+(b-a)*(1-Math.exp(-k*dt));
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rand=mulberry32(20260924);
const R=(a,b)=>a+(b-a)*rand();
const PERM=new Uint8Array(512);{const p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(rand()*(i+1));[p[i],p[j]]=[p[j],p[i]];}for(let i=0;i<512;i++)PERM[i]=p[i&255];}
const hash2=(x,y)=>PERM[(PERM[x&255]+y)&255]/255;
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return(a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v)*2-1;}
function fbm(x,y,o=4){let s=0,a=0.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=0.5;}return s;}
const hexRGB=h=>{const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];};
const mixRGB=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const V3=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const UP=V3(0,1,0);
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const isMobile=matchMedia('(max-width: 760px)').matches||/Mobi|Android/i.test(navigator.userAgent);

function canvasTex(w,h,draw,{repeat=[1,1],srgb=true,clampEdge=false}={}){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=clampEdge?THREE.ClampToEdgeWrapping:THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1]);
  if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;
}
function prep(geo,hex,jit=0){
  const g=geo.index?geo.toNonIndexed():geo;
  if(!g.getAttribute('uv'))g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(g.getAttribute('position').count*2),2));
  if(hex!==undefined){const c=new THREE.Color(hex);const n=g.getAttribute('position').count;const a=new Float32Array(n*3);
    for(let i=0;i<n;i+=3){const k=1+(rand()-0.5)*jit;for(let j=0;j<3&&i+j<n;j++){a[(i+j)*3]=c.r*k;a[(i+j)*3+1]=c.g*k;a[(i+j)*3+2]=c.b*k;}}
    g.setAttribute('color',new THREE.BufferAttribute(a,3));}
  return g;
}

/* --------------------------------------------------------------- renderer */
const canvas=$('c');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});}
catch(e){$('loading').innerHTML='<div>WebGL is not available in this browser.</div>';throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1.5:1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xc3dbea,0.0022);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.3,2400);
const HOME_POS=V3(96,64,112), HOME_TGT=V3(0,3,0);
camera.position.copy(HOME_POS);
const controls=new OrbitControls(camera,canvas);
controls.target.copy(HOME_TGT);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=6;controls.maxDistance=280;controls.maxPolarAngle=Math.PI*0.62;
controls.update();

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth/2,innerHeight/2),0.28,0.55,0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const usePost=!isMobile;

const U={time:{value:0},wind:{value:0.35},caustic:{value:1},rain:{value:0},level:{value:1}};

/* ----------------------------------------------------------------- lights */
const hemi=new THREE.HemisphereLight(0xc4e0ff,0x62703f,1.15);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff3df,3.2);
sun.castShadow=true;
sun.shadow.mapSize.set(isMobile?1024:2048,isMobile?1024:2048);
Object.assign(sun.shadow.camera,{left:-72,right:72,top:72,bottom:-72,near:10,far:340});
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.05;
scene.add(sun,sun.target);

/* --------------------------------------------------------------------- sky */
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color()},horizon:{value:new THREE.Color()},bottom:{value:new THREE.Color()},sunDir:{value:V3(0,1,0)},sunColor:{value:new THREE.Color()},disk:{value:1}},
  vertexShader:`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vDir;uniform vec3 top,horizon,bottom,sunDir,sunColor;uniform float disk;
  void main(){vec3 d=normalize(vDir);float h=d.y;
    vec3 c=h>0.?mix(horizon,top,pow(clamp(h,0.,1.),0.55)):mix(horizon,bottom,1.-smoothstep(-0.3,0.,h));
    float s=max(dot(d,normalize(sunDir)),0.);
    c+=sunColor*(smoothstep(0.9993,0.9997,s)*4.*disk+pow(s,14.)*0.22+pow(s,3.)*0.07);
    gl_FragColor=vec4(c,1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`});
const sky=new THREE.Mesh(new THREE.SphereGeometry(1000,32,16),skyMat);sky.renderOrder=-10;sky.frustumCulled=false;scene.add(sky);
const stars=(()=>{const n=1400,p=new Float32Array(n*3);for(let i=0;i<n;i++){const u=rand(),v=rand()*0.95+0.03;const th=u*Math.PI*2,ph=Math.acos(1-v);p[i*3]=Math.sin(ph)*Math.cos(th)*900;p[i*3+1]=Math.cos(ph)*900;p[i*3+2]=Math.sin(ph)*Math.sin(th)*900;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const m=new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false});
  const s=new THREE.Points(g,m);s.renderOrder=-9;scene.add(s);return s;})();

/* ----------------------------------------------------------------- terrain */
const WORLD_R=80, SEA_FLOOR=-18, BASE_Y=-25;
const VOLC={x:-20,z:-26}, POND={x:24,z:2}, POND_Y=2.4, RIDGE={x:32,z:-8}, STATION={x:8,z:36}, PLATFORM={x:-3,z:14};
const NESTS_DEF=[{x:-30,z:12,species:'galli'},{x:-16,z:27,species:'trike'},{x:2,z:-12,species:'brachio'}];
function coastR(a){return 49+4.5*Math.sin(a*3+0.7)+2.5*Math.sin(a*5-1.1)+3.5*fbm(Math.cos(a)*1.3+5,Math.sin(a)*1.3+5,3);}
function volcProfile(d){return 24*Math.pow(Math.max(0,1-d/21),1.5);}
const CRATER_R=6, RIM_H=volcProfile(CRATER_R);
function baseHeight(x,z){
  const r=Math.hypot(x,z),a=Math.atan2(z,x),cr=coastR(a);
  const cliff=smooth(0.35,0.9,Math.cos(a+0.5));
  const w=10-7*cliff;
  const land=smooth(cr+w*0.5,cr-w*0.5,r);
  let landH=3.0+2.4*fbm(x*0.04+3,z*0.04-2,4)+0.45*fbm(x*0.21,z*0.21,2);
  landH+=cliff*6*smooth(cr-26,cr-8,r);
  const seaH=-1.5+(SEA_FLOOR+1.5)*smooth(cr-2,cr+16,r)+0.9*fbm(x*0.08,z*0.08,3);
  let h=seaH+(landH-seaH)*land;
  const dv=Math.hypot(x-VOLC.x,z-VOLC.z),va=Math.atan2(z-VOLC.z,x-VOLC.x);
  let cone;
  if(dv<CRATER_R){const s=dv/CRATER_R;cone=RIM_H-5.5+5.5*s*s*s;}
  else cone=volcProfile(dv)*(1+0.08*Math.sin(va*7+dv*0.35)*smooth(CRATER_R,CRATER_R+3,dv));
  h+=cone;
  const dr=Math.hypot(x-RIDGE.x,z-RIDGE.z)+1.2*fbm(x*0.15,z*0.15,2);
  h+=7.5*smooth(9,7,dr);
  const dp=Math.hypot(x-POND.x,z-POND.z);
  if(dp<13){
    const raise=Math.max(h,POND_Y+0.9);h=h+(raise-h)*smooth(13,9,dp);
    const s=smooth(0,8.4,dp);const bowl=POND_Y-2.0+2.9*s*s;const carved=Math.min(h,bowl);
    h=carved+(h-carved)*smooth(8.4,11,dp);
  }
  return h;
}
const STATION_Y=baseHeight(STATION.x,STATION.z)+0.1;
for(const n of NESTS_DEF)n.y=baseHeight(n.x,n.z);
function terrainH(x,z){
  let h=baseHeight(x,z);
  const ds=Math.hypot(x-STATION.x,z-STATION.z);if(ds<15)h=lerp(STATION_Y,h,smooth(9.5,15,ds));
  for(const n of NESTS_DEF){const dn=Math.hypot(x-n.x,z-n.z);if(dn<4)h=lerp(n.y,h,smooth(1.8,4,dn));}
  return h;
}
const HN=200,HS=160/HN,HW=HN+1;
const HGT=new Float32Array(HW*HW);
for(let j=0;j<HW;j++)for(let i=0;i<HW;i++)HGT[j*HW+i]=terrainH(-80+i*HS,-80+j*HS);
function groundY(x,z){
  const gx=clamp((x+80)/HS,0,HN-1e-4),gz=clamp((z+80)/HS,0,HN-1e-4);
  const i=Math.floor(gx),j=Math.floor(gz),fx=gx-i,fz=gz-j,k=j*HW+i;
  const h00=HGT[k],h10=HGT[k+1],h01=HGT[k+HW],h11=HGT[k+HW+1];
  if(fx+fz<=1)return h00+(h10-h00)*fx+(h01-h00)*fz;
  return h11+(h01-h11)*(1-fx)+(h10-h11)*(1-fz);
}
function slopeAt(x,z){const e=0.6;return Math.hypot(groundY(x+e,z)-groundY(x-e,z),groundY(x,z+e)-groundY(x,z-e))/(2*e);}
let pondEdge=0;{let s=0;for(let k=0;k<24;k++){const a=k/24*Math.PI*2;let r=1;while(r<12&&groundY(POND.x+Math.cos(a)*r,POND.z+Math.sin(a)*r)<POND_Y)r+=0.1;s+=r;}pondEdge=s/24;}

function detailTexture(){return canvasTex(256,256,(g,w,h)=>{const im=g.createImageData(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const u=x/w,v=y/h;
  const n=fbm(Math.cos(u*6.283)*3+Math.cos(v*6.283)*1.5,Math.sin(u*6.283)*3+Math.sin(v*6.283)*1.5,4);const k=(0.84+0.16*n+0.05*(Math.random()-0.5))*255;const i=(y*w+x)*4;im.data[i]=im.data[i+1]=im.data[i+2]=k;im.data[i+3]=255;}g.putImageData(im,0,0);},{repeat:[36,36]});}

const terrain=(()=>{
  const pos=[],col=[],uv=[],idx=[];
  const outside=[];
  for(let j=0;j<HW;j++)for(let i=0;i<HW;i++){
    let x=-80+i*HS,z=-80+j*HS,y=HGT[j*HW+i];const r=Math.hypot(x,z);outside.push(r>WORLD_R);
    if(r>WORLD_R){x*=WORLD_R/r;z*=WORLD_R/r;y=terrainH(x,z);}
    pos.push(x,y,z);uv.push(i/HN,j/HN);
  }
  for(let j=0;j<HN;j++)for(let i=0;i<HN;i++){
    const a=j*HW+i,b=a+1,c=a+HW,d=c+1;
    if(!(outside[a]&&outside[b]&&outside[c]))idx.push(a,c,b);
    if(!(outside[b]&&outside[c]&&outside[d]))idx.push(b,c,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  const N=g.getAttribute('normal');
  const C={sand:hexRGB('#d9c590'),wet:hexRGB('#a89468'),g1:hexRGB('#5d8c34'),g2:hexRGB('#3e6d27'),dry:hexRGB('#8e9b47'),rock:hexRGB('#71685d'),dark:hexRGB('#3c3632'),ash:hexRGB('#2c2826'),lava:hexRGB('#5b2e20'),sb:hexRGB('#bba878'),deep:hexRGB('#6b7b70'),dirt:hexRGB('#8b7453'),mud:hexRGB('#5e5238'),moss:hexRGB('#4f6b3a')};
  for(let k=0;k<pos.length/3;k++){
    const x=pos[k*3],y=pos[k*3+1],z=pos[k*3+2],ny=N.getY(k);
    const n1=fbm(x*0.09,z*0.09,3),n2=vnoise(x*0.35,z*0.35);
    let c;
    if(y<-0.8){c=mixRGB(C.sb,C.deep,smooth(-2,-16,y));c=mixRGB(c,C.rock,smooth(0.25,0.55,n1)*0.6);c=mixRGB(c,C.moss,smooth(0.1,0.5,n2)*0.25*smooth(-3,-8,y));}
    else if(y<1.3){c=mixRGB(C.wet,C.sand,smooth(-0.8,0.6,y));}
    else{c=mixRGB(C.g1,C.g2,smooth(-0.3,0.4,n1));c=mixRGB(c,C.dry,smooth(0.2,0.7,n2)*0.35);c=mixRGB(C.sand,c,smooth(1.3,2.2,y));}
    const rocky=smooth(0.8,0.6,ny);c=mixRGB(c,mixRGB(C.rock,C.dark,smooth(0,1,n2)),rocky);
    const dv=Math.hypot(x-VOLC.x,z-VOLC.z);
    if(dv<19&&y>-1){const t=smooth(19,11,dv);c=mixRGB(c,mixRGB(C.dark,C.ash,smooth(-0.2,0.5,n1)),t);if(dv<CRATER_R+1.5)c=mixRGB(c,C.lava,smooth(CRATER_R+1.5,CRATER_R-1,dv));}

const waterfall=(()=>{

  const topH=groundY(RIDGE.x,RIDGE.z);
  let t=0,E=null;
  for(t=0;t<16;t+=0.2){const x=RIDGE.x+dir.x*t,z=RIDGE.z+dir.y*t;if(groundY(x,z)<topH-1.2){E={x:RIDGE.x+dir.x*(t-0.6),z:RIDGE.z+dir.y*(t-0.6)};break;}}
  if(!E)E={x:RIDGE.x+dir.x*8,z:RIDGE.z+dir.y*8};
  const pts=[];
  for(let k=6;k>=0;k--){const x=E.x-dir.x*k*0.7,z=E.z-dir.y*k*0.7;pts.push(V3(x,groundY(x,z)+0.08,z));}
  const y0=pts[pts.length-1].y;let fall=0,out=0;

    let push=0;while(groundY(x,z)>y-0.25&&push<30){out+=0.15;x=E.x+dir.x*out;z=E.z+dir.y*out;push++;}
    if(y<=POND_Y+0.05){pts.push(V3(x,POND_Y+0.02,z));break;}pts.push(V3(x,y,z));if(fall>30)break;}
  const side=V3(-dir.y,0,dir.x);const pos=[],uv=[],idx=[];let L=0;
  for(let i=0;i<pts.length;i++){if(i>0)L+=pts[i].distanceTo(pts[i-1]);const w=1.3+0.08*i;
    const a=pts[i].clone().addScaledVector(side,-w),b=pts[i].clone().addScaledVector(side,w);pos.push(a.x,a.y,a.z,b.x,b.y,b.z);uv.push(0,L/10,1,L/10);}
  for(let i=0;i<pts.length-1;i++){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:{uTime:U.time,uLevel:U.level},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform float uTime,uLevel;varying vec2 vUv;${NOISE_GLSL}
      void main(){float n=noise(vec2(vUv.x*14.,vUv.y*7.-uTime*3.2))*0.6+noise(vec2(vUv.x*31.,vUv.y*14.-uTime*5.))*0.4;
        float edge=smoothstep(0.,0.18,vUv.x)*smoothstep(1.,0.82,vUv.x);vec3 col=mix(vec3(0.5,0.72,0.8),vec3(1.),smoothstep(0.35,0.8,n))*max(uLevel,0.2);
        gl_FragColor=vec4(col,edge*(0.5+0.45*n));
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`});
  const mesh=new THREE.Mesh(g,m);mesh.renderOrder=2.5;scene.add(mesh);

})();

const WALK_PATHS=[];
{
  const a=V3(STATION.x-5,0,STATION.z-7),b=V3(2,0,23),c=V3(PLATFORM.x+1.5,0,PLATFORM.z+2.4);
  WALK_PATHS.push([a,b,c]);
  const dir=new THREE.Vector2(STATION.x,STATION.z).normalize();let t=11,pts=[];
  const p0=V3(STATION.x+dir.x*9.5,0,STATION.z+dir.y*9.5);let wet=0;
  for(t=9.5;t<40;t+=0.5){const x=STATION.x+dir.x*t,z=STATION.z+dir.y*t;if(groundY(x,z)<-1.2){wet+=0.5;if(wet>8)break;}}
  WALK_PATHS.push([p0,V3(STATION.x+dir.x*t,0,STATION.z+dir.y*t)]);
}
const walkPts=[];for(const path of WALK_PATHS)for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1],L=a.distanceTo(b);for(let s=0;s<=L;s+=1)walkPts.push({x:lerp(a.x,b.x,s/L),z:lerp(a.z,b.z,s/L)});}
const nearWalk=(x,z,r)=>walkPts.some(p=>Math.hypot(x-p.x,z-p.z)<r);

function scatter(n,test,maxR=62){const out=[];for(let k=0;k<n*40&&out.length<n;k++){const a=rand()*Math.PI*2,r=Math.sqrt(rand())*maxR;const x=Math.cos(a)*r,z=Math.sin(a)*r;const h=groundY(x,z),s=slopeAt(x,z);if(test(x,z,h,s))out.push({x,z,h,s});}return out;}
function instanced(geo,mat,items,fn,{cast=true,recv=true}={}){const m=new THREE.InstancedMesh(geo,mat,Math.max(1,items.length));const d=new THREE.Object3D();
  items.forEach((it,i)=>{fn(d,it,i);d.updateMatrix();m.setMatrixAt(i,d.matrix);});m.count=items.length;m.instanceMatrix.needsUpdate=true;m.castShadow=cast;m.receiveShadow=recv;scene.add(m);return m;}

const frondTex=canvasTex(128,256,(g,w,h)=>{g.clearRect(0,0,w,h);
  for(let i=0;i<30;i++){const t=i/30,y=h*(1-t)-4,len=w*0.47*Math.sin(Math.PI*(0.1+0.9*t))*(1-t*0.3);
    g.fillStyle=`hsl(${92+t*18},${48+t*8}%,${24+t*16}%)`;
    for(const s of [-1,1]){g.beginPath();g.moveTo(w/2,y);g.quadraticCurveTo(w/2+s*len*0.55,y-5-len*0.12,w/2+s*len,y-3-len*0.32);g.quadraticCurveTo(w/2+s*len*0.5,y+3,w/2,y+4);g.fill();}}
  g.strokeStyle='#3b561d';g.lineWidth=3;g.beginPath();g.moveTo(w/2,h);g.lineTo(w/2,2);g.stroke();},{clampEdge:true});
function frondGeo(len,width,a0,a1,segs=7){
  const pos=[],uv=[],idx=[];let py=0,pz=0;
  for(let k=0;k<=segs;k++){const t=k/segs;if(k>0){const th=lerp(a0,a1,t);py+=Math.cos(th)*len/segs;pz+=Math.sin(th)*len/segs;}
    const w=width*(1-0.25*t);pos.push(-w/2,py,pz,w/2,py,pz);uv.push(0,t,1,t);}
  for(let k=0;k<segs;k++){const a=k*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();return g;
}
function fernClump(n=8,len=1.6,a0=0.45,a1=1.7){const parts=[];for(let i=0;i<n;i++){const g=frondGeo(len*R(0.8,1.15),0.62,a0+R(-0.15,0.15),a1+R(-0.2,0.2));g.rotateY(i/n*Math.PI*2+R(-0.2,0.2));parts.push(g);}
  const m=mergeGeometries(parts);const nr=m.getAttribute('normal');for(let i=0;i<nr.count;i++){nr.setXYZ(i,nr.getX(i)*0.4,0.9,nr.getZ(i)*0.4);}nr.needsUpdate=true;return m;}
const frondMat=addSway(new THREE.MeshStandardMaterial({map:frondTex,alphaTest:0.45,side:THREE.DoubleSide,roughness:0.85}),0.12,1.6,'fern');

{const c=new THREE.Color();ferns.forEach((f,i)=>{c.setHSL(R(0.2,0.3),R(0.35,0.6),R(0.42,0.62));fernMesh.setColorAt(i,c);});fernMesh.instanceColor.needsUpdate=true;}

/* ------------------------------------------------------------------- herds */
class Herd{
  constructor(members,zones,label){this.members=members;this.zones=zones;this.label=label;this.timer=R(8,16);this.zi=0;members.forEach(m=>m.herd=this);}
  update(dt){if(this.members.every(m=>m.state==='idle'||m.state==='call'))this.timer-=dt;if(this.timer<=0)this.move(false);}
  move(forced){
    this.timer=R(22,38);let zi;do{zi=Math.floor(rand()*this.zones.length);}while(zi===this.zi&&this.zones.length>1);this.zi=zi;const Z=this.zones[zi];
    const lead=this.members[0];const run=forced;
    const ang=Math.atan2(Z.x-lead.pos.x,Z.z-lead.pos.z);let n=0;
    this.members.forEach((m,i)=>{if(!forced&&(m.state==='eat'||m.state==='drink'||m.state==='rest'))return;
      const ring=i===0?0:1+Math.floor((i-1)/5);const a=ang+Math.PI+(i%5)*1.25+ring;const rr=ring*m.S.pathR*3.2;
      const p=nearestWalkable(Z.x+Math.sin(a)*rr,Z.z+Math.cos(a)*rr,m.S.pathR*m.scale,10);if(!p)return;
      m.food=null;if(m.goTo(p.x,p.z,'herd',{speed:m.S.walk*(run?1.9:1.1)}))n++;});
    if(n)audio.call(lead.S.call,lead.pos,false);
    return {zone:Z,n};
  }
}

    const cs=new THREE.Shape();cs.moveTo(0,0.05);cs.lineTo(-0.85,0.5);cs.lineTo(-0.2,0.02);cs.lineTo(0,0.05);head.add(new THREE.Mesh(new THREE.ShapeGeometry(cs).rotateY(Math.PI/2),crestMat));
    for(const sd of [-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(0.028,6,5),eyeMat);e.position.set(sd*0.075,0.04,0.05);head.add(e);}
    this.wings=[];
    for(const sd of [1,-1]){const sh=new THREE.Group();sh.position.set(sd*0.15,0.08,0.3);sh.scale.x=sd;this.g.add(sh);
      const inner=new THREE.Shape();inner.moveTo(0,0.05);inner.lineTo(1.3,0.1);inner.lineTo(1.3,-0.35);inner.lineTo(0.05,-0.8);inner.lineTo(0,0.05);
      const ig=new THREE.ShapeGeometry(inner).rotateX(Math.PI/2);const im=new THREE.Mesh(ig,wingMat);im.castShadow=true;sh.add(im);
      const arm=new THREE.Mesh(limbGeo(1.3,0.045,0.035),pteroMat);arm.rotation.z=-Math.PI/2;arm.position.z=0.08;sh.add(arm);
      const wr=new THREE.Group();wr.position.set(1.3,0,0.1);sh.add(wr);
      const outer=new THREE.Shape();outer.moveTo(0,0);outer.lineTo(2.0,-0.4);outer.lineTo(0,-0.45);outer.lineTo(0,0);
      const om=new THREE.Mesh(new THREE.ShapeGeometry(outer).rotateX(Math.PI/2),wingMat);om.castShadow=true;wr.add(om);
      const f=new THREE.Mesh(limbGeo(2.0,0.035,0.012),pteroMat);f.rotation.z=-Math.PI/2+0.2;wr.add(f);
      this.wings.push({sh,wr,sd});}
    this.g.scale.setScalar(1.25);
    this.c={x:R(-20,20),z:R(-20,20)};this.r=R(28,48);this.a=R(0,6.3);this.alt=R(26,40);this.dir=rand()<0.5?1:-1;this.v=R(6,8);this.phase=R(0,10);this.flapT=0;
  }
  update(dt){
    this.a+=this.dir*this.v/this.r*dt;this.phase+=dt;const cyc=this.phase%9;const flapping=cyc<3.2;
    const x=this.c.x+Math.cos(this.a)*this.r,z=this.c.z+Math.sin(this.a)*this.r,y=this.alt+Math.sin(this.phase*0.4)*3+(flapping?0:-cyc*0.15);
    const vx=-Math.sin(this.a)*this.dir,vz=Math.cos(this.a)*this.dir;
    this.g.position.set(x,y,z);this.g.rotation.set(flapping?-0.08:0.06,Math.atan2(vx,vz),this.dir*-0.38);
    this.flapT+=dt*(flapping?6.5:0);const fl=flapping?Math.sin(this.flapT):0.06;

    this.head.rotation.y=Math.sin(this.phase*0.7)*0.25;
    if(rand()<dt*0.02)audio.call('ptero',this.g.position,false);
  }
}

/* -------------------------------------------------------- marine reptile */
const plesioSpec={nodes:[[-4.2,0,0.03,0.03],[-3.4,0,0.18,0.16],[-2.4,0,0.45,0.38],[-1.2,0,0.8,0.62],[0,0,1.0,0.75],[1.2,0,0.95,0.7],[2.2,0.05,0.6,0.5],[3.2,0.2,0.32,0.3],[4.3,0.35,0.24,0.24],[5.4,0.45,0.2,0.2],[6.3,0.5,0.18,0.18]],P:4};
class Plesio{
  constructor(){
    const S=plesioSpec;const mat=skinTexture({base:'#3f7c56',dark:'#22503a',belly:'#bcd8ab',pattern:'#285a3f',kind:'spots',freq:4,amt:0.7});this.mat=mat;
    this.root=new THREE.Group();this.root.rotation.order='YXZ';scene.add(this.root);
    const bones=this.bones=S.nodes.map(()=>new THREE.Bone());
    S.nodes.forEach((nd,k)=>{if(k===S.P)return;const par=k>S.P?k-1:k+1;const pn=S.nodes[par];bones[k].position.set(0,nd[1]-pn[1],nd[0]-pn[0]);bones[par].add(bones[k]);});
    const mesh=new THREE.SkinnedMesh(loftGeometry(S.nodes,{P:S.P,step:0.14,uvLen:3}),mat);mesh.add(bones[S.P]);mesh.updateMatrixWorld(true);mesh.bind(new THREE.Skeleton(bones));mesh.frustumCulled=false;mesh.castShadow=true;this.root.add(mesh);
    const head=bones[bones.length-1];
    head.add(new THREE.Mesh(loftGeometry([[-0.1,0,0.2,0.18],[0.3,0.02,0.22,0.18],[0.7,-0.02,0.15,0.12],[1.0,-0.04,0.07,0.06],[1.08,-0.05,0.01,0.01]],{radial:12,step:0.08}),mat));
    for(const sd of [-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(0.045,8,6),eyeMat);e.position.set(sd*0.17,0.07,0.3);head.add(e);}
    const tp=[];for(let i=0;i<8;i++)for(const sd of [-1,1])tp.push(prep(new THREE.ConeGeometry(0.018,0.1,4).rotateX(Math.PI).translate(sd*(0.16-i*0.012),-0.1,0.35+i*0.08)));head.add(new THREE.Mesh(mergeGeometries(tp),toothMat));
    const fs=new THREE.Shape();fs.moveTo(0,-0.25);fs.quadraticCurveTo(1.0,-0.35,1.8,0.05);fs.quadraticCurveTo(0.9,0.3,0,0.25);fs.lineTo(0,-0.25);
    const fg=new THREE.ExtrudeGeometry(fs,{depth:0.08,bevelEnabled:true,bevelSize:0.03,bevelThickness:0.03,bevelSegments:2}).translate(0,0,-0.04).rotateX(Math.PI/2);
    this.flippers=[];
    for(const [bi,z,sc] of [[5,0.3,1],[4,-0.6,0.85]])for(const sd of [1,-1]){const g=new THREE.Group();g.position.set(sd*0.75,-0.35,z);g.scale.set(sd*sc,sc,sc);bones[bi].add(g);const m=new THREE.Mesh(fg,mat);m.castShadow=true;g.add(m);this.flippers.push({g,sd,front:bi===5});}
    this.head=head;this.reset();
  }
  reset(){this.a=R(0,6.3);this.pos=V3();this.pathPoint(this.a,this.pos);this.vel=V3(0,0,1);this.surface=0;this.state='swim';this.t=0;this.splashed=false;this.root.position.copy(this.pos);}
  pathPoint(a,out){const r=70+3.5*Math.sin(a*3+1);const x=Math.cos(a)*r,z=Math.sin(a)*r;let y=-7+3*Math.sin(a*2);y=clamp(y,groundY(x,z)+2.4,-2.6);return out.set(x,y,z);}
  trigger(){if(this.state!=='swim')return false;this.state='rise';this.t=0;this.splashed=false;this.sa=this.a+0.35;this.spot=V3();const r=67;this.spot.set(Math.cos(this.sa)*r,-0.9,Math.sin(this.sa)*r);
    if(groundY(this.spot.x,this.spot.z)>-3){const r2=73;this.spot.set(Math.cos(this.sa)*r2,-0.9,Math.sin(this.sa)*r2);}return true;}
  update(dt){
    const speed=3.2;this.t+=dt;let target;
    if(this.state==='swim'){this.a+=speed/70*dt;target=this.pathPoint(this.a+0.12,tv1);}
    else if(this.state==='rise'){target=tv1.copy(this.spot);if(this.pos.distanceTo(this.spot)<1.2||this.t>9){this.state='hold';this.t=0;}}
    else if(this.state==='hold'){target=tv1.copy(this.spot);if(this.t>4.2){this.state='dive';this.t=0;this.a=this.sa;}}
    else{this.a+=speed/70*dt;target=this.pathPoint(this.a+0.2,tv1);if(this.t>4)this.state='swim';}
    const want=V3().subVectors(target,this.pos);const d=want.length();const sp=this.state==='hold'?0.25:(this.state==='rise'?Math.min(speed*1.3,d*0.8):speed);
    if(d>0.001)want.multiplyScalar(sp/d);this.vel.lerp(want,1-Math.exp(-dt*1.6));
    this.pos.addScaledVector(this.vel,dt);this.pos.y=Math.min(this.pos.y,-0.7);
    const gy=groundY(this.pos.x,this.pos.z)+1.4;if(this.pos.y<gy)this.pos.y=gy;
    const rr=Math.hypot(this.pos.x,this.pos.z);if(rr>WORLD_R-2.5){this.pos.x*=(WORLD_R-2.5)/rr;this.pos.z*=(WORLD_R-2.5)/rr;}
    this.root.position.copy(this.pos);
    const hv=Math.hypot(this.vel.x,this.vel.z);if(hv>0.05){const yaw=Math.atan2(this.vel.x,this.vel.z);this.root.rotation.y=this.root.rotation.y+angDiff(this.root.rotation.y,yaw)*(1-Math.exp(-dt*3));}
    const pitch=-Math.atan2(this.vel.y,Math.max(hv,0.3));this.root.rotation.x=damp(this.root.rotation.x,this.state==='hold'?0:clamp(pitch,-0.6,0.6),3,dt);
    const up=(this.state==='rise'||this.state==='hold')?1:0;this.surface=damp(this.surface,up,1.2,dt);
    const t=simTime,b=this.bones;const fr=this.state==='hold'?1.2:2.4;
    for(let i=0;i<4;i++)b[i].rotation.set(0,Math.sin(t*fr-i*0.8)*0.12,0);
    for(let i=6;i<10;i++)b[i].rotation.set(-this.surface*0.36+Math.sin(t*0.9+i)*0.03,Math.sin(t*0.6-i*0.5)*0.08,0);
    b[10].rotation.set(this.surface*0.9,0,0);
    for(const f of this.flippers){const ph=t*fr+(f.front?0:Math.PI);f.g.rotation.set(0,f.sd*0.3*Math.cos(ph)+f.sd*0.2,0.55*Math.sin(ph));}
    this.root.updateMatrixWorld(true);
    const hp=this.head.getWorldPosition(tv2);
    if(this.state!=='swim'&&!this.splashed&&hp.y>-0.2){this.splashed=true;audio.sfx('splash',hp);for(let i=0;i<90;i++){const a=R(0,6.3),s=R(1,5);splash.emit(hp.x+R(-0.5,0.5),0.1,hp.z+R(-0.5,0.5),Math.cos(a)*s*0.6,R(3,8),Math.sin(a)*s*0.6,R(0.8,1.6),R(0.3,0.8),0.9,0.97,1,0.85,{grav:9.8,drag:0.3});}
      for(let i=0;i<30;i++){const a=i/30*6.28;splash.emit(hp.x+Math.cos(a)*1.2,0.15,hp.z+Math.sin(a)*1.2,Math.cos(a)*2.5,0.3,Math.sin(a)*2.5,1.6,1.4,0.95,0.98,1,0.5,{grow:1.6,drag:1});}}
    if(this.state==='dive'&&this.t<0.1&&hp.y>-0.5){audio.sfx('splash',hp);}
    if(rand()<dt*1.5)bubbles.emit(hp.x,hp.y,hp.z,R(-0.2,0.2),R(0.8,1.4),R(-0.2,0.2),R(3,6),R(0.12,0.25),0.8,0.95,1,0.8);
  }
}

function placeFood(p,type){
  const grp=new THREE.Group();grp.position.copy(p);scene.add(grp);
  if(type==='plant'){for(let i=0;i<4;i++){const m=new THREE.Mesh(miniFern,frondMat);m.position.set(R(-0.4,0.4),0,R(-0.4,0.4));m.rotation.y=R(0,6);m.scale.setScalar(R(0.7,1));grp.add(m);}
    for(let i=0;i<12;i++){const b=new THREE.Mesh(new THREE.SphereGeometry(0.09,8,6),berryMat);b.position.set(R(-0.5,0.5),R(0.05,0.25),R(-0.5,0.5));grp.add(b);}}
  else{const m=new THREE.Mesh(rockGeo,meatMat);m.scale.set(0.8,0.45,0.6);m.position.y=0.2;m.castShadow=true;grp.add(m);const bo=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1.5,6),boneMat);bo.rotation.z=Math.PI/2;bo.position.set(0,0.3,0.1);grp.add(bo);
    for(const sd of [-1,1]){const k=new THREE.Mesh(new THREE.SphereGeometry(0.13,8,6),boneMat);k.position.set(sd*0.78,0.3,0.1);grp.add(k);}}
  grp.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  const f={pos:p.clone(),type,grp,amount:1,alive:true,t:0};foods.push(f);
  for(let i=0;i<14;i++)smoke.emit(p.x+R(-0.6,0.6),p.y+0.2,p.z+R(-0.6,0.6),R(-0.5,0.5),R(0.3,0.9),R(-0.5,0.5),R(0.8,1.4),R(0.4,0.8),0.75,0.68,0.52,0.45,{grow:0.8,drag:1});

  const cands=dinos.filter(d=>d.S.diet===diet&&!d.removed&&d.state!=='emerge'&&d.pos.distanceTo(p)<50).sort((a,b)=>a.pos.distanceTo(p)-b.pos.distanceTo(p)).slice(0,3);

function updateFoods(dt){for(let i=foods.length-1;i>=0;i--){const f=foods[i];f.t+=dt;const s=clamp(f.amount,0,1);f.grp.scale.setScalar(0.25+0.75*s);

  let egg=nest.eggs.find(e=>e.state==='idle');
  if(!egg){for(const e of nest.eggs){e.state='idle';e.t=0;e.grp.visible=true;e.top.position.set(0,0,0);e.top.rotation.set(0,0,0);e.grp.scale.set(1,1.3,1);}egg=nest.eggs[0];toast('Fresh eggs in the '+SPECIES[nest.species].name+' nest');}
  egg.state='wobble';egg.t=0;return egg;
}
function updateNests(dt){for(const n of nests)for(const e of n.eggs){if(e.state==='idle')continue;e.t+=dt;
  if(e.state==='wobble'){e.grp.rotation.z=Math.sin(e.t*22)*0.18*Math.min(1,e.t);e.grp.rotation.x=Math.cos(e.t*17)*0.08;if(e.t>1.6){e.state='crack';e.t=0;audio.sfx('crack',n.grp.position);
      const wp=n.grp.localToWorld(e.home.clone());for(let i=0;i<24;i++)splash.emit(wp.x,wp.y+0.3,wp.z,R(-1.2,1.2),R(1,3),R(-1.2,1.2),R(0.6,1),R(0.08,0.14),0.93,0.9,0.8,1,{grav:9});
      const S=SPECIES[n.species];const sc={galli:0.4,trike:0.3,brachio:0.2}[n.species];
      const heading=Math.atan2(wp.x-n.x,wp.z-n.z)||R(0,6);const b=new Dino(n.species,wp.x,wp.z,heading,{scale:sc,baby:true,zone:{x:n.x,z:n.z,r:8}});
      b.state='emerge';b.timer=2.4;b.ghost=5;b.pose.lie=0.9;babies.push(b);refreshSelect();audio.call(S.call,wp,true);
      if(babies.length>6){const old=babies.shift();if(selected===old)select(null);old.dispose();refreshSelect();}}}
  else if(e.state==='crack'){e.grp.rotation.z*=0.9;e.top.position.y=Math.min(0.5,e.t*0.9);e.top.position.x=Math.min(0.45,e.t*0.6);e.top.rotation.z=-Math.min(1.8,e.t*2.4);if(e.t>5){e.state='done';e.t=0;}}
  else if(e.state==='done'){const s=Math.max(0,1-e.t/1.5);e.grp.scale.set(s,1.3*s,s);if(s<=0)e.grp.visible=false;}}}

/* -------------------------------------------------------------- spawn all */
let herds=[],pteros=[],plesio=null;
function spawnAll(){
  for(const d of [...dinos])d.dispose();babies.length=0;dinoCounter={};rand=mulberry32(777);
  const at=(k,x,z,h)=>{const S=SPECIES[k];const p=nearestWalkable(x,z,S.pathR,14)||{x,z};return new Dino(k,p.x,p.z,h);};
  at('brachio',-12,-6,0.6);at('brachio',-4,2,2.4);
  const tr=[at('trike',-20,14,1.0),at('trike',-15,19,1.4),at('trike',-23,20,0.3)];
  at('stego',-34,-4,1.8);at('stego',-30,4,2.8);
  at('trex',16,-22,-0.5);
  const ga=[];for(let i=0;i<8;i++)ga.push(at('galli',6+R(-5,5),12+R(-4,4),R(0,6)));
  herds=[new Herd(ga,[{x:6,z:12},{x:-6,z:-18},{x:-26,z:6},{x:-8,z:24},{x:14,z:-8}],'Gallimimus herd'),new Herd(tr,[{x:-18,z:16},{x:-8,z:-8},{x:-28,z:4}],'Triceratops herd')];
  rand=mulberry32(Date.now()%100000);
}
spawnAll();
for(let i=0;i<4;i++)pteros.push(new Ptero(i));
plesio=new Plesio();

/* ---------------------------------------------------------------- UI */
let selected=null,follow=false,foodMode=false,foodType='plant',viewIdx=0,glide=null;
const sel=$('sel');
function refreshSelect(){const v=selected?String(dinos.indexOf(selected)):'';sel.innerHTML='<option value="">Select dinosaur…</option>'+dinos.map((d,i)=>`<option value="${i}">${d.name}</option>`).join('');sel.value=selected?String(dinos.indexOf(selected)):'';}
refreshSelect();
let toastT=0;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function select(d,{focus=false}={}){selected=d;$('card').hidden=!d;if(d){$('cName').textContent=d.name;$('cMeta').textContent=d.S.meta;if(focus)glideTo(d.focusPoint(V3()),null);}
  else{follow=false;}syncFollow();sel.value=d?String(dinos.indexOf(d)):'';}
function syncFollow(){$('bFollow').classList.toggle('on',follow);$('cFollow').classList.toggle('on',follow);$('cFollow').textContent=follow?'Following':'Follow';}
function glideTo(target,pos){glide={target:target.clone(),pos:pos?pos.clone():null};}
function ensureSelected(){if(selected&&!selected.removed)return selected;let best=null,bd=1e9;for(const d of dinos){const dd=d.pos.distanceTo(controls.target);if(dd<bd){bd=dd;best=d;}}if(best){select(best);toast('Selected '+best.name);}return best;}
sel.onchange=()=>{const d=dinos[+sel.value];select(d||null,{focus:true});};
$('bFollow').onclick=$('cFollow').onclick=()=>{const d=ensureSelected();if(!d)return;follow=!follow;syncFollow();toast(follow?'Camera following '+d.name:'Camera released');};
$('cClose').onclick=()=>select(null);
const VIEWS=[{name:'Overview',pos:HOME_POS,tgt:HOME_TGT},{name:'Underwater cross-section',pos:V3(-60,-8,128),tgt:V3(-10,-8,40)},{name:'Research station',pos:V3(34,16,66),tgt:V3(STATION.x,3,STATION.z-4)},{name:'Volcano',pos:V3(18,40,6),tgt:V3(VOLC.x,12,VOLC.z)},{name:'Waterfall & pond',pos:V3(POND.x-24,14,POND.z+20),tgt:V3(POND.x+2,5,POND.z-2)}];
$('bView').onclick=()=>{viewIdx=(viewIdx+1)%VIEWS.length;const v=VIEWS[viewIdx];follow=false;syncFollow();glideTo(v.tgt,v.pos);toast('View: '+v.name);};
$('bFood').onclick=()=>{foodMode=!foodMode;$('bFood').classList.toggle('on',foodMode);canvas.style.cursor=foodMode?'crosshair':'';if(foodMode)toast('Click the ground to place '+(foodType==='plant'?'plants':'meat'));};
$('bFoodType').onclick=()=>{foodType=foodType==='plant'?'meat':'plant';$('bFoodType').textContent=foodType==='plant'?'Plants':'Meat';toast(foodType==='plant'?'Food: ferns & berries for herbivores':'Food: meat for the Tyrannosaurus');};
const act=(kind,label)=>{const d=ensureSelected();if(!d)return;if(d.command(kind))toast(d.name+' · '+label+(ENV.paused?' (resume to watch)':''));else toast(d.name+' cannot '+kind+' right now');};
$('bDrink').onclick=()=>act('drink','heading to the pond');
$('bRest').onclick=()=>act('rest','lying down to rest');
$('bCall').onclick=()=>act('call','calling');
$('bHerd').onclick=()=>{const h=(selected&&selected.herd)||herds[0];const r=h.move(true);toast(r.n?h.label+' is on the move':'The herd is busy');if(!follow){glideTo(V3(r.zone.x,3,r.zone.z),null);}};
$('bHatch').onclick=()=>{let best=nests[0],bd=1e9;for(const n of nests){const d=Math.hypot(n.x-controls.target.x,n.z-controls.target.z);if(d<bd){bd=d;best=n;}}doHatch(best);};
function doHatch(n){hatch(n);follow=false;syncFollow();const t=V3(n.x,n.y+0.6,n.z);const off=V3().subVectors(camera.position,controls.target).normalize().multiplyScalar(12);off.y=Math.max(off.y,5);glideTo(t,t.clone().add(off));toast('A '+SPECIES[n.species].name+' egg is hatching…');}
$('bSurface').onclick=()=>{if(plesio.trigger()){toast('The plesiosaur is surfacing');follow=false;syncFollow();const s=plesio.spot;const dir=V3(s.x,0,s.z).normalize();glideTo(V3(s.x,1,s.z),V3(s.x,0,s.z).addScaledVector(dir,34).add(V3(0,12,0)));}else toast('The plesiosaur is already at the surface');};
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{setTime(b.dataset.time);toast({day:'Daylight',sunset:'Sunset',night:'Night — station lights on'}[b.dataset.time]);});
$('bEnv').onclick=()=>{$('env').hidden=!$('env').hidden;$('bEnv').classList.toggle('on',!$('env').hidden);};
$('sRain').oninput=e=>ENV.rain=+e.target.value;$('sWind').oninput=e=>ENV.wind=+e.target.value;$('sVolc').oninput=e=>{ENV.volcano=+e.target.value;if(ENV.volcano>0.55&&eruptT>2)eruptT=0.6;};
$('sVol').oninput=e=>{audio.vol=+e.target.value;audio.start();};
const syncMusic=()=>{for(const id of ['bMusic','bMusic2']){$(id).classList.toggle('on',audio.musicOn);}$('bMusic2').textContent=audio.musicOn?'On':'Off';};
$('bMusic').onclick=$('bMusic2').onclick=()=>{audio.start();audio.musicOn=!audio.musicOn;syncMusic();toast(audio.musicOn?'Music on':'Music off');};syncMusic();
$('bPause').onclick=()=>{ENV.paused=!ENV.paused;$('bPause').textContent=ENV.paused?'Resume':'Pause';$('bPause').classList.toggle('on',ENV.paused);toast(ENV.paused?'Simulation paused':'Simulation resumed');};
$('bReset').onclick=()=>{
  for(const f of foods)scene.remove(f.grp);foods.length=0;
  for(const n of nests)for(const e of n.eggs){e.state='idle';e.t=0;e.grp.visible=true;e.grp.rotation.set(0,0,0);e.grp.scale.set(1,1.3,1);e.top.position.set(0,0,0);e.top.rotation.set(0,0,0);}
  select(null);spawnAll();plesio.reset();refreshSelect();
  ENV.rain=0;ENV.wind=0.35;ENV.volcano=0.25;$('sRain').value=0;$('sWind').value=0.35;$('sVolc').value=0.25;setTime('day');
  for(const p of particleSystems)p.clear();ENV.paused=false;$('bPause').textContent='Pause';$('bPause').classList.remove('on');
  foodMode=false;$('bFood').classList.remove('on');canvas.style.cursor='';viewIdx=0;glideTo(HOME_TGT,HOME_POS);toast('Island reset');};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();$('bPause').click();}if(e.code==='Escape'){select(null);if(foodMode)$('bFood').click();}});

// picking
const ray=new THREE.Raycaster();const ndc=new THREE.Vector2();let downAt=null;
canvas.addEventListener('pointerdown',e=>{downAt={x:e.clientX,y:e.clientY};audio.start();hideHint();});
canvas.addEventListener('pointerup',e=>{if(!downAt||Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>6)return;downAt=null;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  if(foodMode){const hit=ray.intersectObject(terrain)[0];if(!hit)return;const p=hit.point;
    if(p.y<0.8||slopeAt(p.x,p.z)>0.8||Math.hypot(p.x-POND.x,p.z-POND.z)<pondEdge+0.5||clearAt(p.x,p.z)<0.8){toast('Unsuitable spot — pick open, dry ground');return;}
    const n=placeFood(p,foodType);toast(n?`${n} dinosaur${n>1?'s are':' is'} coming to eat`:'Food placed — no hungry '+(foodType==='plant'?'herbivores':'carnivores')+' nearby');
    foodMode=false;$('bFood').classList.remove('on');canvas.style.cursor='';return;}
  // nests
  for(const n of nests){const c=V3(n.x,n.y+0.4,n.z);if(ray.ray.distanceSqToPoint(c)<2.2*2.2&&ray.ray.origin.distanceTo(c)<(ray.intersectObject(terrain)[0]?.distance??1e9)+3){doHatch(n);return;}}
  let best=null,bd=1e9;
  for(const d of dinos){const sph=[[d.root.getWorldPosition(V3()),d.S.nodes[d.S.P][2]*1.2*d.scale],[d.bones[d.S.chest].getWorldPosition(V3()),d.S.nodes[d.S.chest][2]*1.2*d.scale],[d.headBone.getWorldPosition(V3()),0.8*d.scale+0.3]];
    for(const [c,r] of sph){const hit=ray.ray.intersectSphere(new THREE.Sphere(c,Math.max(r,0.6)),V3());if(hit){const dd=hit.distanceTo(ray.ray.origin);if(dd<bd){bd=dd;best=d;}}}}
  if(best){select(best);return;}
  if(selected&&!follow)select(null);
});
let hintHidden=false;function hideHint(){if(hintHidden)return;hintHidden=true;setTimeout(()=>{$('hint').style.opacity=0;},4000);}
setTimeout(hideHint,9000);

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);setPointScale();});
function setPointScale(){const s=renderer.domElement.height*0.5/Math.tan(THREE.MathUtils.degToRad(camera.fov/2));for(const p of particleSystems)p.mat.uniforms.uScale.value=s;}
setPointScale();

/* ---------------------------------------------------------------- loop */
let simTime=0,last=performance.now(),mistT=0,fireT=0,frames=0,fpsT=0,fps=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000);last=now;const sdt=ENV.paused?0:dt;simTime+=sdt;U.time.value=simTime;
  updateEnv(dt);
  if(sdt>0){
    for(const d of [...dinos])d.update(sdt);for(const h of herds)h.update(sdt);
    for(const p of pteros)p.update(sdt);plesio.update(sdt);updateFish(sdt);updateBirds(sdt);updateNests(sdt);updateFoods(sdt);updateVolcano(sdt);updateRain(sdt);
    for(const c of clouds){c.position.x+=(1.5+ENV.wind*9)*sdt;c.position.z+=(0.5+ENV.wind*3)*sdt;if(c.position.x>240)c.position.x=-240;if(c.position.z>240)c.position.z=-240;}
    mistT+=sdt;while(mistT>0.05){mistT-=0.05;const b=waterfall.bottom;mist.emit(b.x+R(-1.2,1.2),POND_Y+0.2,b.z+R(-1.2,1.2),R(-0.6,0.6),R(0.6,1.6),R(-0.6,0.6),R(1.2,2.2),R(0.8,1.6),0.9,0.95,1,0.35*Math.max(U.level.value,0.3),{grow:1.2,drag:0.8});}
    if(rand()<sdt*6){const a=R(0,6.3),r=R(58,77);const x=Math.cos(a)*r,z=Math.sin(a)*r;const g=groundY(x,z);if(g<-5)bubbles.emit(x,g+0.3,z,R(-0.1,0.1),R(0.7,1.3),R(-0.1,0.1),Math.min(14,(-g)/1.0),R(0.1,0.22),0.8,0.95,1,0.7);}
    const nightK=ENV.cur.night;fireT+=sdt*nightK*18;while(fireT>1){fireT-=1;const p=rand()<0.5?{x:POND.x+R(-10,10),z:POND.z+R(-10,10)}:{x:R(-40,20),z:R(-30,30)};const g=groundY(p.x,p.z);if(g>1)fireflies.emit(p.x,g+R(0.5,2.5),p.z,R(-0.4,0.4),R(-0.1,0.2),R(-0.4,0.4),R(2,4),R(0.18,0.3),1,0.9,0.4,0.9);}
    for(const p of particleSystems)p.update(sdt);
    station.beacon.scale.setScalar(1);
  }
  // bubbles pop at surface
  for(let i=0;i<bubbles.n;i++){if(bubbles.pos[i*3+1]>-0.25)bubbles.life[i]=Math.min(bubbles.life[i],0.05);}
  // camera
  if(glide){const k=1-Math.exp(-dt*2.2);const dT=V3().subVectors(glide.target,controls.target).multiplyScalar(k);controls.target.add(dT);
    if(glide.pos)camera.position.lerp(glide.pos,k);else camera.position.add(dT);if(dT.length()<0.01&&(!glide.pos||camera.position.distanceTo(glide.pos)<0.1))glide=null;}
  if(follow&&selected&&!selected.removed){const fp=selected.focusPoint(tv1);const d=V3().subVectors(fp,controls.target).multiplyScalar(1-Math.exp(-dt*2.5));controls.target.add(d);camera.position.add(d);}
  controls.update();
  const cr=Math.hypot(camera.position.x,camera.position.z);
  if(cr<WORLD_R+2){const minY=Math.max(groundY(camera.position.x,camera.position.z)+1.2,1.0);if(camera.position.y<minY)camera.position.y=minY;}
  else if(camera.position.y<BASE_Y-18)camera.position.y=BASE_Y-18;
  if(shake>0){camera.position.x+=Math.sin(now*0.07)*shake*0.25;camera.position.y+=Math.cos(now*0.09)*shake*0.2;}
  sky.position.copy(camera.position);stars.position.copy(camera.position);
  if(selected){$('cState').textContent=selected.label();}
  audio.update();
  if(usePost)composer.render();else renderer.render(scene,camera);
  frames++;fpsT+=dt;if(fpsT>1){fps=frames/fpsT;frames=0;fpsT=0;}
}
requestAnimationFrame(t=>{last=t;$('loading').style.opacity=0;setTimeout(()=>$('loading').remove(),700);frame(t);});
window.__island={dinos,herds,plesio,nests,foods,ENV,camera,controls,get fps(){return fps;},groundY,select,placeFood,hatch,setTime,
  stats:()=>({calls:renderer.info.render.calls,tris:renderer.info.render.triangles,dinos:dinos.length})};
</script>
</body>
</html>
