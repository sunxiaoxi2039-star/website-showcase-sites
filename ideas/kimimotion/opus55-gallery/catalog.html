<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案例海洋 · Opus 5.5 全 88 帧</title>
<style>
  :root{--bg:#0c0a09;--panel:#141210;--ink:#f3ede3;--gold:#e8b04b;--muted:#94867a;--dim:#5a4f47;--glass:rgba(24,20,17,.9);--ease:cubic-bezier(.16,1,.3,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Inter","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1600px;margin:0 auto;padding:20px 20px 60px}
  header{padding:22px 0 14px;border-bottom:1px solid rgba(232,176,75,.08);margin-bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
  header h1{font-size:24px;font-weight:800;color:var(--gold)}
  header .sub{color:var(--muted);font-size:13px;margin-top:4px}
  header .count{font-family:"Noto Serif SC",serif;font-size:38px;color:var(--ink);font-weight:900;line-height:1}
  header .count small{font-size:13px;color:var(--dim);font-weight:400;display:block;text-align:right;margin-top:4px}

  /* 控制区：吸附顶部 */
  .controls{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,var(--bg) 85%,transparent);padding:12px 0 16px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .lbl{font-size:11px;color:var(--dim);letter-spacing:2px;flex:none}
  .chip{background:none;border:1px solid rgba(90,79,71,.5);color:var(--muted);padding:4px 13px;border-radius:15px;font-size:12px;cursor:pointer;transition:all .18s;font-family:inherit;white-space:nowrap}
  .chip:hover{border-color:var(--gold);color:var(--ink)}
  .chip.active{background:rgba(232,176,75,.14);border-color:rgba(232,176,75,.4);color:var(--gold)}
  .search{flex:1;min-width:160px;max-width:340px;background:var(--panel);border:1px solid rgba(90,79,71,.4);color:var(--ink);padding:7px 14px;border-radius:18px;font-size:13px;outline:none;font-family:inherit}
  .search::placeholder{color:var(--dim)}
  .search:focus{border-color:rgba(232,176,75,.35)}
  /* 风格索引条 */
  .style-rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
  .style-rail::-webkit-scrollbar{height:4px}
  .style-rail::-webkit-scrollbar-thumb{background:rgba(90,79,71,.5);border-radius:2px}
  .style-chip{flex:none;font-size:11px;color:var(--muted);background:rgba(90,79,71,.18);border:1px solid transparent;padding:3px 11px;border-radius:12px;cursor:pointer;transition:all .18s;font-family:inherit}
  .style-chip:hover{color:var(--ink);background:rgba(90,79,71,.35)}
  .style-chip.active{color:var(--gold);border-color:rgba(232,176,75,.4);background:rgba(232,176,75,.1)}
  .style-chip b{font-weight:600;margin-right:4px;color:var(--dim)}
  .style-chip.active b{color:var(--gold)}

  /* 海洋网格 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .frame{background:var(--glass);border:1px solid rgba(90,79,71,.18);border-radius:12px;overflow:hidden;cursor:zoom-in;transition:all .3s var(--ease);position:relative}
  .frame:hover{transform:translateY(-4px) scale(1.015);border-color:rgba(232,176,75,.35);box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:2}
  .frame .imgbox{aspect-ratio:16/10;overflow:hidden;background:#111}
  .frame img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
  .frame:hover img{transform:scale(1.06)}
  .frame .cap{padding:9px 12px 11px}
  .frame .cap .sname{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frame .cap .meta{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
  .frame .cap .fno{font-size:10.5px;color:var(--dim)}
  .frame .cap .tags{display:flex;gap:4px}
  .frame .cap .tags i{font-style:normal;font-size:10px;color:var(--gold);background:rgba(232,176,75,.09);padding:1.5px 7px;border-radius:7px}
  .frame .cap .tags i.plain{color:var(--muted);background:rgba(90,79,71,.22)}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 0;font-size:14px}

  /* 灯箱 */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .lightbox.active{display:flex}
  .lightbox img{max-width:92vw;max-height:74vh;border-radius:8px;box-shadow:0 20px 70px rgba(0,0,0,.7)}
  .lb-bar{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap;justify-content:center}
  .lb-bar .cap{color:var(--muted);font-size:13px}
  .lb-bar a{color:var(--gold);font-size:12.5px;text-decoration:none;border:1px solid rgba(232,176,75,.35);padding:5px 14px;border-radius:14px}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(28,24,20,.7);border:1px solid rgba(232,176,75,.2);color:var(--gold);width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .lb-nav:hover{background:rgba(232,176,75,.15)}
  .lb-prev{left:18px}.lb-next{right:18px}
  .lb-close{position:absolute;top:16px;right:24px;color:var(--muted);font-size:30px;cursor:pointer}
  .lb-close:hover{color:var(--ink)}

  @media(max-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
    header h1{font-size:19px}
    header .count{font-size:28px}
    .frame .cap{padding:7px 9px 9px}
    .frame .cap .sname{font-size:11px}
  }

  /* 一键复制 Prompt */
  .frame .cp{position:absolute;top:8px;right:8px;z-index:3;border:1px solid rgba(232,176,75,.35);
    background:rgba(12,10,8,.78);color:var(--gold);font-size:12px;padding:4px 10px;border-radius:12px;
    cursor:pointer;font-family:inherit;opacity:0;transition:opacity .2s,background .2s}
  .frame:hover .cp{opacity:1}
  .frame .cp:hover{background:rgba(232,176,75,.2)}
  .frame .cp.copied-flash{opacity:1;color:#7fd4c0;border-color:rgba(127,212,192,.5)}
  @media(hover:none){.frame .cp{opacity:1}}
  #lb-copy{cursor:pointer}
  #lb-copy.copied-flash{color:#7fd4c0!important;border-color:rgba(127,212,192,.5)!important}

/* ---------- 常驻目录条 ---------- */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:99999;display:flex;gap:2px;background:rgba(16,13,11,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(232,176,75,.3);border-radius:999px;padding:5px;box-shadow:0 10px 34px rgba(0,0,0,.55)}
.dock a{display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:#94867a;padding:6px 14px;
  border-radius:999px;text-decoration:none;white-space:nowrap;line-height:1.4;transition:all .2s;font-family:inherit}
.dock a b{font-size:16px;font-weight:400;line-height:1.2}
.dock a:hover{color:#f3ede3}
.dock a.on{color:#e8b04b;background:rgba(232,176,75,.15)}
@media(max-width:520px){.dock a{padding:6px 10px;font-size:10px}}
body{padding-bottom:86px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>案例海洋 · Opus 5.5</h1>
      <div class="sub">lemomo-ai/lemo-opuscar 全量帧索引 · 每一帧都是代码画出来的</div>
    </div>
    <div class="count"><span id="shown">0</span><small>/ <span id="total">88</span> 帧在视野</small></div>
  </header>

  <div class="controls">
    <div class="row">
      <span class="lbl">技术</span>
      <button class="chip active" data-stack="all">全部</button>
      <button class="chip" data-stack="Three.js">Three.js</button>
      <button class="chip" data-stack="Canvas">Canvas</button>
      <button class="chip" data-stack="React">React</button>
      <button class="chip" data-stack="SVG">SVG</button>
      <button class="chip" data-stack="CSS">CSS</button>
      <input class="search" id="search" placeholder="搜风格名 / 描述 / Prompt…">
    </div>
    <div class="row" style="margin-bottom:0">
      <span class="lbl">风格</span>
      <div class="style-rail" id="styleRail"></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="lightbox" id="lb">
  <div class="lb-close" onclick="closeLb()">&times;</div>
  <button class="lb-nav lb-prev" onclick="navLb(-1);event.stopPropagation()">‹</button>
  <img id="lb-img" src="" alt="">
  <div class="lb-bar">
    <span class="cap" id="lb-cap"></span>
    <a id="lb-gh" href="#" target="_blank" onclick="event.stopPropagation()">GitHub 源码 ↗</a>
    <a id="lb-copy" onclick="event.stopPropagation();copyPrompt(view[lbIdx].styleId,this)">📋 复制该风格 Prompt</a>
  </div>
  <button class="lb-nav lb-next" onclick="navLb(1);event.stopPropagation()">›</button>
</div>

<script>
let catalog=[],frames=[],view=[],curStack='all',curStyle='all',curQ='',lbIdx=0;
const initStyle=new URLSearchParams(location.search).get('style');

fetch('opuscar-catalog.json').then(r=>r.json()).then(data=>{
  catalog=data;
  frames=catalog.flatMap(it=>it.stills.map((s,i)=>({
    style:it.name,styleId:it.id,src:s,idx:i+1,total:it.stills.length,
    stack:it.stack,desc:it.desc,prompt:it.prompt,github:it.github
  })));
  document.getElementById('total').textContent=frames.length;
  if(initStyle&&catalog.some(c=>c.id===initStyle))curStyle=initStyle;
  buildRail();apply();
});

function buildRail(){
  const rail=document.getElementById('styleRail');
  rail.innerHTML=`<button class="style-chip ${curStyle==='all'?'active':''}" data-style="all">全部 <b>${frames.length}</b></button>`+
    catalog.map(it=>`<button class="style-chip ${curStyle===it.id?'active':''}" data-style="${it.id}">${it.name.replace(/ — Style Prompt.*$/,'').replace(/: Style Prompt.*$/,'')} <b>${it.stills.length}</b></button>`).join('');
  rail.querySelectorAll('.style-chip').forEach(c=>c.addEventListener('click',()=>{
    rail.querySelectorAll('.style-chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');curStyle=c.dataset.style;apply();
  }));
}

function apply(){
  view=frames.filter(f=>{
    if(curStack!=='all'&&!f.stack.includes(curStack))return false;
    if(curStyle!=='all'&&f.styleId!==curStyle)return false;
    if(curQ){const t=(f.style+' '+f.desc+' '+f.prompt).toLowerCase();if(!t.includes(curQ))return false;}
    return true;
  });
  document.getElementById('shown').textContent=view.length;
  const grid=document.getElementById('grid');
  grid.innerHTML=view.map((f,i)=>`
    <div class="frame" onclick="openLb(${i})">
      <button class="cp" onclick="event.stopPropagation();copyPrompt('${f.styleId}',this)">📋 Prompt</button>
      <div class="imgbox"><img src="${f.src}" loading="lazy" alt="${f.style}"></div>
      <div class="cap">
        <div class="sname">${f.style}</div>
        <div class="meta">
          <span class="fno">帧 ${f.idx}/${f.total}</span>
          <span class="tags">${f.stack.slice(0,2).map((t,j)=>`<i class="${j===0?'':'plain'}">${t}</i>`).join('')}</span>
        </div>
      </div>
    </div>`).join('')||'<div class="empty">没有匹配的帧，换个筛选条件</div>';
}

document.querySelectorAll('[data-stack]').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('[data-stack]').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');curStack=c.dataset.stack;apply();
}));
document.getElementById('search').addEventListener('input',e=>{curQ=e.target.value.trim();apply();});

function openLb(i){lbIdx=i;showLb();document.getElementById('lb').classList.add('active');}
function showLb(){
  const f=view[lbIdx];
  document.getElementById('lb-img').src=f.src;
  document.getElementById('lb-cap').textContent=`${f.style} · 帧 ${f.idx}/${f.total} · ${f.stack.join(' / ')}`;
  document.getElementById('lb-gh').href=f.github;
}
function navLb(d){lbIdx=(lbIdx+d+view.length)%view.length;showLb();}
function closeLb(){document.getElementById('lb').classList.remove('active');}
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb();});
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lb').classList.contains('active'))return;
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowLeft')navLb(-1);
  if(e.key==='ArrowRight')navLb(1);
});
</script>
<script>
// ---------- 一键复制 Prompt（按需取单文件，避免整包加载） ----------
const __pcache={};
function __flash(btn){
  if(!btn)return;
  const t=btn.textContent;btn.textContent='✓ 已复制';btn.classList.add('copied-flash');
  setTimeout(()=>{btn.textContent=t;btn.classList.remove('copied-flash')},1600);
}
function __write(text,btn){
  const done=()=>__flash(btn);
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>__legacyCopy(text,done));
  }else __legacyCopy(text,done);
}
function __legacyCopy(text,done){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done();
}
function copyPrompt(id,btn){
  const cached=__pcache[id];
  if(cached){__write(cached,btn);return}
  fetch('prompts/'+id+'.md').then(r=>r.text()).then(t=>{__pcache[id]=t;__write(t,btn)}).catch(()=>__flash(btn));
}
function copyTpl(btn){
  const el=document.querySelector('.tpl');
  if(el)__write(el.innerText,btn);
}
</script>

<!-- 常驻目录条：任何页面随时跳回 -->
<div class="dock">
  <a href="index.html" data-dock="wall"><b>🧱</b>案例墙</a>
  <a href="learn.html" data-dock="learn"><b>📚</b>拆解课堂</a>
  <a href="catalog.html" data-dock="catalog"><b>🌊</b>帧海洋</a>
  <a href="pk-battle.html" data-dock="pk"><b>⚔</b>PK 擂台</a>
</div>
<script>document.querySelector('.dock a[data-dock="catalog"]').classList.add('on');</script>
</body>
</html>
