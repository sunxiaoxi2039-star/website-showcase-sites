:root{
  --paper:#ece2cc;
  --paper-2:#e4d8bf;
  --mat:#f3ecdb;
  --ground:#eadfc6;
  --ink:#231f1b;
  --ink-soft:#5b544a;
  --rule:rgba(92,72,46,.26);
  --mist:241,235,221;
  --verm:#b3392a;
  --verm-deep:#962c20;
  --sun:#a9503d;
  --serif:'Garamond Ink','EB Garamond','Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --brush:'Inkbrush','Ma Shan Zheng','STKaiti','KaiTi','Kaiti SC',serif;
  --seal:'Sealcut','Noto Serif SC','Songti SC','SimSun',serif;
  --m:.42;
  --gut:clamp(16px,3.4vw,52px);
  --matw:clamp(10px,2.1vw,30px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--paper);
  background-image:
    radial-gradient(120% 90% at 50% 38%,rgba(255,250,238,.55),rgba(255,250,238,0) 62%),
    radial-gradient(80% 60% at 8% 100%,rgba(150,112,62,.13),transparent 70%),
    radial-gradient(70% 55% at 100% 0%,rgba(150,112,62,.10),transparent 70%),
    repeating-radial-gradient(circle at 37% 61%,rgba(120,92,52,.03) 0 1px,transparent 1px 4.3px),
    repeating-radial-gradient(circle at 81% 27%,rgba(120,92,52,.025) 0 1px,transparent 1px 6.1px);
  color:var(--ink);
  font-family:var(--serif);
  font-size:16px;
  line-height:1.5;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
main{
  min-height:100vh;min-height:100svh;
  display:grid;place-items:center;
  padding:clamp(18px,4.2vh,44px) var(--gut) clamp(22px,4.6vh,48px);
}
figure{margin:0;width:100%;display:grid;justify-items:center}

/* ---------- mount (the paper frame) ---------- */
.mount{
  --sw:min(1240px, calc(100vw - 2*var(--gut) - 2*var(--matw)), calc((100svh - 262px) * 2.4));
  width:calc(max(280px,var(--sw)) + 2*var(--matw));
  padding:var(--matw);
  position:relative;
  background:
    linear-gradient(180deg,rgba(255,252,244,.55),rgba(255,252,244,0) 30%,rgba(120,90,50,.05)),
    repeating-linear-gradient(91deg,rgba(120,92,52,.03) 0 1px,transparent 1px 5px),
    var(--mat);
  border:1px solid rgba(116,90,56,.22);
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 26px 44px -30px rgba(70,45,18,.45),
    0 3px 10px -4px rgba(70,45,18,.16);
}
.scene{
  position:relative;width:100%;
  aspect-ratio:12/5;
  overflow:hidden;
  container-type:inline-size;
  isolation:isolate;
  background:var(--ground);
  box-shadow:0 0 0 1px rgba(84,64,40,.34),0 0 0 5px var(--mat),0 0 0 6px rgba(84,64,40,.16);
}
.scene > *{position:absolute;pointer-events:none}

/* sky */
.sky{inset:0;
  background:
    radial-gradient(38% 60% at var(--sx,60%) var(--sy,37%),rgba(196,118,86,.20),rgba(196,118,86,0) 70%),
    linear-gradient(180deg,#e2d7bd 0%,#e9dec6 38%,#efe5cf 60%,#ece2cb 64%,#e2dcc6 64.2%,#dcd8c3 82%,#d4d1bc 100%);
}
.sky::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(var(--mist),.0) 0%,rgba(var(--mist),.55) 45%,rgba(var(--mist),.85) 64%,rgba(var(--mist),.35) 80%,rgba(var(--mist),.1));
  opacity:calc(var(--m) * .8);
}

/* sun */
.sun{border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 50% 50%,var(--sun) 0 58%,rgba(169,80,61,.92) 66%,rgba(169,80,61,.0) 71%);
  opacity:calc(.92 - var(--m) * .42);
  filter:blur(calc(var(--m) * 2.4px));
  mix-blend-mode:multiply;
}
.sun::after{content:"";position:absolute;inset:-70%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(190,110,80,.22),rgba(190,110,80,0));
  opacity:calc(.35 + var(--m) * .9);
}

/* mountain layers */
.layer{inset:0;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(var(--wl) - var(--f,10%)),rgba(0,0,0,.35) calc(var(--wl) - var(--f,10%) * .35),transparent calc(var(--wl) + .3%));
          mask-image:linear-gradient(180deg,#000 calc(var(--wl) - var(--f,10%)),rgba(0,0,0,.35) calc(var(--wl) - var(--f,10%) * .35),transparent calc(var(--wl) + .3%));
}
.layer > i{position:absolute;inset:0;clip-path:var(--clip)}
.layer .edge{background:var(--edge)}
.layer .tex{overflow:hidden}
.tex b{position:absolute;width:var(--sw,1px);transform-origin:50% 0;border-radius:1px;
  background:linear-gradient(180deg,var(--sc,rgba(30,40,30,.5)),rgba(30,40,30,0))}
.layer .wash{
  transform:translateY(var(--lip,.7%));
  background:
    radial-gradient(40% 16% at 30% 30%,rgba(255,255,255,.10),transparent 70%),
    radial-gradient(28% 22% at 70% 44%,rgba(0,0,0,.06),transparent 70%),
    repeating-linear-gradient(93deg,rgba(20,30,20,.035) 0 1px,transparent 1px 7px,rgba(255,255,255,.04) 7px 8px,transparent 8px 17px),
    repeating-linear-gradient(81deg,rgba(20,30,20,.03) 0 1px,transparent 1px 13px),
    linear-gradient(180deg,var(--top) 0%,var(--top) var(--y0,30%),var(--bot) var(--wl));
}
.l1{--edge:#b2baa7;--top:#c5cbb9;--bot:#dcddcc;filter:blur(1.1px);opacity:calc(.95 - var(--m) * .55)}
.l2{--edge:#7c8b7a;--top:#9aa897;--bot:#c9cfbf;filter:blur(.5px);opacity:calc(1 - var(--m) * .38)}
.l3{--edge:#63725f;--top:#85957f;--bot:#bcc4b1;filter:blur(.35px);opacity:calc(1 - var(--m) * .26)}
.l4{--edge:#465644;--top:#667763;--bot:#a6b09c;filter:blur(.25px);opacity:calc(1 - var(--m) * .16);--lip:.55%}
.l5{--edge:#2c362c;--top:#465245;--bot:#7c8676;--lip:.8%;
  -webkit-mask-image:linear-gradient(180deg,#000 88%,transparent 100%);mask-image:linear-gradient(180deg,#000 88%,transparent 100%);
  opacity:calc(1 - var(--m) * .12)}

/* moss dots & trees */
.dots{inset:0}
.dots b{position:absolute;border-radius:50%;background:var(--c,#3b4639);transform:translate(-50%,-50%)}
.tree{position:absolute;transform-origin:50% 100%}
.tree i{position:absolute;display:block;background:#28302a}
.tree .t{left:50%;bottom:0;width:6%;height:64%;border-radius:40% 40% 20% 20%;transform:translateX(-50%) skewX(var(--lean,-4deg));background:#2d342d}
.tree .c{left:-10%;right:-10%;top:0;height:72%}

/* water */
.water{left:0;right:0;top:var(--wl);bottom:0;
  background:
    linear-gradient(180deg,rgba(var(--mist),.55),rgba(var(--mist),0) 16%),
    linear-gradient(180deg,#e0dac5 0%,#d6d3be 40%,#cfcdb7 100%);
}
.refl{inset:0;transform-origin:50% var(--wl);transform:scaleY(-1);
  -webkit-mask-image:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.3) 40%,#000 60%);
          mask-image:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.3) 40%,#000 60%);
  opacity:calc((1 - var(--m) * .7) * var(--ro,.5));
}
.refl > div{position:absolute;inset:0;
  -webkit-mask-image:repeating-linear-gradient(180deg,#000 0 2px,rgba(0,0,0,.25) 2px 3px,#000 3px 5px,rgba(0,0,0,.5) 5px 6px);
          mask-image:repeating-linear-gradient(180deg,#000 0 2px,rgba(0,0,0,.25) 2px 3px,#000 3px 5px,rgba(0,0,0,.5) 5px 6px);
  animation:wobble 9s ease-in-out infinite alternate;
}
.refl i{position:absolute;inset:0;clip-path:var(--clip);background:var(--rc)}
.r1{--rc:#b7bfad;--ro:.55;filter:blur(1.6px)}
.r2{--rc:#8e9c8b;--ro:.5;filter:blur(1.1px)}
.r3{--rc:#7a8a75;--ro:.5;filter:blur(.9px)}
.r4{--rc:#5e6e5b;--ro:.55;filter:blur(.8px)}
@keyframes wobble{from{transform:translateX(-.25%) scaleX(1.002)}to{transform:translateX(.25%) scaleX(.998)}}

.sunr{transform:translate(-50%,-50%);
  background:repeating-linear-gradient(180deg,rgba(169,80,61,.75) 0 2px,transparent 2px 4px,rgba(169,80,61,.45) 4px 5px,transparent 5px 8px);
  -webkit-mask-image:radial-gradient(closest-side,#000 40%,rgba(0,0,0,.4) 75%,transparent);
          mask-image:radial-gradient(closest-side,#000 40%,rgba(0,0,0,.4) 75%,transparent);
  opacity:calc(.55 - var(--m) * .4);
  filter:blur(.4px);
}
.shore-mist{left:-5%;right:-5%;top:calc(var(--wl) - 7%);height:13%;
  background:radial-gradient(60% 50% at 50% 50%,rgba(var(--mist),.95),rgba(var(--mist),0) 100%);
  opacity:calc(.25 + var(--m) * .75);
}
.ripples{inset:0}
.ripples b{position:absolute;height:1px;border-radius:1px;transform:translateX(-50%)}
.ripples .lt{background:linear-gradient(90deg,rgba(252,248,238,0),rgba(252,248,238,.85),rgba(252,248,238,0))}
.ripples .dk{background:linear-gradient(90deg,rgba(58,70,58,0),rgba(58,70,58,.32),rgba(58,70,58,0))}
.ripples .gl{background:linear-gradient(90deg,rgba(169,80,61,0),rgba(169,80,61,.7),rgba(169,80,61,0));opacity:calc(1 - var(--m) * .8)}
.ripples .tw{animation:twinkle var(--d,6s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes twinkle{from{opacity:.15}to{opacity:1}}

/* mist */
.band{
  background:
    radial-gradient(34% 46% at 22% 58%,rgba(var(--mist),.95),rgba(var(--mist),0) 100%),
    radial-gradient(30% 38% at 52% 40%,rgba(var(--mist),.9),rgba(var(--mist),0) 100%),
    radial-gradient(28% 50% at 78% 60%,rgba(var(--mist),.92),rgba(var(--mist),0) 100%),
    radial-gradient(50% 30% at 50% 62%,rgba(var(--mist),.8),rgba(var(--mist),0) 100%);
  opacity:calc(var(--m) * var(--k,1) + var(--b0,0));
}
.drift{animation:drift var(--d,60s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes drift{from{transform:translateX(calc(var(--dx,4%) * -1))}to{transform:translateX(var(--dx,4%))}}
.veil{inset:0;
  background:linear-gradient(180deg,rgba(var(--mist),.25) 0%,rgba(var(--mist),.75) 50%,rgba(var(--mist),.9) 66%,rgba(var(--mist),.45) 88%,rgba(var(--mist),.25));
  opacity:calc(var(--m) * var(--m) * .75);
}

/* boat */
.lane{height:0}
.rider{position:absolute;left:0;top:0;width:100%;height:0;animation:sail 170s linear -62s infinite}
@keyframes sail{
  0%{transform:translateX(0);opacity:0}
  6%{opacity:1}
  92%{opacity:1}
  100%{transform:translateX(100%);opacity:0}
}
.boat{position:absolute;left:0;bottom:0;width:var(--bw,40px);aspect-ratio:3/1.25;transform:translateX(-50%)}
.bob{position:absolute;inset:0;transform-origin:50% 85%;animation:bob 7s ease-in-out infinite alternate}
@keyframes bob{from{transform:rotate(-1.4deg) translateY(0)}to{transform:rotate(1.2deg) translateY(4%)}}
.boat i{position:absolute;display:block;background:#2a2723}
.boat .hull{left:0;right:0;bottom:0;height:46%;
  clip-path:polygon(0 0,7% 30%,20% 62%,40% 78%,62% 78%,82% 60%,94% 30%,100% 4%,88% 22%,62% 34%,34% 34%,12% 22%)}
.boat .roof{left:30%;width:38%;bottom:36%;height:30%;border-radius:50% 50% 6% 6%/100% 100% 8% 8%;background:#35312c}
.boat .roof::after{content:"";position:absolute;inset:20% 18% 0;border-radius:inherit;background:rgba(236,226,204,.10)}
.boat .hat{left:73.5%;bottom:70%;width:19%;height:15%;clip-path:polygon(50% 0,100% 88%,86% 100%,14% 100%,0 88%);background:#2e2a25}
.boat .body{left:79%;bottom:32%;width:7.5%;height:40%;border-radius:45% 45% 12% 12%;transform:skewX(-10deg)}
.boat .pole{left:83%;bottom:-40%;width:1px;height:150%;transform-origin:50% 100%;transform:rotate(-24deg);background:linear-gradient(#2a2723 70%,rgba(42,39,35,0))}
.boat .wake{left:-160%;width:170%;bottom:-2%;height:1px;background:linear-gradient(90deg,rgba(250,246,236,0),rgba(250,246,236,.9));}
.boat .wake + .wake{left:-110%;width:120%;bottom:-16%;opacity:.6}
.boat-r{position:absolute;inset:0;transform-origin:50% 100%;transform:scaleY(-.85);opacity:calc(.32 - var(--m) * .2);filter:blur(.6px);
  -webkit-mask-image:repeating-linear-gradient(180deg,#000 0 1px,transparent 1px 2px);mask-image:repeating-linear-gradient(180deg,#000 0 1px,transparent 1px 2px)}
.boat-r .wake{display:none}

/* verse & seals */
.verse{top:7%;right:4.2%;display:flex;flex-direction:row-reverse;align-items:flex-start;gap:1.2cqw;pointer-events:auto}
.poem{writing-mode:vertical-rl;font-family:var(--brush);font-size:2.25cqw;line-height:1.62;letter-spacing:.14em;color:rgba(30,26,22,.86);margin:0;
  text-shadow:0 0 .6px rgba(30,26,22,.55)}
.sign{display:flex;flex-direction:column;align-items:center;gap:.8cqw;padding-top:3.2cqw}
.sign p{writing-mode:vertical-rl;margin:0;font-family:var(--brush);font-size:1.28cqw;letter-spacing:.2em;color:rgba(30,26,22,.8)}
.seal{width:3cqw;aspect-ratio:1;position:relative;display:grid;place-items:center;
  background:
    radial-gradient(12% 9% at 22% 74%,rgba(241,231,209,.55),transparent 70%),
    radial-gradient(7% 10% at 80% 18%,rgba(241,231,209,.45),transparent 70%),
    radial-gradient(4% 4% at 60% 90%,rgba(241,231,209,.7),transparent 70%),
    linear-gradient(135deg,var(--verm),var(--verm-deep));
  clip-path:var(--sealclip,none);
  mix-blend-mode:multiply;transform:rotate(-1.2deg);
}
.seal span{writing-mode:vertical-rl;font-family:var(--seal);font-weight:900;font-size:1.08cqw;line-height:1.12;letter-spacing:.04em;color:#f1e6cf;text-align:center;opacity:.95}
.seal2{bottom:5%;left:2.6%;width:1.7cqw;aspect-ratio:1/1.9;border:.14cqw solid var(--verm);border-radius:48%;display:grid;place-items:center;opacity:.8;mix-blend-mode:multiply;transform:rotate(1.5deg)}
.seal2 span{writing-mode:vertical-rl;font-family:var(--seal);font-weight:900;font-size:.72cqw;line-height:1;color:var(--verm)}

.grain{inset:0;mix-blend-mode:multiply;opacity:.55;
  background:
    radial-gradient(60% 40% at 18% 22%,rgba(160,120,70,.08),transparent 70%),
    radial-gradient(40% 30% at 86% 80%,rgba(160,120,70,.09),transparent 70%),
    radial-gradient(120% 120% at 50% 50%,transparent 60%,rgba(120,86,46,.16) 100%),
    repeating-radial-gradient(circle at 23% 41%,rgba(110,84,50,.035) 0 1px,transparent 1px 3.7px),
    repeating-radial-gradient(circle at 71% 13%,rgba(110,84,50,.03) 0 1px,transparent 1px 5.3px),
    repeating-linear-gradient(89deg,rgba(110,84,50,.018) 0 1px,transparent 1px 3px,transparent 3px 11px,rgba(110,84,50,.02) 11px 12px,transparent 12px 23px);
}

/* ---------- caption ---------- */
.caption{
  width:calc(max(280px,var(--capw,1240px)));
  max-width:100%;
  margin-top:clamp(16px,2.6vh,26px);
  display:grid;grid-template-columns:1fr 1.18fr 1fr;
  border-top:1px solid var(--rule);
  color:var(--ink-soft);
  font-size:14px;line-height:1.5;
}
.caption > section{padding:14px 22px 2px;min-width:0}
.caption > section + section{border-left:1px solid var(--rule)}
.caption > section:first-child{padding-left:2px}
.caption > section:last-child{padding-right:2px}
.label{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#8a7a62;margin:0 0 6px;font-weight:500}
.title{font-style:italic;font-size:19px;line-height:1.25;color:var(--ink);margin:0 0 6px;font-weight:400}
.meta{margin:0;font-size:13.5px}
.lines{margin:0;font-style:italic;font-size:14.5px;line-height:1.52;color:#3f392f}
.lines span{display:block}
.mist-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.mist-row output{font-style:italic;color:var(--ink);font-size:15px}
.mist-row .pct{font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.08em;color:#8a7a62}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:28px;margin:2px 0 4px;background:transparent;cursor:pointer;
  --p:42%;
}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;
  background:linear-gradient(90deg,#3a342c 0 var(--p),rgba(92,72,46,.28) var(--p))}
input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:rgba(92,72,46,.28)}
input[type=range]::-moz-range-progress{height:2px;background:#3a342c}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-6.5px;border-radius:50%;
  background:var(--verm);border:2px solid var(--mat);box-shadow:0 0 0 1px rgba(150,44,32,.55),0 1px 3px rgba(60,30,10,.25)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--verm);border:2px solid var(--mat);box-shadow:0 0 0 1px rgba(150,44,32,.55)}
input[type=range]:focus{outline:none}
input[type=range]:focus-visible{outline:1px dashed #8a7a62;outline-offset:3px;border-radius:2px}
.hint{margin:0;font-size:12.5px;color:#7e715d}

@media (max-width:1020px){
  .scene{aspect-ratio:8/5}
  .mount{--sw:min(1240px, calc(100vw - 2*var(--gut) - 2*var(--matw)))}
  .poem{font-size:3cqw}
  .sign p{font-size:1.7cqw}
  .sign{padding-top:4.2cqw}
  .seal{width:4cqw}.seal span{font-size:1.44cqw}
  .seal2{width:2.3cqw}.seal2 span{font-size:.98cqw}
}
@media (max-width:700px){
  .scene{aspect-ratio:5/6}
  .verse{top:5%;right:5%;gap:2cqw}
  .poem{font-size:5.3cqw;line-height:1.55}
  .sign p{font-size:3cqw}
  .sign{padding-top:4cqw;gap:2cqw}
  .seal{width:7cqw}.seal span{font-size:2.5cqw}
  .seal2{width:4cqw;left:4%;bottom:4%;border-width:.3cqw}.seal2 span{font-size:1.7cqw}
  .caption{grid-template-columns:1fr;border-top:0}
  .caption > section{padding:14px 2px 12px;border-top:1px solid var(--rule)}
  .caption > section + section{border-left:0}
  .title{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .rider{transform:translateX(42%)}
}

<body>
<main>
  <figure>
    <div class="mount">
      <div class="scene" id="scene" role="img" aria-label="Ink-wash landscape at dusk: layered grey-green mountains fade into river mist beneath a muted red sun; a tiny boat drifts across the still water; a vertical Chinese poem and a vermilion seal stand in the upper right.">
        <div class="sky"></div>
        <div class="sun" id="sun"></div>
        <div class="layer l1" data-l="0"><i class="edge"></i><i class="wash"></i><i class="tex"></i></div>
        <div class="band drift" data-band="0.505,1.3,0.10,-0.10" style="--k:.8;--b0:.08;--d:74s;--dx:3%"></div>
        <div class="layer l2" data-l="1"><i class="edge"></i><i class="wash"></i><i class="tex"></i></div>
        <div class="dots" data-dots="1"></div>
        <div class="band drift" data-band="0.33,.9,0.075,-0.35" style="--k:.95;--b0:.02;--d:58s;--dl:-20s;--dx:5%"></div>
        <div class="band drift" data-band="0.565,1.4,0.09,0.25" style="--k:.9;--b0:.1;--d:66s;--dl:-9s;--dx:4%"></div>
        <div class="layer l3" data-l="2"><i class="edge"></i><i class="wash"></i><i class="tex"></i></div>
        <div class="dots" data-dots="2"></div>
        <div class="band drift" data-band="0.6,1.1,0.07,-0.2" style="--k:.85;--b0:.1;--d:52s;--dl:-30s;--dx:4%"></div>
        <div class="layer l4" data-l="3"><i class="edge"></i><i class="wash"></i><i class="tex"></i></div>
        <div class="dots" data-dots="3"></div>
        <div class="water"></div>
        <div class="sunr" id="sunr"></div>
        <div class="refl r1" data-r="0"><div><i></i></div></div>
        <div class="refl r2" data-r="1"><div><i></i></div></div>
        <div class="refl r3" data-r="2"><div><i></i></div></div>
        <div class="refl r4" data-r="3"><div><i></i></div></div>
        <div class="shore-mist"></div>
        <div class="ripples" id="ripples"></div>
        <div class="lane" id="lane"><div class="rider"><div class="boat" id="boat"></div></div></div>
        <div class="band drift" data-band="0.83,1.2,0.07,0.1" style="--k:.7;--b0:0;--d:80s;--dl:-40s;--dx:5%"></div>
        <div class="layer l5" data-l="4"><i class="edge"></i><i class="wash"></i><i class="tex"></i></div>
        <div class="dots" data-dots="4"></div>
        <div class="veil"></div>
        <div class="verse" lang="zh-Hans" aria-hidden="true">
          <p class="poem">移舟泊烟渚<br>日暮客愁新<br>野旷天低树<br>江清月近人</p>
          <div class="sign">
            <p>孟浩然 宿建德江</p>
            <div class="seal" id="seal"><span>山水<br>清音</span></div>
          </div>
        </div>
        <div class="seal2" aria-hidden="true"><span>烟波</span></div>
        <div class="grain"></div>
      </div>
    </div>

    <figcaption class="caption" id="caption">
      <section>
        <span class="label">The painting</span>
        <h1 class="title">Mooring at Dusk on the Jiande River</h1>
        <p class="meta">After a quatrain by Meng Haoran (689–740). Mountains, sun, water and boat are cut from CSS silhouettes on warm paper.</p>
      </section>
      <section>
        <span class="label">The verse</span>
        <p class="lines">
          <span>I move my boat to moor by the misted isle;</span>
          <span>at dusk, a traveller’s sorrow comes anew.</span>
          <span>The wilds lie wide, the sky sinks below the trees;</span>
          <span>the river is clear, the moon comes close to me.</span>
        </p>
      </section>
      <section>
        <span class="label"><label for="mist">Atmosphere</label></span>
        <div class="mist-row"><output id="mistName" for="mist">Drifting mist</output><span class="pct" id="mistPct">42</span></div>
        <input type="range" id="mist" min="0" max="100" step="1" value="42" aria-describedby="mistHint">
        <p class="hint" id="mistHint">Draw the slider to thicken or lift the river mist.</p>
      </section>
    </figcaption>
  </figure>
</main>

<script>
(function(){
  'use strict';
  var scene=document.getElementById('scene');
  var WL=0.64;             // waterline (fraction of height)
  var WORLD=2.4;           // composition width in "heights"

  /* ---------- deterministic noise ---------- */
  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function noise1(seed){
    var r=rng(seed),T=[];for(var i=0;i<512;i++)T.push(r()*2-1);
    function v(x){var i=Math.floor(x),f=x-i,a=T[i&511],b=T[(i+1)&511];f=f*f*(3-2*f);return a+(b-a)*f;}
    return function(x){var s=0,amp=1,fr=1,n=0;for(var o=0;o<5;o++){s+=v(x*fr+o*31.7)*amp;n+=amp;amp*=.5;fr*=2.03;}return s/n;};
  }

  /* ---------- composition, in world units (x: 0..2.4, y: 0..1 down) ---------- */
  // peaks: [x, topY, halfWidth, q(shape: 2 round, 1 pointed)]
  var LAYERS=[
    {seed:11,base:.545,bottom:WL,rough:.016,freq:7,jag:.004,peaks:[[.12,.47,.34,1.8],[.6,.445,.3,1.6],[1.12,.425,.26,1.7],[1.72,.46,.22,1.8],[1.98,.405,.26,1.5],[2.34,.45,.3,1.8]]},
    {seed:23,base:.62,bottom:WL,rough:.02,freq:6.5,jag:.007,peaks:[[.06,.39,.2,1.7],[.2,.35,.08,2.2],[.31,.29,.18,1.5],[.43,.21,.07,2.4],[.53,.13,.17,1.45],[.6,.155,.06,2.4],[.66,.2,.07,2.4],[.73,.235,.15,1.5],[.83,.3,.07,2.2],[.92,.375,.17,1.7],[1.16,.5,.2,2]]},
    {seed:37,base:.62,bottom:WL,rough:.018,freq:7,jag:.006,peaks:[[1.44,.52,.2,1.9],[1.56,.41,.13,1.7],[1.66,.335,.13,1.5],[1.74,.375,.06,2.4],[1.92,.525,.12,1.8],[2.3,.52,.24,1.9],[-.02,.43,.2,1.7],[.14,.47,.07,2.2]]},
    {seed:41,base:.633,bottom:WL,rough:.01,freq:9,jag:.003,peaks:[[.08,.5,.3,1.9],[.42,.555,.26,2],[.78,.59,.24,2],[1.74,.55,.16,1.8],[2.28,.505,.24,1.9]]},
    {seed:53,base:1.03,bottom:1.03,rough:.016,freq:7,jag:.006,peaks:[[2.2,.77,.3,1.5],[2.42,.7,.2,1.6],[1.96,.87,.12,1.8],[2.52,.72,.2,1.6]]}
  ];
  LAYERS.forEach(function(L){L.n1=noise1(L.seed);L.n2=noise1(L.seed*7+3);
    L.minY=Math.min.apply(null,L.peaks.map(function(p){return p[1];}));});

  function ridge(L,x){
    var best=0;
    for(var i=0;i<L.peaks.length;i++){var p=L.peaks[i],t=Math.abs(x-p[0])/p[2];
      if(t<1){var h=(L.base-p[1])*Math.pow(1-Math.pow(t,p[3]),1.55);if(h>best)best=h;}}
    var hf=best/(L.base-L.minY);
    var y=L.base-best;
    y+=L.rough*L.n1(x*L.freq)*(.35+.9*hf);
    y+=L.jag*L.n2(x*L.freq*6)*(.3+hf);
    return Math.min(y,L.bottom);
  }

  var view={x0:0,vw:WORLD,W:1,H:1};
  function px(x){return (x-view.x0)/view.vw*100;}

  function buildLayers(){
    var steps=Math.round(160+view.W/5);
    var els=scene.querySelectorAll('[data-l]');
    LAYERS.forEach(function(L,li){
      var a=view.x0-.03,b=view.x0+view.vw+.03,pts=[],top=1;
      for(var s=0;s<=steps;s++){var x=a+(b-a)*s/steps,y=ridge(L,x);if(y<top)top=y;pts.push(px(x).toFixed(2)+'% '+(y*100).toFixed(2)+'%');}
      pts.push(px(b).toFixed(2)+'% '+(L.bottom*100+.4).toFixed(2)+'%',px(a).toFixed(2)+'% '+(L.bottom*100+.4).toFixed(2)+'%');
      var clip='polygon('+pts.join(',')+')';
      els[li].style.setProperty('--clip',clip);
      els[li].style.setProperty('--y0',(top*100+2).toFixed(1)+'%');
      var r=scene.querySelector('[data-r="'+li+'"]');if(r)r.style.setProperty('--clip',clip);
      L.top=top;
      els[li].querySelector('.tex').innerHTML=strokes(L,li);
    });
  }
  // hemp-fibre texture strokes (披麻皴) running down from the ridges
  function strokes(L,li){
    var cfg=[[10,'rgba(120,132,112,.35)',.6],[26,'rgba(52,64,50,.42)',1],[24,'rgba(44,56,42,.46)',1],[14,'rgba(30,40,30,.5)',1],[22,'rgba(18,24,18,.6)',1.2]][li];
    var r=rng(L.seed*5+1),html='',H=view.H;
    for(var p=0;p<L.peaks.length;p++){
      var pk=L.peaks[p];if(pk[2]<.1)continue;
      var n=Math.round(cfg[0]*pk[2]/.18);
      for(var k=0;k<n;k++){
        var off=(r()*2-1)*pk[2]*.78,x=pk[0]+off;
        if(x<view.x0-.05||x>view.x0+view.vw+.05)continue;
        var y=ridge(L,x)+.003+r()*.02*(li===4?2:1);
        var len=(.035+r()*.12)*(L.bottom-y)*1.6;
        var ang=(off<0?1:-1)*(8+Math.abs(off)/pk[2]*26+r()*8);
        var sw=(cfg[2]*(.7+r()*.8)*Math.max(.8,H/520)).toFixed(2);
        html+='<b style="left:'+px(x).toFixed(2)+'%;top:'+(y*100).toFixed(2)+'%;height:'+(len*H).toFixed(1)+'px;transform:rotate('+ang.toFixed(1)+'deg);opacity:'+(.35+r()*.65).toFixed(2)+';--sw:'+sw+'px;--sc:'+cfg[1]+'"></b>';
      }
    }
    return html;
  }

  function buildDots(){
    var holders=scene.querySelectorAll('[data-dots]');
    for(var h=0;h<holders.length;h++){
      var holder=holders[h],li=+holder.getAttribute('data-dots'),L=LAYERS[li],r=rng(L.seed*13+5),html='';
      var col=['','#55634f','#445241','#303b2f','#1f261f'][li];
      var count=[0,34,26,22,26][li]*view.vw/WORLD;
      var unit=view.H/100;
      for(var k=0,tries=0;k<count&&tries<4000;tries++){
        var x=view.x0+r()*view.vw,y=ridge(L,x),hf=(L.base-y)/(L.base-L.minY);
        if(hf<.22||r()>hf*hf*1.4)continue;
        // moss dots (苔点) sitting right on the ridge line
        var dy=r()*r()*(li===4?.04:.012)+.002;
        var w=(li===4?.32:.26)+r()*(li===4?.4:.3);
        html+='<b style="left:'+px(x).toFixed(2)+'%;top:'+((y+dy)*100).toFixed(2)+'%;width:'+(w*unit*2.1).toFixed(1)+'px;height:'+(w*unit).toFixed(1)+'px;--c:'+col+';opacity:'+(.5+r()*.45).toFixed(2)+'"></b>';
        k++;
      }
      // pines on the near shore and foreground rocks
      if(li===3||li===4){
        var spots=li===4?[2.08,2.19,2.33]:[.12,.2,.3,1.72,2.3];
        for(var s=0;s<spots.length;s++){
          var tx=spots[s]+(r()-.5)*.03;if(tx<view.x0+.02||tx>view.x0+view.vw-.02)continue;
          var ty=ridge(L,tx)+.004,th=(li===4?.085:.036)*(.75+r()*.5);
          html+=tree(tx,ty,th,r);
        }
      }
      holder.innerHTML=html;
    }
  }
  function tree(x,y,h,r){
    var hp=h*Math.min(view.H,view.W*.75),wp=hp*(.7+r()*.3),s='<span class="tree" style="left:'+(px(x)).toFixed(2)+'%;top:'+(y*100).toFixed(2)+'%;width:'+wp.toFixed(1)+'px;height:'+hp.toFixed(1)+'px;margin-left:'+(-wp/2).toFixed(1)+'px;margin-top:'+(-hp).toFixed(1)+'px;--lean:'+((r()-.5)*14).toFixed(1)+'deg">';
    s+='<i class="t"></i>';
    // crown: a cluster of soft ink blots
    var bl=[],nb=5+Math.floor(r()*4);
    for(var i=0;i<nb;i++){
      var bx=50+(r()-.5)*44,by=26+r()*48,rx=16+r()*14,ry=rx*(.55+r()*.3),al=(.72+r()*.25).toFixed(2);
      bl.push('radial-gradient('+rx.toFixed(0)+'% '+ry.toFixed(0)+'% at '+bx.toFixed(0)+'% '+by.toFixed(0)+'%,rgba(30,38,31,'+al+') 45%,rgba(30,38,31,0) 100%)');
    }
    s+='<i class="c" style="background:'+bl.join(',')+'"></i>';
    return s+'</span>';
  }

  function buildWater(){
    var r=rng(97),html='',n=Math.round(70*view.vw/WORLD+26);
    var sunX=view.sunX;
    for(var i=0;i<n;i++){
      var d=Math.pow(r(),1.35),y=WL+.012+d*(1-WL-.02),x=view.x0+r()*view.vw;
      var len=(.02+d*.13)*(.5+r());
      var cls=r()<.62?'lt':'dk';
      var tw=r()<.35?' tw':'';
      html+='<b class="'+cls+tw+'" style="left:'+px(x).toFixed(2)+'%;top:'+(y*100).toFixed(2)+'%;width:'+(len/view.vw*100).toFixed(2)+'%;opacity:'+(.35+r()*.6).toFixed(2)+(tw?';--d:'+(4+r()*6).toFixed(1)+'s;--dl:-'+(r()*8).toFixed(1)+'s':'')+'"></b>';
    }
    // a broken vermilion path beneath the sun
    for(var j=0;j<24;j++){
      var dd=Math.pow(j/24,1.1),yy=WL+.018+dd*(1-WL-.05);
      var xx=sunX+(r()-.5)*(.02+dd*.12),ll=(.012+dd*.05)*(.5+r()*.8);
      html+='<b class="gl'+(r()<.5?' tw':'')+'" style="left:'+px(xx).toFixed(2)+'%;top:'+(yy*100).toFixed(2)+'%;width:'+(ll/view.vw*100).toFixed(2)+'%;--d:'+(3+r()*5).toFixed(1)+'s;--dl:-'+(r()*6).toFixed(1)+'s"></b>';
    }
    document.getElementById('ripples').innerHTML=html;
  }

  function buildSun(){
    var sun=document.getElementById('sun'),sr=document.getElementById('sunr');
    var d=Math.min(view.H*.125,view.W*.2);
    var sx=px(view.sunX);
    sun.style.cssText='left:'+sx+'%;top:'+(view.sunY*100)+'%;width:'+d+'px;height:'+d+'px';
    sr.style.cssText='left:'+sx+'%;top:'+((2*WL-view.sunY)*100)+'%;width:'+(d*1.05)+'px;height:'+(d*.9)+'px';
    scene.style.setProperty('--sx',sx+'%');scene.style.setProperty('--sy',(view.sunY*100)+'%');
  }

  function buildBands(){
    var bands=scene.querySelectorAll('[data-band]');
    for(var i=0;i<bands.length;i++){
      var v=bands[i].getAttribute('data-band').split(',').map(Number); // y, width(world), height, x-offset (fraction of view)
      var w=Math.min(v[1]/view.vw*100,140),cx=50+v[3]*100*(view.vw/WORLD)*.9;
      bands[i].style.left=(cx-w/2)+'%';bands[i].style.width=w+'%';
      bands[i].style.top=((v[0]-v[2]/2)*100)+'%';bands[i].style.height=(v[2]*100)+'%';
    }
  }

  function buildBoat(){
    var lane=document.getElementById('lane'),boat=document.getElementById('boat');
    var a=view.boatA,b=view.boatB;
    lane.style.left=px(a)+'%';lane.style.width=((b-a)/view.vw*100)+'%';lane.style.top=(view.boatY*100)+'%';
    var bw=Math.max(26,Math.min(view.H*.084,view.W*.11));
    boat.style.setProperty('--bw',bw.toFixed(1)+'px');
    if(!boat.firstChild){
      var parts='<i class="wake"></i><i class="wake"></i><i class="hull"></i><i class="roof"></i><i class="hat"></i><i class="body"></i><i class="pole"></i>';
      boat.innerHTML='<div class="bob">'+parts+'</div><div class="boat-r"><div class="bob">'+parts+'</div></div>';
    }
  }

  function sealEdge(){
    var r=rng(7),pts=[],n=9,j=function(){return (r()*4.5).toFixed(1);};
    for(var i=0;i<n;i++)pts.push((i/n*100).toFixed(1)+'% '+j()+'%');
    for(i=0;i<n;i++)pts.push((100-j())+'% '+(i/n*100).toFixed(1)+'%');
    for(i=0;i<n;i++)pts.push((100-i/n*100).toFixed(1)+'% '+(100-j())+'%');
    for(i=0;i<n;i++)pts.push(j()+'% '+(100-i/n*100).toFixed(1)+'%');
    document.getElementById('seal').style.setProperty('--sealclip','polygon('+pts.join(',')+')');
  }

  var lastKey='';
  function layout(){
    var W=scene.clientWidth,H=scene.clientHeight;if(!W||!H)return;
    var key=W+'x'+H;if(key===lastKey)return;lastKey=key;
    var asp=W/H;
    view.W=W;view.H=H;
    if(asp>=2.1){view.vw=WORLD;view.x0=0;view.sunX=1.43;view.sunY=.365;view.boatA=.92;view.boatB=1.86;view.boatY=.79;}
    else{
      view.vw=Math.min(WORLD,asp>1.2?asp*1.3:Math.max(asp,asp*1.62));
      // tablet: trim the far left; portrait: frame the right half of the scroll — sun, far ranges, the pine-clad rocks
      view.x0=asp>1.2?Math.max(0,WORLD-view.vw-.02):Math.max(0,WORLD-view.vw);
      view.sunX=asp>1.2?1.43:view.x0+view.vw*.22;
      view.sunY=asp>1.2?.36:.35;
      view.boatA=view.x0+view.vw*.08;view.boatB=view.x0+view.vw*.86;view.boatY=asp>1.2?.8:.81;
    }
    buildLayers();buildDots();buildSun();buildWater();buildBands();buildBoat();
    var cap=document.getElementById('caption');
    cap.style.setProperty('--capw',(scene.parentNode.getBoundingClientRect().width)+'px');
  }

  /* ---------- mist ---------- */
  var slider=document.getElementById('mist'),nameEl=document.getElementById('mistName'),pctEl=document.getElementById('mistPct');
  var NAMES=[[0,'Clear dusk'],[16,'Thin haze'],[36,'Drifting mist'],[60,'River fog'],[82,'Sea of cloud']];
  function setMist(v){
    var m=v/100,name=NAMES[0][1];
    for(var i=0;i<NAMES.length;i++)if(v>=NAMES[i][0])name=NAMES[i][1];
    scene.style.setProperty('--m',m.toFixed(3));
    // deeper layers dissolve sooner at their feet
    var depthF=[.2,.26,.2,.12];
    for(var k=0;k<4;k++){
      var f=(4+m*100*depthF[k]*1.05+(3-k)*1.5).toFixed(1)+'%';
      scene.querySelector('[data-l="'+k+'"]').style.setProperty('--f',f);
    }
    slider.style.setProperty('--p',v+'%');
    nameEl.textContent=name;pctEl.textContent=String(v).padStart(2,'0');
    slider.setAttribute('aria-valuetext',name+', '+v+' percent');
  }
  slider.addEventListener('input',function(){setMist(+slider.value);});
  scene.style.setProperty('--wl',(WL*100)+'%');

  sealEdge();
  setMist(+slider.value);
  layout();
  var raf=0;
  function onResize(){cancelAnimationFrame(raf);raf=requestAnimationFrame(layout);}
  if('ResizeObserver' in window)new ResizeObserver(onResize).observe(scene);else window.addEventListener('resize',onResize);

  /* ---------- motion preference ---------- */
  var mq=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
  var hint=document.getElementById('mistHint');
  function motionNote(){
    hint.textContent=(mq&&mq.matches)?'Draw the slider to thicken or lift the river mist. The scene rests still, as your system prefers reduced motion.':'Draw the slider to thicken or lift the river mist. The little boat takes its time.';
  }
  motionNote();
  if(mq){if(mq.addEventListener)mq.addEventListener('change',motionNote);else if(mq.addListener)mq.addListener(motionNote);}
})();
</script>
</body>
</html>
