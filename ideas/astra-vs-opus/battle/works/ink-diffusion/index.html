:root{
  --paper:#f2eadb;
  --ink:#15120e;
  --ink-soft:rgba(21,18,14,.62);
  --hair:rgba(21,18,14,.22);
  --indigo:#2b3a7c;
  --rose:#c4466c;
  --jade:#1c7d69;
  --pad:clamp(20px,4.2vw,64px);
  --serif:"Bodoni Moda","Bodoni 72","Didot","Bodoni MT","Iowan Old Style","Palatino Linotype",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);overscroll-behavior:none}
body{color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility}

#stage{position:fixed;inset:0;touch-action:none;outline:none;cursor:crosshair}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#dry,#wet{mix-blend-mode:multiply;transition:opacity .75s cubic-bezier(.4,0,.2,1)}
#stage.washing #dry,#stage.washing #wet{opacity:0}
#stage:focus-visible::after{content:"";position:absolute;inset:10px;border:1px dashed var(--hair);border-radius:4px;pointer-events:none}

/* ---------- typography ---------- */
.type{position:fixed;left:var(--pad);top:calc(var(--pad) + env(safe-area-inset-top,0px));pointer-events:none;user-select:none;max-width:min(46vw,720px)}
.eyebrow{margin:0 0 clamp(18px,4.4vh,44px);font-weight:500;font-size:11px;letter-spacing:.34em;text-transform:uppercase;display:flex;align-items:center;gap:14px}
.eyebrow::after{content:"";width:56px;height:1px;background:var(--ink);opacity:.55}
h1{margin:0;font-weight:400;font-size:clamp(60px,min(10.4vw,17.5vh),170px);line-height:.86;letter-spacing:-.035em}
h1 span{display:block}
h1 em{display:block;font-style:italic;font-weight:400;letter-spacing:-.02em;padding-left:.62em}
h1 .l3{padding-left:.08em}
.lede{margin:clamp(22px,4.6vh,46px) 0 0 .2em;max-width:25ch;font-style:italic;font-size:clamp(16px,1.35vw,20px);line-height:1.45;color:var(--ink-soft)}
.lede b{font-style:normal;font-weight:500;color:var(--ink);letter-spacing:.01em}

/* ---------- palette ---------- */
.palette{position:fixed;left:var(--pad);bottom:calc(var(--pad) * .8 + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:clamp(14px,2vw,26px);padding:10px 22px 10px 12px;border-radius:999px;background:rgba(242,234,219,.74);box-shadow:0 0 0 1px var(--hair),0 14px 40px -24px rgba(40,30,10,.45);-webkit-backdrop-filter:blur(8px) saturate(1.05);backdrop-filter:blur(8px) saturate(1.05);z-index:3}
.swatches{display:flex;gap:4px}
.swatch{appearance:none;border:0;background:none;color:inherit;font:inherit;cursor:pointer;display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border-radius:999px;position:relative;transition:background-color .25s}
.swatch:hover{background:rgba(21,18,14,.045)}
.swatch .dot{width:34px;height:34px;border-radius:50%;flex:none;position:relative;background-size:100% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.swatch .dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--ink);opacity:0;transform:scale(.8);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.swatch .name{font-style:italic;font-size:17px;line-height:1;position:relative;padding-bottom:3px;color:var(--ink-soft);transition:color .25s}
.swatch .name::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.4,0,.2,1)}
.swatch[aria-checked="true"] .dot{transform:scale(1.06)}
.swatch[aria-checked="true"] .dot::after{opacity:.85;transform:scale(1)}
.swatch[aria-checked="true"] .name{color:var(--ink)}
.swatch[aria-checked="true"] .name::after{transform:scaleX(1)}
.sep{width:1px;align-self:stretch;margin:6px 0;background:var(--hair)}
.reset{appearance:none;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 4px;font-weight:500;font-size:11px;letter-spacing:.26em;text-transform:uppercase;white-space:nowrap}
.reset svg{width:22px;height:22px;flex:none;transition:transform .6s cubic-bezier(.4,0,.2,1)}
.reset:hover svg{transform:rotate(-160deg)}
.reset:active svg{transform:rotate(-360deg)}
button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

.colophon{position:fixed;right:var(--pad);bottom:calc(var(--pad) * .8 + env(safe-area-inset-bottom,0px) + 12px);pointer-events:none;user-select:none;text-align:right;font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;line-height:1.9}
.colophon i{font-weight:400;font-size:15px;letter-spacing:0;text-transform:none}
.colophon .count{font-size:15px;letter-spacing:.02em;font-weight:400;font-variant-numeric:lining-nums tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:760px){
  .type{max-width:calc(100vw - 2*var(--pad))}
  h1{font-size:min(19vw,11.5vh,104px)}
  .eyebrow{font-size:10px;letter-spacing:.3em}
  .lede{font-size:16px;max-width:21ch}
  .palette{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));justify-content:space-between;padding:8px 14px 8px 8px;gap:6px}
  .swatches{gap:0}
  .swatch{flex-direction:column;gap:6px;padding:6px 8px 4px}

  .reset{flex-direction:column;gap:6px;font-size:9.5px;letter-spacing:.2em;padding:6px 4px}
  .reset svg{width:24px;height:24px}
  .colophon{right:auto;left:var(--pad);bottom:calc(112px + env(safe-area-inset-bottom,0px));text-align:left;line-height:1.5}

}
@media (max-width:360px){.swatch .name{font-size:13px}.swatch{padding:6px 5px 4px}}

}

}
</style>

<body>

</div>

<header class="type">

<nav class="palette" aria-label="Pigment and paper">

    <button class="swatch" type="button" role="radio" aria-checked="false" data-pigment="rose" title="Rose (2)"><span class="dot" aria-hidden="true"></span><span class="name">Rose</span></button>

  </div>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true"><path d="M19.4 8.6A8 8 0 1 0 20 12"/><path d="M20.2 4.2v4.6h-4.6"/></svg>
    <span>Fresh paper</span>

<div class="colophon" aria-live="polite"><span class="where">Watercolour &amp; ink<br></span><span class="count" id="count">02</span> <i id="countLabel">blooms</i></div>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ *
 *  utilities
 * ------------------------------------------------------------------ */
const $ = s => document.querySelector(s);
const stage = $('#stage');
const paperC = $('#paper'), dryC = $('#dry'), wetC = $('#wet');
const pctx = paperC.getContext('2d');
const dctx = dryC.getContext('2d');
const wctx = wetC.getContext('2d');

const mq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
let reduced = !!(mq && mq.matches);
if (mq) {
  const onMq = e => { reduced = e.matches; };
  mq.addEventListener ? mq.addEventListener('change', onMq) : mq.addListener && mq.addListener(onMq);
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gaussFn(r) {
  let spare = null;
  return () => {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u, v, s;
    do { u = r() * 2 - 1; v = r() * 2 - 1; s = u * u + v * v; } while (s >= 1 || s === 0);
    const m = Math.sqrt(-2 * Math.log(s) / s);
    spare = v * m; return u * m;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${clamp(a, 0, 1).toFixed(4)})`;

/* ------------------------------------------------------------------ *
 *  pigments
 * ------------------------------------------------------------------ */
const PIGMENTS = {
  indigo: { rgb: [34, 58, 158], deep: [16, 24, 86], pool: [24, 36, 118] },
  rose:   { rgb: [214, 78, 118], deep: [150, 26, 72], pool: [178, 40, 88] },
  jade:   { rgb: [20, 146, 118], deep: [6, 80, 70], pool: [10, 108, 90] }
};

/* ------------------------------------------------------------------ *
 *  state
 * ------------------------------------------------------------------ */
let W = 0, H = 0, DPR = 1;
let blooms = [];          // every bloom on the sheet
let active = [];          // blooms still spreading
let pigment = 'indigo';
let seedCounter = 1000 + (Math.random() * 1e6 | 0);
let paperSeed = 11;
let raf = 0;
let washing = false;
let tiles = null;         // paper / granulation / mottle textures
const shapeCache = new Map();

/* ------------------------------------------------------------------ *
 *  tileable value noise (for paper tooth, granulation, mottling)
 * ------------------------------------------------------------------ */
function noiseTile(size, cells, octaves, seed) {
  const r = mulberry32(seed);
  const out = new Float32Array(size * size);
  let amp = 1, total = 0;
  for (let o = 0; o < octaves; o++) {
    const g = cells << o;
    const lat = new Float32Array(g * g);
    for (let i = 0; i < lat.length; i++) lat[i] = r();
    const step = size / g;
    for (let y = 0; y < size; y++) {
      const fy = y / step, y0 = Math.floor(fy), ty0 = fy - y0, ty = ty0 * ty0 * (3 - 2 * ty0);
      const ya = (y0 % g) * g, yb = ((y0 + 1) % g) * g;
      for (let x = 0; x < size; x++) {
        const fx = x / step, x0 = Math.floor(fx), tx0 = fx - x0, tx = tx0 * tx0 * (3 - 2 * tx0);
        const xa = x0 % g, xb = (x0 + 1) % g;
        const a = lat[ya + xa], b = lat[ya + xb], c = lat[yb + xa], d = lat[yb + xb];
        out[y * size + x] += amp * ((a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty);
      }
    }
    total += amp; amp *= 0.55;
  }
  for (let i = 0; i < out.length; i++) out[i] /= total;
  return out;
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  return c;
}

function buildTiles(seed) {
  const size = Math.round(192 * DPR);
  const tooth = noiseTile(size, 40, 3, seed);
  const r = mulberry32(seed * 7 + 3);

  // paper tooth: warm shadows in the valleys, cream highlights on the peaks
  const paper = makeCanvas(size, size);
  const pc = paper.getContext('2d');
  const pd = pc.createImageData(size, size), p = pd.data;
  for (let i = 0; i < tooth.length; i++) {
    const n = tooth[i] + (r() - 0.5) * 0.22;
    const k = i * 4;
    if (n > 0.5) { p[k] = 118; p[k + 1] = 94; p[k + 2] = 62; p[k + 3] = Math.min(255, (n - 0.5) * 150); }
    else { p[k] = 255; p[k + 1] = 252; p[k + 2] = 243; p[k + 3] = Math.min(255, (0.5 - n) * 170); }
  }
  pc.putImageData(pd, 0, 0);

  // granulation: pigment particles settle into the same valleys of the tooth
  const gran = {};
  for (const key in PIGMENTS) {
    const c = makeCanvas(size, size), cx = c.getContext('2d');
    const id = cx.createImageData(size, size), d = id.data;
    const col = PIGMENTS[key].deep;
    const rr = mulberry32(seed * 13 + key.length);
    for (let i = 0; i < tooth.length; i++) {
      const valley = Math.max(0, tooth[i] - 0.47) * 2.4;
      const speck = rr() < 0.05 ? rr() * 0.55 : 0;
      const k = i * 4;
      d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2];
      d[k + 3] = Math.min(255, (valley * valley * 0.9 + speck) * 255);
    }
    cx.putImageData(id, 0, 0);
    gran[key] = c;
  }

  // mottle: slow clouds where the wash thins out
  const msize = Math.round(320 * DPR);
  const mn = noiseTile(msize, 4, 4, seed * 3 + 1);
  const mottle = makeCanvas(msize, msize), mc = mottle.getContext('2d');
  const md = mc.createImageData(msize, msize), m = md.data;
  for (let i = 0; i < mn.length; i++) {
    const v = smooth(0.42, 0.78, mn[i]);
    m[i * 4 + 3] = v * 255;
  }
  mc.putImageData(md, 0, 0);

  return { paper, gran, mottle };
}

/* ------------------------------------------------------------------ *
 *  paper
 * ------------------------------------------------------------------ */
function renderPaper() {
  const w = paperC.width, h = paperC.height;
  const ctx = pctx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#f2eadb';
  ctx.fillRect(0, 0, w, h);

  // soft light falling from the upper left
  let g = ctx.createRadialGradient(w * 0.28, h * 0.22, 0, w * 0.28, h * 0.22, Math.hypot(w, h) * 0.75);
  g.addColorStop(0, 'rgba(255,251,240,.55)');
  g.addColorStop(1, 'rgba(255,251,240,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  // tooth
  ctx.fillStyle = ctx.createPattern(tiles.paper, 'repeat');
  ctx.globalAlpha = 0.34;
  ctx.fillRect(0, 0, w, h);
  ctx.globalAlpha = 1;

  // sparse fibres
  const r = mulberry32(paperSeed * 31 + 7);
  const count = Math.round((W * H) / 5200);
  ctx.lineCap = 'round';
  for (let i = 0; i < count; i++) {
    const x = r() * w, y = r() * h, len = (6 + r() * 26) * DPR, a = r() * Math.PI * 2;
    const bend = (r() - 0.5) * len * 0.6;
    ctx.strokeStyle = r() < 0.55 ? `rgba(120,96,64,${0.035 + r() * 0.05})` : `rgba(255,253,246,${0.25 + r() * 0.35})`;
    ctx.lineWidth = (0.4 + r() * 0.6) * DPR;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + Math.cos(a) * len * 0.5 - Math.sin(a) * bend, y + Math.sin(a) * len * 0.5 + Math.cos(a) * bend, x + Math.cos(a) * len, y + Math.sin(a) * len);
    ctx.stroke();
  }

  // deckle-ish vignette
  g = ctx.createRadialGradient(w * 0.5, h * 0.5, Math.min(w, h) * 0.35, w * 0.5, h * 0.5, Math.hypot(w, h) * 0.62);
  g.addColorStop(0, 'rgba(150,118,74,0)');
  g.addColorStop(1, 'rgba(150,118,74,.13)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}

/* ------------------------------------------------------------------ *
 *  bloom geometry — recursive polygon deformation, many translucent layers
 * ------------------------------------------------------------------ */
const LAYERS = 28;

function deform(pts, depth, k, r, g, cap = 0.06) {
  for (let d = 0; d < depth; d++) {
    const out = [], n = pts.length;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      out.push(a);
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      const v = (a.v + b.v) * 0.5 * (0.7 + r() * 0.6);
      const sd = Math.min(len * v * k, cap);
      out.push({ x: (a.x + b.x) / 2 + g() * sd, y: (a.y + b.y) / 2 + g() * sd, v });
    }
    pts = out;
  }
  return pts;
}
function toArrays(poly, scale, ox, oy, lagOf, r, jitter) {
  const n = poly.length;
  const xs = new Float32Array(n), ys = new Float32Array(n), lag = new Float32Array(n);
  let ext = 0;
  for (let i = 0; i < n; i++) {
    const x = poly[i].x * scale + ox, y = poly[i].y * scale + oy;
    xs[i] = x; ys[i] = y;
    lag[i] = clamp(lagOf(Math.atan2(y, x)) + (r() - 0.5) * jitter, 0, 1);
    ext = Math.max(ext, Math.abs(x), Math.abs(y));
  }
  return { xs, ys, lag, n, ext };
}

function getShape(seed) {
  let s = shapeCache.get(seed);
  if (s) return s;
  const r = mulberry32(seed), g = gaussFn(r);
  const n = 30 + (r() * 10 | 0);
  const rot = r() * Math.PI * 2;
  // soft lobes: a few low harmonics make the silhouette breathe
  const harm = [2, 3, 4, 5, 7, 9, 12, 16, 21, 27].map(k => ({ k, a: g() * 0.08 / Math.pow(k, 0.58), p: r() * 6.283 }));
  const stretch = 1 + g() * 0.07;
  const vh = [1, 2, 3].map(k => ({ k, p: r() * 6.283 }));
  let base = [];
  for (let i = 0; i < n; i++) {
    const a = rot + (i / n) * Math.PI * 2 + (r() - 0.5) * 0.12;
    let rad = 1 + g() * 0.025;
    for (const h of harm) rad += h.a * Math.sin(h.k * a + h.p);
    // some stretches of the edge are calm, others ragged
    let vv = 0; for (const h of vh) vv += Math.sin(h.k * a + h.p) / h.k;
    vv = clamp(0.5 + vv * 0.45, 0, 1);
    base.push({ x: Math.cos(a) * rad * stretch, y: Math.sin(a) * rad / stretch, v: 0.2 + vv * vv * 0.95 });
  }
  base = deform(base, 2, 0.3, r, g, 0.05);

  // direction-dependent lag: the wet front runs ahead in some directions
  const p1 = r() * 6.283, p2 = r() * 6.283, p3 = r() * 6.283;
  const lagOf = a => 0.5 + 0.5 * (0.5 * Math.sin(3 * a + p1) + 0.32 * Math.sin(5 * a + p2) + 0.18 * Math.sin(8 * a + p3));

  const layers = [];
  let ext = 1;
  for (let L = 0; L < LAYERS; L++) {
    const poly = deform(base, 2, 0.24, r, g, 0.026);
    const sc = 0.965 + r() * 0.045;
    const a = toArrays(poly, sc, g() * 0.015, g() * 0.015, lagOf, r, 0.12);
    ext = Math.max(ext, a.ext);
    layers.push(a);
  }

  // pooled pigment — a denser, slightly off-centre heart
  const pools = [];
  const pa = r() * Math.PI * 2, pd = 0.12 + r() * 0.16;
  for (let k = 0; k < 5; k++) {
    const sc = 0.42 + r() * 0.3;
    const poly = deform(base.map(p => ({ x: p.x, y: p.y, v: p.v })), 3, 0.25, r, g, 0.05);
    pools.push(toArrays(poly, sc, Math.cos(pa) * pd + g() * 0.03, Math.sin(pa) * pd + g() * 0.03, lagOf, r, 0.1));
  }

  // tide lines / back-runs: inner ridges left behind as the water retreats
  const tides = [];
  const tc = 1 + (r() * 3 | 0);
  for (let k = 0; k < tc; k++) {
    const sc = 0.42 + r() * 0.36;
    const ta = r() * Math.PI * 2, td = (1 - sc) * (0.2 + r() * 0.45);
    const poly = deform(base.map(p => ({ x: p.x, y: p.y, v: p.v * 1.2 + 0.15 })), 3, 0.24, r, g, 0.05);
    tides.push(toArrays(poly, sc, Math.cos(ta) * td, Math.sin(ta) * td, lagOf, r, 0.05));
  }

  s = {
    layers, pools, tides, ext: ext * 1.04,
    mottleX: r() * 1000, mottleY: r() * 1000,
    alpha: 0.035 + r() * 0.01,
    rim: 0.75 + r() * 0.5
  };
  shapeCache.set(seed, s);
  return s;
}

function tracePath(ctx, a, cx, cy, R, e, spread) {
  const xs = a.xs, ys = a.ys, lag = a.lag, n = a.n;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const s = e >= 1 ? 1 : Math.pow(e, 1 + lag[i] * spread);
    const x = cx + xs[i] * R * s, y = cy + ys[i] * R * s;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/* draw one bloom at progress t (0..1) centred in ctx at (cx, cy), radius R in device px.
   `sx, sy` are the canvas' top-left in screen device px so textures stay pinned to the paper. */
function drawBloom(ctx, b, t, cx, cy, R, sx, sy, cw, ch) {
  const sh = getShape(b.seed);
  const pig = PIGMENTS[b.pigment];
  const e = t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
  const wet = 1 - smooth(0.5, 1, t);       // 1 while wet, 0 once dry
  const dry = 1 - wet;
  const spread = 1.2;
  const A = sh.alpha * (b.strength || 1);

  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineJoin = 'round';

  // body of the wash: many translucent, slightly different layers; the centre thins out
  // as pigment migrates to the rim, so each layer carries a radial density profile
  const gr = Math.max(R * 1.12 * Math.max(e, 0.04), 1);
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, gr);
  grad.addColorStop(0,    rgba(pig.rgb, A * lerp(1.8, 0.42, e)));
  grad.addColorStop(0.55, rgba(pig.rgb, A * lerp(1.5, 0.62, e)));
  grad.addColorStop(0.84, rgba(pig.rgb, A * lerp(1.2, 1.0, e)));
  grad.addColorStop(1,    rgba(pig.rgb, A * lerp(1.0, 1.7, e)));
  ctx.fillStyle = grad;
  ctx.strokeStyle = rgba(pig.deep, 0.17 * sh.rim * (0.15 + 0.85 * dry));
  ctx.lineWidth = Math.max(1.4 * DPR, R * 0.01);
  const layers = sh.layers;
  for (let L = 0; L < layers.length; L++) {
    tracePath(ctx, layers[L], cx, cy, R, e, spread);
    ctx.fill();
  }
  // edge darkening: pigment carried to the rim, laid only over existing wash so the edge stays crisp
  ctx.globalCompositeOperation = 'source-atop';
  for (let L = 0; L < layers.length; L += 2) {
    tracePath(ctx, layers[L], cx, cy, R, e, spread);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  // pooled heart
  ctx.fillStyle = rgba(pig.pool, A * 0.9);
  for (let k = 0; k < sh.pools.length; k++) {
    tracePath(ctx, sh.pools[k], cx, cy, R, e, spread);
    ctx.fill();
  }

  // tide lines: lighter back-run inside a darker cauliflower ridge
  if (dry > 0.001) {
    ctx.lineWidth = Math.max(0.8, R * 0.006);
    for (let k = 0; k < sh.tides.length; k++) {
      tracePath(ctx, sh.tides[k], cx, cy, R, e, spread);
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = `rgba(0,0,0,${(0.13 * dry).toFixed(4)})`;
      ctx.fill();
      ctx.globalCompositeOperation = 'source-atop';
      ctx.strokeStyle = rgba(pig.deep, 0.16 * dry);
      ctx.stroke();
    }
  }

  // mottling (lighter clouds) and granulation (pigment settling into the tooth)
  if (tiles) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.globalAlpha = 0.26;
    ctx.save();
    ctx.translate(-(sx + sh.mottleX * DPR), -(sy + sh.mottleY * DPR));
    ctx.fillStyle = ctx.createPattern(tiles.mottle, 'repeat');
    ctx.fillRect(sx + sh.mottleX * DPR, sy + sh.mottleY * DPR, cw, ch);
    ctx.restore();

    ctx.globalCompositeOperation = 'source-atop';
    ctx.globalAlpha = 0.2 + 0.45 * dry;
    ctx.save();
    ctx.translate(-sx, -sy);
    ctx.fillStyle = ctx.createPattern(tiles.gran[b.pigment], 'repeat');
    ctx.fillRect(sx, sy, cw, ch);
    ctx.restore();
  }
  ctx.restore();
}

/* ------------------------------------------------------------------ *
 *  bloom placement (all stored relative to the viewport)
 * ------------------------------------------------------------------ */
function seedLayout(i) {
  if (W >= H * 1.05) {
    return i === 0
      ? { x: W * 0.705, y: H * 0.43, r: H * 0.275 }
      : { x: W * 0.868, y: H * 0.685, r: H * 0.17 };
  }
  return i === 0
    ? { x: W * 0.7, y: H * 0.6, r: W * 0.3 }
    : { x: W * 0.9, y: H * 0.775, r: W * 0.19 };
}
function geom(b) {
  if (b.seedIndex !== undefined) return seedLayout(b.seedIndex);
  const m = Math.min(W, H);
  return { x: b.fx * W, y: b.fy * H, r: b.fr * m };
}

/* canvas big enough to hold the finished bloom */
function bloomBox(b) {
  const g = geom(b), sh = getShape(b.seed);
  const R = g.r * DPR, half = Math.ceil(sh.ext * R + 6 * DPR);
  const cx = g.x * DPR, cy = g.y * DPR;
  return { R, cx, cy, left: Math.floor(cx - half), top: Math.floor(cy - half), size: half * 2 };
}

let scratch = null;
/* q < 1 renders a still-wet bloom at reduced resolution (it is soft anyway); dry blooms are always full-res */
function renderInto(b, t, box, q = 1) {
  let c = b.canvas;
  if (!c) { if (!scratch) scratch = makeCanvas(1, 1); c = scratch; }
  const px = Math.ceil(box.size * q);
  if (c.width !== px || c.height !== px) { c.width = px; c.height = px; }
  const ctx = c.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.setTransform(q, 0, 0, q, 0, 0);
  drawBloom(ctx, b, t, box.cx - box.left, box.cy - box.top, box.R, box.left, box.top, box.size, box.size);
  return c;
}
function bake(b) {
  const box = bloomBox(b);
  const c = renderInto(b, 1, box);
  dctx.save();
  dctx.globalCompositeOperation = 'multiply';
  dctx.drawImage(c, box.left, box.top);
  dctx.restore();
}

/* ------------------------------------------------------------------ *
 *  animation
 * ------------------------------------------------------------------ */
function frame(now) {
  raf = 0;
  wctx.setTransform(1, 0, 0, 1, 0, 0);
  wctx.clearRect(0, 0, wetC.width, wetC.height);
  wctx.globalCompositeOperation = 'multiply';
  const still = [];
  const wetQ = Math.min(1, 1.35 / DPR) * (active.length > 4 ? 0.62 : 0.8);
  for (const b of active) {
    const t = (now - b.start) / b.dur;
    if (t < 0) { still.push(b); continue; }
    if (t >= 1) { b.canvas = null; bake(b); continue; }
    if (!b.canvas) b.canvas = makeCanvas(1, 1);
    const box = bloomBox(b);
    const q = t > 0.9 ? 1 : wetQ;
    const c = renderInto(b, t, box, q);
    wctx.drawImage(c, box.left, box.top, c.width / q, c.height / q);
    still.push(b);
  }
  wctx.globalCompositeOperation = 'source-over';
  active = still;
  if (active.length) raf = requestAnimationFrame(frame);
}
function kick() { if (!raf && active.length) raf = requestAnimationFrame(frame); }

/* ------------------------------------------------------------------ *
 *  adding blooms
 * ------------------------------------------------------------------ */
const countEl = $('#count'), countLabel = $('#countLabel');
function updateCount() {
  const n = blooms.filter(b => !b.satellite).length;
  countEl.textContent = String(n).padStart(2, '0');
  countLabel.textContent = n === 1 ? 'bloom' : 'blooms';
}

function addBloom(x, y) {
  const r = mulberry32(seedCounter * 9 + 1);
  const m = Math.min(W, H);
  const narrow = W < 700;
  const frac = narrow ? lerp(0.1, 0.2, Math.pow(r(), 1.3)) : lerp(0.075, 0.16, Math.pow(r(), 1.3));
  const main = {
    seed: seedCounter++, pigment, fx: x / W, fy: y / H, fr: frac,
    strength: 0.9 + r() * 0.3
  };
  const group = [main];
  // occasional satellite drops flung from the brush
  if (r() < 0.55) {
    const k = 1 + (r() * 2.4 | 0);
    for (let i = 0; i < k; i++) {
      const a = r() * Math.PI * 2, d = frac * m * (1.15 + r() * 0.7);
      const sx = x + Math.cos(a) * d, sy = y + Math.sin(a) * d;
      group.push({
        seed: seedCounter++, pigment, fx: sx / W, fy: sy / H,
        fr: frac * (0.1 + r() * 0.16), strength: 1.1 + r() * 0.3, satellite: true, delay: 120 + r() * 380
      });
    }
  }
  const now = performance.now();
  for (const b of group) {
    blooms.push(b);
    if (reduced) { bake(b); continue; }          // reduced motion: placed at final radius
    const px = b.fr * m;
    b.dur = (b.satellite ? 1300 : 2600) + px * 11 + r() * 600;
    b.start = now + (b.delay || 0);
    active.push(b);
  }
  updateCount();
  kick();
}

/* ------------------------------------------------------------------ *
 *  sizing
 * ------------------------------------------------------------------ */
function resize(first) {
  const nw = window.innerWidth, nh = window.innerHeight;
  const nd = Math.min(window.devicePixelRatio || 1, 2);
  if (!first && nw === W && nh === H && nd === DPR) return;
  const dprChanged = nd !== DPR || !tiles;
  W = nw; H = nh; DPR = nd;
  for (const c of [paperC, dryC, wetC]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  if (dprChanged) tiles = buildTiles(paperSeed);
  renderPaper();
  dctx.setTransform(1, 0, 0, 1, 0, 0);
  dctx.clearRect(0, 0, dryC.width, dryC.height);
  for (const b of blooms) if (!active.includes(b)) bake(b);
  if (active.length) { cancelAnimationFrame(raf); raf = 0; kick(); }
}

let rT = 0;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => resize(false), 120); });

/* ------------------------------------------------------------------ *
 *  interface
 * ------------------------------------------------------------------ */
stage.addEventListener('pointerdown', e => {
  if (washing || (e.button !== undefined && e.button > 0)) return;
  addBloom(e.clientX, e.clientY);
});
stage.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && !washing) {
    e.preventDefault();
    const land = W >= H;
    addBloom(W * (land ? 0.45 + Math.random() * 0.5 : 0.15 + Math.random() * 0.75),
             H * (land ? 0.12 + Math.random() * 0.7 : 0.35 + Math.random() * 0.45));
  }
});

const swatches = [...document.querySelectorAll('.swatch')];
function cursorFor(key) {
  const c = PIGMENTS[key].rgb;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"><circle cx="14" cy="14" r="9" fill="rgba(${c},0.28)" stroke="rgb(${c})" stroke-width="1.2"/><circle cx="14" cy="14" r="1.6" fill="rgb(21,18,14)"/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}") 14 14, crosshair`;
}
function setPigment(key) {
  pigment = key;
  for (const s of swatches) s.setAttribute('aria-checked', s.dataset.pigment === key ? 'true' : 'false');
  stage.style.cursor = cursorFor(key);
}
swatches.forEach(s => {
  s.addEventListener('click', () => setPigment(s.dataset.pigment));
  s.addEventListener('keydown', e => {
    const i = swatches.indexOf(s);
    let j = -1;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') j = (i + 1) % swatches.length;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') j = (i + swatches.length - 1) % swatches.length;
    if (j >= 0) { e.preventDefault(); swatches[j].focus(); setPigment(swatches[j].dataset.pigment); }
  });
});

function freshPaper() {
  if (washing) return;
  const clearAll = () => {
    blooms = []; active = [];
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    wctx.setTransform(1, 0, 0, 1, 0, 0); wctx.clearRect(0, 0, wetC.width, wetC.height);
    dctx.setTransform(1, 0, 0, 1, 0, 0); dctx.clearRect(0, 0, dryC.width, dryC.height);
    paperSeed = (paperSeed * 48271) % 2147483647;
    tiles = buildTiles(paperSeed);
    renderPaper();
    updateCount();
  };
  if (reduced) { clearAll(); return; }
  washing = true;
  stage.classList.add('washing');
  setTimeout(() => {
    clearAll();
    stage.classList.remove('washing');
    washing = false;
  }, 780);
}
$('.reset').addEventListener('click', freshPaper);

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if (e.key === '1') setPigment('indigo');
  else if (e.key === '2') setPigment('rose');
  else if (e.key === '3') setPigment('jade');
  else if (e.key === 'r' || e.key === 'R') freshPaper();
});

/* painted swatch dots, rendered with the same bloom engine */
function paintSwatches() {
  const px = Math.round(34 * Math.max(DPR, 2));
  const seeds = { indigo: 71, rose: 4412, jade: 915 };
  for (const s of swatches) {
    const key = s.dataset.pigment;
    const c = makeCanvas(px, px), ctx = c.getContext('2d');
    const b = { seed: seeds[key], pigment: key, strength: 1.7 };
    const sh = getShape(b.seed);
    const R = px / 2 / sh.ext;
    drawBloom(ctx, b, 1, px / 2, px / 2, R, 0, 0, px, px);
    try { s.querySelector('.dot').style.backgroundImage = `url(${c.toDataURL()})`; }
    catch (err) { s.querySelector('.dot').style.background = `var(--${key})`; }
  }
}

/* ------------------------------------------------------------------ *
 *  opening state: two developed indigo blooms at right
 * ------------------------------------------------------------------ */
blooms.push({ seed: 6939, pigment: 'indigo', seedIndex: 0, strength: 1.05 });
blooms.push({ seed: 4008, pigment: 'indigo', seedIndex: 1, strength: 1.12 });
resize(true);
paintSwatches();
setPigment('indigo');
updateCount();
})();
</script>
</body>
