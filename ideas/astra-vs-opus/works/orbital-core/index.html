<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>轨道核心 · Opus 临摹</title>
<meta name="description" content="对 @oneruofeng 用 GPT-6 Astra + Blender 做的 Orbital Core Showcase 的临摹重写：双环能量核心产品展示页。">
<link rel="stylesheet" href="../../assets/work.css">
<style>
  body { background: radial-gradient(120% 90% at 50% 42%, #14202e 0%, #080c12 55%, #04060a 100%); }
  .lede {
    position: fixed; z-index: 15; left: 44px; top: 50%; transform: translateY(-50%);
    max-width: 300px; pointer-events: none;
  }
  .lede .kicker { font-size: 11px; letter-spacing: .38em; color: rgba(124, 215, 255, .8); text-transform: uppercase; }
  .lede h1 { margin: 14px 0 10px; font-size: 46px; line-height: 1.02; font-weight: 300; letter-spacing: -.015em; }
  .lede h1 b { display: block; font-weight: 600; }
  .lede p { margin: 0 0 22px; font-size: 13px; line-height: 1.85; color: var(--dim); }
  .specs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 10px; border-top: 1px solid var(--line); padding-top: 16px; }
  .specs div span { display: block; font-size: 10.5px; letter-spacing: .16em; color: rgba(242,245,248,.42); text-transform: uppercase; }
  .specs div b { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .modlabel {
    position: fixed; z-index: 16; padding: 6px 12px; border: 1px solid rgba(124,215,255,.4); border-radius: 999px;
    background: rgba(8, 16, 24, .8); font-size: 11px; letter-spacing: .1em; color: #cfeeff;
    transform: translate(-50%, -50%); pointer-events: none; opacity: 0; transition: opacity .25s;
    white-space: nowrap; backdrop-filter: blur(6px);
  }
  @media (max-width: 900px) {
    .lede { left: 16px; top: 78px; transform: none; max-width: 62vw; }
    .lede h1 { font-size: 30px; }
    .lede p, .specs { display: none; }
  }
</style>
</head>
<body>

<div class="loading" id="loading">装配核心 · ASSEMBLING CORE</div>

<div class="topbar">
  <a href="../../index.html">← 对照总览</a>
  <div class="ttl">轨道核心<span>OPUS 临摹</span></div>
  <div class="spacer"></div>
  <a href="https://x.com/oneruofeng/status/2096551010089263181" target="_blank" rel="noopener">原作 @oneruofeng ↗</a>
</div>

<div class="lede">
  <div class="kicker">Orbital Core</div>
  <h1>双环<b>能量核心</b></h1>
  <p>两组反向自转的悬浮环、十二枚约束模块，与被锁在中心的等离子体。拖拽可绕着它转一圈，滚轮推近看细节。</p>
  <div class="specs">
    <div><span>Output</span><b id="sOut">2.4 PW</b></div>
    <div><span>Ring RPM</span><b id="sRpm">840</b></div>
    <div><span>Modules</span><b>12</b></div>
    <div><span>Coolant</span><b>He-3</b></div>
  </div>
</div>

<div class="modlabel" id="modlabel"></div>

<div class="panel">
  <h2>控制台</h2>
  <label>能量输出 <b id="powv">0.70</b></label>
  <input type="range" id="pow" min="0.05" max="1" step="0.01" value="0.7">
  <label>环转速 <b id="spdv">1.00</b></label>
  <input type="range" id="spd" min="0" max="2.4" step="0.01" value="1">
  <div class="btnrow">
    <button class="btn" id="explode">爆炸视图</button>
    <button class="btn on" id="spin">自动旋转</button>
  </div>
</div>

<div class="hint" id="hint">拖拽旋转 · 滚轮缩放 · 点击模块查看</div>

<script src="../../assets/vendor/three.min.js"></script>
<script>
(function () {
  'use strict';

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 400);

  // ---------- 灯光：一冷一暖两盏轮廓光 + 底部补光 ----------
  scene.add(new THREE.AmbientLight(0x2b3a4a, 0.55));
  var keyLight = new THREE.DirectionalLight(0xbfe6ff, 1.15); keyLight.position.set(6, 9, 7); scene.add(keyLight);
  var rimLight = new THREE.DirectionalLight(0xff9a62, 0.85); rimLight.position.set(-8, -3, -6); scene.add(rimLight);
  var coreLight = new THREE.PointLight(0x7fd9ff, 3.4, 34, 2); scene.add(coreLight);

  var rig = new THREE.Group();                    // 整机
  scene.add(rig);

  // ---------- 核心：内核 + 两层菲涅尔辉光壳 ----------
  var core = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.5, 1),
    new THREE.MeshPhongMaterial({ color: 0x0a2b3a, emissive: 0x4fd8ff, emissiveIntensity: 1, flatShading: true, shininess: 60 })
  );
  rig.add(core);

  var GLOW_VS = 'varying vec3 vN; varying vec3 vV;\n' +
    'void main(){ vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position,1.0);' +
    ' vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }';
  var GLOW_FS = 'uniform vec3 uColor; uniform float uPower; uniform float uStrength;\n' +
    'varying vec3 vN; varying vec3 vV;\n' +
    // 壳体用 BackSide 渲染，法线是朝内的，所以取 abs 才能得到「边缘亮、正中透」的菲涅尔
    'void main(){ float f = pow(1.0 - clamp(abs(dot(vN, vV)), 0.0, 1.0), uPower);' +
    ' gl_FragColor = vec4(uColor * f * uStrength, f * uStrength); }';

  function glowShell(radius, color, power, strength) {
    var m = new THREE.Mesh(
      new THREE.SphereGeometry(radius, 48, 32),
      new THREE.ShaderMaterial({
        vertexShader: GLOW_VS, fragmentShader: GLOW_FS,
        uniforms: { uColor: { value: new THREE.Color(color) }, uPower: { value: power }, uStrength: { value: strength } },
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide
      })
    );
    rig.add(m);
    return m;
  }
  var shellInner = glowShell(2.1, 0x6fe0ff, 2.6, 1.0);
  var shellOuter = glowShell(3.4, 0x3f86ff, 3.6, 0.55);

  // 核心内部的等离子丝：几条抖动的折线
  var filaments = [];
  for (var f = 0; f < 7; f++) {
    var pts = [];
    for (var s = 0; s <= 24; s++) {
      var a = s / 24 * Math.PI * 2 + f;
      pts.push(new THREE.Vector3(Math.cos(a) * 1.15, Math.sin(a * 1.7 + f) * 0.9, Math.sin(a) * 1.15));
    }
    var lg = new THREE.BufferGeometry().setFromPoints(pts);
    var line = new THREE.Line(lg, new THREE.LineBasicMaterial({
      color: 0xa9ecff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    line.userData.seed = f;
    rig.add(line);
    filaments.push(line);
  }

  // ---------- 双环 + 约束模块 ----------
  var MODULES = [
    { name: '约束线圈 A', spec: '超导磁笼 · 4.2 K' },
    { name: '注入口 B', spec: 'He-3 冷却剂注入' },
    { name: '取能栅 C', spec: '直接能量转换' },
    { name: '诊断阵 D', spec: '中子能谱监测' }
  ];
  var ringA = new THREE.Group(), ringB = new THREE.Group();
  rig.add(ringA); rig.add(ringB);
  var pickables = [];

  function buildRing(group, radius, tube, tilt, color, moduleCount, startIndex) {
    var torus = new THREE.Mesh(
      new THREE.TorusGeometry(radius, tube, 14, 128),
      new THREE.MeshPhongMaterial({ color: color, shininess: 90, specular: 0x9fd6ff, flatShading: false })
    );
    torus.rotation.x = Math.PI / 2;
    group.add(torus);

    // 环内侧的发光条
    var strip = new THREE.Mesh(
      new THREE.TorusGeometry(radius - tube * 1.05, tube * 0.28, 8, 128),
      new THREE.MeshBasicMaterial({ color: 0x63d8ff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    strip.rotation.x = Math.PI / 2;
    group.add(strip);
    group.userData.strip = strip;

    for (var i = 0; i < moduleCount; i++) {
      var ang = i / moduleCount * Math.PI * 2;
      var mod = new THREE.Group();
      var shell = new THREE.Mesh(
        new THREE.BoxGeometry(tube * 3.6, tube * 4.4, tube * 2.4),
        new THREE.MeshPhongMaterial({ color: 0xdfe8f0, shininess: 40, specular: 0x556677, flatShading: true })
      );
      var eye = new THREE.Mesh(
        new THREE.BoxGeometry(tube * 1.2, tube * 1.2, tube * 2.9),
        new THREE.MeshBasicMaterial({ color: 0x9df0ff })
      );
      mod.add(shell); mod.add(eye);
      mod.position.set(Math.cos(ang) * radius, 0, Math.sin(ang) * radius);
      mod.lookAt(0, 0, 0);
      mod.userData.home = mod.position.clone();
      mod.userData.info = MODULES[(startIndex + i) % MODULES.length];
      group.add(mod);
      pickables.push(shell);
      shell.userData.mod = mod;
    }
    group.rotation.set(tilt.x, tilt.y, tilt.z);
    group.userData.home = { radius: radius };
  }

  buildRing(ringA, 4.6, 0.19, { x: 0, y: 0, z: 0 }, 0xb9c6d2, 6, 0);
  buildRing(ringB, 6.5, 0.15, { x: 0.62, y: 0.4, z: 0.22 }, 0x8f9dac, 6, 2);

  // ---------- 尘埃 / 火花 ----------
  var sparkGeo = new THREE.BufferGeometry();
  var N = 1400, sp = [], sphase = [];
  for (var i = 0; i < N; i++) {
    var th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1), rr = 3 + Math.random() * 16;
    sp.push(Math.sin(ph) * Math.cos(th) * rr, Math.cos(ph) * rr * 0.55, Math.sin(ph) * Math.sin(th) * rr);
    sphase.push(Math.random());
  }
  sparkGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  sparkGeo.setAttribute('aPhase', new THREE.Float32BufferAttribute(sphase, 1));
  var sparkMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPR: { value: Math.min(devicePixelRatio, 2) }, uPower: { value: 0.7 } },
    vertexShader: [
      'attribute float aPhase; uniform float uTime; uniform float uPR;',
      'varying float vA;',
      'void main(){',
      '  float a = uTime * (0.06 + aPhase * 0.12);',
      '  float c = cos(a), s = sin(a);',
      '  vec3 p = vec3(position.x * c - position.z * s, position.y, position.x * s + position.z * c);',
      '  vA = 0.35 + 0.65 * sin(uTime * 1.4 + aPhase * 22.0);',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  gl_PointSize = (1.0 + aPhase * 2.2) * uPR * (90.0 / max(-mv.z, 1.0));',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform float uPower; varying float vA;',
      'void main(){',
      '  float d = length(gl_PointCoord - 0.5);',
      '  float a = smoothstep(0.5, 0.0, d) * vA * (0.25 + 0.75 * uPower);',
      '  gl_FragColor = vec4(0.62, 0.85, 1.0, a * 0.7);',
      '}'
    ].join('\n'),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  rig.add(new THREE.Points(sparkGeo, sparkMat));

  // ---------- 轨道相机（手写，不依赖 OrbitControls） ----------
  var dist = 21, targetDist = 21, yaw = 0.6, pitch = 0.26, autoSpin = true, dragging = false, px = 0, py = 0;
  function place() {
    var cd = dist;
    camera.position.set(
      Math.cos(pitch) * Math.sin(yaw) * cd,
      Math.sin(pitch) * cd,
      Math.cos(pitch) * Math.cos(yaw) * cd
    );
    camera.lookAt(0, 0, 0);
  }
  var el = renderer.domElement;
  el.addEventListener('pointerdown', function (e) { dragging = true; px = e.clientX; py = e.clientY; setSpin(false); });
  addEventListener('pointerup', function () { dragging = false; });
  addEventListener('pointermove', function (e) {
    hover(e.clientX, e.clientY);
    if (!dragging) return;
    yaw -= (e.clientX - px) * 0.006;
    pitch = THREE.MathUtils.clamp(pitch + (e.clientY - py) * 0.004, -1.2, 1.2);
    px = e.clientX; py = e.clientY;
  });
  el.addEventListener('wheel', function (e) {
    e.preventDefault();
    targetDist = THREE.MathUtils.clamp(targetDist + e.deltaY * 0.014, 9, 42);
  }, { passive: false });

  // ---------- 拾取：悬停高亮 + 标签 ----------
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hovered = null;
  var labelEl = document.getElementById('modlabel');
  function hover(cx, cy) {
    ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    var hit = ray.intersectObjects(pickables, false)[0];
    var obj = hit ? hit.object : null;
    if (obj !== hovered) {
      if (hovered) hovered.material.emissive && hovered.material.emissive.setHex(0x000000);
      hovered = obj;
      if (hovered) hovered.material.emissive && hovered.material.emissive.setHex(0x1d4a5e);
    }
    if (obj) {
      var info = obj.userData.mod.userData.info;
      labelEl.textContent = info.name + ' · ' + info.spec;
      labelEl.style.left = cx + 'px';
      labelEl.style.top = (cy - 26) + 'px';
      labelEl.style.opacity = 1;
      el.style.cursor = 'pointer';
    } else {
      labelEl.style.opacity = 0;
      el.style.cursor = dragging ? 'grabbing' : 'grab';
    }
  }

  // ---------- 控件 ----------
  var powEl = document.getElementById('pow'), spdEl = document.getElementById('spd');
  var exploded = false, explodeT = 0;
  function setSpin(on) { autoSpin = on; document.getElementById('spin').classList.toggle('on', on); }
  document.getElementById('spin').onclick = function () { setSpin(!autoSpin); };
  document.getElementById('explode').onclick = function () {
    exploded = !exploded;
    this.classList.toggle('on', exploded);
    this.textContent = exploded ? '合拢' : '爆炸视图';
  };
  powEl.oninput = function () { document.getElementById('powv').textContent = (+powEl.value).toFixed(2); };
  spdEl.oninput = function () { document.getElementById('spdv').textContent = (+spdEl.value).toFixed(2); };

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  var q = new URLSearchParams(location.search);
  if (q.get('yaw')) yaw = +q.get('yaw');
  if (q.get('explode')) document.getElementById('explode').click();

  // ---------- 主循环 ----------
  var clock = new THREE.Clock();
  var outEl = document.getElementById('sOut'), rpmEl = document.getElementById('sRpm');
  var hintEl = document.getElementById('hint'), hintFade = 0;

  function tick() {
    requestAnimationFrame(tick);
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    var power = +powEl.value, speed = +spdEl.value;

    if (autoSpin) yaw += dt * 0.12;
    dist += (targetDist - dist) * Math.min(1, dt * 4);
    place();

    // 核心呼吸
    var pulse = 0.85 + 0.15 * Math.sin(t * 2.1) + 0.06 * Math.sin(t * 7.3);
    core.material.emissiveIntensity = power * pulse * 1.5;
    core.rotation.y += dt * 0.25 * speed;
    core.rotation.x += dt * 0.11 * speed;
    core.scale.setScalar(1 + power * 0.12 * pulse);
    shellInner.material.uniforms.uStrength.value = 0.45 + power * 0.9 * pulse;
    shellOuter.material.uniforms.uStrength.value = 0.16 + power * 0.5 * pulse;
    coreLight.intensity = 1.2 + power * 3.6 * pulse;
    sparkMat.uniforms.uTime.value = t;
    sparkMat.uniforms.uPower.value = power;

    // 等离子丝抖动
    for (var i = 0; i < filaments.length; i++) {
      var ln = filaments[i];
      ln.rotation.y = t * (0.4 + i * 0.05) * speed;
      ln.rotation.z = Math.sin(t * 0.7 + i) * 0.6;
      ln.material.opacity = (0.18 + 0.5 * power) * (0.6 + 0.4 * Math.sin(t * 6 + i * 2));
      ln.scale.setScalar(1 + power * 0.1 * Math.sin(t * 3 + i));
    }

    // 双环反向自转
    ringA.rotation.y += dt * 0.55 * speed;
    ringB.rotation.y -= dt * 0.38 * speed;
    ringA.userData.strip.material.opacity = 0.35 + 0.6 * power;
    ringB.userData.strip.material.opacity = 0.25 + 0.5 * power;

    // 爆炸视图：模块沿半径外推，两环分离
    explodeT += ((exploded ? 1 : 0) - explodeT) * Math.min(1, dt * 3.2);
    [ringA, ringB].forEach(function (ring, ri) {
      ring.children.forEach(function (c) {
        if (!c.userData.home) return;
        var h = c.userData.home;
        c.position.copy(h).multiplyScalar(1 + explodeT * 0.32);
      });
      ring.position.y = (ri === 0 ? 1 : -1) * explodeT * 1.7;
      ring.scale.setScalar(1 + explodeT * 0.06);
    });

    outEl.textContent = (power * 3.4).toFixed(1) + ' PW';
    rpmEl.textContent = Math.round(speed * 840);

    if (hintFade < 1 && t > 6) { hintFade = 1; hintEl.style.opacity = 0; }

    renderer.render(scene, camera);
  }

  place();
  tick();
  setTimeout(function () { document.getElementById('loading').classList.add('gone'); }, 400);
})();
</script>
</body>
</html>
