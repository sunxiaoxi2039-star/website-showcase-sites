<!doctype html>

<link rel="stylesheet" href="../../assets/work.css">
<style>
  body { background: #070b12; }
  .card {
    position: fixed; z-index: 18; right: 18px; top: 62px; width: 246px;
    padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--glass); backdrop-filter: blur(16px);
    transition: opacity .35s, transform .35s;
  }
  .card h3 { margin: 0 0 2px; font-size: 17px; font-weight: 600; letter-spacing: .02em; }

  .chips { position: fixed; z-index: 18; left: 50%; bottom: 96px; transform: translateX(-50%); display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; max-width: 92vw; }
  .chips button {
    padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px;
    background: rgba(10,14,20,.6); backdrop-filter: blur(10px); color: var(--dim);

</style>
</head>
<body>

<div class="card" id="card">
  <div class="en" id="cardEn">SEOUL</div>

<div class="panel">

  <input type="range" id="time" min="0" max="1" step="0.005" value="0.86">
  <div class="btnrow">
    <button class="btn on" id="tour">自动巡游</button>
    <button class="btn" id="reset">全景视角</button>
  </div>
</div>

<div class="hint" id="hint">拖拽旋转 · 滚轮缩放 · 点地标飞过去</div>

<script src="../../assets/vendor/three.min.js"></script>
<script>
(function () {
  'use strict';

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a1018, 0.0068);
  var camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 2000);

  var sun = new THREE.DirectionalLight(0xffffff, 1.0);
  scene.add(sun);
  var amb = new THREE.AmbientLight(0x5a6a85, 0.8);
  scene.add(amb);
  var cityGlow = new THREE.PointLight(0xffc98a, 0, 260, 2);
  cityGlow.position.set(0, 18, 0);
  scene.add(cityGlow);

  var city = new THREE.Group();
  scene.add(city);

  // ---------- 窗户贴图：一次生成，全城复用 ----------
  function windowTexture() {
    var c = document.createElement('canvas');
    c.width = 64; c.height = 128;
    var x = c.getContext('2d');
    x.fillStyle = '#05070b'; x.fillRect(0, 0, 64, 128);
    for (var row = 0; row < 21; row++) {
      for (var col = 0; col < 8; col++) {
        if (Math.random() < 0.34) continue;
        var v = 150 + Math.random() * 105;
        x.fillStyle = 'rgb(' + v + ',' + (v * 0.86 | 0) + ',' + (v * 0.6 | 0) + ')';
        x.fillRect(4 + col * 7.4, 4 + row * 5.9, 4.4, 3.4);
      }
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }
  var winTex = windowTexture();

  var DISTRICTS = [
    { color: 0x59657a, tint: 0xffd9a0 },
    { color: 0x4c576b, tint: 0xffd2a8 },
    { color: 0x67728a, tint: 0xfff0c8 }
  ];
  var buildingMats = DISTRICTS.map(function (d) {
    return new THREE.MeshPhongMaterial({
      color: d.color, shininess: 28, specular: 0x223044,
      emissive: new THREE.Color(d.tint), emissiveMap: winTex, emissiveIntensity: 0
    });
  });
  var glassMat = new THREE.MeshPhongMaterial({ color: 0x8fb7d8, shininess: 140, specular: 0xffffff, emissive: 0x6fa8d8, emissiveIntensity: 0 });
  var emissives = buildingMats.concat([glassMat]);

  // ---------- 汉江 ----------
  var riverPts = [];
  for (var i = 0; i <= 60; i++) {
    var u = i / 60;
    riverPts.push(new THREE.Vector3(-120 + u * 240, 0, 14 + Math.sin(u * 3.1 + 0.6) * 22 - u * 10));
  }
  var riverCurve = new THREE.CatmullRomCurve3(riverPts);
  function riverZAt(x) {
    var u = THREE.MathUtils.clamp((x + 120) / 240, 0, 1);
    return riverCurve.getPoint(u).z;
  }
  var riverMat = new THREE.MeshPhongMaterial({ color: 0x16334e, shininess: 160, specular: 0xbcdcff, transparent: true, opacity: 0.96 });
  (function buildRiver() {
    var g = new THREE.BufferGeometry(), pos = [], idx = [], W = 17;
    for (var i = 0; i <= 60; i++) {
      var p = riverCurve.getPoint(i / 60);
      pos.push(p.x, 0.08, p.z - W, p.x, 0.08, p.z + W);
    }
    for (var s = 0; s < 60; s++) {
      var a = s * 2;
      idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    city.add(new THREE.Mesh(g, riverMat));
  })();

  // 地面
  var ground = new THREE.Mesh(
    new THREE.CircleGeometry(150, 64),
    new THREE.MeshPhongMaterial({ color: 0x1b2029, shininess: 0, specular: 0x000000 })
  );
  ground.rotation.x = -Math.PI / 2;
  city.add(ground);

  // 桥
  function bridge(x) {
    var z = riverZAt(x);
    var deck = new THREE.Mesh(new THREE.BoxGeometry(3, 0.5, 40), new THREE.MeshPhongMaterial({ color: 0x6b7686, shininess: 30 }));
    deck.position.set(x, 1.4, z);
    city.add(deck);
    for (var i = -1; i <= 1; i += 2) {
      var pylon = new THREE.Mesh(new THREE.BoxGeometry(1.1, 9, 1.1), new THREE.MeshPhongMaterial({ color: 0x7d8896 }));
      pylon.position.set(x, 5, z + i * 9);
      city.add(pylon);
    }
    var lampMat = new THREE.MeshBasicMaterial({ color: 0xffd79a });
    for (var l = -18; l <= 18; l += 6) {
      var lm = new THREE.Mesh(new THREE.SphereGeometry(0.22, 6, 5), lampMat);
      lm.position.set(x, 2.1, z + l);
      city.add(lm);
      bridgeLamps.push(lm);
    }
  }
  var bridgeLamps = [];
  [-42, -6, 34].forEach(bridge);

  // ---------- 普通楼房 ----------
  var rand = (function () { var s = 20260904; return function () { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; }; })();
  function addBlocks(cx, cz, radius, count, maxH, matIdx) {
    for (var i = 0; i < count; i++) {
      var a = rand() * Math.PI * 2, r = Math.sqrt(rand()) * radius;
      var x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
      if (Math.abs(z - riverZAt(x)) < 19) continue;          // 不盖到江里
      if (Math.hypot(x - 8, z + 34) < 16) continue;          // 给南山留空
      var w = 1.6 + rand() * 2.6, d = 1.6 + rand() * 2.6;
      var h = 2 + Math.pow(rand(), 2.2) * maxH * (1 - r / radius * 0.55);
      var mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMats[matIdx]);
      mesh.position.set(x, h / 2, z);
      mesh.rotation.y = (rand() - 0.5) * 0.5;
      city.add(mesh);
      if (h > maxH * 0.55) {                                  // 高楼加个屋顶灯
        var tip = new THREE.Mesh(new THREE.SphereGeometry(0.16, 6, 5), new THREE.MeshBasicMaterial({ color: 0xff5a4a }));
        tip.position.set(x, h + 0.3, z);
        city.add(tip);
        roofLights.push(tip);
      }
    }
  }
  var roofLights = [];
  addBlocks(-58, 34, 34, 150, 16, 0);     // 江北西
  addBlocks(-14, 44, 30, 130, 13, 1);     // 钟路 / 旧城
  addBlocks(38, 40, 30, 120, 15, 2);      // 江北东
  addBlocks(-30, -30, 32, 130, 20, 1);    // 永登浦 / 汝矣岛
  addBlocks(30, -34, 34, 160, 26, 2);     // 江南
  addBlocks(86, -16, 26, 90, 22, 0);      // 蚕室

  // ---------- 地标 ----------
  var LANDMARKS = [];
  function landmark(obj, opts) {
    obj.position.set(opts.x, 0, opts.z);
    city.add(obj);
    LANDMARKS.push(Object.assign({ obj: obj }, opts));
  }

  // 南山 + N 首尔塔
  (function () {
    var g = new THREE.Group();
    var hill = new THREE.Mesh(new THREE.ConeGeometry(15, 11, 26), new THREE.MeshPhongMaterial({ color: 0x2c4033, shininess: 4, flatShading: true }));
    hill.position.y = 5.5; g.add(hill);
    var base = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2.4, 3, 10), new THREE.MeshPhongMaterial({ color: 0x8b94a2 }));
    base.position.y = 11.4; g.add(base);
    var shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.85, 12, 12), new THREE.MeshPhongMaterial({ color: 0xc8ced8, shininess: 60 }));
    shaft.position.y = 18.5; g.add(shaft);
    var deck = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.9, 3.2, 14), glassMat);
    deck.position.y = 25.5; g.add(deck);
    var crown = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2.3, 1.6, 14), new THREE.MeshPhongMaterial({ color: 0xd8dee8 }));
    crown.position.y = 27.9; g.add(crown);
    var mast = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.2, 9, 8), new THREE.MeshPhongMaterial({ color: 0xaab2bd }));
    mast.position.y = 33.4; g.add(mast);
    var tip = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff5a4a }));
    tip.position.y = 38; g.add(tip); roofLights.push(tip);
    landmark(g, {
      x: 8, z: -34, zh: 'N 首尔塔', en: 'N Seoul Tower', h: '236 m', y: '1971',
      desc: '架在南山顶上的电波塔，山高塔高加起来是首尔夜景里最容易认出来的一根竖线。',
      view: { yaw: 0.6, pitch: 0.32, dist: 78, tx: 8, ty: 16, tz: -34 }
    });
  })();

  // 乐天世界塔
  (function () {
    var g = new THREE.Group();
    var shell = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 5.2, 46, 4, 6), glassMat);
    shell.rotation.y = Math.PI / 4;
    shell.position.y = 23; g.add(shell);
    var crown = new THREE.Mesh(new THREE.ConeGeometry(1.7, 6, 4), glassMat);
    crown.rotation.y = Math.PI / 4; crown.position.y = 48; g.add(crown);
    var podium = new THREE.Mesh(new THREE.BoxGeometry(12, 4, 12), buildingMats[2]);
    podium.position.y = 2; g.add(podium);
    var tip2 = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff5a4a }));
    tip2.position.y = 51.4; g.add(tip2); roofLights.push(tip2);
    landmark(g, {
      x: 88, z: -20, zh: '乐天世界塔', en: 'Lotte World Tower', h: '555 m', y: '2017',
      desc: '蚕室的那根锥子。四个面缓缓收束到顶，玻璃幕墙在日落时会整根变成橙色。',
      view: { yaw: -0.5, pitch: 0.26, dist: 96, tx: 88, ty: 24, tz: -20 }
    });
  })();

  // 景福宫
  (function () {
    var g = new THREE.Group();
    var wallMat = new THREE.MeshPhongMaterial({ color: 0x6d5a48, shininess: 6 });
    var roofMat = new THREE.MeshPhongMaterial({ color: 0x2f3a4a, shininess: 20, flatShading: true });
    var woodMat = new THREE.MeshPhongMaterial({ color: 0x9a4c3a, shininess: 14 });
    // 院墙
    [[0, -11, 26, 1], [0, 11, 26, 1], [-13, 0, 1, 22], [13, 0, 1, 22]].forEach(function (w) {
      var m = new THREE.Mesh(new THREE.BoxGeometry(w[2], 2.2, w[3]), wallMat);
      m.position.set(w[0], 1.1, w[1]); g.add(m);
    });
    // 正殿：两重屋檐
    var hallBase = new THREE.Mesh(new THREE.BoxGeometry(13, 1.2, 9), new THREE.MeshPhongMaterial({ color: 0x8d8172 }));
    hallBase.position.y = 0.6; g.add(hallBase);
    var hall = new THREE.Mesh(new THREE.BoxGeometry(11.4, 3.4, 7.6), woodMat);
    hall.position.y = 2.9; g.add(hall);
    var roof1 = new THREE.Mesh(new THREE.ConeGeometry(9.6, 2.4, 4), roofMat);
    roof1.rotation.y = Math.PI / 4; roof1.position.y = 5.9; roof1.scale.set(1, 1, 0.72); g.add(roof1);
    var mid = new THREE.Mesh(new THREE.BoxGeometry(8.4, 2.2, 5.6), woodMat);
    mid.position.y = 7.3; g.add(mid);
    var roof2 = new THREE.Mesh(new THREE.ConeGeometry(7.6, 2.2, 4), roofMat);
    roof2.rotation.y = Math.PI / 4; roof2.position.y = 9.4; roof2.scale.set(1, 1, 0.72); g.add(roof2);
    // 光化门
    var gate = new THREE.Mesh(new THREE.BoxGeometry(9, 3, 3), woodMat);
    gate.position.set(0, 1.5, 12.5); g.add(gate);
    var gateRoof = new THREE.Mesh(new THREE.ConeGeometry(6.6, 1.8, 4), roofMat);
    gateRoof.rotation.y = Math.PI / 4; gateRoof.position.set(0, 3.9, 12.5); gateRoof.scale.set(1, 1, 0.55); g.add(gateRoof);
    landmark(g, {
      x: -22, z: 52, zh: '景福宫', en: 'Gyeongbokgung', h: '—', y: '1395',
      desc: '朝鲜王朝的正宫，被现代楼群围在中间的一片低矮瓦顶，正殿勤政殿是两重屋檐。',
      view: { yaw: 0.1, pitch: 0.5, dist: 62, tx: -22, ty: 6, tz: 52 }
    });
  })();

  // 东大门 DDP
  (function () {
    var g = new THREE.Group();
    var skin = new THREE.MeshPhongMaterial({ color: 0xa9b3c0, shininess: 70, specular: 0xdfe9f5, flatShading: true });
    var blob = new THREE.Mesh(new THREE.SphereGeometry(9, 22, 12), skin);
    blob.scale.set(1.5, 0.32, 0.85); blob.position.y = 2.2; g.add(blob);
    var blob2 = new THREE.Mesh(new THREE.SphereGeometry(6.4, 18, 10), skin);
    blob2.scale.set(1.4, 0.4, 0.9); blob2.position.set(6, 3.6, 3); g.add(blob2);
    var ramp = new THREE.Mesh(new THREE.TorusGeometry(7.4, 0.5, 8, 30, Math.PI * 1.2), skin);
    ramp.rotation.x = -Math.PI / 2; ramp.rotation.z = 0.6; ramp.position.y = 4.6; g.add(ramp);
    landmark(g, {
      x: 34, z: 46, zh: '东大门 DDP', en: 'Dongdaemun Design Plaza', h: '29 m', y: '2014',
      desc: '扎哈那只银色的「飞船」，没有一条直边，夜里整个壳面会被打成一片冷光。',
      view: { yaw: -0.9, pitch: 0.42, dist: 52, tx: 34, ty: 4, tz: 46 }
    });
  })();

  // 63 大厦（汝矣岛）
  (function () {
    var g = new THREE.Group();
    var goldMat = new THREE.MeshPhongMaterial({ color: 0xc9a352, shininess: 150, specular: 0xfff0c0, emissive: 0x6b5220, emissiveIntensity: 0 });
    emissives.push(goldMat);
    var slab = new THREE.Mesh(new THREE.BoxGeometry(9, 30, 4.4), goldMat);
    slab.position.y = 15; g.add(slab);
    var top = new THREE.Mesh(new THREE.BoxGeometry(6.4, 3, 3.6), goldMat);
    top.position.y = 31; g.add(top);
    landmark(g, {
      x: -46, z: -14, zh: '63 大厦', en: '63 Building', h: '250 m', y: '1985',
      desc: '汝矣岛江边的金色薄片，曾经是首尔最高的楼，现在是日落时最亮的那一块。',
      view: { yaw: 1.5, pitch: 0.3, dist: 66, tx: -46, ty: 14, tz: -14 }
    });
  })();

  // ---------- 相机 ----------
  var yaw = 0.75, pitch = 0.55, dist = 190;
  var tYaw = yaw, tPitch = pitch, tDist = dist;
  var target = new THREE.Vector3(6, 6, 4), tTarget = target.clone();
  var OVERVIEW = { yaw: 0.75, pitch: 0.55, dist: 190, tx: 6, ty: 6, tz: 4 };

  function flyTo(v) {
    tYaw = v.yaw; tPitch = v.pitch; tDist = v.dist;
    tTarget.set(v.tx, v.ty, v.tz);
  }
  function place() {
    camera.position.set(
      target.x + Math.cos(pitch) * Math.sin(yaw) * dist,
      target.y + Math.sin(pitch) * dist,
      target.z + Math.cos(pitch) * Math.cos(yaw) * dist
    );
    camera.lookAt(target);
  }

  var dragging = false, lx = 0, ly = 0;
  var el = renderer.domElement;
  el.addEventListener('pointerdown', function (e) { dragging = true; lx = e.clientX; ly = e.clientY; setTour(false); });
  addEventListener('pointerup', function () { dragging = false; });
  addEventListener('pointermove', function (e) {
    if (!dragging) return;
    tYaw -= (e.clientX - lx) * 0.005;
    tPitch = THREE.MathUtils.clamp(tPitch + (e.clientY - ly) * 0.004, 0.12, 1.35);
    lx = e.clientX; ly = e.clientY;
  });
  el.addEventListener('wheel', function (e) {
    e.preventDefault();
    tDist = THREE.MathUtils.clamp(tDist + e.deltaY * 0.12, 34, 320);
    setTour(false);
  }, { passive: false });

  // ---------- 地标按钮 ----------
  var chips = document.getElementById('chips');
  var cardEn = document.getElementById('cardEn'), cardZh = document.getElementById('cardZh'),
      cardDesc = document.getElementById('cardDesc'), cardH = document.getElementById('cardH'), cardY = document.getElementById('cardY');
  var activeIdx = -1;
  function select(i) {
    activeIdx = i;
    Array.prototype.forEach.call(chips.children, function (b, bi) { b.classList.toggle('on', bi === i); });
    var L = LANDMARKS[i];
    cardEn.textContent = L.en;
    cardZh.textContent = L.zh;
    cardDesc.textContent = L.desc;
    cardH.textContent = L.h;
    cardY.textContent = L.y;
    flyTo(L.view);
  }
  LANDMARKS.forEach(function (L, i) {
    var b = document.createElement('button');
    b.textContent = L.zh;
    b.onclick = function () { setTour(false); select(i); };
    chips.appendChild(b);
  });

  // 点击场景里的地标本体
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  el.addEventListener('click', function (e) {
    ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    for (var i = 0; i < LANDMARKS.length; i++) {
      if (ray.intersectObject(LANDMARKS[i].obj, true).length) { setTour(false); select(i); return; }
    }
  });

  var tourOn = true, tourT = 0;
  function setTour(on) { tourOn = on; document.getElementById('tour').classList.toggle('on', on); }
  document.getElementById('tour').onclick = function () { setTour(!tourOn); tourT = 0; };
  document.getElementById('reset').onclick = function () {
    setTour(false); activeIdx = -1;
    Array.prototype.forEach.call(chips.children, function (b) { b.classList.remove('on'); });
    cardEn.textContent = 'SEOUL'; cardZh.textContent = '首尔全景';
    cardDesc.textContent = '汉江把城市分成南北两半，北岸是旧王城与南山，南岸是江南的高层区。点下面的地标，镜头会飞过去。';
    cardH.textContent = '—'; cardY.textContent = '—';
    flyTo(OVERVIEW);
  };

  // ---------- 昼夜 ----------
  var timeEl = document.getElementById('time'), timeLabel = document.getElementById('timev');
  var skyDay = new THREE.Color(0x9fc6e8), skyDusk = new THREE.Color(0xe08a55), skyNight = new THREE.Color(0x070b14);
  var sunDay = new THREE.Color(0xfff4e2), sunDusk = new THREE.Color(0xff9a52), sunNight = new THREE.Color(0x2a3a6a);
  var tmp = new THREE.Color(), tmp2 = new THREE.Color();

  function applyTime(v) {
    // v: 0 = 正午, 0.5 = 日落, 1 = 深夜
    var dusk = THREE.MathUtils.smoothstep(v, 0.25, 0.62);
    var night = THREE.MathUtils.smoothstep(v, 0.55, 0.88);
    tmp.copy(skyDay).lerp(skyDusk, dusk);
    tmp2.copy(tmp).lerp(skyNight, night);
    scene.fog.color.copy(tmp2);
    renderer.setClearColor(tmp2);
    scene.background = tmp2.clone();

    tmp.copy(sunDay).lerp(sunDusk, dusk);
    sun.color.copy(tmp.lerp(sunNight, night));
    sun.intensity = 1.1 * (1 - night * 0.86);
    var ang = 0.15 + v * 2.4;
    sun.position.set(Math.cos(ang) * 120, Math.max(6, Math.sin(Math.PI * (1 - v * 0.85)) * 110), 60);
    amb.intensity = 0.75 - night * 0.42;
    amb.color.setHSL(0.6, 0.3, 0.4 - night * 0.18);

    emissives.forEach(function (m) { m.emissiveIntensity = night * 1.25; });
    riverMat.color.setHex(night > 0.5 ? 0x15304c : 0x16334e);
    riverMat.emissive.setHex(0x0a2036);
    riverMat.emissiveIntensity = night * 0.9;
    riverMat.shininess = 90 + night * 130;
    cityGlow.intensity = night * 1.6;
    roofLights.forEach(function (r) { r.visible = night > 0.25; });
    bridgeLamps.forEach(function (b) { b.visible = night > 0.2; });

    // 时钟：0 → 12:00，1 → 02:00
    var hours = 12 + v * 14;
    var hh = Math.floor(hours) % 24, mm = Math.floor((hours % 1) * 60);
    timeLabel.textContent = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  }
  timeEl.oninput = function () { applyTime(+timeEl.value); };

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  var q = new URLSearchParams(location.search);
  if (q.get('time')) { timeEl.value = q.get('time'); }
  if (q.get('tour') === '0') setTour(false);
  if (q.get('go')) { setTour(false); select(Math.min(LANDMARKS.length - 1, +q.get('go'))); }

  // ---------- 主循环 ----------
  var clock = new THREE.Clock();
  var hintEl = document.getElementById('hint');
  applyTime(+timeEl.value);

  function tick() {
    requestAnimationFrame(tick);
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

    if (tourOn) {
      tourT -= dt;
      if (tourT <= 0) { tourT = 7; select((activeIdx + 1) % LANDMARKS.length); }
      tYaw += dt * 0.05;
    }

    var k = Math.min(1, dt * 2.2);
    yaw += (tYaw - yaw) * k;
    pitch += (tPitch - pitch) * k;
    dist += (tDist - dist) * k;
    target.lerp(tTarget, k);
    place();

    // 夜里塔顶航空灯闪烁
    var blink = Math.sin(t * 2.4) > 0.2 ? 1 : 0.35;
    for (var i = 0; i < roofLights.length; i++) roofLights[i].scale.setScalar(blink);

    if (t > 9) hintEl.style.opacity = 0;
    renderer.render(scene, camera);
  }

  place();
  tick();
  setTimeout(function () { document.getElementById('loading').classList.add('gone'); }, 600);
})();
</script>
</body>
</html>
