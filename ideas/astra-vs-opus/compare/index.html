<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astra × Opus 三方对照</title>
<meta name="description" content="同一件作品三个版本并排：GPT-6 Astra 原作、Opus 5 第一版临摹、Opus 5.5 隔离记忆后的独立逆向。">
<meta name="theme-color" content="#07080b">
<style>
  :root {
    --bg: #07080b; --panel: #0e1016; --panel2: #12151c; --ink: #f2f4f7;
    --dim: rgba(242,244,247,.66); --faint: rgba(242,244,247,.44); --line: rgba(242,244,247,.12);
    --astra: #6ee7a5; --o5: #7cd7ff; --o55: #c3a6ff; --amber: #f5c46b;
    --ease: cubic-bezier(.2,.8,.2,1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); line-height: 1.7; overflow-x: hidden;
    font-family: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  html[lang=en] body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; }
  button { font: inherit; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 24px; }

  /* 背景极光：纯 CSS，页面隐藏或减弱动效时暂停 */
  .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .aurora i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .16; animation: drift 26s ease-in-out infinite alternate; }
  .aurora i:nth-child(1) { background: var(--astra); left: -22vmax; top: -30vmax; }
  .aurora i:nth-child(2) { background: var(--o5); left: 30%; top: -38vmax; animation-duration: 32s; animation-delay: -8s; opacity: .12; }
  .aurora i:nth-child(3) { background: var(--o55); right: -24vmax; top: -26vmax; animation-duration: 29s; animation-delay: -14s; }
  .aurora::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 0%, transparent 30%, var(--bg) 78%); }
  @keyframes drift { to { transform: translate3d(6vmax, 9vmax, 0) scale(1.15); } }
  html.paused .aurora i { animation-play-state: paused; }

  /* 语言切换 */
  .lang {
    position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 50;
    min-width: 52px; height: 44px; padding: 0 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(242,244,247,.22); background: rgba(10,12,17,.62); color: var(--ink);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    font-size: 14px; font-weight: 700; letter-spacing: .04em; transition: border-color .2s, background .2s, transform .2s var(--ease);
  }
  .lang:hover { border-color: rgba(242,244,247,.5); background: rgba(24,27,36,.8); }
  .lang:active { transform: scale(.95); }

  /* 顶部导航 */
  .topnav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px 76px 0 0; min-height: 58px; }
  .topnav a {
    display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 15px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(14,16,22,.55); color: var(--dim); text-decoration: none; font-size: 13px;
    transition: color .2s, border-color .2s, background .2s;
  }
  .topnav a:hover { color: var(--ink); border-color: rgba(242,244,247,.36); }
  .topnav a.cur { color: var(--ink); border-color: transparent; background: linear-gradient(var(--panel2), var(--panel2)) padding-box, linear-gradient(90deg, var(--astra), var(--o5), var(--o55)) border-box; border: 1px solid transparent; }

  header.hero { padding: 0 0 34px; border-bottom: 1px solid var(--line); }
  h1 { margin: 26px 0 0; font-size: clamp(30px, 5vw, 56px); font-weight: 650; letter-spacing: -.025em; line-height: 1.08; }
  h1 .a { color: var(--astra); } h1 .b { color: var(--o5); } h1 .c { color: var(--o55); }
  h1 .x { color: var(--faint); font-weight: 300; }
  h1 .sub { display: block; margin-top: 8px; font-size: .56em; font-weight: 500; letter-spacing: -.01em;
    background: linear-gradient(90deg, var(--ink), rgba(242,244,247,.55)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lede { margin: 16px 0 0; max-width: 860px; font-size: 15px; color: var(--dim); }
  .lede b { color: var(--ink); font-weight: 600; }

  .stats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 22px; }
  .stat { display: flex; align-items: baseline; gap: 8px; }
  .stat .n { font-size: 30px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .stat .l { font-size: 13px; color: var(--faint); }
  .stat:nth-child(1) .n { color: var(--ink); } .stat:nth-child(2) .n { color: var(--o5); } .stat:nth-child(3) .n { color: var(--astra); } .stat:nth-child(4) .n { color: var(--amber); }

  .method { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 26px; }
  .method > div { position: relative; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: rgba(14,16,22,.72); font-size: 13px; color: var(--dim); overflow: hidden; }
  .method > div::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--c); box-shadow: 0 0 18px var(--c); }
  .method .a { --c: var(--astra); } .method .b { --c: var(--o5); } .method .c { --c: var(--o55); }
  .method b:first-child { display: block; margin-bottom: 4px; font-size: 14px; color: var(--c); }
  .method b { color: var(--ink); font-weight: 600; }

  /* 入场动效 */
  .rise { animation: rise .8s var(--ease) both; animation-delay: calc(var(--i, 0) * 80ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
  .rv { opacity: 0; transform: translateY(22px); transition: opacity .7s var(--ease), transform .7s var(--ease); transition-delay: calc(var(--i, 0) * 70ms); }
  .rv.in { opacity: 1; transform: none; }

  /* 作品切换 */
  .tabs { position: sticky; top: 0; z-index: 20; background: rgba(7,8,11,.82); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
  .tabs .wrap { padding-right: 76px; }
  .tabrow { position: relative; display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
  .tabrow::-webkit-scrollbar { display: none; }
  .tabrow .ind { position: absolute; top: 10px; height: 40px; left: 0; width: 0; border-radius: 999px; background: var(--ink); box-shadow: 0 0 24px rgba(242,244,247,.18); transition: transform .45s var(--ease), width .45s var(--ease); z-index: 0; }
  .tabrow button {
    position: relative; z-index: 1; flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px;
    border: 1px solid var(--line); border-radius: 999px; background: transparent;
    color: var(--dim); font-size: 13px; cursor: pointer; white-space: nowrap; transition: color .3s, border-color .3s;
  }
  .tabrow button .d { width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(135deg, var(--astra), var(--o55)); }
  .tabrow button.held .d { background: var(--amber); }
  .tabrow button:hover { color: var(--ink); border-color: rgba(242,244,247,.4); }
  .tabrow button.on { color: #07080b; border-color: transparent; font-weight: 650; }

  .work { padding: 30px 0 10px; }
  .work-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
  .work-head .tt { min-width: 0; }
  .work-head h2 { margin: 0; font-size: clamp(22px, 3vw, 30px); font-weight: 650; letter-spacing: -.015em; line-height: 1.2; }
  .work-head .en { display: block; margin-top: 4px; font-size: 12px; letter-spacing: .12em; color: var(--faint); text-transform: uppercase; }
  .work-head .spacer { flex: 1; }
  .bigbtn {
    position: relative; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; cursor: pointer; font-size: 14px; font-weight: 650;
    color: #0a0612; background: linear-gradient(90deg, var(--astra), var(--o5), var(--o55)); background-size: 200% 100%;
    box-shadow: 0 6px 30px rgba(124,215,255,.18); transition: background-position .6s var(--ease), transform .2s var(--ease), box-shadow .3s;
  }
  .bigbtn:hover { background-position: 100% 0; box-shadow: 0 8px 40px rgba(195,166,255,.3); }
  .bigbtn:active { transform: scale(.97); }

  /* 手机：三栏切换胶囊 */
  .seg { display: none; position: relative; margin-top: 18px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: rgba(14,16,22,.8); }
  .seg .knob { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3); border-radius: 999px; background: var(--kc, var(--astra)); transition: transform .4s var(--ease), background .4s; box-shadow: 0 0 22px color-mix(in srgb, var(--kc, var(--astra)) 45%, transparent); }
  .seg button { position: relative; z-index: 1; width: calc(100% / 3); height: 40px; border: 0; background: transparent; color: var(--dim); font-size: 13px; font-weight: 650; cursor: pointer; transition: color .3s; }
  .seg button.on { color: #07080b; }
  .dots { display: none; justify-content: center; gap: 8px; margin-top: 12px; }
  .dots i { width: 7px; height: 7px; border-radius: 99px; background: rgba(242,244,247,.25); transition: width .35s var(--ease), background .35s; }
  .dots i.on { width: 22px; background: var(--kc, var(--ink)); }

  /* 三栏 */
  .tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
  .pane {
    --c: var(--astra); position: relative; display: flex; flex-direction: column; min-width: 0; border-radius: 18px; overflow: hidden;
    border: 1px solid transparent;
    background: linear-gradient(180deg, #10131a, var(--panel)) padding-box,
                linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, transparent), rgba(242,244,247,.08) 40%, rgba(242,244,247,.06)) border-box;
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 50px -30px rgba(0,0,0,.8);
    transition: transform .45s var(--ease), box-shadow .45s var(--ease);
  }
  .pane.b { --c: var(--o5); } .pane.c { --c: var(--o55); }
  .pane::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: radial-gradient(80% 50% at 50% 0%, color-mix(in srgb, var(--c) 14%, transparent), transparent 70%); opacity: .8; }
  @media (hover: hover) {
    .pane:hover { transform: translateY(-4px); box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 28px 60px -28px color-mix(in srgb, var(--c) 45%, transparent); }
    .pane:hover .stage img { transform: scale(1.035); }
  }
  .ph { position: relative; z-index: 1; padding: 12px 10px 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .ph .who { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 750; color: var(--c); display: inline-flex; align-items: center; gap: 8px; }
  .ph .who::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .ph .sub { font-size: 12px; color: var(--faint); min-width: 0; }
  .ph a.open { margin-left: auto; display: inline-flex; align-items: center; min-height: 40px; padding: 0 10px; font-size: 12px; color: var(--dim); text-decoration: none; white-space: nowrap; border-radius: 10px; transition: color .2s, background .2s; }
  .ph a.open:hover { color: var(--ink); background: rgba(242,244,247,.06); }
  .stage { position: relative; z-index: 1; aspect-ratio: 16 / 10; background: #04060a; overflow: hidden; }
  .stage img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s var(--ease), opacity .4s; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #04060a; }
  .stage .load {
    position: absolute; left: 12px; bottom: 12px; min-height: 40px; padding: 0 16px 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid rgba(242,244,247,.28); background: rgba(6,8,12,.7); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: var(--ink); font-size: 13px; cursor: pointer; transition: background .2s, color .2s, transform .2s var(--ease);
  }
  .stage .load::before { content: ""; width: 0; height: 0; border-left: 8px solid var(--c); border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 4px; }
  .stage .load:hover { background: var(--ink); color: #07080b; }
  .stage .load:active { transform: scale(.96); }
  .stage .unload { position: absolute; right: 10px; top: 10px; z-index: 2; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(242,244,247,.3); background: rgba(6,8,12,.75); color: var(--ink); font-size: 12px; cursor: pointer; }
  .stage .blank {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px;
    padding: 22px 24px 60px; background: radial-gradient(120% 90% at 20% 10%, color-mix(in srgb, var(--c) 14%, transparent), transparent 60%), #06080c;
  }
  .blank q { font-size: 15px; line-height: 1.65; color: var(--ink); quotes: "“" "”"; }
  html[lang^=zh] .blank q { quotes: "「" "」"; }
  .blank small { font-size: 12px; color: var(--faint); }
  .pd { position: relative; z-index: 1; padding: 13px 16px 16px; font-size: 13px; color: var(--dim); border-top: 1px solid var(--line); }
  .pd b { color: var(--ink); font-weight: 600; }
  .pd .src { display: block; margin-bottom: 6px; font-size: 12px; color: var(--faint); }
  .heldtag { position: absolute; left: 12px; top: 12px; padding: 6px 12px; border-radius: 999px; background: rgba(245,196,107,.94); color: #1d1405; font-size: 12px; font-weight: 700; box-shadow: 0 6px 20px rgba(245,196,107,.3); }

  .caveat { margin-top: 16px; padding: 14px 18px; border: 1px solid rgba(245,196,107,.26); border-left: 2px solid var(--amber);
    border-radius: 0 14px 14px 0; background: linear-gradient(90deg, rgba(245,196,107,.07), rgba(245,196,107,.02)); font-size: 13px; color: var(--dim); line-height: 1.8; }
  .caveat b { color: var(--amber); font-weight: 600; }
  .caveat > .lab { display: block; margin-bottom: 4px; color: var(--amber); font-weight: 700; }

  /* 心得 + prompt */
  .notes { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .card { border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(180deg, #10131a, var(--panel)); overflow: hidden; }
  .card > h3 { margin: 0; padding: 10px 10px 10px 18px; min-height: 58px; font-size: 14px; letter-spacing: .03em; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .card > h3 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--o55); box-shadow: 0 0 12px var(--o55); flex: none; }
  .card > h3 .only { font-size: 12px; font-weight: 500; color: var(--amber); letter-spacing: 0; }
  .card > h3 button { margin-left: auto; min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--dim); font-size: 12px; cursor: pointer; transition: all .2s; }
  .card > h3 button:hover { background: var(--o55); color: #120a24; border-color: var(--o55); font-weight: 600; }
  .md { padding: 6px 20px 18px; font-size: 14px; color: rgba(242,244,247,.82); }
  .md h1, .md h2, .md h3 { color: var(--ink); line-height: 1.35; }
  .md h1 { font-size: 19px; margin: 16px 0 8px; } .md h2 { font-size: 16px; margin: 22px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); } .md h3 { font-size: 14.5px; margin: 16px 0 6px; }
  .md h1 + h2 { border-top: 0; padding-top: 0; }
  .md p { margin: 8px 0; } .md ul, .md ol { padding-left: 20px; margin: 8px 0; } .md li { margin: 3px 0; }
  .md strong { color: var(--ink); }
  .md code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,.07); word-break: break-word; }
  .md pre { padding: 12px 14px; border-radius: 10px; background: rgba(0,0,0,.35); overflow-x: auto; }
  .md pre code { background: none; padding: 0; word-break: normal; }
  .md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; vertical-align: top; min-width: 120px; }
  .md th { background: rgba(255,255,255,.03); color: var(--ink); }
  .md blockquote { margin: 8px 0; padding: 4px 14px; border-left: 2px solid var(--o55); color: var(--dim); }
  .md.prompt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.8; padding-top: 14px; }
  .clamp { position: relative; max-height: 560px; overflow: hidden; transition: max-height .6s var(--ease); }
  .clamp::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(transparent, var(--panel)); pointer-events: none; transition: opacity .3s; }
  .clamp.open { max-height: none; }
  .clamp.open::after { opacity: 0; }
  .more { display: flex; justify-content: center; padding: 4px 16px 16px; }
  .more button { min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: rgba(242,244,247,.04); color: var(--ink); font-size: 13px; cursor: pointer; transition: background .2s, border-color .2s; }
  .more button:hover { background: rgba(195,166,255,.14); border-color: rgba(195,166,255,.5); }
  .plabel { padding: 12px 20px 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  details.tr { margin: 0 14px 16px; border: 1px solid rgba(195,166,255,.28); border-radius: 12px; background: rgba(195,166,255,.05); }
  details.tr summary { min-height: 44px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--o55); list-style: none; }
  details.tr summary::-webkit-details-marker { display: none; }
  details.tr summary::before { content: "▸"; transition: transform .25s var(--ease); }
  details.tr[open] summary::before { transform: rotate(90deg); }
  details.tr .md.prompt { padding: 0 14px 14px; font-family: inherit; font-size: 13px; }
  .note-only { padding: 0 20px 16px; font-size: 12px; color: var(--faint); }
  .pending { padding: 22px 20px; color: var(--faint); font-size: 13px; }

  /* 三窗同开 */
  .theater { position: fixed; inset: 0; z-index: 60; background: #030406; display: grid; grid-template-rows: auto 1fr; }
  .theater[hidden] { display: none; }
  .theater .bar { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; padding: max(8px, env(safe-area-inset-top)) 12px 8px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .theater .bar b { font-weight: 650; }
  .theater .bar span { color: var(--faint); font-size: 12px; }
  .theater .bar button { margin-left: auto; min-height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); font-size: 13px; cursor: pointer; }
  .theater .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); min-height: 0; }
  .theater .col { --c: var(--astra); position: relative; display: grid; grid-template-rows: auto 1fr; border-right: 1px solid var(--line); min-width: 0; min-height: 0; }
  .theater .col.b { --c: var(--o5); } .theater .col.c { --c: var(--o55); }
  .theater .col:last-child { border-right: 0; }
  .theater .col .lab { padding: 4px 12px; min-height: 40px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 750; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; color: var(--c); }
  .theater .col .lab a { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--dim); text-decoration: none; }
  .theater iframe { width: 100%; height: 100%; border: 0; background: #04060a; }
  .theater .blank { position: relative; height: 100%; }
  .theater .held-img { position: relative; min-height: 0; background: #04060a; }
  .theater .held-img img { width: 100%; height: 100%; object-fit: contain; display: block; }

  footer { margin-top: 60px; padding: 28px 0 54px; border-top: 1px solid var(--line); font-size: 13px; color: var(--faint); }
  footer nav { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; }
  footer nav a { color: var(--dim); text-decoration: none; min-height: 40px; display: inline-flex; align-items: center; }
  footer nav a:hover { color: var(--ink); }

  @media (max-width: 1080px) {
    .wrap { padding: 0 16px; }
    .notes { grid-template-columns: 1fr; }
    .method { grid-template-columns: 1fr; }
    .seg { display: flex; }
    .dots { display: flex; }
    /* 横向滑动分页 */
    .tri { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 14px -16px 0; padding: 4px 16px 8px; scroll-padding: 0 16px; overscroll-behavior-x: contain; }
    .tri::-webkit-scrollbar { display: none; }
    .tri { align-items: flex-start; }
    .tri .pane { flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; }

const V2 = {"abyssal": {"notes": "<h1>深渊：活的深海 —— 独立逆向笔记<\/h1>\n<h2>我对原作的理解（它的核心卖点是什么）<\/h2>\n<p>ABYSSAL: The Living Deep 最打动人的不是某一个特效，而是<strong>“连续”<\/strong>：\n从海面上随浪漂浮的一个镜头开始，一口气潜下去——阳光珊瑚礁、海藻林、陆架边缘的蔚蓝、峡谷里的暮光带，一直到 1400 米的热液花园——中间没有加载、没有切场景，全都是同一颗种子长出来的同一片海。站点按钮只是“旅程”，不是“传送门”。<\/p>\n<p>第二个卖点是<strong>“活”<\/strong>：动物不是贴在场景里的装饰，而是有形态、有行为的群落——鱼群彼此保持间距、被掠食者或潜水员惊散再合拢，礁鱼低头啄食，螃蟹横着走一段停一段，海豚与海豹会周期性上浮换气，鱿鱼喷水后退；越往下，光越少，动物开始自己发光。<\/p>\n<p>第三个卖点是<strong>“可以玩的配方”<\/strong>：种子、地形、生物覆盖、种群、水体光学、天气全都是实时旋钮，还能复制成可复现的链接；再加上观察模式和野外图鉴，把“看风景”变成了“做一次潜水考察”。<\/p>\n<h2>逆向推断：从有限资料里推出了哪些关键机制，依据是什么<\/h2>\n<p>只读了 README、上游 README（UPSTREAM.md）和仓库里的几张文档截图，没有看任何实现源码。<\/p>\n<table>\n<thead>\n<tr>\n<th>推断<\/th>\n<th>依据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>地形是<strong>连续的海底高度场<\/strong>，站点只是其中的坐标；远处用“有界的邻域地块”流式生成<\/td>\n<td>README：“All four habitats exist together in one generated landscape”“Detailed seabed tiles … follow a bounded neighbourhood around the camera. Tile seeds depend on world coordinates”<\/td>\n<\/tr>\n<tr>\n<td>需要一个<strong>与渲染完全一致的 CPU 地形采样<\/strong>（碰撞、动物贴地、路线规划都要用）<\/td>\n<td>测试项里写着 “agreement between rendered terrain and collision height”<\/td>\n<\/tr>\n<tr>\n<td>布局：西侧珊瑚脊与沙质水道、东侧海藻林与空地、南面陆坡与峡谷、深渊平原上散布热液带；可航行半径 2.2 km<\/td>\n<td>README 的 biome 段落与 11 个 place id 名称（reef-ridges / kelp-clearings / canyon-wall / vent-belt / far-vents…）<\/td>\n<\/tr>\n<tr>\n<td>“下潜”要<strong>沿峡谷走<\/strong>，深度站点就是这条路线上的点<\/td>\n<td>“Descend follows the canyon from the shelf, or dives directly when you are already over the trench”，以及 <code>depth=200<\/code> “starts on the canyon route”<\/td>\n<\/tr>\n<tr>\n<td>水体光学是<strong>按波长衰减<\/strong> + 焦散 + 光柱 + 潜水灯，深处只有灯照得到的地方可见<\/td>\n<td>“wavelength-dependent attenuation, wave-driven caustics, shadows, light shafts”“paired dive lights … the water beyond the lights is dark”<\/td>\n<\/tr>\n<tr>\n<td>动物用<strong>固定步长的转向模拟 + 插值渲染<\/strong>，暂停同时冻结位置与附肢<\/td>\n<td>“The steering runs at a fixed time step, with smooth rendering between updates; pausing holds both animal positions and appendages”<\/td>\n<\/tr>\n<tr>\n<td>动物是<strong>镜头附近按生境适宜度加载的群落<\/strong>，而不是整片海都在模拟<\/td>\n<td>“The lab's population readout counts animals currently loaded”<\/td>\n<\/tr>\n<tr>\n<td>图鉴识别要看距离、画框、地形遮挡与<strong>是否被照亮<\/strong><\/td>\n<td>“Identification respects distance, the camera frame, rock and terrain occlusion, and available light”<\/td>\n<\/tr>\n<tr>\n<td>海面与水下共享同一套波浪；水线处两种视图在<strong>真实浪面<\/strong>上混合<\/td>\n<td>“The waterline samples all three FFT cascades … Crossing the surface blends the two views at the moving wave boundary”<\/td>\n<\/tr>\n<tr>\n<td>界面：左上品牌、左下大号衬线标题 + “Nearby” 行、底部四个生境标签、右侧深度刻度（0/200/600/1000/≈1400）、右下 Drift/Swim/暂停/灯/相机<\/td>\n<td>仓库 docs/media 里的截图<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>实现思路与关键技术决策（为什么这么选）<\/h2>\n<ul>\n<li><strong>Three.js（r186，本地 vendor）+ 全部自写 GLSL 的 ShaderMaterial<\/strong>。没有用标准材质，因为每一种材质（地形、景物、动物、粒子、海面）都必须走同一套“水下光学”函数，才能在任何深度下保持一致。无构建步骤，ES Module + importmap。<\/li>\n<li><strong>地形 = 烘焙高度图 + 可平铺细节噪声，GPU 用 <code>texelFetch<\/code> 手写插值<\/strong>。CPU 端用完全相同的插值公式采样同一份 Float32 数据，所以碰撞、动物贴地、路线规划与画面严格一致（这是 README 测试里强调的点）。渲染网格是以镜头为中心、近密远疏的一张 257×257 网格（近处 0.75 米，远处约 9 米）。<\/li>\n<li><strong>一套解析的水体模型<\/strong>：下行辐照 <code>E(d)=E0·e^{-Kd·d}<\/code>（三通道），视线内散射用解析积分 <code>b·phase·E0·e^{-Kd·d0}·(e^{aL}-1)/a<\/code>，所以“往上看变亮、往下看变暗、远处融进水色”都是同一个公式的结果；天空穹顶在水下就是 L→∞ 的这条积分。清澈度、上升流、离岸距离、沉积物都只改 Kd/Kv/b 三组系数。<\/li>\n<li><strong>像潜水相机那样的部分白平衡<\/strong>：浅处按阳光下行路径补偿红光，深处按潜水灯约 12 米往返路径补偿。这是刻意的艺术选择——让礁石有颜色、让深海在灯下是 ROV 画面那种中性色，而不是一片青绿。<\/li>\n<li><strong>自动曝光 + “按曝光归一化的生物光”<\/strong>：深处曝光会拉到几十倍，生物发光的自发光强度按 1/曝光 缩放，这样灯笼鱼的腹部发光在 600 米和 1000 米看起来同样亮，在浅海白天则几乎看不见。<\/li>\n<li><strong>后期管线<\/strong>：HDR 场景 → 半分辨率体积光（沿视线步进，同时积分阳光光柱与两盏潜水灯的光束）→ 两级泛光 → ACES → 暗角/颗粒。水线附近把场景渲两遍（水上/水下），逐像素用 GLSL 里的 Gerstner 浪高判断近裁剪面在不在水下，做出随浪移动的分屏。<\/li>\n<li><strong>海面<\/strong>：12 个 Gerstner 波（风浪 + 涌浪，按风速估算峰值波长与有效波高），JS 与 GLSL 同一组参数；镜头漂浮时用 CPU 迭代反解真实浪高并随浪面倾斜。事件波（海底震颤的环形波列、畸形浪波包）同时写进两边。从水下看是斯涅尔窗 + 全反射。<\/li>\n<li><strong>天空<\/strong>：穹顶里在 1300–2200 米的云层中做 14 步的“2.5D 体积云”（二维覆盖场 + 随高度抬高的阈值 → 积云圆顶），朝太阳方向采样一次做自阴影；反射里用便宜的二维版本。夜晚有星、月、银河带。<\/li>\n<li><strong>景物<\/strong>：岩石（分层台地、巨石、石柱、玄武岩）、鹿角珊瑚、脑珊瑚、桌状珊瑚、海扇、海鞭、管状/桶状海绵、巨藻、海草、矿物烟囱、管虫全部是程序化网格，每类几个变体，用 InstancedMesh 画。按 32 米地块、以世界坐标为种子播种，镜头附近展开，逐帧做视锥与距离剔除。珊瑚会“长”在台地顶上。海藻用顶点着色器按高度弯曲，叠加洋流与波浪涌动。<\/li>\n<li><strong>水下阳光阴影<\/strong>：沿折射后的太阳方向做一张 2048² 的正交深度图，只覆盖镜头前方 64 米，按纹素对齐防闪烁，越深越软越淡。<\/li>\n<li><strong>动物<\/strong>：32 个物种群体，每个物种一套程序化解剖（放样躯干 + 鳍片 + 腕足 + 发光器官 + 眼睛），顶点属性里存“脊柱坐标 / 拍动权重 / 腕编号 / 发光 / 收缩”，一个通用顶点着色器按物种参数做身体波动、鳍的拍动（带展向相位滞后）、腕的卷曲、步足交替和伞体收缩。行为在 30Hz 固定步长里跑：鱼群三规则、群体目标漫游、前瞻避地形、避大石、惊散与重聚、礁鱼觅食低头、掠食者偶尔追向附近猎物群、呼吸空气的动物周期性上浮、底栖动物“走一段停一段”（螃蟹横行）、鱿鱼喷射后退、水母脉动漂流、热泉虾围着烟囱打转。<\/li>\n<li><strong>群落管理<\/strong>：每个物种周期性地在镜头周围采样“适宜度”，决定目标数量；在视野外补生、远离回收；初次到达时把多数群体放在镜头前方。深处群落半径随深度收拢到潜水灯可及范围。<\/li>\n<li><strong>界面<\/strong>全中文，信息架构照原作：标题会随区域淡入切换（呼吸之海 / 珊瑚大教堂 / 沉没的森林 / 深入蔚蓝 / 暮光带 / 漫长的暮光 / 午夜之水 / 午夜花园 / 玄武岩平原），深度刻度可点击作为深度站点，世界实验室四个页签，海图，观察，图鉴，帮助，触屏按钮。<\/li>\n<\/ul>\n<h2>和「常规做法」相比，我做了哪些不一样的尝试<\/h2>\n<ol>\n<li><strong>不用雾，用“解析水体”<\/strong>。常规做法是 <code>scene.fog<\/code> 或者按距离混一个水色；这里每个像素都按视线方向、起点深度和长度解析积分内散射，所以同一个函数自然产生了：往上看的亮、往下看的暗、朝太阳方向的前向散射光晕、深处的漆黑。<\/li>\n<li><strong>一张高度图同时服务 GPU 和 CPU<\/strong>，靠手写插值保证逐位一致，而不是“渲染一套、碰撞另一套近似”。<\/li>\n<li><strong>“按曝光归一化的生物光”与“按潜水灯路径的白平衡”<\/strong>——为了让深海在极端曝光下仍然好看，这两个小决定比任何后期都重要。<\/li>\n<li><strong>海图直接从世界数据渲染<\/strong>：晕渲 + 生境着色 + 等深线（50/200/600/1000 米）+ 峡谷线 + 实时位置与朝向 + 旅程路线；除了 11 个目的地，还可以点海图上任意一点出发（原作没有提到这一点）。<\/li>\n<li><strong>图鉴识别做了真正的可见性判断<\/strong>：画框内、距离、地形遮挡（沿视线采样高度图）、光照（阳光曝光阈值 / 潜水灯锥 / 自身发光），而不是“进入半径就算看见”。<\/li>\n<li>多加了原作列表之外的<strong>雀鲷群<\/strong>（悬停在珊瑚丛上方的小鱼），让礁区“满”起来。<\/li>\n<\/ol>\n<h2>踩过的坑与修正过程<\/h2>\n<ul>\n<li><strong>第一张水下截图只有一片青色<\/strong>：看起来像地形没画出来，实际是散射系数太大、红光衰减太狠，地面被“淹”在水色里。把 b/Kv 比例降到真实大洋的量级、加上部分白平衡后，沙地和焦散才出来。<\/li>\n<li><strong>InstancedMesh + 自写管道几何全部“里外翻面”<\/strong>：平行传输标架下 <code>T×B = -N<\/code>，四边形绕序反了，珊瑚只剩背面、桌状珊瑚变成地上的黑斑。修正绕序后正常。<\/li>\n<li><strong>台地像飘在空中的蘑菇<\/strong>：底部内凹 + 埋入深度不对，算清几何的 y 范围后改成少量内收、以“下缘略埋”定位。<\/li>\n<li><strong>海平线上一排小黑点<\/strong>：极坐标海面网格的最外圈是多边形，弦中点露出了穹顶的深水色。改成海面远处与穹顶在水平线附近使用同一个 <code>seaHorizon()<\/code> 颜色，并加密分段。<\/li>\n<li><strong>云像被压扁的层云<\/strong>：纯二维云层在低仰角被透视压成条纹。换成薄层内 14 步步进、阈值随高度升高，云才有了侧面和圆顶；时间抖动带来的颗粒改成静态的交错梯度噪声。<\/li>\n<li><strong>深海整屏被潜水灯光束糊成一片青色<\/strong>：光束内散射借用了阳光光柱的放大系数，而且用的是偏青的散射系数。拆成单独的、中性的灯光散射项，并对体积光做 4 点模糊压住抖动纹理；曝光公式里提高灯的权重，灯下物体不再过曝。<\/li>\n<li><strong>“蔚蓝”站点一只动物都看不见<\/strong>：生境适宜度采样把中层鱼的高度钳在“离底 20–200 米”里，而这里海底在 470 米以下，全被判成不适宜。改成在深度窗口内采样两次取较大值，并放宽大洋物种的离底上限。<\/li>\n<li><strong>动物都在身后或太远<\/strong>：初次生成改为多数群体放在镜头前方，小型礁鱼用更小的生成半径并偏向近处；深处群落半径收拢到灯光范围。<\/li>\n<li><strong>无头 swiftshader 下帧率只有 1–2 fps<\/strong>，所有截图都要等十几秒；为此写了批量截图脚本，并把 CPU 端的动物模拟单独放到 Node 里测（约 1.5–3 ms/步）。<\/li>\n<\/ul>\n<h2>自评：和原作相比，哪里可能追平或超越，哪里还差<\/h2>\n<p><strong>可能追平或超越的地方<\/strong>\n- 完整实现了原作 README 描述的体验骨架：海面开场 → 连续旅程 → 四个生境 + 11 个目的地的同一片海、沿峡谷下潜、深度站点、停在这里、漂流/游动、世界实验室四页签、复制链接、观察与跟随、图鉴、合成声音、震颤/畸形浪/闪电、水线分屏、夜间藻华发光。\n- 珊瑚礁、海藻林、暮光带三处画面与原作文档截图的气质相当接近，礁区的鱼种与珊瑚形态更丰富一些。\n- 图鉴的可见性判断、海图可点任意一点、按曝光归一化的生物光，是我认为比较扎实的加分项。\n- 全部代码约 6,900 行、无贴图/模型/音频资源，首屏只需 three.js 一个依赖。<\/p>\n<p><strong>还差的地方<\/strong>\n- 海面是 12 个 Gerstner 波而不是原作的多级 FFT；飓风、龙卷水柱、漩涡、海啸没有做，只做了震颤、畸形浪、闪电与雨。\n- 云是“2.5D 体积”，近看边缘仍有抖动纹理；没有 TAA，没有景深与运动模糊。\n- 动物模型是低多边形的程序化形态，近看不如原作精细；鲸鱼在“蔚蓝”站点不一定正好出现在画面里。\n- 深海地面的颜色和沙纹仍偏平，细节纹理远不如原作的石灰岩。\n- 我只能在软件渲染器里验证，真实 GPU 上的帧率是按经验估计的（带自适应分辨率兜底）。<\/p>\n<h2>如果重来一次会怎么做<\/h2>\n<ol>\n<li>先搭“截图 + 数值探针”的验证脚手架，再写渲染：这次前期很多时间耗在“为什么画面是一片青色”上。<\/li>\n<li>海面直接上 GPU FFT（两到三级级联），并与水下共享同一张位移纹理，水线和焦散会更真实。<\/li>\n<li>加 TAA，把云、体积光、阴影的抖动都交给时间累积，而不是靠模糊。<\/li>\n<li>给动物做一次“二级细节”：近处用更高细分的网格与法线扰动的鳞片/皮肤，远处保留现在的低模。<\/li>\n<li>把群落生成做成“以世界坐标为种子的地块”，这样动物也能像珊瑚一样“回到原地仍在”。<\/li>\n<\/ol>\n<h2>模型标识<\/h2>\n<p>claude-opus-5-5<\/p>", "notes_en": "<h1>ABYSSAL: The Living Deep — Independent Reverse-Engineering Notes<\/h1>\n<h2>How I read the original (what it is really selling)<\/h2>\n<p>What makes ABYSSAL: The Living Deep so striking isn't any single effect — it's <strong>continuity<\/strong>:\nyou start from a camera bobbing on the waves and dive straight down — the sunlit reef, the kelp forest, the blue at the shelf edge, the twilight zone in the canyon, all the way to the hydrothermal gardens at 1,400 m — with no loading and no scene cuts. It's one ocean grown from one seed. The site buttons are a <em>journey<\/em>, not a <em>teleporter<\/em>.<\/p>\n<p>The second selling point is that it's <strong>alive<\/strong>: the animals aren't props pasted into the scene but communities with anatomy and behavior. Schools keep their spacing, scatter from predators or the diver and then regroup; reef fish dip their heads to feed; crabs sidle a few steps and pause; dolphins and seals surface periodically to breathe; squid jet backwards. The deeper you go, the less light there is, and the animals start making their own.<\/p>\n<p>The third is that it's <strong>a recipe you can play with<\/strong>: seed, terrain, cover, populations, water optics and weather are all live controls, and the whole setup can be copied as a reproducible link. Add an observation mode and a field guide, and \"looking at scenery\" becomes \"running a dive survey.\"<\/p>\n<h2>Reverse inference: which key mechanisms I deduced from limited material, and why<\/h2>\n<p>I read only the README, the upstream README (UPSTREAM.md) and a few documentation screenshots in the repository. I did not look at any implementation source.<\/p>\n<table>\n<thead>\n<tr>\n<th>Inference<\/th>\n<th>Evidence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The terrain is a <strong>continuous seabed heightfield<\/strong>; sites are just coordinates in it, and the distance is streamed as \"bounded neighbourhood\" tiles<\/td>\n<td>README: \"All four habitats exist together in one generated landscape\", \"Detailed seabed tiles … follow a bounded neighbourhood around the camera. Tile seeds depend on world coordinates\"<\/td>\n<\/tr>\n<tr>\n<td>It needs <strong>CPU terrain sampling that matches rendering exactly<\/strong> (for collision, grounding animals and route planning)<\/td>\n<td>The test list mentions \"agreement between rendered terrain and collision height\"<\/td>\n<\/tr>\n<tr>\n<td>Layout: coral ridges and sandy channels to the west, kelp forest and clearings to the east, slope and canyon to the south, vent belts scattered across the abyssal plain; a navigable radius of 2.2 km<\/td>\n<td>The README's biome section and the names of the 11 place ids (reef-ridges / kelp-clearings / canyon-wall / vent-belt / far-vents…)<\/td>\n<\/tr>\n<tr>\n<td>\"Descend\" <strong>follows the canyon<\/strong>, and the depth stations are points along that route<\/td>\n<td>\"Descend follows the canyon from the shelf, or dives directly when you are already over the trench\", and <code>depth=200<\/code> \"starts on the canyon route\"<\/td>\n<\/tr>\n<tr>\n<td>Water optics are <strong>wavelength-dependent attenuation<\/strong> + caustics + light shafts + dive lights; in the deep, only what the lights reach is visible<\/td>\n<td>\"wavelength-dependent attenuation, wave-driven caustics, shadows, light shafts\", \"paired dive lights … the water beyond the lights is dark\"<\/td>\n<\/tr>\n<tr>\n<td>Animals run a <strong>fixed-step steering simulation with interpolated rendering<\/strong>; pausing freezes both positions and appendages<\/td>\n<td>\"The steering runs at a fixed time step, with smooth rendering between updates; pausing holds both animal positions and appendages\"<\/td>\n<\/tr>\n<tr>\n<td>Animals are <strong>communities loaded near the camera by habitat suitability<\/strong>, not a simulation of the whole ocean<\/td>\n<td>\"The lab's population readout counts animals currently loaded\"<\/td>\n<\/tr>\n<tr>\n<td>Field-guide identification considers distance, framing, terrain occlusion and <strong>whether the animal is lit<\/strong><\/td>\n<td>\"Identification respects distance, the camera frame, rock and terrain occlusion, and available light\"<\/td>\n<\/tr>\n<tr>\n<td>The surface and the underwater view share one wave field; at the waterline the two views are blended <strong>on the actual wave surface<\/strong><\/td>\n<td>\"The waterline samples all three FFT cascades … Crossing the surface blends the two views at the moving wave boundary\"<\/td>\n<\/tr>\n<tr>\n<td>UI: brand top-left, a large serif title plus a \"Nearby\" line bottom-left, four habitat tabs along the bottom, a depth scale on the right (0/200/600/1000/≈1400), Drift/Swim/Pause/Lights/Camera bottom-right<\/td>\n<td>Screenshots in the repo's docs/media<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Implementation approach and key technical decisions (and why)<\/h2>\n<ul>\n<li><strong>Three.js (r186, vendored locally) + ShaderMaterials with entirely hand-written GLSL.<\/strong> No standard materials, because every material — terrain, props, animals, particles, sea surface — has to go through the same \"underwater optics\" functions to stay consistent at every depth. No build step: ES modules + an import map.<\/li>\n<li><strong>Terrain = a baked heightmap + tileable detail noise, with hand-written <code>texelFetch<\/code> interpolation on the GPU.<\/strong> The CPU samples the same Float32 data with exactly the same interpolation formula, so collision, animal grounding and route planning agree with the picture exactly (the point the README's tests stress). The render mesh is a 257×257 grid centered on the camera, dense near and sparse far (0.75 m up close, about 9 m in the distance).<\/li>\n<li><strong>One analytic water model<\/strong>: downwelling irradiance <code>E(d)=E0·e^{-Kd·d}<\/code> (per channel), with in-scattering along the view ray integrated analytically as <code>b·phase·E0·e^{-Kd·d0}·(e^{aL}-1)/a<\/code>. So \"brighter looking up, darker looking down, the distance melting into water colour\" all fall out of one formula; underwater, the sky dome is simply that integral with L→∞. Clarity, upwelling, distance offshore and sediment only change three sets of coefficients: Kd, Kv and b.<\/li>\n<li><strong>Partial white balance, like a dive camera<\/strong>: in the shallows it compensates red along the sunlight's downward path; in the deep it compensates along the dive lights' ~12 m round trip. This is a deliberate artistic choice — the reef keeps its colour, and the deep looks neutral under the lights like ROV footage instead of a wash of teal.<\/li>\n<li><strong>Auto-exposure + \"exposure-normalized bioluminescence\"<\/strong>: in the deep, exposure climbs by tens of times, so emissive bioluminescence is scaled by 1/exposure. A lanternfish's belly photophores look equally bright at 600 m and at 1,000 m, and are all but invisible in the shallows by day.<\/li>\n<li><strong>Post-processing pipeline<\/strong>: HDR scene → half-resolution volumetric light (ray-marched along the view, integrating both sun shafts and the beams of the two dive lights) → two-level bloom → ACES → vignette/grain. Near the waterline the scene is rendered twice (above/below), and a per-pixel Gerstner wave height in GLSL decides whether the near clip plane is underwater, producing a split screen that moves with the waves.<\/li>\n<li><strong>Sea surface<\/strong>: 12 Gerstner waves (wind sea + swell, with peak wavelength and significant wave height estimated from wind speed), sharing one parameter set between JS and GLSL. When the camera floats, the CPU iteratively solves for the true wave height and tilts with the surface. Event waves (ring-shaped wave trains from seabed tremors, rogue-wave packets) are written into both sides. From below you get a Snell's window and total internal reflection.<\/li>\n<li><strong>Sky<\/strong>: inside the dome, a 14-step \"2.5D volumetric cloud\" layer between 1,300 and 2,200 m (a 2D coverage field + a threshold that rises with altitude → cumulus domes), with one sample toward the sun for self-shadowing; reflections use a cheap 2D version. At night there are stars, the moon and a Milky Way band.<\/li>\n<li><strong>Props<\/strong>: rocks (terraced shelves, boulders, pillars, basalt), staghorn coral, brain coral, table coral, sea fans, sea whips, tube/barrel sponges, giant kelp, seagrass, mineral chimneys and tubeworms are all procedural meshes, a few variants each, drawn with InstancedMesh. They are scattered per 32 m tile, seeded by world coordinates, expanded around the camera, and frustum- and distance-culled every frame. Corals \"grow\" on top of the shelves. Kelp bends with height in the vertex shader, layered with current and wave surge.<\/li>\n<li><strong>Underwater sun shadows<\/strong>: a 2048² orthographic depth map along the refracted sun direction, covering only the 64 m in front of the camera, texel-snapped to prevent shimmering, and softer and fainter with depth.<\/li>\n<li><strong>Animals<\/strong>: 32 species groups, each with its own procedural anatomy (lofted body + fins + arms + photophores + eyes). Vertex attributes store \"spine coordinate / flap weight / arm index / glow / contraction\", and one shared vertex shader uses per-species parameters for body undulation, fin beats (with spanwise phase lag), arm curling, alternating legs and bell contraction. Behavior runs at a fixed 30 Hz step: the three boids rules, group goal wandering, look-ahead terrain avoidance, boulder avoidance, scattering and regrouping, reef fish dipping to feed, predators occasionally chasing a nearby school, air-breathers surfacing periodically, benthic animals that move-and-pause (crabs walking sideways), squid jetting backwards, jellyfish pulsing and drifting, vent shrimp circling the chimneys.<\/li>\n<li><strong>Community management<\/strong>: each species periodically samples \"suitability\" around the camera to set a target count; animals spawn out of view and are recycled when far away; on first arrival most groups are placed in front of the camera. In the deep, the community radius shrinks with depth to the reach of the dive lights.<\/li>\n<li><strong>The UI is entirely in Chinese<\/strong>, with the original's information architecture: the title fades between regions (The Breathing Sea / Coral Cathedral / The Sunken Forest / Into the Blue / Twilight Zone / The Long Twilight / Midnight Waters / Midnight Garden / Basalt Plain), the depth scale is clickable as depth stations, and there are the four World Lab tabs, a sea chart, observation, the field guide, help and touch buttons.<\/li>\n<\/ul>\n<h2>What I tried differently from the \"usual approach\"<\/h2>\n<ol>\n<li><strong>No fog — an \"analytic water\" model instead.<\/strong> The usual approach is <code>scene.fog<\/code> or blending in a water colour by distance. Here every pixel analytically integrates in-scattering by view direction, starting depth and length, so one function naturally produces the brightness looking up, the darkness looking down, the forward-scattering halo toward the sun, and the pitch black of the deep.<\/li>\n<li><strong>One heightmap serves both GPU and CPU<\/strong>, with hand-written interpolation guaranteeing bit-for-bit agreement, instead of \"one version for rendering and an approximation for collision.\"<\/li>\n<li><strong>\"Exposure-normalized bioluminescence\" and \"white balance along the dive-light path\"<\/strong> — to keep the deep beautiful under extreme exposure, these two small decisions matter more than any post-processing.<\/li>\n<li><strong>The sea chart is rendered straight from world data<\/strong>: hillshading + habitat colouring + depth contours (50/200/600/1000 m) + canyon lines + live position and heading + the journey route. Besides the 11 destinations, you can click any point on the chart to set off from there (the original doesn't mention this).<\/li>\n<li><strong>Field-guide identification does real visibility testing<\/strong>: in frame, distance, terrain occlusion (sampling the heightmap along the line of sight), and lighting (sunlight exposure threshold / dive-light cone / self-luminescence) — not \"inside the radius counts as seen.\"<\/li>\n<li>I added <strong>damselfish shoals<\/strong>, which aren't on the original's list (small fish hovering above coral heads), to make the reef feel full.<\/li>\n<\/ol>\n<h2>Pitfalls and how I fixed them<\/h2>\n<ul>\n<li><strong>The first underwater screenshot was a flat sheet of teal.<\/strong> It looked as if the terrain wasn't drawing, but the scattering coefficient was too large and red attenuated too hard, so the ground was \"drowned\" in water colour. Only after bringing the b/Kv ratio down to real open-ocean values and adding partial white balance did the sand and caustics appear.<\/li>\n<li><strong>InstancedMesh + my hand-built tube geometry came out entirely inside-out.<\/strong> Under a parallel-transport frame <code>T×B = -N<\/code>, so the quad winding was reversed: corals showed only back faces and table corals became black blotches on the ground. Fixing the winding sorted it out.<\/li>\n<li><strong>The shelves looked like mushrooms floating in the air<\/strong>: the undercut bottom and burial depth were wrong. After working out the geometry's y-range, I switched to a slight inset positioned with the lower edge \"slightly buried.\"<\/li>\n<li><strong>A row of small black dots along the horizon<\/strong>: the outermost ring of the polar sea-surface mesh is a polygon, and the chord midpoints exposed the dome's deep-water colour. Fixed by having the far sea surface and the dome use the same <code>seaHorizon()<\/code> colour near the horizon, plus denser segments.<\/li>\n<li><strong>The clouds looked like squashed stratus<\/strong>: a purely 2D cloud layer is foreshortened into stripes at low elevation angles. Switching to 14 steps inside a thin layer, with a threshold rising with height, gave the clouds sides and domes; the grain from temporal jitter was replaced with static interleaved gradient noise.<\/li>\n<li><strong>In the deep, the whole screen was smeared teal by the dive-light beams<\/strong>: the beam in-scattering borrowed the sun shafts' gain and used the bluish scattering coefficient. I split it into a separate, neutral lamp-scattering term, applied a 4-tap blur to the volumetric light to suppress the dither pattern, and raised the lamps' weight in the exposure formula so lit objects no longer blow out.<\/li>\n<li><strong>Not a single animal visible at the \"Into the Blue\" site<\/strong>: habitat suitability sampling clamped mid-water fish to \"20–200 m above the bottom,\" but the seabed there is below 470 m, so everything was judged unsuitable. I changed it to sample twice within the depth window and take the larger value, and relaxed the height-above-bottom cap for oceanic species.<\/li>\n<li><strong>The animals were all behind the camera or too far away<\/strong>: initial spawning now puts most groups in front of the camera, small reef fish use a smaller spawn radius biased toward the near field, and deep communities shrink to the reach of the lights.<\/li>\n<li><strong>Headless SwiftShader ran at only 1–2 fps<\/strong>, so every screenshot took over ten seconds; I wrote a batch screenshot script and tested the CPU-side animal simulation separately in Node (about 1.5–3 ms per step).<\/li>\n<\/ul>\n<h2>Self-assessment: where it may match or beat the original, and where it falls short<\/h2>\n<p><strong>Where it may match or beat the original<\/strong>\n- It implements the full experience skeleton the original's README describes: surface opening → continuous journey → one ocean with four habitats and 11 destinations, descending along the canyon, depth stations, \"stay here,\" drift/swim, the four World Lab tabs, copy link, observe and follow, field guide, synthesized sound, tremors/rogue waves/lightning, the waterline split, and night-time bloom glow.\n- The reef, kelp forest and twilight zone come quite close in mood to the original's documentation screenshots, and the reef has somewhat richer fish species and coral forms.\n- The field guide's visibility testing, clicking anywhere on the chart, and exposure-normalized bioluminescence are what I consider solid extras.\n- About 6,900 lines of code in total, with no textures, models or audio assets; the first screen needs only one dependency, three.js.<\/p>\n<p><strong>Where it falls short<\/strong>\n- The sea surface is 12 Gerstner waves rather than the original's multi-cascade FFT; there are no hurricanes, waterspouts, whirlpools or tsunamis — only tremors, rogue waves, lightning and rain.\n- The clouds are \"2.5D volumetric\" and still show dither at the edges up close; no TAA, no depth of field, no motion blur.\n- The animals are low-poly procedural forms and less refined than the original up close; the whale doesn't necessarily appear in frame at the \"Into the Blue\" site.\n- The deep seabed's colour and sand ripples are still flat, with far less detail than the original's limestone.\n- I could only verify in a software renderer; frame rates on a real GPU are estimates from experience (with adaptive resolution as a fallback).<\/p>\n<h2>What I'd do if I started over<\/h2>\n<ol>\n<li>Build the \"screenshots + numeric probes\" verification scaffolding first, then write the renderer — a lot of early time went into \"why is the picture solid teal.\"<\/li>\n<li>Go straight to a GPU FFT ocean (two or three cascades) and share one displacement texture with the underwater view; the waterline and caustics would be more realistic.<\/li>\n<li>Add TAA and let temporal accumulation handle the jitter in clouds, volumetric light and shadows, instead of relying on blur.<\/li>\n<li>Give the animals a second level of detail: denser meshes with normal-perturbed scales/skin up close, keeping the current low-poly models in the distance.<\/li>\n<li>Make community spawning \"tiles seeded by world coordinates,\" so animals, like the coral, are \"still there when you come back.\"<\/li>\n<\/ol>\n<h2>Model identifier<\/h2>\n<p>claude-opus-5-5<\/p>", "prompt": "# 一次性生成这件作品的 Prompt\n\n> 请做一个可静态托管的网页作品《深渊：活的深海》（ABYSSAL: The Living Deep 的致敬重制）。它是一片可以连续探索的程序化海洋：从海面随浪漂浮的镜头出发，一路潜到 1400 米，全部由同一颗种子生成，界面全部使用中文。\n\n## 技术约束\n\n- 只用 three.js（把 `three.module.js` 与 `three.core.js` 放进 `vendor/`，用 importmap 引入），ES Module、无构建步骤、只用相对路径、不依赖任何 CDN。\n- 不使用任何贴图、模型、字体或音频文件；地形、珊瑚、动物、天空与声音全部由代码生成。\n- 所有材质用自写 GLSL 的 `ShaderMaterial`，并共享同一段“水下光学”GLSL，保证任何深度下风格一致。\n- 需要 WebGL2；不支持时给出中文提示。页面必须在 390px 宽的手机上不横向溢出。\n\n## 页面框架\n\n- 顶部一条细顶栏：左 `← 三方对照`（链接 `../../compare/index.html`），中间“深渊：活的深海” + 小标签「Opus 5.5 · 独立逆向」，右 `原作 @emollick ↗`（链接 https://x.com/emollick/status/2095673885605630429）。`?shot=1` 时隐藏顶栏，`?ui=0` 时隐藏界面。\n- 画布下方叠一层 HUD（风格：深色半透明方块按钮、米白墨色、大号衬线标题、等宽小字标签、淡绿色主按钮）：\n  - 左上 “ABYSSAL / 活的深海”；右上：上浮、下潜、探索（海图）、世界实验室、?。\n  - 右侧深度计：大号数字 + “水面以下/以上”，下方一条可点击的深度刻度 0 水面 / 200 暮光带 / 600 下暮光带 / 1,000 午夜带 / ≈1,400 热液区，并有随深度移动的标记。\n  - 左下标题区：随所处区域淡入切换的大标题与副标题（呼吸之海、珊瑚大教堂、沉没的森林、深入蔚蓝、暮光带、漫长的暮光、午夜之水、午夜花园、玄武岩平原），一行“附近 · 物种 · 物种…”；在海面时显示“潜入珊瑚礁”按钮。\n  - 底部四个生境标签（珊瑚礁 / 海藻林 / 开阔大洋 / 深渊，快捷键 1–4），当前区域有下划线。\n  - 右下工具栏：漂流、游动、暂停、潜水灯、观察、图鉴、截图（不含界面的 PNG），下方一行提示。\n  - 旅程进行中在顶部显示“正在前往 · X”进度条与“停在这里”。\n\n## 世界生成（同一片海）\n\n- 种子（数字或文字，文字哈希成稳定整数；默认 713）→ 在 4.8 km 见方范围内烘焙 768² 的 RG32F 高度图（高度 + 细节幅度）与 RGBA 生境图，再加一张 256² 可平铺细节噪声。GPU 顶点着色器用 `texelFetch` 手写双线性采样；CPU 用完全相同的公式采样，用于碰撞、动物贴地与路线规划。\n- 布局：北侧陆架（-15 到 -30 米）；西侧是沿东北向延伸的珊瑚脊与沙质水道，东侧是岩质海藻林与林间空地；陆架边缘突然坠入陆坡，一条蜿蜒峡谷从陆架切到深渊；南侧是约 -1400 米起伏的深渊平原，散布着热液带。可航行半径 2.2 km。\n- 四个站点（reef / kelp / blue / deep）与 11 个目的地（reef-ridges、reef-channels、reef-gardens、kelp-avenues、kelp-clearings、kelp-outer、shelf-edge、canyon-wall、vent-belt、basalt-plain、far-vents）都只是这片海里的坐标。\n- 镜头周围的地形用一张以镜头为中心、近密远疏的网格（近处约 0.75 米一格）实时采样高度图，并在片元里加沙纹、岩面凹凸、藻皮与生境着色。\n\n## 光与水\n\n- 三通道的下行衰减 Kd、视线衰减 Kv、散射系数 b；沿视线的内散射用解析积分（起点深度、方向、长度），水下穹顶就是 L→∞ 的积分。清澈度、上升流（更绿）、离岸（更清）、沉积物都只改这三组系数。\n- 焦散：两层随时间漂移的“绝对值噪声网”，沿折射后的太阳方向投影，随深度变弱变糊。\n- 沿折射太阳方向的 2048² 正交阴影图，只覆盖镜头前方约 64 米。\n- 自动曝光；潜水相机式部分白平衡（浅处按阳光路径、深处按潜水灯往返路径补偿红光）。\n- 两盏潜水灯（自动随深度亮起，可手动覆盖）。生物发光的强度按 1/曝光 缩放。\n- 后期：半分辨率体积光（阳光光柱 + 灯光光束）、两级泛光、ACES、暗角与细颗粒。镜头靠近水线时把场景渲两遍，逐像素用 GLSL 里的浪高判断水上/水下，做出随浪移动的分屏与暗色水膜线。\n\n## 海面与天空\n\n- 12 个 Gerstner 波（由风速估算峰值波长与波高，加上涌浪），CPU 与 GPU 同参数；漂浮镜头用 CPU 迭代反解真实浪高并随浪倾斜。海面从空中看：天空反射 + 太阳高光 + 浪峰次表面散射 + 雅可比泡沫；从水下看：斯涅尔窗与全反射。事件波：海底震颤的环形波列、畸形浪波包。\n- 天空：解析大气渐变 + 在云层薄壳里 14 步步进的积云（阈值随高度升高形成圆顶，朝太阳采样做自阴影与银边）+ 夜空的星、月与银河带；雨线与分叉闪电。夜里上升流喂养的表层藻华在浪峰被扰动时发出青绿色光。\n\n## 景物（程序化 + 实例化）\n\n- 分层石灰岩台地（顶上长珊瑚）、巨石、陆坡石柱、玄武岩、鹿角珊瑚、脑珊瑚、桌状珊瑚、海扇、海鞭、管状与桶状海绵、巨藻（高度随水深与“海藻高度”旋钮，顶点着色器弯曲并随波浪涌动）、海草丛、冷水珊瑚、矿物烟囱（顶上升起羽流粒子）与管虫丛。\n- 以 32 米地块、世界坐标为种子播种；只展开镜头附近的地块，逐帧做视锥与距离剔除；回到同一地点群落不变。\n\n## 动物（约 30 个物种群体）\n\n- 珊瑚礁：蝴蝶鱼、鹦嘴鱼、雀鲷、礁鲨、蝠鲼、章鱼、螃蟹、海星、海胆；海藻林：海豹、银色鱼群、海龟；蔚蓝：座头鲸、海豚、金枪鱼、翻车鱼、鱿鱼；200–1000 米：灯笼鱼、斧头鱼、中层水虾、吸血鬼乌贼、龙鱼；1000 米以下：鮟鱇、宽咽鱼、烟灰蛸；深海底：大王具足虫、蛇尾、海参、海鳃、热泉虾；漂流者：水母、管水母。\n- 每个物种一套程序化解剖（放样躯干、尾鳍/背鳍/臀鳍/胸鳍、腕足、眼睛、发光器官），顶点属性记录脊柱坐标、拍动权重、腕编号、发光与收缩，通用顶点着色器做身体波动、鳍的拍动、腕的卷曲、步足交替与伞体收缩。\n- 30Hz 固定步长 + 插值渲染：鱼群分离/对齐/聚合，前瞻避地形与大石，被掠食者或正在游动的潜水员惊散后重聚；礁鱼游到岩面低头啄食；掠食者偶尔追向附近的猎物群；海豚、海豹、海龟、座头鲸周期性上浮换气；底栖动物走一段停一段、螃蟹横行；鱿鱼喷水后退；水母脉动漂流；热泉虾围着烟囱打转；转弯时侧倾。暂停时位置与附肢一起冻结；漂流模式下镜头不惊扰动物。\n- 群落按镜头周围的生境适宜度加载与回收，初次生成多放在镜头前方；深处群落半径收拢到潜水灯范围。实验室里显示的是当前加载的数量。\n\n## 交互\n\n- 漂流 / 游动（WASD 沿视线游动、拖动环顾、Q/E 下沉上升、Shift 加速、滚轮缩放）；上浮、沿峡谷下潜（已在深水区则直接下沉）、深度站点、1–4 生境旅程、海图目的地或海图任意一点；旅程沿地形平滑并可“停在这里”。\n- 世界实验室四个页签：世界（种子、新种子、地形起伏、生物覆盖、海藻高度、生境尺度、重置配方、复制世界链接）、生命（动物丰度、掠食者、底栖生物、水母与漂流者、鱼群规模、当前加载数量）、水体（清澈度、洋流、生物发光、深层上升流、潜水灯 自动/开/关、海洋声音与音量）、天气（白天/黄昏/风暴/夜晚、太阳高度、云量、风速、涌浪、风暴强度，展开更多：风向、涌浪周期、浪尖陡度、降雨、雾霾、云密度；事件：海底震颤、畸形浪、闪电）；底部“视图与控制”：在水线漂浮、画质、帧率、操作说明。地形类旋钮松开时重建，天气与水体旋钮拖动时实时生效。\n- 观察（O）：选中视野里看得清的动物，屏幕上用四角括号跟随，卡片显示名称、描述、距离与深度，可“跟随”（镜头缓缓移到舒适距离）、“下一个”；点画面上的动物也能选中。\n- 野外图鉴（J）：动物需要在画面里停留约 1 秒、距离足够近、没被地形挡住、并且被阳光/潜水灯/自身发光照亮才记录；记录首次深度与种子，存在 localStorage（读写包 try/catch）。\n- 海洋声音（M，默认关闭）：WebAudio 实时合成浪涌、水下低鸣、礁区噼啪、远处的鲸歌、热泉嘶声与震颤低频。\n- 快捷键：G 实验室、R 新种子、C 海图、L 潜水灯、P 暂停、H 隐藏界面、F 漂流/游动、Esc 关闭。\n- URL 参数：`site`、`place`、`seed`、`light`（day/dusk/storm/night）、`surface`（1 / waterline）、`depth`（200/600/1000/vent）、`relief`、`cover`、`height`、`habitatScale`、`life`、`predators`、`benthos`、`jellies`、`shoal`、`clarity`、`current`、`glow`、`upwelling`、`lamp`、`preset`、`adaptive=0`。\n- 自适应内部分辨率保帧率；手机默认低画质（关闭阴影）。\n\n## 交付\n\n`index.html`、`css/`、`js/`（按模块拆分：noise、world、optics、sky、surface、terrain、post、geom、scenery、fauna-geo、species、fauna、particles、explore、sound、ui、main）、`vendor/`。完成后用无头浏览器在海面、珊瑚礁、海藻林、蔚蓝、600 米、热液花园、夜晚、风暴、水线与 390px 手机视口逐一截图检查，确认没有控制台报错。", "prompt_en": "# The Prompt to Generate This Piece in One Shot\n\n> Build a statically hostable web piece, *深渊：活的深海* (a tribute remake of ABYSSAL: The Living Deep). It is a procedural ocean you can explore continuously: starting from a camera floating on the waves at the surface and diving all the way to 1,400 m, all generated from a single seed, with the entire UI in Chinese.\n\n## Technical constraints\n\n- Use only three.js (put `three.module.js` and `three.core.js` in `vendor/` and load them with an import map), ES modules, no build step, relative paths only, no CDN dependencies.\n- No texture, model, font or audio files; terrain, corals, animals, sky and sound are all generated in code.\n- Every material is a `ShaderMaterial` with hand-written GLSL, all sharing one \"underwater optics\" GLSL chunk so the style stays consistent at any depth.\n- Requires WebGL2; show a Chinese-language notice when it isn't supported. The page must not overflow horizontally on a 390 px-wide phone.\n\n## Page frame\n\n- A thin top bar: on the left `← 三方对照` (linking to `../../compare/index.html`), in the middle \"深渊：活的深海\" plus a small tag \"Opus 5.5 · 独立逆向\" (independent reverse-engineering), on the right `原作 @emollick ↗` (linking to https://x.com/emollick/status/2095673885605630429). Hide the top bar with `?shot=1` and the UI with `?ui=0`.\n- A HUD layered over the canvas (style: dark translucent square buttons, off-white ink, large serif titles, small monospace labels, a pale-green primary button):\n  - Top-left \"ABYSSAL / 活的深海\"; top-right: Surface, Descend, Explore (chart), World Lab, ?.\n  - Depth gauge on the right: a large number + \"below/above the surface\", and beneath it a clickable depth scale — 0 surface / 200 twilight zone / 600 lower twilight / 1,000 midnight zone / ≈1,400 vents — with a marker that moves with depth.\n  - Title area bottom-left: a large title and subtitle that fade in as the region changes (The Breathing Sea, Coral Cathedral, The Sunken Forest, Into the Blue, Twilight Zone, The Long Twilight, Midnight Waters, Midnight Garden, Basalt Plain), plus a line \"Nearby · species · species…\"; at the surface, show a \"Dive into the reef\" button.\n  - Four habitat tabs along the bottom (Coral Reef / Kelp Forest / Open Ocean / The Deep, shortcuts 1–4), with the current region underlined.\n  - Toolbar bottom-right: Drift, Swim, Pause, Dive Lights, Observe, Field Guide, Screenshot (a PNG without UI), with a hint line below.\n  - During a journey, show a \"Heading to · X\" progress bar and \"Stay here\" at the top.\n\n## World generation (one ocean)\n\n- Seed (a number or text; text is hashed to a stable integer; default 713) → bake a 768² RG32F heightmap (height + detail amplitude) and an RGBA habitat map over a 4.8 km square, plus a 256² tileable detail noise. The GPU vertex shader does hand-written bilinear sampling with `texelFetch`; the CPU samples with exactly the same formula, for collision, grounding animals and route planning.\n- Layout: a shelf to the north (-15 to -30 m); to the west, coral ridges running northeast with sandy channels; to the east, a rocky kelp forest with clearings; the shelf edge drops abruptly onto the slope, and a winding canyon cuts from the shelf down to the abyss; to the south, a rolling abyssal plain at about -1,400 m, scattered with vent belts. Navigable radius 2.2 km.\n- The four sites (reef / kelp / blue / deep) and 11 destinations (reef-ridges, reef-channels, reef-gardens, kelp-avenues, kelp-clearings, kelp-outer, shelf-edge, canyon-wall, vent-belt, basalt-plain, far-vents) are just coordinates in this ocean.\n- Terrain around the camera uses a camera-centered grid, dense near and sparse far (about 0.75 m per cell up close), sampling the heightmap in real time, with sand ripples, rock relief, algal crust and habitat colouring added in the fragment shader.\n\n## Light and water\n\n- Per-channel downwelling attenuation Kd, view attenuation Kv and scattering coefficient b; in-scattering along the view ray uses an analytic integral (start depth, direction, length), and the underwater dome is that integral with L→∞. Clarity, upwelling (greener), distance offshore (clearer) and sediment only change these three sets of coefficients.\n- Caustics: two layers of time-drifting \"absolute-value noise nets,\" projected along the refracted sun direction, weaker and blurrier with depth.\n- A 2048² orthographic shadow map along the refracted sun direction, covering only about 64 m in front of the camera.\n- Auto-exposure; dive-camera-style partial white balance (compensating red along the sunlight path in the shallows, and along the dive lights' round trip in the deep).\n- Two dive lights (switching on automatically with depth, with manual override). Bioluminescence intensity is scaled by 1/exposure.\n- Post: half-resolution volumetric light (sun shafts + lamp beams), two-level bloom, ACES, vignette and fine grain. When the camera nears the waterline, render the scene twice and decide above/below per pixel from the GLSL wave height, producing a split screen that moves with the waves and a dark water-film line.\n\n## Sea surface and sky\n\n- 12 Gerstner waves (peak wavelength and wave height estimated from wind speed, plus swell), with the same parameters on CPU and GPU; the floating camera iteratively solves for the true wave height on the CPU and tilts with the waves. From the air the sea shows sky reflection + sun glint + subsurface scattering on crests + Jacobian foam; from below, Snell's window and total internal reflection. Event waves: ring-shaped wave trains from seabed tremors, rogue-wave packets.\n- Sky: an analytic atmospheric gradient + cumulus ray-marched in 14 steps inside a thin cloud shell (a threshold rising with height forms domes, with one sample toward the sun for self-shadowing and silver linings) + stars, moon and a Milky Way band at night; rain streaks and forked lightning. At night, a surface bloom fed by upwelling glows blue-green where wave crests disturb it.\n\n## Scenery (procedural + instanced)\n\n- Terraced limestone shelves (with coral growing on top), boulders, slope pillars, basalt, staghorn coral, brain coral, table coral, sea fans, sea whips, tube and barrel sponges, giant kelp (height following water depth and a \"kelp height\" control, bent in the vertex shader and surging with the waves), seagrass clumps, cold-water corals, mineral chimneys (with plume particles rising from the top) and tubeworm clusters.\n- Scattered per 32 m tile, seeded by world coordinates; expand only the tiles near the camera, with per-frame frustum and distance culling; returning to the same spot gives the same community.\n\n## Animals (about 30 species groups)\n\n- Reef: butterflyfish, parrotfish, damselfish, reef sharks, manta rays, octopus, crabs, sea stars, sea urchins; kelp forest: seals, silver schools, sea turtles; the blue: humpback whales, dolphins, tuna, ocean sunfish, squid; 200–1,000 m: lanternfish, hatchetfish, midwater shrimp, vampire squid, dragonfish; below 1,000 m: anglerfish, gulper eels, dumbo octopus; the deep seafloor: giant isopods, brittle stars, sea cucumbers, sea pens, vent shrimp; drifters: jellyfish, siphonophores.\n- Each species gets its own procedural anatomy (lofted body; caudal, dorsal, anal and pectoral fins; arms; eyes; photophores). Vertex attributes record spine coordinate, flap weight, arm index, glow and contraction; a shared vertex shader handles body undulation, fin beats, arm curling, alternating legs and bell contraction.\n- 30 Hz fixed step + interpolated rendering: schools separate/align/cohere, look ahead to avoid terrain and boulders, scatter from predators or a swimming diver and regroup; reef fish swim to the rock face and dip to feed; predators occasionally chase a nearby school; dolphins, seals, turtles and humpbacks surface periodically to breathe; benthic animals move and pause, crabs walk sideways; squid jet backwards; jellyfish pulse and drift; vent shrimp circle the chimneys; animals bank into turns. Pausing freezes positions and appendages together; in Drift mode the camera doesn't disturb the animals.\n- Communities are loaded and recycled by habitat suitability around the camera, with initial spawns mostly in front of the camera; in the deep, the community radius shrinks to the dive lights' range. The lab shows the currently loaded count.\n\n## Interaction\n\n- Drift / Swim (WASD to swim along the view, drag to look around, Q/E to sink/rise, Shift to speed up, scroll to zoom); Surface, Descend along the canyon (sinking straight down if already over deep water), depth stations, 1–4 habitat journeys, chart destinations or any point on the chart; journeys follow the terrain smoothly and can \"Stay here.\"\n- The World Lab's four tabs: World (seed, new seed, terrain relief, cover, kelp height, habitat scale, reset recipe, copy world link), Life (animal abundance, predators, benthos, jellies and drifters, school size, currently loaded count), Water (clarity, current, bioluminescence, deep upwelling, dive lights auto/on/off, ocean sound and volume), Weather (day/dusk/storm/night, sun elevation, cloud cover, wind speed, swell, storm intensity; expand for more: wind direction, swell period, crest steepness, rain, haze, cloud density; events: seabed tremor, rogue wave, lightning); at the bottom, \"View & controls\": float at the waterline, quality, frame rate, instructions. Terrain controls rebuild on release; weather and water controls apply live while dragging.\n- Observe (O): select a clearly visible animal in view and track it on screen with corner brackets; a card shows name, description, distance and depth, with \"Follow\" (the camera eases to a comfortable distance) and \"Next\"; clicking an animal in the picture also selects it.\n- Field Guide (J): an animal is recorded only after staying in frame for about 1 second, close enough, not hidden by terrain, and lit by sunlight / dive lights / its own glow; record the first depth and seed, stored in localStorage (reads and writes wrapped in try/catch).\n- Ocean sound (M, off by default): WebAudio synthesizes surge, underwater drone, reef crackle, distant whale song, vent hiss and tremor rumble in real time.\n- Shortcuts: G lab, R new seed, C chart, L dive lights, P pause, H hide UI, F drift/swim, Esc close.\n- URL parameters: `site`, `place`, `seed`, `light` (day/dusk/storm/night), `surface` (1 / waterline), `depth` (200/600/1000/vent), `relief`, `cover`, `height`, `habitatScale`, `life`, `predators`, `benthos`, `jellies`, `shoal`, `clarity`, `current`, `glow`, `upwelling`, `lamp`, `preset`, `adaptive=0`.\n- Adaptive internal resolution to hold frame rate; low quality by default on phones (shadows off).\n\n## Deliverables\n\n`index.html`, `css/`, `js/` (split into modules: noise, world, optics, sky, surface, terrain, post, geom, scenery, fauna-geo, species, fauna, particles, explore, sound, ui, main), `vendor/`. When done, use a headless browser to screenshot the surface, reef, kelp forest, the blue, 600 m, the vent garden, night, storm, the waterline and a 390 px phone viewport one by one, and confirm there are no console errors.", "summary": "three.js + 手写着色器，零外部素材：一套水体光学模型统一处理颜色衰减、焦散、光柱、阴影与头灯；32 种程序化动物会成群、惊散、觅食、上浮换气；同一个种子长出从海面到 1400 米的连续海洋", "summary_en": "three.js + hand-written shaders with zero external assets: one water-optics model handles colour attenuation, caustics, light shafts, shadows and dive lights together; 32 procedural species school, scatter, feed and surface to breathe; one seed grows a continuous ocean from the surface down to 1,400 m", "caveat": "这一件 5.5 的起跑线比第一版高：它读了原作仓库的 README、上游说明和仓库里的原作截图（没读实现源码），所以连界面布局都能对照原作。心得里没有报告隔离泄漏。自评差距：海面波浪比原作简单，缺飓风、水龙卷、漩涡、海啸等极端天气，动物近看偏低模。", "caveat_en": "Opus 5.5 started this one from a higher line than the first version: it read the original repository's README, the upstream notes and the original screenshots in the repo (but not the implementation source), so it could even match the original's UI layout. Its notes report no isolation leaks. Self-assessed gaps: waves simpler than the original's, no extreme weather such as hurricanes, waterspouts, whirlpools or tsunamis, and animals that look low-poly up close.", "origShot": "原作截图：取自原作仓库 emollick/abyssal-living-deep 的 docs/media（MIT 协议，© Token-Gremlin）", "origShot_en": "Original screenshot: from docs/media in the original repository emollick/abyssal-living-deep (MIT License, © Token-Gremlin)"}, "v8-engine": {"notes": "<h1>交互式 V8 发动机 · 独立逆向心得<\/h1>\n<h2>我对原作的理解（它的核心卖点是什么）<\/h2>\n<p>原作的一句话 prompt 是「highly detailed, interactive visualization of a V8 engine」，而公开报道把它描述成「可操作的 3D 课堂」：四个冲程能实时切换，还能看曲轴、凸轮轴、点火顺序、气门正时和气缸压力。我认为它的卖点有三层：<\/p>\n<ol>\n<li><strong>机械真实感<\/strong>：不是一个转圈的模型，而是活塞、连杆、曲轴、凸轮、气门之间真正“咬合”的运动学关系，看上去“就是会这么动”。<\/li>\n<li><strong>把看不见的东西可视化<\/strong>：点火顺序、气门重叠、缸压峰值这些平时只在教科书曲线里出现的概念，和 3D 画面同步出现。<\/li>\n<li><strong>动手<\/strong>：用户不是看视频，而是能切冲程、换视角、拆开看。<\/li>\n<\/ol>\n<p>所以还原的关键不是“建一个好看的 V8”，而是<strong>让 3D、曲线和文字解释由同一个物理模型驱动，任何一处的变化都能在其它地方同时看到<\/strong>。<\/p>\n<h2>逆向推断：从有限资料里推出了哪些关键机制，依据是什么<\/h2>\n<p>没有 demo，只有一句描述和作者的风格参考，所以大部分机制是从“V8 真实工作原理 + 描述中点名的五个功能”反推的：<\/p>\n<ul>\n<li><strong>曲轴类型 → 横置平面（cross-plane）<\/strong>：报道点名“点火顺序”，而最具教学价值、最常见的 V8 就是 90° 夹角 + 曲柄销 0°/90°/270°/180° 的横置平面曲轴，点火顺序 1-8-4-3-6-5-7-2（GM 编号）。我没有手写每缸相位，而是只给定“点火顺序 + 缸列夹角”，再<strong>反解出每个曲柄销的角度<\/strong>；解出来左右两缸共用同一销、四销恰好互成 90°，说明模型自洽。顺时针旋转 + 奇数列在前视右侧，与真实 GM 布局一致。<\/li>\n<li><strong>“实时切换四冲程”→ 以单缸循环角 ψ 为中心<\/strong>：切换冲程的本质是“把聚焦缸拨到该冲程”。我把每缸状态定义为 ψ = θ − 点火相位（0° = 压缩上止点），所有显示（缸内气体颜色、气门、曲线游标、HUD 文案）都从 ψ 推导，所以切换就是让曲轴向前转到目标 ψ，而不是切换动画片段。<\/li>\n<li><strong>“气门正时”→ 真实的正时参数和凸轮型线<\/strong>：采用典型的 IVO 12° BTDC / IVC 48° ABDC / EVO 52° BBDC / EVC 10° ATDC，重叠 22°；凸轮轴 2:1 减速。凸轮外形不是随便画的，而是用同一条升程曲线按极坐标（基圆 + 升程，凸轮 1° = 曲轴 2°）逐点生成，所以凸尖压下挺柱的时刻和升程曲线严格一致。<\/li>\n<li><strong>“气缸压力”→ 不是画一条假曲线，而是算出来<\/strong>：单区热力学模型 + Wiebe 燃烧放热函数，从进气门关闭积分到排气门打开，再用指数衰减近似自由排气。得出 WOT/3000 rpm 下峰值约 68 bar @ 14° ATDC、IMEP 13.5 bar、扭矩约 470 N·m——都在真实 5 L 自然吸气 V8 的量级内。这让“调点火提前角”变成真实的物理实验。<\/li>\n<li><strong>作者审美<\/strong>：同一作者的另一件作品是“2D 原理图自然过渡成 3D”。我推断他偏爱工程制图式的清晰感，于是把“原理图 ⇄ 3D”做成本作的一个视图模式。<\/li>\n<\/ul>\n<h2>实现思路与关键技术决策（为什么这么选）<\/h2>\n<ul>\n<li><strong>Three.js（本地 vendor，importmap，无构建）<\/strong>：WebGL 程序化建模最成熟、可静态托管。只拷贝了用到的 13 个文件（2.3 MB）。<\/li>\n<li><strong>全部几何程序化生成<\/strong>：没有 glTF。缸体用“截面 + 拉伸”构造（缸列截面带缸孔和缸盖螺栓孔，曲轴箱是前视轮廓沿轴向拉伸），这样每个壳体都是封闭实体——这是剖切面能正确“填色”的前提。曲轴臂、连杆是 2D 轮廓挤出，活塞/气门/火花塞是车削体，凸轮是由升程函数生成的型线挤出，正时链与多楔带沿“圆的凸包切线路径”排布。<\/li>\n<li><strong>剖切 = 裁剪平面 + 背面填色<\/strong>：每个缸列的壳体用“过缸轴线的平面”裁掉谷侧一半，背面用斜线红色着色器渲染，形成经典的机械剖视图截面。缸盖在剖切模式下换成“燃烧室板 + 凸轮轴承座”骨架，让排气门也能被看见。<\/li>\n<li><strong>一个物理模型驱动一切<\/strong>：<code>physics.js<\/code> 是纯函数（可在 node 中测试），<code>computeCycle()<\/code> 输出 0.5° 分辨率的 p、V、已燃质量分数、放热率、温度。3D 中缸内气体的颜色/亮度、火焰前锋、排气管发红、气流粒子速度、声音、所有图表都从它采样。<\/li>\n<li><strong>原理图转场<\/strong>：两组裁剪平面互补——实体材质保留扫描线右侧、蓝图材质保留左侧，扫描线横扫的同时摄像机做 dolly-zoom（按“视高不变”插值 FOV 与距离），透视自然压扁成近似正交的前视图。蓝图材质是“填充 + 菲涅尔轮廓线 + EdgesGeometry 棱线”，内部零件不透明（自动消隐），壳体只画轮廓（能透过去看），最后叠上 SVG 尺寸标注（90° 夹角、缸径、行程、中心线）。<\/li>\n<li><strong>可见性用 layers 而不是 visible<\/strong>：layers 不向子节点级联，于是“实体隐藏、它的蓝图副本仍显示”可以共存，转场时两边同时渲染。<\/li>\n<li><strong>UI 用 Canvas 2D 自绘图表<\/strong>：p–θ（线性/对数）+ 升程叠图、p–V 环线、气门正时圆图、8 缸 × 720° 相位图、带冲程色带的拖动条，全部每帧重绘，与 3D 同步。<\/li>\n<\/ul>\n<h2>和「常规做法」相比，我做了哪些不一样的尝试<\/h2>\n<ul>\n<li><strong>常规做法<\/strong>：一个旋转的 V8 模型 + 四个按钮播放对应的动画 + 一张静态的气门正时示意图。<\/li>\n<li><strong>我的尝试<\/strong>：\n  1. <strong>参数可调、结果可算<\/strong>：点火提前角、节气门、转速、进气 VVT 都会实时重算缸压循环；面板会给出压力峰值位置、爆震风险提示，并<strong>自动扫描求出当前工况的 MBT（最佳扭矩点火角）<\/strong>。拖动 VVT 能看到进气凸轮整体相对转动、气门重叠在圆图上变大。\n  2. <strong>凸轮型线由升程曲线生成<\/strong>，而不是一个“蛋形”。\n  3. <strong>缸内气体是状态体<\/strong>：进气蓝 → 压缩变紫变密 → 火焰前锋从火花塞向外扩张 → 做功橙红 → 排气褐色，高度随活塞实时变化；排气门打开时对应排气歧管短暂发红。\n  4. <strong>2D 原理图 ⇄ 3D 的扫描转场<\/strong>，在线稿里活塞和气体仍在运动。\n  5. <strong>声音按物理事件合成<\/strong>：在每缸 EVO（排气门打开）时刻触发脉冲，奇数列/偶数列分别声像左右——横置平面曲轴同一列点火间隔不均（270°/180°/90°/180°），自然出现 V8 的“突突”声。慢放时是一声声独立的“砰”，实时模式下连成轰鸣。\n  6. 点火顺序同时用三种方式表达：顺序条（当前做功缸点亮）、8 缸 × 720° 相位图（能一眼看出做功段每 90° 错开的“阶梯”）、3D 气缸编号标签上的点火闪烁。<\/li>\n<\/ul>\n<h2>踩过的坑与修正过程<\/h2>\n<ul>\n<li><strong>第一版整屏“白茫茫”<\/strong>：缸内气体用加法混合 + 较低 bloom 阈值，金属高光和气体叠加后全部溢出成白色。改为 Alpha 混合的气体体积（保色相）、bloom 阈值提到 1.9、降低 RoomEnvironment 反射强度并补一盏半球光，只让燃烧和火花真正发光。<\/li>\n<li><strong>剖切后右列看不到活塞<\/strong>：裁剪平面过缸轴线，摄像机若在右前方，右列正好“侧对”镜头。把默认机位移到更靠正前上方，让两列谷侧剖面都朝向观众。<\/li>\n<li><strong>剖切模式下进气歧管消失导致气流粒子“悬空”<\/strong>：改为剖切时进气歧管以淡幽灵材质显示，给粒子一个“管道”的语境。<\/li>\n<li><strong>粒子几乎不可见<\/strong>：点大小按固定系数算，只有 1 像素；改为按画布高度与 FOV 推导的屏幕空间尺度。<\/li>\n<li><strong>高亮部件时共享材质串色<\/strong>：同一材质被多个部件共用，选中曲轴时螺栓也发光。改为按“材质 × 部件”克隆，高亮与虚化都按部件精确生效。<\/li>\n<li><strong>正时罩盖最初是随手画的扇形<\/strong>，外观模式下很假。改为对所有链轮外包圆求凸包，再沿边缘均布螺栓。<\/li>\n<li><strong>无头 SwiftShader 下约 1 fps<\/strong>：截图会拍到旧合成帧；测试脚本改为等加载完成、关闭 CSS 过渡、加长超时，并暴露 <code>__v8.finish()<\/code> 直接推进转场以便验证。<\/li>\n<li><strong>手机端<\/strong>：面板改为舞台下方纵向排列、传动条紧跟 3D 视图；用 <code>camera.zoom<\/code> 按宽高比缩放，390 px 宽无横向溢出。<\/li>\n<\/ul>\n<h2>自评：和原作相比，哪里可能追平或超越，哪里还差<\/h2>\n<ul>\n<li><strong>可能追平/超越<\/strong>：<\/li>\n<li>物理真实度：点火顺序、曲柄销相位、气门正时、缸压都是算出来且互相一致的，并且可以动手调参看因果（提前角 → 峰值位置 → 爆震/MBT）。<\/li>\n<li>原理图 ⇄ 3D 转场和线稿中的实时运动，是原帖没有提到的维度。<\/li>\n<li>数据面板的密度（p–θ、对数、p–V、正时圆图、720° 相位图）应该比多数同类作品更“能教东西”。<\/li>\n<li><strong>还差<\/strong>：<\/li>\n<li>视觉精度：程序化几何没有铸造纹理、倒角细节和 AO，缸体表面偏“干净”，离照片级渲染还有距离；原作若使用了更精细的建模或贴图，外观模式会明显强于我。<\/li>\n<li>没有真正的爆炸图（部件沿轴向拆开）动画，只有“选中高亮 + 其余虚化”。<\/li>\n<li>气流只是沿路径的粒子，不是流体；缸内涡流/滚流没有表现。<\/li>\n<li>无法看到原作视频，交互布局是按描述推断的，镜头语言可能和原作不同。<\/li>\n<\/ul>\n<h2>如果重来一次会怎么做<\/h2>\n<ul>\n<li>先搭好“ψ 驱动一切 + 物理模型”这一层再建几何——这次也是这么做的，收益很大；但会更早定下光照与后期参数，避免后面反复调 bloom。<\/li>\n<li>用 SDF/法线贴图给缸体加铸造质感和倒角，在 GPU 上做屏幕空间 AO。<\/li>\n<li>加入“爆炸图”模式：各部件按装配层级沿自身轴线分离，并能逐级还原。<\/li>\n<li>用 AudioWorklet 做连续的排气声合成（含进气谐振），而不是离散脉冲。<\/li>\n<li>把原理图模式扩展成可切换的剖面位置（任选一缸做横剖面）。<\/li>\n<\/ul>\n<h2>模型标识<\/h2>\n<p>claude-opus-5-5<\/p>", "notes_en": "<h1>Interactive V8 Engine · Independent Reverse-Engineering Notes<\/h1>\n<h2>How I read the original (what it is really selling)<\/h2>\n<p>The original's one-line prompt was \"highly detailed, interactive visualization of a V8 engine,\" and press coverage described it as \"a hands-on 3D classroom\": you can switch between the four strokes in real time and inspect the crankshaft, camshafts, firing order, valve timing and cylinder pressure. I see three layers to its appeal:<\/p>\n<ol>\n<li><strong>Mechanical realism<\/strong>: not a spinning model, but the genuine kinematic linkage between pistons, connecting rods, crankshaft, cams and valves — it looks like it <em>has<\/em> to move that way.<\/li>\n<li><strong>Making the invisible visible<\/strong>: firing order, valve overlap and peak cylinder pressure — concepts that normally live in textbook curves — appear in sync with the 3D view.<\/li>\n<li><strong>Hands-on<\/strong>: the user isn't watching a video; they can switch strokes, change views and take it apart.<\/li>\n<\/ol>\n<p>So the key to recreating it isn't \"build a good-looking V8\" but <strong>drive the 3D, the curves and the written explanations from one physical model, so any change shows up everywhere at once<\/strong>.<\/p>\n<h2>Reverse inference: which key mechanisms I deduced from limited material, and why<\/h2>\n<p>There is no demo — just one sentence and the author's style as a reference — so most mechanisms were worked backwards from \"how a real V8 works + the five features the description names\":<\/p>\n<ul>\n<li><strong>Crank type → cross-plane<\/strong>: the coverage names \"firing order,\" and the most instructive and most common V8 is a 90° bank angle with a cross-plane crank (crankpins at 0°/90°/270°/180°), firing order 1-8-4-3-6-5-7-2 (GM numbering). Rather than hand-writing each cylinder's phase, I specify only \"firing order + bank angle\" and <strong>solve for each crankpin angle<\/strong>. The solution puts each left/right pair on a shared pin with the four pins exactly 90° apart, which shows the model is self-consistent. Clockwise rotation with the odd bank on the right as seen from the front matches the real GM layout.<\/li>\n<li><strong>\"Switch the four strokes in real time\" → centred on a single cylinder's cycle angle ψ<\/strong>: switching strokes really means \"turn the focused cylinder to that stroke.\" I define each cylinder's state as ψ = θ − firing phase (0° = compression TDC), and derive every display from ψ — gas colour in the cylinder, valves, curve cursors, HUD text — so switching simply rotates the crank forward to the target ψ rather than swapping animation clips.<\/li>\n<li><strong>\"Valve timing\" → real timing figures and real cam profiles<\/strong>: I use typical values of IVO 12° BTDC / IVC 48° ABDC / EVO 52° BBDC / EVC 10° ATDC, with 22° of overlap; the camshafts run at 2:1 reduction. The cam shape isn't drawn by eye: it's generated point by point in polar coordinates from the same lift curve (base circle + lift, 1° of cam = 2° of crank), so the moment the lobe presses the lifter matches the lift curve exactly.<\/li>\n<li><strong>\"Cylinder pressure\" → computed, not a fake curve<\/strong>: a single-zone thermodynamic model plus a Wiebe heat-release function, integrated from intake valve closing to exhaust valve opening, with exponential decay approximating blowdown. At WOT/3000 rpm it gives a peak of about 68 bar @ 14° ATDC, an IMEP of 13.5 bar and about 470 N·m of torque — all in the range of a real 5 L naturally aspirated V8. That turns \"adjust spark advance\" into a real physics experiment.<\/li>\n<li><strong>The author's taste<\/strong>: another piece by the same author is \"a 2D schematic that transitions naturally into 3D.\" I inferred a liking for the clarity of engineering drawings and made \"schematic ⇄ 3D\" one of this piece's view modes.<\/li>\n<\/ul>\n<h2>Implementation approach and key technical decisions (and why)<\/h2>\n<ul>\n<li><strong>Three.js (vendored locally, import map, no build)<\/strong>: the most mature option for procedural modelling in WebGL, and statically hostable. I copied only the 13 files actually used (2.3 MB).<\/li>\n<li><strong>All geometry is procedural<\/strong>: no glTF. The block is built as \"cross-section + extrusion\" (the bank cross-section includes cylinder bores and head-bolt holes; the crankcase is the front profile extruded along the axis), so every shell is a closed solid — a precondition for the section cut to \"fill\" correctly. Crank webs and connecting rods are extruded 2D profiles; pistons, valves and spark plugs are lathed; the cams are extrusions of profiles generated from the lift function; the timing chain and serpentine belt follow \"tangent paths around the convex hull of the circles.\"<\/li>\n<li><strong>Section cut = clipping planes + back-face fill<\/strong>: each bank's shell is clipped by a plane through the cylinder axes, removing the valley-side half, and the back faces are rendered with a red cross-hatch shader, giving the classic mechanical section view. In section mode the head is swapped for a \"combustion-chamber plate + cam bearing\" skeleton so the exhaust valves are visible too.<\/li>\n<li><strong>One physical model drives everything<\/strong>: <code>physics.js<\/code> is pure functions (testable in Node); <code>computeCycle()<\/code> outputs p, V, burned mass fraction, heat-release rate and temperature at 0.5° resolution. In 3D, the gas colour/brightness, the flame front, glowing exhaust pipes, airflow particle speed, the sound and every chart are sampled from it.<\/li>\n<li><strong>Schematic transition<\/strong>: two complementary sets of clipping planes — the solid material keeps what's right of a scan line, the blueprint material keeps what's left — and while the line sweeps across, the camera does a dolly-zoom (interpolating FOV and distance to keep the framing constant), so the perspective naturally flattens into a near-orthographic front view. The blueprint material is \"fill + Fresnel outline + EdgesGeometry creases\": internal parts are opaque (automatic hidden-line removal), shells are drawn only as outlines (so you can see through them), and SVG dimensions are overlaid at the end (90° bank angle, bore, stroke, centre lines).<\/li>\n<li><strong>Visibility via layers, not <code>visible<\/code><\/strong>: layers don't cascade to children, so \"solid hidden while its blueprint copy still shows\" can coexist, and both sides render during the transition.<\/li>\n<li><strong>Charts drawn in Canvas 2D<\/strong>: p–θ (linear/log) with lift overlay, the p–V loop, a valve-timing circle, an 8-cylinder × 720° phase chart and a scrubber with stroke colour bands, all redrawn every frame in sync with the 3D.<\/li>\n<\/ul>\n<h2>What I tried differently from the \"usual approach\"<\/h2>\n<ul>\n<li><strong>The usual approach<\/strong>: a rotating V8 model + four buttons that play the matching animation + a static valve-timing diagram.<\/li>\n<li><strong>What I tried<\/strong>:\n  1. <strong>Adjustable parameters, computed results<\/strong>: spark advance, throttle, rpm and intake VVT all recompute the pressure cycle in real time; the panel reports where the pressure peak lands and warns of knock risk, and <strong>automatically sweeps to find MBT (minimum advance for best torque) for the current operating point<\/strong>. Dragging VVT rotates the whole intake cam relative to the crank, and you can watch the valve overlap grow on the timing circle.\n  2. <strong>Cam profiles generated from the lift curve<\/strong>, not a generic \"egg\" shape.\n  3. <strong>The cylinder gas is a stateful volume<\/strong>: blue on intake → purple and denser on compression → a flame front spreading out from the spark plug → orange-red on power → brown on exhaust, with its height following the piston in real time; when the exhaust valve opens, the matching exhaust manifold briefly glows.\n  4. <strong>A scanning 2D schematic ⇄ 3D transition<\/strong>, with pistons and gas still moving in the line drawing.\n  5. <strong>Sound synthesized from physical events<\/strong>: a pulse is triggered at each cylinder's EVO (exhaust valve opening), with the odd and even banks panned left and right. Because a cross-plane crank fires unevenly within each bank (270°/180°/90°/180°), the V8 \"burble\" emerges on its own. In slow motion you hear individual thumps; in real time they merge into a roar.\n  6. The firing order is expressed three ways at once: a sequence bar (the cylinder on its power stroke lights up), the 8-cylinder × 720° phase chart (where you can see at a glance the \"staircase\" of power strokes staggered every 90°), and firing flashes on the 3D cylinder-number labels.<\/li>\n<\/ul>\n<h2>Pitfalls and how I fixed them<\/h2>\n<ul>\n<li><strong>The first version was a white-out<\/strong>: the cylinder gas used additive blending with a low bloom threshold, so metal highlights plus gas all overflowed to white. I switched to alpha-blended gas volumes (preserving hue), raised the bloom threshold to 1.9, lowered the RoomEnvironment reflection strength and added a hemisphere light, so only combustion and sparks truly glow.<\/li>\n<li><strong>The right bank's pistons were invisible after the section cut<\/strong>: the clipping plane passes through the cylinder axes, so with the camera front-right, the right bank faces it edge-on. I moved the default camera further toward the front and up, so both banks' valley-side sections face the viewer.<\/li>\n<li><strong>In section mode the intake manifold disappeared and the airflow particles were left \"floating\"<\/strong>: the manifold now shows as a faint ghost material when sectioned, giving the particles a \"duct\" for context.<\/li>\n<li><strong>The particles were barely visible<\/strong>: point size used a fixed factor and came out at 1 pixel; it's now a screen-space size derived from canvas height and FOV.<\/li>\n<li><strong>Highlighting a part bled colour through shared materials<\/strong>: one material was shared by several parts, so selecting the crankshaft also lit up the bolts. Materials are
