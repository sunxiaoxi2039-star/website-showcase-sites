 now cloned per \"material × part,\" so highlighting and ghosting apply precisely per part.<\/li>\n<li><strong>The timing cover started as a hand-drawn fan shape<\/strong> and looked fake in exterior mode. It's now the convex hull of all the sprockets' outer circles, with bolts spaced evenly along the edge.<\/li>\n<li><strong>About 1 fps under headless SwiftShader<\/strong>: screenshots caught stale composited frames. The test script now waits for loading to finish, disables CSS transitions and uses longer timeouts, and I exposed <code>__v8.finish()<\/code> to jump the transition forward for verification.<\/li>\n<li><strong>Mobile<\/strong>: the panels stack vertically below the stage, with the drivetrain bar right under the 3D view; <code>camera.zoom<\/code> scales by aspect ratio, and there's no horizontal overflow at 390 px wide.<\/li>\n<\/ul>\n<h2>Self-assessment: where it may match or beat the original, and where it falls short<\/h2>\n<ul>\n<li><strong>Where it may match or beat the original<\/strong>:<\/li>\n<li>Physical fidelity: firing order, crankpin phasing, valve timing and cylinder pressure are all computed and mutually consistent, and you can tweak parameters to see cause and effect (advance → peak position → knock/MBT).<\/li>\n<li>The schematic ⇄ 3D transition and live motion in the line drawing are a dimension the original post doesn't mention.<\/li>\n<li>The density of the data panels (p–θ, log scale, p–V, timing circle, 720° phase chart) should make it better at <em>teaching<\/em> than most pieces of its kind.<\/li>\n<li><strong>Where it falls short<\/strong>:<\/li>\n<li>Visual fidelity: the procedural geometry has no casting texture, chamfer detail or AO, so the block looks rather \"clean\" and is some way from photoreal; if the original used finer modelling or textures, its exterior mode will clearly beat mine.<\/li>\n<li>There's no true exploded-view animation (parts separating along their axes) — only \"highlight the selection, ghost the rest.\"<\/li>\n<li>The airflow is just particles along a path, not a fluid; in-cylinder swirl and tumble aren't shown.<\/li>\n<li>I couldn't see the original's video, so the interaction layout is inferred from the description, and the camera language may differ from the original.<\/li>\n<\/ul>\n<h2>What I'd do if I started over<\/h2>\n<ul>\n<li>Build the \"ψ drives everything + physical model\" layer before the geometry — I did that this time too and it paid off — but lock down lighting and post-processing parameters earlier to avoid re-tuning the bloom again and again.<\/li>\n<li>Use SDFs/normal maps to give the block a cast texture and chamfers, and add screen-space AO on the GPU.<\/li>\n<li>Add an \"exploded view\" mode: parts separate along their own axes by assembly hierarchy and can be reassembled step by step.<\/li>\n<li>Use an AudioWorklet for continuous exhaust synthesis (including intake resonance) instead of discrete pulses.<\/li>\n<li>Extend the schematic mode to a movable section plane (a cross-section through any chosen cylinder).<\/li>\n<\/ul>\n<h2>Model identifier<\/h2>\n<p>claude-opus-5-5<\/p>", "prompt": "# 一次性生成 Prompt\n\n请用 Three.js（ES Module + importmap，本地 `vendor/` 引用，无构建、无 CDN）做一个单页网页：**可动手探索的交互式 V8 发动机**。界面文字全部中文，深色工程风格，桌面端与 390px 手机端都可用、不得横向溢出。\n\n## 1. 物理与运动学（先写成纯函数模块 `physics.js`，所有显示都由它驱动）\n- 发动机参数：90° V8，缸径 94 mm、行程 92 mm、连杆 150 mm、压缩比 11:1，DOHC 每缸 4 气门。\n- 横置平面曲轴，点火顺序 1-8-4-3-6-5-7-2（奇数缸一列、偶数缸一列，每个曲柄销驱动两列各一缸）。**不要手写每缸相位**：给定点火顺序（每 90° 点火一次）和缸列角 ±45°，反解出曲柄销角度（应得到四销互成 90°，同销两缸一致）。曲轴从前端看顺时针旋转。\n- 定义单缸循环角 ψ = θ − 该缸点火相位，0° = 压缩上止点：0–180 做功、180–360 排气、360–540 进气、540–720 压缩。\n- 活塞位移用精确的曲柄连杆公式；连杆两端分别跟随曲柄销和活塞销。\n- 气门正时：IVO 12° BTDC、IVC 48° ABDC、EVO 52° BBDC、EVC 10° ATDC（重叠 22°），升程曲线用平滑的多项式型线，进气 11.8 mm、排气 11.2 mm；进气凸轮支持 VVT 相位偏移（−20°～+40°）。\n- 缸压：单区热力学（多变压缩/膨胀）+ Wiebe 燃烧放热（点火延迟、燃烧持续角随负荷/转速变化），从 IVC 积分到 EVO，之后指数衰减的自由排气、背压排气、按节气门决定的进气歧管压力。输出 0.5° 分辨率的 p、V、已燃分数、放热率、温度，以及峰值压力与位置、IMEP、扭矩、功率、爆震指数。目标量级：WOT 3000 rpm、提前角 26° 时峰值约 65–70 bar @ 约 14° ATDC。\n\n## 2. 三维模型（全部程序化几何，禁止外部模型）\n- 缸体：每列用“带缸孔与螺栓孔的截面”沿缸轴拉伸；曲轴箱用前视轮廓（U 形 + 谷底 V 形隔板）沿曲轴方向拉伸；主轴承隔板、油底壳；所有壳体必须是封闭实体。\n- 曲轴：带配重的曲臂（2D 轮廓挤出）、曲柄销、主轴颈、前端链轮与减振皮带轮、后端飞轮与齿圈。\n- 连杆（I 字梁 + 螺栓）、活塞（车削体，环槽 + 三道活塞环 + 活塞销）。\n- 缸盖、凸轮罩、4 根凸轮轴：**凸轮型线用升程曲线按极坐标生成（凸轮 1° = 曲轴 2°）**，每个凸轮按其缸的相位安装；桶形挺柱、气门弹簧（进气蓝、排气橙，随升程压缩）、气门。\n- 正时链（两条，实例化链节沿“多圆凸包切线路径”运动，2:1）、火花塞与独立点火线圈、进气稳压腔 + 8 根进气道 + 带转动蝶阀的节气门体、两侧 4-into-1 排气歧管、前端水泵/发电机/多楔带。\n- 缸内气体体积：高度随活塞变化；进气蓝 → 压缩紫 → 从火花塞扩张的火焰前锋 → 做功橙红 → 排气褐；点火瞬间火花闪光；排气门打开时对应排气管短暂发红。\n- 气流粒子：沿“稳压腔 → 进气道 → 进气门 → 缸内”和“缸内 → 排气门 → 歧管 → 集管”路径流动，速度与气门升程和活塞速度成正比、随慢放同步变慢。\n\n## 3. 视图模式\n- 外观：完整发动机。\n- 剖切（默认）：每列壳体用过缸轴线的裁剪平面切掉谷侧一半，曲轴箱切掉上半，截面用红色斜线着色（背面着色技巧）；缸盖换成燃烧室板 + 凸轮轴承座骨架，进气歧管显示为淡幽灵材质。\n- 透视：壳体为菲涅尔边缘发光的半透明材质，内部零件实体。\n- 原理图：一条扫描平面横扫，把实体“擦”成蓝图线稿（填充 + 菲涅尔轮廓 + 棱线，内部零件消隐），同时摄像机做 dolly-zoom 变成近正交前视图，背景变为蓝图网格，叠加 SVG 标注：90° 夹角弧与中心线、缸径 Ø94、行程 92、凸轮轴与曲轴中心引线、图框标题栏。线稿中活塞和气体继续运动；可反向转场回 3D。\n- 机位预设：全景 / 前视 / 俯视 / 侧视，OrbitControls 阻尼。\n\n## 4. 交互与面板\n- 左侧：品牌块；四冲程按钮（进气/压缩/做功/排气，点击后曲轴向前平滑转到聚焦缸的该冲程并暂停），当前冲程说明卡（中文原理 + 进/排气门开度、活塞方向、实时缸压）；聚焦气缸选择（左列 2468 / 右列 1357，键盘 1–8）；视图模式；部件标签（曲轴、连杆、活塞、凸轮轴、气门机构、正时链、火花塞/线圈、缸体、缸盖、前端附件、进气歧管、排气歧管）——选中后该部件脉冲发光、其余虚化，并显示中文讲解卡；3D 中悬停显示部件名、点击选中（拾取需排除被裁剪掉的部分）。\n- 右侧：转速/扭矩/功率/IMEP 指标；“工作循环”图（p–θ 线性/对数与气门升程叠图，冲程色带、点火线、峰值标注、游标；可切到对数 p–V 环线并注明指示功）；气门正时圆图（TDC 在上、顺时针、内圈进气外圈排气、重叠扇区、点火标记、随 ψ 旋转的曲柄指针）；点火顺序条（当前做功缸点亮）+ 8 缸 × 720° 相位图（点击行切换聚焦缸）；调参滑块：转速、节气门、点火提前角、VVT，实时重算，并给出“点火过早/偏晚/合适 + 当前工况 MBT”的解释（MBT 通过扫描提前角求最大 IMEP 得到）与爆震警示。\n- 底部传动条：播放/暂停（空格）、±5° 步进（方向键）、以聚焦缸 ψ 为轴、带冲程色带的可拖动刻度条、曲轴角/本缸角读数、慢放档位（1/400～实时）、声音开关。\n- 声音：WebAudio 在每缸排气门打开时刻合成一次排气脉冲，奇数列偏右、偶数列偏左声像，慢放时是独立脉冲，实时时连成 V8 轰鸣。\n- 3D 中每缸上方有按当前冲程着色的编号标签，点火时闪一下；顶部中央大字显示聚焦缸当前冲程。\n\n## 5. 视觉\n- 深石墨背景 + 渐隐网格地面 + 接触阴影 + 暗角；RoomEnvironment 反射 + 暖色主光 + 冷色轮廓光；UnrealBloom 只作用于燃烧与火花（阈值调高避免金属高光溢出），ACES 色调映射。\n- 冲程配色固定：进气 #3fa9ff、压缩 #9a86ff、做功 #ff6a2b、排气 #dba445，所有图表与 3D 保持一致。\n- 面板为半透明毛玻璃卡片，数字用等宽字体。桌面端把 3D 画面的视觉中心偏移到两侧面板之间；≤980px 时面板移到 3D 视图下方纵向排列。", "prompt_en": "# The One-Shot Generation Prompt\n\nUsing Three.js (ES modules + import map, referenced from a local `vendor/`, no build, no CDN), build a single-page site: **an interactive V8 engine you can explore hands-on**. All UI text in Chinese, a dark engineering style, usable on desktop and on a 390 px phone with no horizontal overflow.\n\n## 1. Physics and kinematics (write these first as a pure-function module, `physics.js`; every display is driven by it)\n- Engine specs: 90° V8, 94 mm bore, 92 mm stroke, 150 mm connecting rods, 11:1 compression ratio, DOHC with 4 valves per cylinder.\n- Cross-plane crankshaft, firing order 1-8-4-3-6-5-7-2 (odd cylinders on one bank, even on the other; each crankpin drives one cylinder from each bank). **Don't hand-write each cylinder's phase**: given the firing order (one firing every 90°) and bank angles of ±45°, solve for the crankpin angles (you should get four pins 90° apart, with both cylinders on a pin agreeing). The crank turns clockwise viewed from the front.\n- Define a single cylinder's cycle angle ψ = θ − that cylinder's firing phase, with 0° = compression TDC: 0–180 power, 180–360 exhaust, 360–540 intake, 540–720 compression.\n- Piston displacement uses the exact slider-crank formula; each connecting rod follows the crankpin at one end and the wrist pin at the other.\n- Valve timing: IVO 12° BTDC, IVC 48° ABDC, EVO 52° BBDC, EVC 10° ATDC (22° overlap), with smooth polynomial lift profiles, 11.8 mm intake and 11.2 mm exhaust lift; the intake cam supports a VVT phase offset (−20° to +40°).\n- Cylinder pressure: a single-zone thermodynamic model (polytropic compression/expansion) + Wiebe heat release (ignition delay and burn duration varying with load/rpm), integrated from IVC to EVO, followed by exponentially decaying blowdown, exhaust against back-pressure, and intake manifold pressure set by the throttle. Output p, V, burned fraction, heat-release rate and temperature at 0.5° resolution, plus peak pressure and its location, IMEP, torque, power and a knock index. Target magnitude: at WOT, 3000 rpm and 26° advance, a peak of about 65–70 bar at about 14° ATDC.\n\n## 2. The 3D model (all procedural geometry; no external models)\n- Block: each bank is a \"cross-section with bores and bolt holes\" extruded along the cylinder axis; the crankcase is the front profile (a U-shape + a V-shaped valley web) extruded along the crank axis; main-bearing bulkheads and an oil pan; every shell must be a closed solid.\n- Crankshaft: counterweighted crank webs (extruded 2D profiles), crankpins, main journals, a front sprocket and harmonic balancer pulley, a rear flywheel and ring gear.\n- Connecting rods (I-beam + bolts), pistons (lathed, with ring grooves + three piston rings + a wrist pin).\n- Cylinder heads, cam covers and 4 camshafts: **cam profiles generated in polar coordinates from the lift curve (1° of cam = 2° of crank)**, each lobe installed at its cylinder's phase; bucket tappets, valve springs (blue for intake, orange for exhaust, compressing with lift) and valves.\n- Timing chains (two, with instanced links moving along a \"tangent path around the convex hull of several circles,\" 2:1), spark plugs and coil-on-plug units, an intake plenum + 8 runners + a throttle body with a rotating butterfly, 4-into-1 exhaust manifolds on both sides, and a front water pump/alternator/serpentine belt.\n- In-cylinder gas volumes: height follows the piston; blue on intake → purple on compression → a flame front spreading from the spark plug → orange-red on power → brown on exhaust; a spark flash at ignition; the matching exhaust pipe briefly glows when the exhaust valve opens.\n- Airflow particles: flowing along \"plenum → runner → intake valve → cylinder\" and \"cylinder → exhaust valve → manifold → collector,\" with speed proportional to valve lift and piston speed, slowing down in sync with slow motion.\n\n## 3. View modes\n- Exterior: the complete engine.\n- Section (default): each bank's shell is clipped by a plane through the cylinder axes to remove the valley-side half, the top half of the crankcase is removed, and the cut faces are shaded with red hatching (the back-face shading trick); the heads are replaced by a combustion-chamber plate + cam-bearing skeleton, and the intake manifold shows as a faint ghost material.\n- X-ray: shells in a translucent material with Fresnel rim glow, internal parts solid.\n- Schematic: a scanning plane sweeps across and \"wipes\" the solids into a blueprint line drawing (fill + Fresnel outline + crease lines, with hidden parts removed), while the camera dolly-zooms into a near-orthographic front view, the background turns into a blueprint grid, and SVG annotations are overlaid: the 90° bank-angle arc and centre lines, bore Ø94, stroke 92, leader lines to the camshaft and crankshaft centres, and a title block. Pistons and gas keep moving in the line drawing; the transition can be reversed back to 3D.\n- Camera presets: overview / front / top / side, with damped OrbitControls.\n\n## 4. Interaction and panels\n- Left side: a brand block; four stroke buttons (intake/compression/power/exhaust — clicking one smoothly turns the crank forward until the focused cylinder reaches that stroke, then pauses); a card explaining the current stroke (the principle in Chinese + intake/exhaust valve opening, piston direction, live cylinder pressure); focused-cylinder selection (left bank 2468 / right bank 1357, keys 1–8); view mode; part tags (crankshaft, connecting rods, pistons, camshafts, valvetrain, timing chains, spark plugs/coils, block, heads, front accessories, intake manifold, exhaust manifolds) — selecting one makes that part pulse while the rest are ghosted, and shows an explanation card in Chinese; hovering in 3D shows the part name and clicking selects it (picking must ignore the clipped-away portions).\n- Right side: rpm/torque/power/IMEP readouts; a \"working cycle\" chart (p–θ in linear/log with valve lift overlaid, stroke colour bands, a spark line, peak annotation and a cursor; switchable to a log p–V loop labelled with indicated work); a valve-timing circle (TDC at the top, clockwise, intake on the inner ring and exhaust on the outer, the overlap sector, the spark mark, and a crank pointer rotating with ψ); a firing-order bar (the cylinder on its power stroke lights up) + an 8-cylinder × 720° phase chart (click a row to change the focused cylinder); sliders for rpm, throttle, spark advance and VVT, recomputed live, with an explanation — \"spark too early / too late / about right + MBT for the current operating point\" (MBT found by sweeping advance for maximum IMEP) — and a knock warning.\n- Bottom drivetrain bar: play/pause (space), ±5° steps (arrow keys), a draggable scale based on the focused cylinder's ψ with stroke colour bands, crank-angle / cylinder-angle readouts, slow-motion levels (1/400 up to real time), and a sound toggle.\n- Sound: WebAudio synthesizes one exhaust pulse at each cylinder's exhaust-valve opening, with the odd bank panned right and the even bank left; in slow motion they are separate pulses, in real time they merge into a V8 rumble.\n- In 3D, each cylinder has a number label above it coloured by its current stroke, flashing on ignition; large text at the top centre shows the focused cylinder's current stroke.\n\n## 5. Visuals\n- A deep graphite background + a fading grid floor + contact shadows + a vignette; RoomEnvironment reflections + a warm key light + a cool rim light; UnrealBloom applied only to combustion and sparks (threshold raised so metal highlights don't bloom), ACES tone mapping.\n- Fixed stroke colours: intake #3fa9ff, compression #9a86ff, power #ff6a2b, exhaust #dba445, consistent across every chart and the 3D view.\n- Panels are translucent frosted-glass cards, with numbers in a monospace font. On desktop, offset the visual centre of the 3D view to sit between the two side panels; at ≤980 px, move the panels below the 3D view in a vertical stack.", "summary": "一套物理模型同时驱动 3D 与所有图表：点火顺序反推曲拐相位、按升程曲线造凸轮型线、缸压按热力学计算；改点火提前角 / 节气门 / 凸轮相位会实时重算峰值与爆震风险；外观 / 剖切 / 透视 / 原理图四视图", "summary_en": "One physical model drives both the 3D and every chart: crankpin phases solved from the firing order, cam profiles built from the lift curve, cylinder pressure computed thermodynamically; changing spark advance / throttle / cam phase recomputes peak pressure and knock risk live; exterior / section / X-ray / schematic views", "caveat": "这一件的起跑线和第一版相同：原作没有公开 demo，只有原帖的一句话 prompt 和公开报道的功能描述，没有源码。心得里没有报告隔离泄漏。「原理图 ⇄ 3D」的过渡是子代理参照同一作者另一件作品（2D 原理图过渡到 3D）自己加的致敬。", "caveat_en": "Same starting line as the first version: the original has no public demo — only the post's one-line prompt and the features described in press coverage, no source. Its notes report no isolation leaks. The \"schematic ⇄ 3D\" transition is a tribute the subagent added on its own, after another piece by the same author (a 2D schematic that transitions into 3D)."}, "seoul-atlas": {"notes": "<h1>首尔 3D 地图集：独立逆向笔记<\/h1>\n<h2>我对原作的理解（它的核心卖点是什么）<\/h2>\n<p>原作 <strong>Seoul 3D Atlas<\/strong>（synabreu，GPT-6 Astra）把整座首尔做成一块能拿在手里转的沙盘：25 个自治区、真实地形、汉江，二三十万栋建筑，外加一段自动飞过十几个地标的镜头，以及白天、黄昏、夜晚三种光照。它能在 X 上拿到三十万次浏览，靠的是三点：<\/p>\n<ol>\n<li><strong>规模上的真实感<\/strong>：打开页面看到的是首尔本身，而不是随手捏的一座“风格化城市”。汉江的弯、汝矣岛、南山、北汉山都在它们该在的位置。<\/li>\n<li><strong>微缩模型的质感<\/strong>：垂直方向夸张过的地形和楼群，加上沙盘底座，让人觉得是在俯看一件桌上的模型，而不是在用 GIS 软件。<\/li>\n<li><strong>会自己讲故事<\/strong>：点一下“飞越”，镜头就一站一站带你认识这座城。昼夜切换让同一座城有两种性格。<\/li>\n<\/ol>\n<p>我把复刻目标定为：<strong>真实数据的量感 + 沙盘的质感 + 导览的叙事<\/strong>，缺了哪一项，这件东西就退回成一个普通的 three.js 城市演示。<\/p>\n<h2>逆向推断：从有限资料里推出了哪些关键机制，依据是什么<\/h2>\n<p>我看不到任何临摹版，也打不开原作 demo（chatgpt.site 被屏蔽），能用的只有推文摘要、社区整理，以及原作 GitHub 仓库公开的 README。我只读了 README 的文字说明，没有看它的源码和脚本。<\/p>\n<table>\n<thead>\n<tr>\n<th>推断<\/th>\n<th>依据<\/th>\n<th>我的做法<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>建筑来自 OSM 足迹，数量在 28 万左右<\/td>\n<td>README：“285,841 buildings from OpenStreetMap”“simplified oriented masses”<\/td>\n<td>OSM 瓦片源被屏蔽，改从 <strong>Overture Maps<\/strong>（S3 上的 GeoParquet，大部分要素源自 OSM）拉取。按 row group 的 bbox 统计做 HTTP Range 读取，只下载首尔范围内的数据：60.7 万栋原始足迹，筛选后保留 <strong>399,770 栋<\/strong><\/td>\n<\/tr>\n<tr>\n<td>建筑是“带朝向的体块”，并非真实多边形挤出<\/td>\n<td>README：每栋 6 个 float（x, z, 宽, 深, 角度, 高）<\/td>\n<td>同样用最小外接旋转矩形，再按面积比例缩小，保证体量不虚胖；每栋压到 14 字节（uint16 量化），整个文件 5.6 MB<\/td>\n<\/tr>\n<tr>\n<td>高度大量缺失，需要估算<\/td>\n<td>README：“Heights may be estimates”<\/td>\n<td>有高度或层数的只占 17%。其余按面积、长宽比和所在用地估算：住宅用地里的细长板楼判为 12–24 层公寓，商业区的大体量抬高，学校、工厂压低<\/td>\n<\/tr>\n<tr>\n<td>垂直夸张<\/td>\n<td>README：“exaggerated 4 times”<\/td>\n<td>试过 3 倍，江南变成曼哈顿式的针林，最后定为地形 2.2 倍、建筑 2.0 倍<\/td>\n<\/tr>\n<tr>\n<td>地形来自 AWS Terrain Tiles<\/td>\n<td>README 原文<\/td>\n<td>同一数据源：48 块 z12 Terrarium 瓦片，重采样成 728×626 的网格<\/td>\n<\/tr>\n<tr>\n<td>汉江需要专门处理，水面和地形会互相穿插<\/td>\n<td>README 的版本记录里有大量“汝矣岛水面露出”“下游河道被底座盖住”之类的修补<\/td>\n<td>这是我认为最关键的线索。我没有另铺一张平面水面，而是<strong>把水画进地形着色器<\/strong>：用 4096 px 的水域掩码逐像素判断水面，岸线精度约 10 m；同时把地形网格压到水位以下。支流会跟着真实海拔走，不会被一张平面水面吞掉<\/td>\n<\/tr>\n<tr>\n<td>14～21 个地标、自动飞行、区选择<\/td>\n<td>推文与 README<\/td>\n<td>22 个地标，全部配中文卡片和巡游镜头；可悬停、点选 25 个区<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>实现思路与关键技术决策（为什么这么选）<\/h2>\n<p><strong>数据管线（离线 Python，产物直接静态托管）<\/strong><\/p>\n<ul>\n<li>Overture 的 building / segment / water / land_use / land_cover / land / division_area 七个图层，加上 AWS 地形，统一投影到以市厅为原点的等距平面上（1 单位 = 1 km）。<\/li>\n<li>很多东西直接烘焙成纹理，没有做成几何体。4096×3524 的地面图里有土地覆盖、公园、次级道路、铁路，还有<strong>全部 60 万个建筑足迹的屋顶色块和一圈模糊的接触阴影<\/strong>。小于 60 ㎡、没有做成体块的小房子也画在地面上，所以老城区的肌理是完整的。<\/li>\n<li>另外烘焙了一张<strong>夜间灯光图<\/strong>：道路按等级发暖橙光，城区按建筑密度加一层泛光，首尔市界以外的区域调暗。夜景的“卫星城市灯火”效果基本来自这一张图，运行时几乎不花成本。<\/li>\n<li>主干道只有桥梁段做成几何体：桥面带、侧面灯带、水中桥墩。地面上的路已经在纹理里，再铺一层带状几何体只会和地形打架，产生 z-fighting。<\/li>\n<\/ul>\n<p><strong>渲染（three.js r170，无构建，importmap）<\/strong><\/p>\n<ul>\n<li>建筑按 12×10 个区块分成 InstancedMesh。每个区块内的建筑按“屏幕尺寸重要性”降序排列，每帧用二分查找算出这个距离下多大的楼还能占到 1.3 像素，只画排在前面的那些，也就是 <code>mesh.count<\/code> 截断。这样全景视角实际只画几万栋，拉近看才画全。视锥剔除和阴影剔除都按区块做。<\/li>\n<li>建筑着色器在片元里程序化生成窗格：层高、窗宽随建筑类型变化，每扇窗按哈希决定亮不亮。用 <code>fwidth<\/code> 判断窗格已经小于像素时，平滑过渡到平均亮度，避免远处闪烁。首尔屋顶常见的绿色防水漆、韩屋的深灰瓦屋顶、玻璃塔楼的顶冠灯带都写在这段着色器里。<\/li>\n<li>连续昼夜：用简化的天文公式按首尔纬度算太阳和月亮方位，天空、雾、半球光、水色都按太阳高度角在关键帧之间插值。亮灯比例跟钟点走，傍晚最多，深夜减少。<\/li>\n<li>阴影相机每帧跟着视点缩放（0.6–30 km），并按纹素对齐。这样拉近时阴影清晰，全景时仍然有山影和楼影。<\/li>\n<li>后期：Bloom，强度随夜色变化；移轴景深（Tilt-shift），强度随俯仰角自动变化，平视时强、俯视时弱，这是“微缩感”的来源；最后加轻微暗角和饱和度。<\/li>\n<\/ul>\n<p><strong>地标<\/strong>：22 处全部程序化建模。乐天世界塔用超椭圆截面的锥形放样，顶部是开放钢构；N 首尔塔夜里会循环变色；63 大厦是金色梯形；DDP 是挤出后倒圆角的曲面；崇礼门和兴仁之门有重檐门楼，兴仁之门另有瓮城。景福宫按真实宫墙范围布置光化门、兴礼门、勤政殿回廊、庆会楼池、香远亭和各个院落；韩式屋顶的四角都有起翘。<\/p>\n<p><strong>动态<\/strong>：14,000 个车流光点（右侧通行，白色是车头灯、红色是尾灯）；盘浦大桥的月光彩虹喷泉由 GPU 粒子实现，只在桥体跨水的那一段喷射；金浦机场有航班按真实跑道方向（约 136°）起降；超高层楼顶有闪烁的航空障碍灯；另有雨、雪粒子，以及季节带来的树色和地面色变化。<\/p>\n<h2>和「常规做法」相比，我做了哪些不一样的尝试<\/h2>\n<ol>\n<li><strong>水面并入地形着色器<\/strong>。常规做法是一张平面水面加地形，结果就是原作 README 里反复修补的那类问题。我让水“长”在地形上，岸线精度由纹理决定，与网格精度无关。<\/li>\n<li><strong>把屏幕尺寸 LOD 做进实例化<\/strong>。不用 THREE.LOD，而是靠排序加 <code>count<\/code> 截断，零额外 draw call。<\/li>\n<li><strong>夜景主要靠一张烘焙灯光图<\/strong>，而不是成千上万个点光源。水面用 mip 偏置采样灯光图，做出模糊的倒影。<\/li>\n<li><strong>移轴景深跟着俯仰角走<\/strong>：斜看时更像模型，正俯视时像地图。<\/li>\n<li><strong>信息层<\/strong>：可点击的小地图，上面画着视锥投影；鼠标悬停时显示区名、面积和海拔；区界做成会升起的半透明光幕；地名标签按优先级做碰撞避让。<\/li>\n<li><strong>自适应画质<\/strong>：帧率低时自动降像素比、提高 LOD 阈值。移动端另有底部抽屉式 UI。<\/li>\n<\/ol>\n<h2>踩过的坑与修正过程<\/h2>\n<ul>\n<li><strong>端口被占<\/strong>：本地 8765 端口上跑着别的项目，第一次截图连到了别的页面。只看到了它的标题，随即换成独占端口。<\/li>\n<li><strong>楼太高<\/strong>：第一版建筑 ×3、公寓判据过宽，旧城区冒出一片 200 米的“板楼”。改为只在住宅用地里判定公寓、收紧面积阈值，并把夸张系数降到 2。<\/li>\n<li><strong>夜景过曝<\/strong>：第一版夜景全屏泛金，近景地面糊成黄色。加了指数压缩、随相机距离衰减的地面辉光，并调高 Bloom 阈值。<\/li>\n<li><strong>夜里楼身发灰白<\/strong>：我一度以为是月光，逐个关掉光源排查后发现，截图会滞后一帧，干扰了判断。真正的原因是窗格在半像素尺度上混叠。把 LOD 过渡提前，并把平均亮度改成暖色低值后解决。<\/li>\n<li><strong>道路越界<\/strong>：Overture 取数范围比沙盘大，桥和车流悬在沙盘外面的虚空里。在构建时按沙盘范围裁剪折线。<\/li>\n<li><strong>天空断层<\/strong>：地平线辉光用了 <code>step()<\/code>，远景中出现一条硬边，改成对称的指数衰减。<\/li>\n<li><strong>魔幻岛放错位置<\/strong>：按记忆的坐标，城堡落在了室内乐园旁边。改用 Overture 的 theme_park 多边形重新定位到石村湖的岛上。<\/li>\n<li><strong>小地图整块变蓝<\/strong>：水域 PNG 是灰度图，没有 alpha 通道，<code>source-in<\/code> 失效。改为逐像素把亮度转成 alpha。<\/li>\n<li><strong>手机端面板默认展开<\/strong>：ID 选择器的优先级盖过了 <code>.sheet { display: none }<\/code>。<\/li>\n<\/ul>\n<h2>自评：和原作相比，哪里可能追平或超越，哪里还差<\/h2>\n<p><strong>可能追平或超越<\/strong>\n- 数据量级相当：约 40 万栋建筑，原作约 28 万；另有 7 万棵树和完整的地面肌理。\n- 夜景更有层次：烘焙灯光图、逐窗亮灯、水面倒影、桥梁灯带、喷泉、航空灯。\n- 昼夜是连续的，可以拖动或让时间流动，而不只是三档。\n- 景福宫做到了院落级别，DDP、乐天世界塔、63 大厦都有辨识度。\n- 交互信息层更完整：小地图视锥、区域悬停、标签避让、手机端适配。<\/p>\n<p><strong>还差<\/strong>\n- 地铁线路、登山步道、酒店、文化遗产这些原作 v1.9 的专题图层没有做：Overture 的地铁数据缺少线路编号，无法可靠着色。\n- 建筑高度有 83% 是估算的，个别街区的天际线不够准确。\n- 体块仍然是旋转矩形，复杂平面（L 形、弧形）的建筑会失真。\n- 数据总量约 18 MB，首次加载比理想的更重。\n- 无头 SwiftShader 下只能静态验证，真机 GPU 上的帧率我没有亲测，只做了自适应兜底。<\/p>\n<h2>如果重来一次会怎么做<\/h2>\n<ul>\n<li>数据管线一开始就用瓦片化的二进制，按视野流式加载，而不是一次性加载全部 40 万栋。<\/li>\n<li>高度估算改用有标注的 7 万栋建筑训练一个小回归模型（面积、长宽比、用地、到地铁站距离 → 高度），取代手写规则。<\/li>\n<li>大型建筑用真实足迹挤出，小建筑保留实例化体块，两者混合。<\/li>\n<li>夜景加一层屏幕空间的水面反射（SSR 或平面反射，只取汉江范围），让大桥和两岸灯火的倒影更真实。<\/li>\n<li>更早搭好“确定性截图”工具：逐帧手动渲染，而不是依赖 requestAnimationFrame，这样能省下大量排查截图滞后的时间。<\/li>\n<\/ul>\n<h2>模型标识<\/h2>\n<p>claude-opus-5-5<\/p>", "notes_en": "<h1>Seoul 3D Atlas: Independent Reverse-Engineering Notes<\/h1>\n<h2>How I read the original (what it is really selling)<\/h2>\n<p>The original <strong>Seoul 3D Atlas<\/strong> (synabreu, GPT-6 Astra) turns all of Seoul into a sand-table model you can turn in your hands: 25 districts, real terrain, the Han River, two to three hundred thousand buildings, plus a camera that automatically flies past a dozen-odd landmarks, and three lighting moods — day, dusk and night. It drew 300,000 views on X on the strength of three things:<\/p>\n<ol>\n<li><strong>Realism at scale<\/strong>: what you see when the page opens is Seoul itself, not some \"stylized city\" thrown together. The bends of the Han, Yeouido, Namsan and Bukhansan are all where they should be.<\/li>\n<li><strong>The feel of a miniature<\/strong>: vertically exaggerated terrain and buildings, plus a model base, make you feel you're looking down at a tabletop model rather than using GIS software.<\/li>\n<li><strong>It tells its own story<\/strong>: press \"Fly-through\" and the camera introduces the city stop by stop. The day/night switch gives the same city two personalities.<\/li>\n<\/ol>\n<p>I set the recreation goal as <strong>the heft of real data + the texture of a sand table + the narrative of a guided tour<\/strong>. Lose any one of them and the piece falls back to an ordinary three.js city demo.<\/p>\n<h2>Reverse inference: which key mechanisms I deduced from limited material, and why<\/h2>\n<p>I couldn't see any earlier copy, and I couldn't open the original demo (chatgpt.site was blocked). All I had were the tweet summaries, community write-ups and the README of the original's public GitHub repository. I read only the README's prose; I did not look at its source or scripts.<\/p>\n<table>\n<thead>\n<tr>\n<th>Inference<\/th>\n<th>Evidence<\/th>\n<th>What I did<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Buildings come from OSM footprints, roughly 280,000 of them<\/td>\n<td>README: \"285,841 buildings from OpenStreetMap\", \"simplified oriented masses\"<\/td>\n<td>OSM tile sources were blocked, so I pulled from <strong>Overture Maps<\/strong> instead (GeoParquet on S3; most features derive from OSM). Using the row groups' bbox statistics I did HTTP Range reads and downloaded only data within Seoul: 607,000 raw footprints, <strong>399,770 buildings<\/strong> kept after filtering<\/td>\n<\/tr>\n<tr>\n<td>Buildings are \"oriented masses,\" not real extruded polygons<\/td>\n<td>README: 6 floats per building (x, z, width, depth, angle, height)<\/td>\n<td>Likewise a minimum-area rotated rectangle, then shrunk by area ratio so the massing doesn't bloat; each building packed into 14 bytes (uint16 quantization), 5.6 MB for the whole file<\/td>\n<\/tr>\n<tr>\n<td>Heights are mostly missing and must be estimated<\/td>\n<td>README: \"Heights may be estimates\"<\/td>\n<td>Only 17% have a height or floor count. The rest are estimated from area, aspect ratio and land use: long slab blocks on residential land are judged to be 12–24-storey apartments, big masses in commercial areas are raised, schools and factories kept low<\/td>\n<\/tr>\n<tr>\n<td>Vertical exaggeration<\/td>\n<td>README: \"exaggerated 4 times\"<\/td>\n<td>I tried 3×, and Gangnam turned into a Manhattan-style forest of needles; I settled on 2.2× for terrain and 2.0× for buildings<\/td>\n<\/tr>\n<tr>\n<td>Terrain from AWS Terrain Tiles<\/td>\n<td>The README itself<\/td>\n<td>Same source: 48 z12 Terrarium tiles, resampled into a 728×626 grid<\/td>\n<\/tr>\n<tr>\n<td>The Han River needs special handling; water and terrain poke through each other<\/td>\n<td>The README's changelog is full of fixes like \"water showing through on Yeouido\" and \"downstream channel covered by the base\"<\/td>\n<td>This was the clue I considered most important. Instead of laying a separate flat water plane, I <strong>paint the water into the terrain shader<\/strong>: a 4096 px water mask decides water per pixel, giving shorelines accurate to about 10 m, while the terrain mesh is pushed below water level there. Tributaries follow their real elevation instead of being swallowed by a flat plane<\/td>\n<\/tr>\n<tr>\n<td>14–21 landmarks, auto flight, district selection<\/td>\n<td>Tweets and README<\/td>\n<td>22 landmarks, each with a Chinese info card and a tour shot; all 25 districts can be hovered and selected<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Implementation approach and key technical decisions (and why)<\/h2>\n<p><strong>Data pipeline (offline Python; outputs are statically hosted as-is)<\/strong><\/p>\n<ul>\n<li>Seven Overture layers — building / segment / water / land_use / land_cover / land / division_area — plus AWS terrain, all projected onto an equidistant plane centred on City Hall (1 unit = 1 km).<\/li>\n<li>A lot is baked into textures rather than built as geometry. The 4096×3524 ground map holds land cover, parks, minor roads and railways, plus <strong>roof-colour patches and a soft ring of contact shadow for all 600,000 building footprints<\/strong>. Small houses under 60 m² that aren't built as masses are painted on the ground too, so the grain of the old city is complete.<\/li>\n<li>I also baked a <strong>night-lights map<\/strong>: roads glow warm orange by class, urban areas get a haze by building density, and everything outside the Seoul city limits is dimmed. The \"satellite view of city lights\" at night comes almost entirely from this one map and costs next to nothing at runtime.<\/li>\n<li>Only the bridge sections of the main roads are geometry: deck strips, side light strips and piers in the water. Ground-level roads are already in the texture; laying ribbon geometry on top would just fight the terrain and cause z-fighting.<\/li>\n<\/ul>\n<p><strong>Rendering (three.js r170, no build, import map)<\/strong><\/p>\n<ul>\n<li>Buildings are split into InstancedMeshes over 12×10 blocks. Within each block, buildings are sorted in descending order of \"screen-size importance,\" and every frame a binary search finds how big a building must be to still cover 1.3 pixels at this distance; only the ones ahead of that are drawn — i.e. <code>mesh.count<\/code> truncation. So the overview only draws a few tens of thousands of buildings, and all of them appear only when you zoom in. Frustum culling and shadow culling are per block.<\/li>\n<li>The building shader generates window grids procedurally in the fragment stage: storey height and window width vary by building type, and a hash decides whether each window is lit. When <code>fwidth<\/code> shows a window cell is smaller than a pixel, it fades smoothly to the average brightness to avoid distant shimmer. The green waterproof paint common on Seoul rooftops, the dark-grey tile roofs of hanok, and the crown light bands of glass towers are all in that shader.<\/li>\n<li>Continuous day and night: a simplified astronomical formula gives the sun and moon positions at Seoul's latitude, and the sky, fog, hemisphere light and water colour interpolate between keyframes by solar elevation. The share of lit windows follows the clock — highest in the evening, lower late at night.<\/li>\n<li>The shadow camera rescales with the viewpoint every frame (0.6–30 km) and is texel-snapped, so shadows are crisp up close and the overview still has mountain and building shadows.<\/li>\n<li>Post: bloom whose strength follows the darkness; tilt-shift depth of field whose strength varies automatically with pitch — strong when looking across, weak when looking straight down — which is where the \"miniature\" feel comes from; and finally a light vignette and saturation.<\/li>\n<\/ul>\n<p><strong>Landmarks<\/strong>: all 22 are modelled procedurally. Lotte World Tower is a tapered loft of superellipse sections with open steelwork at the top; N Seoul Tower cycles through colours at night; the 63 Building is a golden trapezoid; DDP is an extruded surface with rounded fillets; Sungnyemun and Heunginjimun have double-eaved gate pavilions, and Heunginjimun also has its semicircular enceinte. Gyeongbokgung follows the real palace walls, laying out Gwanghwamun, Heungnyemun, the Geunjeongjeon cloister, the Gyeonghoeru pond, Hyangwonjeong and the various courtyards; the Korean roofs have upturned corners.<\/p>\n<p><strong>Motion<\/strong>: 14,000 points of traffic light (right-hand traffic; white headlights, red taillights); the Banpo Bridge Moonlight Rainbow Fountain is GPU particles that spray only along the section of the bridge over water; flights take off and land at Gimpo Airport along the real runway heading (about 136°); aviation warning lights blink on supertall rooftops; plus rain and snow particles, and seasonal changes in tree and ground colour.<\/p>\n<h2>What I tried differently from the \"usual approach\"<\/h2>\n<ol>\n<li><strong>Water folded into the terrain shader.<\/strong> The usual approach is a flat water plane plus terrain, which produces exactly the kind of problems the original's README keeps patching. I let the water \"grow\" on the terrain, with shoreline accuracy set by the texture, independent of mesh resolution.<\/li>\n<li><strong>Screen-size LOD built into instancing.<\/strong> Not THREE.LOD, but sorting plus <code>count<\/code> truncation — zero extra draw calls.<\/li>\n<li><strong>The night view relies mainly on one baked light map<\/strong>, rather than thousands of point lights. The water samples the light map with a mip bias for blurry reflections.<\/li>\n<li><strong>Tilt-shift that follows pitch<\/strong>: at an angle it looks more like a model; straight down it looks like a map.<\/li>\n<li><strong>An information layer<\/strong>: a clickable minimap showing the projected view frustum; hovering shows the district name, area and elevation; district boundaries become rising translucent light curtains; place labels avoid collisions by priority.<\/li>\n<li><strong>Adaptive quality<\/strong>: when the frame rate drops, pixel ratio is lowered and the LOD threshold raised automatically. Mobile gets its own bottom-drawer UI.<\/li>\n<\/ol>\n<h2>Pitfalls and how I fixed them<\/h2>\n<ul>\n<li><strong>Port already taken<\/strong>: another project was running on local port 8765, and my first screenshot hit someone else's page. I saw only its title and immediately switched to a port of my own.<\/li>\n<li><strong>Buildings too tall<\/strong>: the first version used 3× for buildings with too loose an apartment criterion, so a field of 200 m \"slab blocks\" sprang up in the old city. I now classify apartments only on residential land, tightened the area threshold, and lowered the exaggeration to 2.<\/li>\n<li><strong>Overexposed night view<\/strong>: the first night view was washed gold across the whole screen, with the near ground smeared yellow. I added exponential compression and ground glow that falls off with camera distance, and raised the bloom threshold.<\/li>\n<li><strong>Buildings looking grey-white at night<\/strong>: for a while I thought it was moonlight. Turning off light sources one by one, I found screenshots lagged by a frame, which had muddied my diagnosis. The real cause was window cells aliasing at sub-pixel scale. Moving the LOD transition earlier and making the average brightness a warm, low value fixed it.<\/li>\n<li><strong>Roads out of bounds<\/strong>: Overture's fetch extent was larger than the model, so bridges and traffic hung in the void beyond the base. Polylines are now clipped to the model's extent at build time.<\/li>\n<li><strong>A seam in the sky<\/strong>: the horizon glow used <code>step()<\/code>, leaving a hard edge in the distance; replaced with a symmetric exponential falloff.<\/li>\n<li><strong>Magic Island in the wrong place<\/strong>: using coordinates from memory, the castle landed next to the indoor park. I relocated it to the island in Seokchon Lake using Overture's theme_park polygon.<\/li>\n<li><strong>The minimap turned solid blue<\/strong>: the water PNG was greyscale with no alpha channel, so <code>source-in<\/code> failed. I now convert luminance to alpha per pixel.<\/li>\n<li><strong>The mobile panel opened by default<\/strong>: an ID selector's specificity overrode <code>.sheet { display: none }<\/code>.<\/li>\n<\/ul>\n<h2>Self-assessment: where it may match or beat the original, and where it falls short<\/h2>\n<p><strong>Where it may match or beat the original<\/strong>\n- Comparable data scale: about 400,000 buildings versus the original's roughly 280,000, plus 70,000 trees and complete ground texture.\n- A more layered night view: the baked light map, per-window lighting, reflections on the water, bridge light strips, the fountain, aviation lights.\n- Day and night are continuous — you can drag the time or let it flow — rather than just three settings.\n- Gyeongbokgung is modelled down to the courtyards, and DDP, Lotte World Tower and the 63 Building are all recognizable.\n- A fuller interactive information layer: minimap frustum, district hover, label collision avoidance, mobile layout.<\/p>\n<p><strong>Where it falls short<\/strong>\n- The thematic layers from the original's v1.9 — subway lines, hiking trails, hotels, cultural heritage — aren't there: Overture's subway data lacks line numbers, so they can't be coloured reliably.\n- 83% of building heights are estimates, so the skyline of some blocks isn't accurate.\n- The masses are still rotated rectangles, so buildings with complex plans (L-shaped, curved) are distorted.\n- Total data is about 18 MB, a heavier first load than ideal.\n- Under headless SwiftShader I could only verify static frames; I didn't measure frame rates on a real GPU, only built in an adaptive fallback.<\/p>\n<h2>What I'd do if I started over<\/h2>\n<ul>\n<li>Use tiled binaries in the data pipeline from the start, streamed by view, instead of loading all 400,000 buildings at once.<\/li>\n<li>Estimate heights with a small regression model trained on the 70,000 labelled buildings (area, aspect ratio, land use, distance to a subway station → height) instead of hand-written rules.<\/li>\n<li>Mix the two approaches: real extruded footprints for large buildings, instanced masses for small ones.<\/li>\n<li>Add screen-space water reflections at night (SSR or a planar reflection limited to the Han), so the reflections of the bridges and the lights on both banks look more real.<\/li>\n<li>Build a \"deterministic screenshot\" tool earlier — rendering frames manually instead of relying on requestAnimationFrame — which would have saved a lot of time chasing lagging screenshots.<\/li>\n<\/ul>\n<h2>Model identifier<\/h2>\n<p>claude-opus-5-5<\/p>", "prompt": "# 一次性生成 Prompt\n\n> 你是一名兼做 GIS 数据工程与实时图形的前端工程师。请做一个名为 **「首尔 3D 地图集」** 的网页：一块可以旋转、缩放的首尔微缩沙盘。数据要真实，观感要像桌面模型，还要带地标飞越导览和连续的昼夜光照。交付物是一个无需构建、可直接静态托管的目录。\n\n## 一、交付与约束\n- 目录结构：`index.html`、`css/style.css`、`js/{main,geo,landmarks}.js`、`data/*`、`vendor/three/*`。\n- 只用相对路径，禁止 CDN。three.js r170 通过 `npm pack three@0.170.0` 拿到，拷入 `vendor/three/`（`three.module.min.js`，以及 addons 里的 OrbitControls、EffectComposer、RenderPass、ShaderPass、UnrealBloomPass、OutputPass 及其依赖），用 importmap 映射 `three` 和 `three/addons/`。\n- 界面全部用中文，地名附韩文。页面顶部有一条 36px 的细顶栏：左边 `← 三方对照`，中间作品名加小标签，右边链接原作。\n- 手机 390px 宽时不能横向溢出，面板改为底部抽屉。\n\n## 二、离线数据管线（Python：pyarrow、shapely、numpy、Pillow、scipy）\n1. **范围与投影**：以首尔市厅（126.978E, 37.5665N）为原点做等距投影，1 单位 = 1 km，x 向东、z 向南。沙盘范围 x∈[-21.8, 21.8]、z∈[-18.6, 18.9]。\n2. **取数**：从 Overture Maps 在 S3 上的 GeoParquet（`overturemaps-us-west-2/release/<最新>/theme=*/type=*`）读取。先读每个文件的 footer，按 row group 的 bbox 统计筛选，再用 HTTP Range 只拉相交的 row group。需要的图层：buildings/building、transportation/segment（含 road_flags 里的 is_bridge / is_tunnel 区间）、base/water、base/land_use、base/land_cover、base/land、divisions/division_area（取首尔 25 个 county）。\n3. **地形**：AWS Terrain Tiles 的 Terrarium z12 瓦片，重采样成 728×626 的网格（int16，单位 0.1 m）。在水域掩码内把地形压到水位（3 m）以下，陆地不低于 5.5 m；大面积的汉江压平，支流按邻域最低点下挖。\n4. **建筑**：丢弃面积小于 60 ㎡ 和地下建筑，以及落在水里、地标保留区内的建筑。取最小外接旋转矩形，按面积比例缩小。高度优先用 height，其次用 num_floors×3.3+2；都缺失时按规则估算：住宅用地内、长宽比 ≥1.9、短边 9–24 m 的板楼判为公寓，高 36–70 m；小房子 5–9 m；商业大体量 18–42 m；学校和工厂压低。类型编码为：独栋、中层、公寓、玻璃塔、工业、公共、韩屋（宫阙周边）；最高位标记“首尔市界外”。每栋存 14 字节：x、z 各 uint16 量化，宽、深、高、基底高程各 uint16（单位 0.1 m），角度 uint8，类型 uint8。整体按体量降序排列。\n5. **烘焙纹理（4096×3524）**：\n   - `ground.jpg`：土地覆盖与用地配色，市界外降低饱和度；次级道路与铁路画成细线；全部建筑足迹画成屋顶色块并加一圈模糊接触阴影；水面填河床色。\n   - `night.jpg`：道路按等级画成暖橙色光线，叠加模糊泛光，再按建筑密度加辉光；市界外调暗，水面为黑。\n   - `water.png`（水域掩码，轻微模糊）；`mask.png`（R 为水、G 为绿地、B 为首尔市界内）。\n6. **meta.json**：主干道（高速、快速路、主干、次干）每 40 m 加密一次的折线，每个点带标记（0 普通、1 桥、2 隧道），并按沙盘范围裁剪；25 个区的多边形（简化到 25 m），附代表点与面积；首尔市界。\n7. **trees.bin**：在森林、公园、墓地、高尔夫等掩码内按概率撒 7 万棵树，每棵存 x、z、尺寸、类型。\n\n## 三、渲染\n- **地形**：索引网格，法线用中心差分计算。使用 MeshStandardMaterial，通过 `onBeforeCompile` 注入以下内容：\n  - 用 `water.png` 在像素级判定水面：水色随时间变化，粗糙度 0.16，法线加上三组正弦波纹（按 `fwidth` 在远处淡出），菲涅尔项反射天空色；\n  - 夜间自发光为 `pow(night.jpg, 2.3) × 夜色系数 × 随相机距离衰减的系数`；水面用 mip 偏置 5 采样灯光图，作为模糊倒影；\n  - 季节色乘在绿地掩码上；下雪时铺白，下雨时整体变暗、粗糙度降低。\n- **沙盘**：四边侧壁采样地形边缘，贴土层条纹纹理；底部是深色木质底座、黄铜饰条，南面有一块铭牌。\n- **建筑**：12×10 个区块，每块一个 InstancedMesh（去掉底面的单位盒，底边在 y=0），实例属性 `aInfo = (宽, 夸张后高度, 深, 类型)`。每块内部按 `max(宽, 深, 高×1.6)` 降序排序；每帧算出最小可见尺寸 `1.3px × 距离 / 焦距`，二分查找后设置 `mesh.count`。片元着色器：\n  - 按类型和哈希取墙色与屋顶色，屋顶约 40% 刷绿色防水漆；\n  - 按层高 × 窗宽划分窗格，并用 `fwidth` 抗锯齿；窗格小于像素时过渡到平均值；\n  - 墙体底部做 AO 压暗；\n  - 夜间窗格按哈希和亮灯率点亮，暖色与冷白色混合；远处降到 25% 并统一为暖色；玻璃塔顶部加灯带。\n- **桥梁**：只为桥段生成几何体。桥面高度取两端引桥高度插值、加一点拱度，并保证离水面有净空；侧面带夜间灯带；跨水段每 3 个点放一个桥墩。\n- **车流**：14,000 个 Points 沿主干道折线靠右行驶，时间做了缩放。白天为各色车身，夜间正向为白色车头灯、反向为红色尾灯（HDR 值，参与 Bloom）。\n- **天空**：天球着色器，按太阳高度角在 7 个关键帧之间插值；包含太阳盘与光晕、地平线辉光、星空（哈希加闪烁）和月亮。\n- **光照**：太阳方向用首尔纬度与赤纬的公式计算；太阳高度低于 -2° 时主光切换为月光。阴影相机每帧跟随视点，半径 = 相机距离 × 0.75，并按纹素对齐。\n- **后期**：HalfFloat + 4×MSAA 的 RenderTarget → UnrealBloom（夜间增强）→ 两遍可分离的移轴模糊（强度随俯仰角变化）→ 暗角与饱和度 → OutputPass（ACES）。\n- **自适应画质**：帧率低于 28 时降低像素比、提高 LOD 阈值，高于 55 时回升。\n\n## 四、地标（22 处，程序化建模，给出真实经纬度）\n北汉山白云台、景福宫、昌德宫、光化门广场、清溪川、崇礼门、首尔站、N 首尔塔、兴仁之门、DDP、首尔林、乐天世界塔、乐天世界魔幻岛（石村湖岛上）、奥林匹克公园和平之门、蚕室奥林匹克主体育场、COEX、江南站、盘浦大桥月光彩虹喷泉、龙山、汝矣岛 63 大厦、首尔世界杯体育场、金浦机场。\n\n建模要点：\n- 乐天世界塔：超椭圆截面锥形放样，顶部是开放钢构冠顶。\n- N 首尔塔：落在南山山顶，塔身夜间循环变色。\n- 63 大厦：金色梯形挤出。\n- DDP：曲线轮廓挤出并大倒角，表面有 LED 点阵。\n- 城门：石台加拱门，上面是重檐门楼；兴仁之门另加半圆瓮城。\n- 景福宫：宫墙、光化门、兴礼门、勤政殿（重檐加回廊）、思政殿等殿阁、庆会楼与池、香远亭、若干院落。韩式屋顶用 10 个三角面拼出四角起翘。\n- 两座体育场用 Lathe 旋转体。\n- 喷泉：只在桥体跨水段沿两侧布置喷嘴，GPU 粒子做抛物线，夜间呈彩虹色，叠加混合。\n- 金浦：3 架飞机沿 136° 跑道方向循环进近和起飞，夜间有航行灯。\n- 超高层楼顶有闪烁的红色航空障碍灯。\n\n每个地标配一张卡片：中文名、韩文与英文名、一段说明、三项数据、坐标，以及巡游镜头参数（距离、俯角、方位）。\n\n## 五、交互与 UI\n- **OrbitControls**：拖动旋转，右键或双指平移，滚轮缩放并朝向光标，俯角上限 82°。键盘支持方向键平移、+/- 缩放、H 回全景、T 开始巡游、N 切换昼夜。\n- **飞行**：目标点、方位、俯角做插值；距离在对数空间插值，中途按行程抬高形成弧线；缓动用三次 ease。\n- **巡游**：依次飞过 22 站，每站停留 7.5 秒并缓慢环绕，同步更新卡片和进度条；任何手动操作都会暂停巡游。\n- **标签**：地标标签为编号胶囊、引线和圆点，可点击；区名、山峰、桥梁、河流标签按距离淡入淡出；地标标签按优先级做屏幕空间碰撞避让。\n- **面板**：左侧是品牌、统计和地标列表；右侧是时间（滑杆、流动按钮、清晨/正午/黄昏/夜晚预设）、季节、天气和图层开关（区界、地名、车流、树木、建筑、移轴）；左下是可点击的小地图，显示视锥投影、当前区名和坐标；底部 dock 有全景、巡游、指北。\n- **区域**：鼠标悬停时显示区名、面积和海拔（通过高度场步进拾取），区界光幕随之升高；点击区域飞过去。\n- **载入**：载入页显示进度条；开场从高空俯冲到全景。默认时间 17:15，季节为秋。\n- **视觉风格**：深色半透明磨砂面板，金橙色主色（#f2b35e），青色辅色（#74c7cf），不使用网络字体。", "prompt_en": "# The One-Shot Generation Prompt\n\n> You are a front-end engineer who does both GIS data engineering and real-time graphics. Build a web page called **\"首尔 3D 地图集\" (Seoul 3D Atlas)**: a miniature sand-table model of Seoul that can be rotated and zoomed. The data must be real, it should look like a tabletop model, and it should include a guided landmark fly-through and continuous day/night lighting. The deliverable is a directory that needs no build and can be statically hosted as-is.\n\n## 1. Deliverables and constraints\n- Directory structure: `index.html`, `css/style.css`, `js/{main,geo,landmarks}.js`, `data/*`, `vendor/three/*`.\n- Relative paths only; no CDN. Get three.js r170 via `npm pack three@0.170.0` and copy it into `vendor/three/` (`three.module.min.js`, plus OrbitControls, EffectComposer, RenderPass, ShaderPass, UnrealBloomPass, OutputPass and their dependencies from addons), mapping `three` and `three/addons/` with an import map.\n- All UI in Chinese, with Korean alongside place names. A thin 36 px top bar at the top of the page: `← 三方对照` (back to the three-way comparison) on the left, the work's name plus a small tag in the middle, a link to the original on the right.\n- No horizontal overflow at 390 px phone width; panels become a bottom drawer.\n\n## 2. Offline data pipeline (Python: pyarrow, shapely, numpy, Pillow, scipy)\n1. **Extent and projection**: an equidistant projection with Seoul City Hall (126.978E, 37.5665N) as the origin, 1 unit = 1 km, x east, z south. Model extent x∈[-21.8, 21.8], z∈[-18.6, 18.9].\n2. **Fetching**: read Overture Maps' GeoParquet on S3 (`overturemaps-us-west-2/release/<latest>/theme=*/type=*`). First read each file's footer, filter by the row groups' bbox statistics, then use HTTP Range requests to pull only the intersecting row groups. Layers needed: buildings/building, transportation/segment (including the is_bridge / is_tunnel ranges in road_flags), base/water, base/land_use, base/land_cover, base/land, divisions/division_area (taking Seoul's 25 counties).\n3. **Terrain**: AWS Terrain Tiles, Terrarium z12, resampled into a 728×626 grid (int16, in units of 0.1 m). Inside the water mask, push terrain below water level (3 m); keep land no lower than 5.5 m; flatten the broad Han River, and carve tributaries down to their neighbourhood minimum.\n4. **Buildings**: discard buildings under 60 m², underground buildings, and those in water or inside landmark reserves. Take the minimum-area rotated rectangle and shrink it by area ratio. For height, prefer `height`, then `num_floors×3.3+2`; when both are missing, estimate by rules: slab blocks on residential land with aspect ratio ≥1.9 and a short side of 9–24 m are apartments, 36–70 m tall; small houses 5–9 m; large commercial masses 18–42 m; schools and factories kept low. Type codes: detached, mid-rise, apartment, glass tower, industrial, public, hanok (around the palaces); the top bit marks \"outside the Seoul city limits.\" Store 14 bytes per building: x and z each quantized to uint16; width, depth, height and base elevation each uint16 (in 0.1 m); angle uint8; type uint8. Sort everything by volume, descending.\n5. **Baked textures (4096×3524)**:\n   - `ground.jpg`: land cover and land-use colours, desaturated outside the city limits; minor roads and railways as thin lines; all building footprints as roof-colour patches with a soft ring of contact shadow; water filled with riverbed colour.\n   - `night.jpg`: roads drawn as warm orange light lines by class, with a blurred glow on top, plus a glow by building density; dimmed outside the city limits, black on water.\n   - `water.png` (water mask, slightly blurred); `mask.png` (R = water, G = green space, B = inside the Seoul city limits).\n6. **meta.json**: polylines for the main roads (motorways, expressways, arterials, collectors) densified every 40 m, each point flagged (0 normal, 1 bridge, 2 tunnel) and clipped to the model extent; polygons for the 25 districts (simplified to 25 m), with a representative point and area; the Seoul city limits.\n7. **trees.bin**: scatter 70,000 trees by probability inside the forest, park, cemetery, golf course and similar masks, storing x, z, size and type for each.\n\n## 3. Rendering\n- **Terrain**: an indexed mesh with normals from central differences. Use MeshStandardMaterial and inject the following via `onBeforeCompile`:\n  - Decide water per pixel from `water.png`: water colour varies over time, roughness 0.16, normals perturbed by three sets of sine ripples (faded out in the distance by `fwidth`), and a Fresnel term reflecting the sky colour;\n  - Night emission = `pow(night.jpg, 2.3) × night factor × a falloff with camera distance`; the water samples the light map with a mip bias of 5 as a blurry reflection;\n  - Seasonal colour multiplied onto the green-space mask; white cover when it snows; darker overall and lower roughness when it rains.\n- **Model base**: four side walls sample the terrain's edges with a soil-layer stripe texture; underneath, a dark wooden plinth with brass trim, and a nameplate on the south face.\n- **Buildings**: 12×10 blocks, one InstancedMesh each (a unit box with the bottom face removed, base at y=0), with the instance attribute `aInfo = (width, exaggerated height, depth, type)`. Within each block, sort descending by `max(width, depth, height×1.6)`; every frame compute the minimum visible size `1.3px × distance / focal length`, binary-search it, and set `mesh.count`. Fragment shader:\n  - Wall and roof colours by type and hash, with about 40% of roofs in green waterproof paint;\n  - Window cells divided by storey height × window width, antialiased with `fwidth`; fading to the average when a cell is smaller than a pixel;\n  - AO darkening at the base of the walls;\n  - At night, windows lit by hash and lit-ratio, mixing warm and cool white; in the distance, reduced to 25% and unified to warm; light bands on top of glass towers.\n- **Bridges**: generate geometry only for bridge segments. Deck height is interpolated between the approach heights at each end with a slight camber, ensuring clearance above the water; night light strips along the sides; a pier every 3 points over water.\n- **Traffic**: 14,000 Points driving on the right along the main-road polylines, with time scaled. By day, assorted body colours; at night, white headlights in one direction and red taillights in the other (HDR values that feed the bloom).\n- **Sky**: a sky-sphere shader interpolating between 7 keyframes by solar elevation, with a sun disc and halo, horizon glow, stars (hash + twinkle) and the moon.\n- **Lighting**: sun direction from a formula using Seoul's latitude and the solar declination; when the sun is below -2°, the key light switches to moonlight. The shadow camera follows the viewpoint every frame, with radius = camera distance × 0.75, texel-snapped.\n- **Post**: a HalfFloat + 4×MSAA RenderTarget → UnrealBloom (stronger at night) → two separable tilt-shift blur passes (strength varying with pitch) → vignette and saturation → OutputPass (ACES).\n- **Adaptive quality**: below 28 fps, lower the pixel ratio and raise the LOD threshold; above 55, bring them back up.\n\n## 4. Landmarks (22, modelled procedurally, with real coordinates)\nBaegundae on Bukhansan, Gyeongbokgung, Changdeokgung, Gwanghwamun Square, Cheonggyecheon, Sungnyemun, Seoul Station, N Seoul Tower, Heunginjimun, DDP, Seoul Forest, Lotte World Tower, Lotte World Magic Island (on the island in Seokchon Lake), the Olympic Park World Peace Gate, Jamsil Olympic Stadium, COEX, Gangnam Station, the Banpo Bridge Moonlight Rainbow Fountain, Yongsan, the 63 Building on Yeouido, Seoul World Cup Stadium, and Gimpo Airport.\n\nModelling notes:\n- Lotte World Tower: a tapered loft of superellipse sections, with an open steel crown at the top.\n- N Seoul Tower: on the summit of Namsan, with the tower cycling through colours at night.\n- 63 Building: a golden trapezoidal extrusion.\n- DDP: a curved profile extruded with large fillets, with an LED dot matrix on its surface.\n- City gates: a stone base with an arched gateway, topped by a double-eaved gate pavilion; Heunginjimun also gets its semicircular enceinte.\n- Gyeongbokgung: palace walls, Gwanghwamun, Heungnyemun, Geunjeongjeon (double eaves plus cloister), Sajeongjeon and other halls, Gyeonghoeru and its pond, Hyangwonjeong, and several courtyards. Korean roofs are built from 10 triangles to give the upturned corners.\n- The two stadiums are Lathe solids of revolution.\n- Fountain: nozzles placed along both sides only on the bridge section over water; GPU particles trace parabolas, rainbow-coloured at night, additively blended.\n- Gimpo: 3 aircraft cycling through approaches and take-offs along the 136° runway heading, with navigation lights at night.\n- Blinking red aviation warning lights on supertall rooftops.\n\nEach landmark gets a card: Chinese name, Korean and English names, a short description, three facts, coordinates, and tour-shot parameters (distance, pitch, heading).\n\n## 5. Interaction and UI\n- **OrbitControls**: drag to rotate, right-drag or two fingers to pan, scroll to zoom toward the cursor, pitch capped at 82°. Keyboard: arrow keys to pan, +/- to zoom, H back to overview, T to start the tour, N to toggle day/night.\n- **Flight**: interpolate target, heading and pitch; interpolate distance in log space, rising mid-flight in proportion to the distance travelled to form an arc; cubic easing.\n- **Tour**: fly through the 22 stops in order, pausing 7.5 seconds at each with a slow orbit, updating the card and progress bar in sync; any manual input pauses the tour.\n- **Labels**: landmark labels are numbered pills with a leader line and a dot, and are clickable; district, peak, bridge and river labels fade in and out with distance; landmark labels avoid collisions in screen space by priority.\n- **Panels**: on the left, the brand, stats and landmark list; on the right, time (slider, flow button, dawn/noon/dusk/night presets), season, weather and layer toggles (district boundaries, place names, traffic, trees, buildings, tilt-shift); bottom-left, a clickable minimap showing the projected frustum, current district name and coordinates; a bottom dock with Overview, Tour and North-up.\n- **Districts**: hovering shows the district name, area and elevation (picked by stepping through the heightfield), and the district's boundary curtain rises; clicking flies there.\n- **Loading**: a loading screen with a progress bar; the opening swoops down from high altitude to the overview. Default time 17:15, season autumn.\n- **Visual style**: dark translucent frosted panels, a gold-orange primary (#f2b35e) and a cyan secondary (#74c7cf), no web fonts.", "summary": "真实地理数据的首尔沙盘：约 40 万栋建筑（Overture / OSM）+ AWS 真实地形 + 25 个区，汉江画进地形着色器、岸线精度约 10 m；22 处地标巡游、昼夜连续变化，另有季节、雨雪、车流与盘浦大桥喷泉", "summary_en": "A sand-table model of Seoul built from real geodata: about 400,000 buildings (Overture / OSM) + real AWS terrain + 25 districts, with the Han River painted into the terrain shader at roughly 10 m shoreline accuracy; a 22-landmark tour and continuous day/night, plus seasons, rain and snow, traffic and the Banpo Bridge fountain", "caveat": "这一件 5.5 的起跑线比第一版高：它找到了原作的 GitHub 仓库并读了 README 的文字说明（包括原作用了多少栋 OSM 建筑、垂直夸张倍数、地形数据源、汉江水面反复穿插的修补记录），没有看原作源码。第一版只有一句话描述、城市是随机生成的方块。数据授权：OSM 派生数据按 ODbL 1.0 相同方式共享，说明见 data/DATA-LICENSE.md；约 83% 建筑高度为估算。心得里没有报告隔离泄漏。", "caveat_en": "Opus 5.5 started this one from a higher line than the first version: it found the original's GitHub repository and read the README's prose (including how many OSM buildings the original used, its vertical exaggeration, terrain source, and a changelog of repeated fixes to the Han River water poking through), but not the source. The first version had only a one-line description and a randomly generated city of blocks. Data licensing: OSM-derived data is shared alike under ODbL 1.0, see data/DATA-LICENSE.md; about 83% of building heights are estimates. Its notes report no isolation leaks."}, "van-gogh-town": {"notes": "<h1>走进梵高的小镇 · 独立逆向笔记<\/h1>\n<h2>我对原作的理解（它的核心卖点是什么）<\/h2>\n<p>Peter Gostev 用 GPT-6 Astra 做的 <em>Walk Through Van Gogh<\/em>，一句话概括是：把六幅梵高的画\"拼\"成一座可以走进去的小镇。我认为它真正打动人的有三层：<\/p>\n<ol>\n<li><strong>从\"看画\"到\"站在画家的位置\"<\/strong>。名画的构图原本只有一个视点，原作把它变成一个可以绕着走的空间：你可以走到咖啡座背后，或者从卧室门口退出去看黄房子的外墙。<\/li>\n<li><strong>一座镇，而不是一个画廊<\/strong>。六幅画不是挂在墙上的六个展厅，而是被缝成同一块地理：街道、广场、河岸、田野、山坡。作者后来又拿同一座镇做了射击游戏 <em>Gogh Strike<\/em>，这说明它有真正能走的街道和遮挡关系，不是几张画的布景拼贴。<\/li>\n<li><strong>\"painterly\"<\/strong>。3D 场景要看起来是用油画刀和鬃毛笔画出来的，而不是加了滤镜的低多边形。这是最难、也最决定成败的一点。<\/li>\n<\/ol>\n<h2>逆向推断：从有限资料里推出了哪些关键机制，依据是什么<\/h2>\n<p>能拿到的资料只有：标题、\"Six paintings reimagined as one walkable, painterly Three.js town\"、社区转述里点名的《星月夜》《卧室》《夜间露天咖啡座》，以及 <em>Gogh Strike<\/em>（\"12 名画家、两支队伍、在梵高小镇里对战\"）。x.com、surge 在当前网络里都访问不到，所以下面都是推断：<\/p>\n<ul>\n<li><strong>第一人称行走 + 碰撞<\/strong>：<em>Gogh Strike<\/em> 是 5v5 的 FPS，所以地图一定有可用的碰撞、街巷和掩体。我据此把小镇做成真实可走的街区：所有建筑都有碰撞，能从门进入卧室，河岸不能下水。<\/li>\n<li><strong>Three.js、单页、无构建<\/strong>：原帖说明是 Three.js，而且托管在 surge 上的静态页。<\/li>\n<li><strong>六幅画怎么选<\/strong>：已确认三幅（星月夜、卧室、咖啡座），另外三幅按\"能不能拼成同一座镇\"来选：<\/li>\n<li><strong>黄房子（街道）<\/strong>：卧室就在黄房子里。外景和室内正好可以用一扇门连起来，这是六幅里最自然的一对缝合点。<\/li>\n<li><strong>罗纳河上的星夜<\/strong>：真实的阿尔勒里，黄房子所在的拉马丁广场离罗纳河岸只有几分钟路。它给小镇一条\"水边\"，也带来《星夜》系列里第二片不同的夜空（有北斗七星，有煤气灯倒影）。<\/li>\n<li><strong>麦田群鸦<\/strong>：给小镇一个\"镇外\"，也是六幅里唯一一幅带动荡白天天空的画，和其余夜景形成对比。<\/li>\n<li>没选《奥维尔的教堂》和《向日葵》：教堂与《星月夜》里的尖塔功能重复，所以我把星月夜的尖塔放在主街尽头，兼作两幅画的地标；向日葵是静物，缝不进街道。<\/li>\n<li>其中四幅在阿尔勒（1888），《星月夜》在圣雷米、《麦田群鸦》在奥维尔。我把后两者放在镇外的山坡和田野，地理上说得通。<\/li>\n<li><strong>\"painterly\" 很可能不是贴图<\/strong>：如果只是给模型贴梵高笔触的贴图，走近以后会糊、会重复。我推测一个做得好的版本必须让笔触和光照绑定（光在笔触这个单位上被量化），天空要有沿涡流走向的笔触。这成了我的核心技术目标。<\/li>\n<\/ul>\n<h2>实现思路与关键技术决策（为什么这么选）<\/h2>\n<p><strong>技术栈<\/strong>：Three.js r186（从 npm 拉的 <code>three.module.js<\/code> 和 <code>three.core.js<\/code>，放在 <code>vendor/<\/code>），ES Module 加 importmap，不用构建。所有着色器都是手写的 <code>ShaderMaterial<\/code>，不用 three 自带的光照和材质。<\/p>\n<ol>\n<li><strong>逐像素的程序化笔触（核心）<\/strong>\n   每个表面按三平面投影切成网格，每格\"拥有\"一笔：随机位置、长度、角度、宽度沿长度收窄。片元着色器在两层交错的 3×3 格子里找出盖在这个像素上的最上层一笔，同时记下它下面的那一笔。\n   - <strong>光照在笔触中心计算，而不是在像素上计算<\/strong>。于是咖啡座灯光在石板路上的光斑、墙面上的明暗过渡，都被量化成一块块纯色的笔触。这正是油画的样子，也是和\"贴笔触贴图 + 平滑光照\"最大的区别。\n   - 每一笔都有隆起的高光、鬃毛纹和\"起笔厚、收笔薄\"的变化，所以看起来是厚涂颜料。\n   - 石板路用低长宽比、带深色轮廓的笔触，复现咖啡座画里那种一颗颗描了边的石子。<\/li>\n<li><strong>两级笔触 LOD<\/strong>\n   远处的细笔触会糊成噪点，所以在细笔触淡出的距离上，叠一层尺寸是 4 倍的粗笔触。结果是远处的屋顶、草地、山体也保持\"画出来\"的质感。道理就像画家画远景用的笔不比画近景细，笔触在画布上的大小大致不变。<\/li>\n<li><strong>天空：两步画法<\/strong>\n   - 先在一张 1024×512 的等距柱状图上算出天空的\"构思\"：颜色场（渐变、涡旋色带、星星的同心光环、月亮、麦田的白云）和方向场。方向场用倍角向量存储，这样轴向的笔触方向可以平滑混合，不会在相反方向处抵消。只有氛围参数变化时才重算。\n   - 然后在天球上铺笔触：按纬度分行，每行的格子数随 cos(纬度) 变化，所以不会在高处挤成一团；经度方向用取模让接缝自然闭合。每一笔的颜色取自颜色场的笔触中心，角度取自方向场，于是笔触会自己沿着涡旋和星星的光环转圈。<\/li>\n<li><strong>\"走进哪幅画，就变成哪幅画\"<\/strong>\n   每幅画有一个影响区。玩家位置决定一组氛围参数的混合权重：夜晚程度、天空两色、涡旋强度、星星、北斗、云、乱流、太阳方向和颜色、环境光、雾、路灯强度、底色。\n   - 所以从咖啡座走向黄房子，夜会慢慢褪成钴蓝色的白天；进入麦田，天空变暗，开始翻涌。\n   - 夜间的颜色经过一次\"没有黑色的夜\"变换：环境光下的颜色被推向蓝、紫、绿，灯光照到的部分保留暖色。这句话来自梵高信里对咖啡座的描述。<\/li>\n<li><strong>一次绘制的整座镇<\/strong>\n   所有静态建筑和道具（约 13.5 万顶点）合并进一个网格，地形另有两张网格（近处 1.5 米、远处 8 米网格）。调色板和笔触参数写在顶点属性里（3 个颜色、单元大小、长宽比、角度、抖动、自发光、流场、描边），所有建筑只需一次 draw call，地形也用同一个着色器。<\/li>\n<li><strong>植物、人物、灯晕都是\"笔触精灵\"<\/strong>\n   - 麦子、草、柏树、橄榄树都是实例化的笔触面片，按设备分档，桌面约 9.8 万个，软件渲染或手机约 4.9 万个。它们都是柱状公告板，带风摆。柏树按火焰形轮廓排布，笔触沿 S 形扭动。\n   - 人物是十几笔拼出的剪影，刻意不用几何小人。\n   - 灯晕是分段的同心弧笔触，内黄、外绿，也就是咖啡座那盏灯的画法。<\/li>\n<li><strong>罗纳河<\/strong>\n   水面同样用笔触铺，但每一笔的颜色由两部分组成：天空颜色场的反射，加上按\"方位角对齐\"算出的煤气灯倒影柱。倒影因此自然碎成横向的短笔，就是原画里那一列列黄橙色的短横。<\/li>\n<li><strong>后期<\/strong>\n   - 用深度的拉普拉斯和跳变画普鲁士蓝的轮廓线，线条经过噪声抖动，看起来是手画的。\n   - 另外有画布纹理、轻微的饱和度和对比度调整、暗角。<\/li>\n<li><strong>体验层<\/strong>\n   - 开场有\"小镇自己画出来\"的过程：先是米色画布，然后一笔一笔落下。\n   - 数字键 1–6 或底部色卡可以\"飞到画家的画架前\"：飞越屋顶，落地时对准原作的构图。\n   - 自动导览、F 键画框模式（按原作的真实宽高比加金框和铭牌）、带引文的博物馆标签、小地图、手机摇杆、WebAudio 合成的环境声（风、河水、蟋蟀、咖啡馆人声，都按区域混音）。\n   - 每个画家视点旁边都立着一个画架，画布上是那幅画的调色板。<\/li>\n<\/ol>\n<h2>和「常规做法」相比，我做了哪些不一样的尝试<\/h2>\n<ul>\n<li><strong>常规做法<\/strong>：普通 PBR 或卡通渲染，外加一个全屏的 Kuwahara 或油画滤镜，或者给模型贴一张笔触贴图。前者有明显的\"浴帘效应\"（笔触固定在屏幕上，镜头一动就在画面上滑）；后者走近了会糊、会重复，而且光照是平滑的。<\/li>\n<li><strong>我的做法<\/strong>：笔触固定在世界空间，逐像素程序化生成，并且\"一笔一个光照值\"。笔触不会在屏幕上滑动，走近也不糊，而灯光、日照、夜色都以笔触为单位落在画面上。<\/li>\n<li>天空不是贴一张《星月夜》的图，而是一个可以混合的\"涡旋和星星\"参数化系统。你在不同的画区里，看到的是同一片天空的不同画法。<\/li>\n<li>时间和天气跟着\"你在哪幅画里\"走，而不是全局统一。<\/li>\n<li>人物、植物、灯晕全部用笔触构成，没有一处写实几何裸露在画面里（除了家具这类本来就是块面的东西）。<\/li>\n<\/ul>\n<h2>踩过的坑与修正过程<\/h2>\n<ol>\n<li><strong>墙像砌石而不像笔触<\/strong>：第一版笔触之间的缝隙露出很深的底色，墙面看起来像鹅卵石墙。\n   - 我把底色提亮，笔触改得更长、更平行。\n   - 再在着色器里多记一层\"下面那一笔\"，让笔触的抗锯齿边缘混到下面的颜料，而不是混到深色的缝里。<\/li>\n<li><strong>夜里的暖色墙发棕<\/strong>：暖色墙面乘上蓝色环境光会变成脏棕色。\n   - 加了\"夜色调\"：只对环境光那部分做色相推移，偏向蓝紫；灯光照到的部分保持原色。改完以后街道右侧才有了原画那种蓝紫色的夜。<\/li>\n<li><strong>卧室天花板发黑<\/strong>：调了很久光照，最后用 <code>?nopost<\/code> 和 <code>?dbgedge<\/code> 两个调试开关做对照，发现光照没问题，是后期问题。\n   - 我给深度采样加了噪声抖动，而深度纹理是最近邻采样，于是拉普拉斯取到的是不对称的偏移，斜着看的平面被误判成边缘。\n   - 改成对齐到纹素中心，再单独抖动颜色采样，问题消失。<\/li>\n<li><strong>远处和掠射角的地面变成平涂<\/strong>：LOD 用的是两个方向导数里较大的那个，掠射角下，深度方向的压缩会把整片地面判成\"太远\"。\n   - 先改成两个方向导数的几何平均，再加上第二级粗笔触。远处从此也有笔触。<\/li>\n<li><strong>咖啡座不像咖啡座<\/strong>：第一版视点太远，雨篷的外沿背光发黑。\n   - 视点前移到露台起点，雨篷设成半自发光（在原画里它就是自己在发亮），灯改成更陡的衰减，免得街对面的墙也被照成橙色。<\/li>\n<li><strong>飞行是倒着飞的<\/strong>：偏航角直接从起点插值到终点，飞行时镜头朝后。\n   - 改成三段：先转向飞行方向，飞行途中看前方，最后再转到原作的构图。\n   - 高空时雾会冲淡画面，倒影柱也会变成巨大的光柱，所以按相机高度衰减了雾和倒影。<\/li>\n<li><strong>麦田的白云像月亮<\/strong>：各向同性的距离场会画出圆盘，改成横向拉长、再用 fbm 打散的形状。<\/li>\n<li><strong>斜笔触以一端为轴旋转<\/strong>：人物帽檐那种横放的笔触会伸向一侧。加了一个横向偏移，让它以中点为轴。<\/li>\n<li><strong>无头 SwiftShader 一帧 0.2–0.9 秒<\/strong>：截图用一个 <code>?frames=N<\/code> 参数让渲染循环停下，再截图，否则 Playwright 截图会超时。线上有自适应分辨率（帧时间超过 38ms 就降采样），不按这个帧率设计。<\/li>\n<\/ol>\n<h2>自评：和原作相比，哪里可能追平或超越，哪里还差<\/h2>\n<p><strong>可能追平或超越的地方<\/strong>\n- 笔触的\"真实感\"：世界空间、逐像素、光照量化到每一笔、两级 LOD。近看、远看、飞越都保持绘画感。这是我最有把握的一点。\n- 天空：一套参数化的涡旋和星空，在六个区域之间平滑变换，星星有同心光环，北斗七星只在罗纳河上空。\n- 叙事和\"画家视点\"：数字键飞到画架前，落地时对准原作构图；画框模式和带梵高原话的博物馆标签，让\"对照原画\"成了玩法的一部分。\n- 区域化的时间和天气，以及卧室到黄房子之间那扇真实可走的门。<\/p>\n<p><strong>还差的地方<\/strong>\n- 几何细节粗：建筑都是盒子加坡顶，家具也是块面，没有《卧室》里那种\"歪斜的透视\"。我只把一面墙做成了斜的。\n- 没有使用任何原画图像，所以构图只能\"神似\"，比例和位置与原作都有出入。星月夜的村庄偏大、偏近。\n- 性能：片元着色器很重（每像素 18 次候选笔触查找，加 3 次灯光循环）。低端核显需要靠自适应分辨率，画面会软一些。\n- 原作到底选了哪六幅、原作的笔触方案是什么，我都看不到，只能推断。<\/p>\n<h2>如果重来一次会怎么做<\/h2>\n<ul>\n<li>把笔触查找换成\"两遍法\"：先在低分辨率下给每个格子生成笔触列表（写进一张 Voronoi 式的 ID 纹理），再在全分辨率下只查 1–2 个候选。开销能降一个数量级，就可以把笔触层数加到 3–4 层。<\/li>\n<li>给每幅画单独做\"构图吸附\"：在画家视点附近，按原画的透视轻微扭曲相机，比如卧室的倾斜地板、咖啡座的高视平线，让对位视角更像原作。<\/li>\n<li>用 SDF 或程序化建模做更有机的屋顶、窗框和家具，让笔触能沿曲面的主方向走（现在是按三平面的主轴走）。<\/li>\n<li>让天空的涡旋缓慢地\"呼吸\"。目前为了避免笔触抖动，天空是静态的。可以用\"新旧两套笔触交叉淡入\"来实现流动。<\/li>\n<li>加入《星月夜》里的晨星，再加一列会冒烟、会从黄房子后的高架桥上开过去的火车。<\/li>\n<\/ul>\n<h2>模型标识<\/h2>\n<p>claude-opus-5-5<\/p>", "notes_en": "<h1>Walk Through Van Gogh's Town · Independent Reverse-Engineering Notes<\/h1>\n<h2>How I read the original (what it is really selling)<\/h2>\n<p>Peter Gostev's <em>Walk Through Van Gogh<\/em>, made with GPT-6 Astra, can be summed up in one sentence: six Van Gogh paintings \"stitched\" into a town you can walk into. I think what really moves people works on three levels:<\/p>\n<ol>\n<li><strong>From \"looking at a painting\" to \"standing where the painter stood.\"<\/strong> A famous painting's composition has only one viewpoint; the original turns it into a space you can walk around. You can step behind the café terrace, or back out of the bedroom door to look at the Yellow House's outside wall.<\/li>\n<li><strong>A town, not a gallery.<\/strong> The six paintings aren't six rooms with pictures on the walls; they're sewn into one geography — streets, a square, a riverbank, fields, a hillside. The author later used the same town for a shooter, <em>Gogh Strike<\/em>, which shows it has streets you can really walk and real occlusion, not a collage of painted backdrops.<\/li>\n<li><strong>\"Painterly.\"<\/strong> The 3D scene has to look as though it was made with a palette knife and bristle brushes, not low-poly with a filter on top. This is the hardest part, and the one that makes or breaks the piece.<\/li>\n<\/ol>\n<h2>Reverse inference: which key mechanisms I deduced from limited material, and why<\/h2>\n<p>All I had to go on: the title; \"Six paintings reimagined as one walkable, painterly Three.js town\"; <em>The Starry Night<\/em>, <em>The Bedroom<\/em> and <em>Café Terrace at Night<\/em>, named in community write-ups; and <em>Gogh Strike<\/em> (\"12 painters, two teams, fighting in Van Gogh's town\"). Neither x.com nor surge was reachable from my network, so everything below is inference:<\/p>\n<ul>\n<li><strong>First-person walking + collision<\/strong>: <em>Gogh Strike<\/em> is a 5v5 FPS, so the map must have working collision, streets, alleys and cover. On that basis I built the town as a genuinely walkable neighbourhood: every building has collision, you can enter the bedroom through a door, and you can't walk into the river from the bank.<\/li>\n<li><strong>Three.js, single page, no build<\/strong>: the post says Three.js, and it's a static page hosted on surge.<\/li>\n<li><strong>How the six paintings were chosen<\/strong>: three are confirmed (The Starry Night, The Bedroom, the café terrace); I chose the other three by asking \"can they be stitched into the same town?\":<\/li>\n<li><strong>The Yellow House (The Street)<\/strong>: the bedroom <em>is<\/em> in the Yellow House. Exterior and interior can be joined by a single door — the most natural seam of the six.<\/li>\n<li><strong>Starry Night Over the Rhône<\/strong>: in the real Arles, Place Lamartine, where the Yellow House stood, is only a few minutes' walk from the Rhône embankment. It gives the town a waterfront, and brings a second, different night sky from the \"starry night\" series (with the Big Dipper and gaslight reflections).<\/li>\n<li><strong>Wheatfield with Crows<\/strong>: it gives the town an \"outside of town,\" and it's the only one of the six with a turbulent daytime sky, contrasting with the night scenes.<\/li>\n<li>I didn't choose <em>The Church at Auvers<\/em> or <em>Sunflowers<\/em>: the church would duplicate the role of the steeple in <em>The Starry Night<\/em>, so I put the Starry Night steeple at the end of the main street as a landmark serving both; <em>Sunflowers<\/em> is a still life and can't be sewn into a street.<\/li>\n<li>Four of the paintings are from Arles (1888); <em>The Starry Night<\/em> is from Saint-Rémy and <em>Wheatfield with Crows<\/em> from Auvers. Putting those two on the hillside and fields outside town makes geographic sense.<\/li>\n<li><strong>\"Painterly\" probably isn't a texture<\/strong>: if you just put Van Gogh brushstroke textures on models, they blur and repeat as you get close. I reasoned that a good version must bind the strokes to the lighting (light quantized at the unit of the brushstroke), and the sky needs strokes that follow the direction of the swirls. That became my core technical goal.<\/li>\n<\/ul>\n<h2>Implementation approach and key technical decisions (and why)<\/h2>\n<p><strong>Stack<\/strong>: Three.js r186 (<code>three.module.js<\/code> and <code>three.core.js<\/code> pulled from npm into <code>vendor/<\/code>), ES modules plus an import map, no build. Every shader is a hand-written <code>ShaderMaterial<\/code>; none of three's built-in lighting or materials are used.<\/p>\n<ol>\n<li><strong>Per-pixel procedural brushstrokes (the core)<\/strong>\n   Every surface is diced into a grid by triplanar projection, and each cell \"owns\" one stroke: a random position, length and angle, with the width tapering along its length. The fragment shader searches two interleaved 3×3 grids for the topmost stroke covering the pixel, and also remembers the stroke beneath it.\n   - <strong>Lighting is computed at the centre of the stroke, not at the pixel.<\/strong> So the pool of light from the café lamp on the cobblestones, and the transition from light to shade on a wall, are quantized into blocks of solid-colour strokes. That's exactly how an oil painting looks, and it's the biggest difference from \"stroke texture + smooth lighting.\"\n   - Each stroke has a raised highlight, bristle marks and a \"thick at the start, thin at the end\" variation, so it reads as impasto.\n   - The cobblestones use low-aspect-ratio strokes with dark outlines, recreating the individually outlined stones of the café painting.<\/li>\n<li><strong>Two-level stroke LOD<\/strong>\n   Fine strokes turn into noise in the distance, so at the distance where they fade out, a layer of strokes four times larger is added on top. The result: distant roofs, grass and hills keep their \"painted\" feel. The logic is that a painter doesn't use a finer brush for the background than the foreground — a stroke stays roughly the same size on the canvas.<\/li>\n<li><strong>The sky: painted in two steps<\/strong>\n   - First, compute the sky's \"design\" on a 1024×512 equirectangular map: a colour field (gradients, swirling bands, concentric halos around stars, the moon, the white clouds over the wheatfield) and a direction field. The direction field is stored as double-angle vectors, so axial stroke directions blend smoothly instead of cancelling out when opposed. It's recomputed only when the atmosphere parameters change.\n   - Then lay strokes across the sky sphere: rows by latitude, with the number of cells per row varying with cos(latitude) so they don't bunch up overhead, and a modulo in longitude so the seam closes naturally. Each stroke takes its colour from the colour field at its centre and its angle from the direction field, so the strokes spiral on their own along the swirls and the halos around the stars.<\/li>\n<li><strong>\"Walk into a painting, and it becomes that painting\"<\/strong>\n   Each painting has a zone of influence. The player's position sets the blend weights for a set of atmosphere parameters: how much it's night, the two sky colours, swirl strength, stars, the Big Dipper, clouds, turbulence, sun direction and colour, ambient light, fog, street-lamp strength and ground colour.\n   - So as you walk from the café toward the Yellow House, night slowly fades into a cobalt-blue day; enter the wheatfield and the sky darkens and starts to churn.\n   - Night colours go through a \"night without black\" transform: colours under ambient light are pushed toward blue, violet and green, while the parts lit by lamps stay warm. The phrase comes from Van Gogh's letter describing the café terrace.<\/li>\n<li><strong>The whole town in one draw<\/strong>\n   All static buildings and props (about 135,000 vertices) are merged into one mesh, with two more meshes for the terrain (a 1.5 m grid near, an 8 m grid far). Palettes and stroke parameters are written into vertex attributes (3 colours, cell size, aspect ratio, angle, jitter, emission, flow field, outline), so every building takes a single draw call, and the terrain uses the same shader.<\/li>\n<li><strong>Plants, people and lamp halos are all \"brushstroke sprites\"<\/strong>\n   - Wheat, grass, cypresses and olive trees are instanced stroke quads, tiered by device: about 98,000 on desktop, about 49,000 under software rendering or on phones. They're cylindrical billboards that sway in the wind. Cypresses are arranged in a flame-shaped silhouette, with strokes writhing in an S-curve.\n   - People are silhouettes built from a dozen or so strokes — deliberately not little geometric figures.\n   - Lamp halos are segmented concentric arcs of strokes, yellow inside and green outside — the way the café lamp is painted.<\/li>\n<li><strong>The Rhône<\/strong>\n   The water is laid with strokes too, but each stroke's colour has two parts: the reflection from the sky colour field, plus gaslight reflection columns computed by \"azimuth alignment.\" So the reflections break naturally into short horizontal strokes — exactly the columns of short yellow-orange dashes in the original painting.<\/li>\n<li><strong>Post-processing<\/strong>\n   - Prussian-blue outlines drawn from the Laplacian and discontinuities of depth, with noise jitter on the lines so they look hand-drawn.\n   - Plus a canvas texture, slight saturation and contrast adjustments, and a vignette.<\/li>\n<li><strong>The experience layer<\/strong>\n   - An opening in which \"the town paints itself\": first a beige canvas, then the strokes land one by one.\n   - Number keys 1–6 or the colour swatches at the bottom \"fly you to the painter's easel\": you sweep over the rooftops and land lined up with the original's composition.\n   - An auto tour; a frame mode on F (a gold frame and nameplate at the painting's true aspect ratio); museum labels with quotations; a minimap; a mobile joystick; and ambient sound synthesized with WebAudio (wind, river, crickets, café chatter, all mixed by zone).\n   - An easel stands beside each painter's viewpoint, its canvas showing that painting's palette.<\/li>\n<\/ol>\n<h2>What I tried differently from the \"usual approach\"<\/h2>\n<ul>\n<li><strong>The usual approach<\/strong>: ordinary PBR or toon shading plus a full-screen Kuwahara or oil-paint filter, or a brushstroke texture on the models. The former suffers from an obvious \"shower-door effect\" (the strokes are stuck to the screen and slide across the image as the camera moves); the latter blurs and repeats up close, and the lighting is smooth.<\/li>\n<li><strong>My approach<\/strong>: strokes fixed in world space, generated procedurally per pixel, with \"one lighting value per stroke.\" They don't slide on the screen, don't blur up close, and lamplight, daylight and night all land on the image stroke by stroke.<\/li>\n<li>The sky isn't a picture of <em>The Starry Night<\/em>; it's a parametric \"swirls and stars\" system that can be blended. In different painting zones you're seeing different ways of painting the same sky.<\/li>\n<li>Time of day and weather follow \"which painting you're in,\" not a global setting.<\/li>\n<li>People, plants and lamp halos are all made of strokes; no realistic geometry is left bare anywhere in the frame (except things like furniture that are blocky to begin with).<\/li>\n<\/ul>\n<h2>Pitfalls and how I fixed them<\/h2>\n<ol>\n<li><strong>The walls looked like masonry, not brushstrokes<\/strong>: in the first version, the gaps between strokes exposed a very dark ground colour, so walls looked like cobblestone walls.\n   - I lightened the ground colour and made the strokes longer and more parallel.\n   - Then I had the shader track one more layer — \"the stroke underneath\" — so a stroke's antialiased edge blends into the paint below rather than into a dark gap.<\/li>\n<li><strong>Warm walls turned brown at night<\/strong>: a warm wall multiplied by blue ambient light becomes a muddy brown.\n   - I added a \"night grade\": a hue shift toward blue-violet applied only to the ambient part, while the lamp-lit part keeps its colour. Only after that did the right side of the street get the blue-violet night of the original painting.<\/li>\n<li><strong>The bedroom ceiling went black<\/strong>: I spent a long time adjusting the lighting before comparing with two debug switches, <code>?nopost<\/code> and <code>?dbgedge<\/code>, which showed the lighting was fine and the problem was in post.\n   - I had added noise jitter to the depth sampling, but the depth texture is nearest-neighbour sampled, so the Laplacian picked up asymmetric offsets and planes seen at an angle were misread as edges.\n   - Snapping to texel centres and jittering only the colour sampling made the problem go away.<\/li>\n<li><strong>Distant ground and grazing angles turned into flat colour<\/strong>: the LOD used the larger of the two directional derivatives, and at grazing angles the compression in depth made whole stretches of ground count as \"too far.\"\n   - I switched to the geometric mean of the two derivatives, then added the second level of coarse strokes. From then on the distance had brushstrokes too.<\/li>\n<li><strong>The café didn't look like the café<\/strong>: the first viewpoint was too far away, and the awning's outer edge was backlit and black.\n   - I moved the viewpoint forward to the edge of the terrace, made the awning semi-emissive (in the painting it does glow on its own), and gave the lamp a steeper falloff so the wall across the street isn't lit orange too.<\/li>\n<li><strong>Flights went backwards<\/strong>: yaw was interpolated straight from start to end, so the camera faced backwards while flying.\n   - I split it into three phases: turn toward the direction of flight, look ahead during the flight, then turn to the original's composition at the end.\n   - At altitude the fog washed out the picture and the reflection columns became giant pillars of light, so fog and reflections are attenuated by camera height.<\/li>\n<li><strong>The white clouds over the wheatfield looked like moons<\/strong>: an isotropic distance field draws discs; I switched to shapes stretched horizontally and broken up with fbm.<\/li>\n<li><strong>Slanted strokes rotated around one end<\/strong>: horizontal strokes like a hat brim stuck out to one side. I added a lateral offset so they pivot around their midpoint.<\/li>\n<li><strong>Headless SwiftShader took 0.2–0.9 s per frame<\/strong>: for screenshots, a <code>?frames=N<\/code> parameter stops the render loop before capturing; otherwise Playwright's screenshots time out. The live site has adaptive resolution (downsampling when frame time exceeds 38 ms) and isn't designed around that frame rate.<\/li>\n<\/ol>\n<h2>Self-assessment: where it may match or beat the original, and where it falls short<\/h2>\n<p><strong>Where it may match or beat the original<\/strong>\n- The \"authenticity\" of the brushwork: world space, per pixel, lighting quantized per stroke, two-level LOD. It stays painterly up close, at a distance and in a fly-over. This is what I'm most confident about.\n- The sky: one parametric system of swirls and stars that transforms smoothly across the six zones, with concentric halos around the stars and the Big Dipper only above the Rhône.\n- Narrative and \"painter's viewpoints\": number keys fly you to the easel and land you lined up with the original's composition; the frame mode and museum labels with Van Gogh's own words make \"comparing with the original\" part of the play.\n- Zoned time and weather, and a real, walkable door between the bedroom and the Yellow House.<\/p>\n<p><strong>Where it falls short<\/strong>\n- Coarse geometric detail: buildings are all boxes with pitched roofs and the furniture is blocky, without the \"skewed perspective\" of <em>The Bedroom<\/em>. I made only one wall slanted.\n- No images of the original paintings were used, so the compositions only capture the spirit; proportions and positions differ from the originals. The Starry Night village is too big and too close.\n- Performance: the fragment shader is heavy (18 candidate stroke lookups per pixel, plus 3 light loops). Low-end integrated GPUs rely on adaptive resolution, which softens the image.\n- I can't see which six paintings the original actually chose, or how it does its brushwork — I can only infer.<\/p>\n<h2>What I'd do if I started over<\/h2>\n<ul>\n<li>Replace the stroke lookup with a \"two-pass\" method: first generate a stroke list per cell at low resolution (written into a Voronoi-style ID texture), then look up only 1–2 candidates at full resolution. That would cut the cost by an order of magnitude and allow 3–4 stroke layers.<\/li>\n<li>Give each painting its own \"composition snapping\": near the painter's viewpoint, warp the camera slightly to the original's perspective — the tilted floor of the bedroom, the high eye level of the café — so the matched views feel more like the originals.<\/li>\n<li>Use SDFs or procedural modelling for more organic roofs, window frames and furniture, so strokes can follow a curved surface's principal directions (right now they follow the triplanar axes).<\/li>\n<li>Let the sky's swirls slowly \"breathe.\" For now the sky is static to avoid stroke jitter; flow could be achieved by cross-fading between an old and a new set of strokes.<\/li>\n<li>Add the morning star from <em>The Starry Night<\/em>, and a smoking train crossing the viaduct behind the Yellow House.<\/li>\n<\/ul>\n<h2>Model identifier<\/h2>\n<p>claude-opus-5-5<\/p>", "prompt": "# 一次性生成本作品的 Prompt\n\n> 你是一名图形程序员兼美术指导。请用 Three.js（r18x，ES Module + importmap，本地 `vendor/three/three.module.js` 和 `three.core.js`，不用 CDN，不用构建工具）做一个单页网页作品：**《走进梵高的小镇》**，把梵高的六幅画重新想象成一座可以第一人称步行穿越、处处都像油画笔触的 3D 小镇。界面文字全部用中文。\n>\n> ## 一、六幅画与小镇地理（必须是一座连通的镇，不是六个展厅）\n> 使用坐标 x 向东、z 向南、y 向上，单位米。\n> 1. **夜间露天咖啡座**（1888）：镇中心一条南北向的石板主街。西侧是咖啡馆：黄色墙面，一楼灯火通明，外挑一个向下倾斜的巨大黄色雨篷，雨篷下是橙黄色露台、圆桌和椅子，墙上挂一盏带巨大光晕的灯。东侧是蓝紫色的夜间楼房，窗子亮着灯。街道尽头是一座尖塔教堂。\n> 2. **黄房子（街道）**（1888）：东北方向的拉马丁广场。广场是沙土地面；黄房子是两层的转角楼，配绿色百叶窗和门。左邻是一栋粉色餐馆，挂着条纹雨篷。右边一条街向北，从石砌铁路高架桥下穿过（高架桥一直延伸到河上）。\n> 3. **阿尔勒的卧室**（1888）：就在黄房子里面，要能从正门真正走进去。房间是梯形的（一面墙是斜的），墙面淡紫蓝，地板是带绿色笔触的红褐色，黄色木床配大红被和柠檬色枕头，两把草编椅，窗边小桌上放着蓝色水壶，蓝色门，墙上挂几幅小画、一面镜子和一条毛巾。\n> 4. **罗纳河上的星夜**（1888）：镇东的河岸。近岸是缓坡草地（带粉紫色笔触），停着两三条小船，站着一对散步的男女。对岸是一排剪影楼房，窗户亮着灯；岸边一列煤气灯，灯光在水面上拉出黄橙色的倒影柱。天上有北斗七星。\n> 5. **麦田群鸦**（1890）：镇西的麦田。从一个路口分出三条红土小路（左、中、右），路边有绿色草缘。麦子用数万根金黄和赭色的笔触精灵表现，随风摆动。天空深蓝、翻涌，有两团被拉长的白云，二三十只乌鸦在盘旋振翅。\n> 6. **星月夜**（1889）：镇西南的一座小山。山顶有一棵高约 17 米的火焰形柏树（由数千笔墨绿、橄榄、棕黑的笔触组成）。从山顶往东北能俯瞰整座小镇、教堂尖塔和远处蓝色的阿尔皮耶山；天空里有巨大的双涡旋、带同心光环的星星和一弯橙色月牙。\n> 地形：镇区平整；麦田有轻微起伏；外围一圈山把地平线封起来，西侧较低，北侧是山脉。世界边界是一个圆，河道不可涉水。所有建筑都有碰撞。镇里填充程序化生成的街区楼房（奶油、赭、鲑粉、淡蓝、淡紫墙面，红陶坡顶，彩色百叶窗，夜里约四成窗户亮灯），加上街灯、广场树和行人。\n>\n> ## 二、画风：必须像画出来的，而不是加滤镜\n> 1. **世界空间的逐像素程序化笔触**。写一个 `ShaderMaterial` 给所有静态几何用。\n>    - 按法线主轴做三平面投影，得到平面坐标，再按\"单元大小\"切成网格，每格拥有一笔。每一笔有随机偏移、长度（0.6–1.0 格半长）、宽度（长度 / 长宽比）、角度（基础角 + 抖动 + 可选噪声流场），宽度沿长度收窄，形状是圆头胶囊。\n>    - 用两层交错的网格，在 3×3 邻域里找出优先级最高的覆盖笔（最上层），同时记下第二名。\n>    - **光照在笔触中心的世界坐标上算**，所以光斑会被量化成一块块纯色的笔触。\n>    - 每一笔：颜色从 3 色调色板里按哈希选取并抖动；加上隆起高光、鬃毛纹、起笔厚收笔薄；可选深色描边（用于石板路）。笔触抗锯齿的边缘混到第二名那一笔上，不要混到深色缝隙里。\n> 2. **两级 LOD**：笔触格子在屏幕上小于约 4 像素时，淡出到 4 倍大的粗笔触层，再往远才淡出到平均色。LOD 用两个方向导数的几何平均来判断，这样掠射角的地面不会过早变平。\n> 3. **每个顶点带调色板和笔触参数**（3 个颜色、单元大小、长宽比、角度、抖动、自发光、流场、描边、尺寸）。所有建筑合并成一个网格，一次绘制。\n> 4. **夜色调**：夜间只对环境光那部分做色相推移（推向蓝、紫、绿），灯光照到的部分保持暖色。这是一幅\"没有黑色的夜景\"。灯光衰减要陡，免得街对面也被照成橙色。\n> 5. **天空**：\n>    - 先把颜色场和方向场渲染到等距柱状 RT 上（颜色 1024×512，方向 512×256；方向用倍角向量存储，才能做轴向混合）。颜色场包括渐变、横向波纹色带、多个带螺旋色带的涡旋、星星的同心光环、月牙、麦田的云；方向场是水平流加上涡旋、星星、月亮周围的切向流。\n>    - 天球着色器按纬度分行、每行的格子数随 cos(纬度) 变化，经度取模闭合接缝。每一笔取中心点的颜色、方向场的角度。星核和月牙另外用解析方式叠加，星核轻微闪烁。\n> 6. **精灵笔触**：麦子、草、柏树、树冠、行人都是实例化的柱状公告板笔触，锥形胶囊加鬃毛纹，带风摆，逐实例计算光照。行人由十几笔拼成：腿、外套、手臂、头、帽檐。煤气灯的光晕是分段的同心弧笔触，由内向外是白、黄、橙、黄绿。乌鸦是振翅的 M 形笔。\n> 7. **水面**：同样铺笔触（长的横向笔，深度方向拉伸 2.2 倍）。每一笔的颜色 = 深蓝 + 天空颜色场的反射 + 按\"相机到灯的方位角对齐\"计算的煤气灯倒影柱。相机升高时倒影逐渐消失。\n> 8. **后期**：\n>    - 对齐到纹素中心采样深度，用深度拉普拉斯和跳变画普鲁士蓝的手绘轮廓。颜色采样另加轻微抖动。\n>    - 饱和度约 1.14，画布经纬纹理加颗粒，轻微暗角。\n>\n> ## 三、\"走进哪幅画，就变成哪幅画\"\n> 每幅画有一个中心和内外半径（卧室用房间的包围盒）。按相机位置混合一组氛围参数：夜晚程度、天顶色、地平色、涡旋强度、星星、月亮、北斗、云、乱流、太阳方向和颜色、天光、地光、雾、灯光强度、底色。随时间平滑插值。\n> - 咖啡座、罗纳河、星月夜是夜；黄房子和卧室是钴蓝天空下的白天；麦田是阴沉翻涌的白天。\n> - 每次只把最近的 8 盏灯传进着色器。\n>\n> ## 四、交互与界面\n> - WASD 或方向键行走，Shift 快走，Q/E 转身。鼠标拖动看四周，单击锁定指针。手机上左半屏是虚拟摇杆，右半屏拖动看四周。碰撞用线段加圆，轻微的走路起伏。\n> - 每幅画有一个\"画家视点\"（位置加注视点加 FOV），视点旁边立一个画架，画布上是这幅画的调色板。\n>   - 数字键 1–6 或底部 6 个色卡按钮：从空中飞越屋顶到画架前。飞行中先朝飞行方向看，落地时对准原作构图。进出卧室要先经过门口。\n> - T 键自动导览（每站停 7.5 秒，任何输入都会打断）。F 键画框模式：按当前这幅画的真实宽高比，在画面上压一个金色画框和铭牌，框外压暗。H 键隐藏界面，M 键开关环境声（WebAudio 合成：风、河水、蟋蟀、咖啡馆人声，按区域混音）。\n> - 进入一个区域时，左下角出现米色的博物馆标签：中文名、原名、年份、地点和收藏馆，外加一句梵高书信的中文引文。几秒后自动隐藏。右上角有圆形小地图。\n> - 开场\"小镇自己画出来\"：先是米色画布，然后在约 3.4 秒内一笔一笔落下（笔触按哈希阈值逐步显现，精灵和光晕也一样）。开场界面叠在画面左侧：大标题「走进梵高的小镇」、一段说明、「开始漫步」和「跟随导览」两个按钮、按键说明。背景镜头缓慢漂移。\n> - 页面顶部是一条 34px 的细顶栏：左边「← 三方对照」链接到 `../../compare/index.html`，中间是作品名和一个小标签「Opus 5.5 · 独立逆向」，右边「原作 @petergostev ↗」链接到原帖。在 390px 宽的屏幕上不能横向溢出。\n> - 性能：检测到软件渲染或手机时降低精灵数量；按帧时间自适应调整内部渲染分辨率（0.45–1.5）。提供调试参数 `?vp=<id>`、`?t=<秒>`、`?scale=`、`?q=`、`?frames=N`（渲染 N 帧后停下，供截图用）、`?cover`（隐藏全部界面）。\n>\n> ## 五、交付\n> `index.html`、`js/*.js`、`vendor/three/`，只用相对路径，能被静态托管。控制台不能有任何报错。", "prompt_en": "# The Prompt to Generate This Piece in One Shot\n\n> You are a graphics programmer and art director. Using Three.js (r18x, ES modules + an import map, with local `vendor/three/three.module.js` and `three.core.js`, no CDN, no build tools), build a single-page web piece: **\"走进梵高的小镇\" (Walk Through Van Gogh's Town)**, reimagining six Van Gogh paintings as a 3D town you can walk throug
