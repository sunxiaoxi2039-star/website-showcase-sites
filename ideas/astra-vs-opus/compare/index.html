h in first person, where everything looks like oil-paint brushwork. All UI text in Chinese.\n>\n> ## 1. The six paintings and the town's geography (it must be one connected town, not six exhibition rooms)\n> Coordinates: x east, z south, y up, in metres.\n> 1. **Café Terrace at Night** (1888): a north–south cobbled main street at the centre of town. On the west side, the café: yellow walls, a brightly lit ground floor, a huge yellow awning sloping outward and down, and under it an orange-yellow terrace with round tables and chairs, plus a wall lamp with an enormous halo. On the east side, blue-violet night-time buildings with lit windows. A steepled church at the end of the street.\n> 2. **The Yellow House (The Street)** (1888): Place Lamartine to the northeast. The square has a sandy surface; the Yellow House is a two-storey corner building with green shutters and door. Next door on the left, a pink restaurant with a striped awning. On the right, a street runs north and passes under a stone railway viaduct (which continues out over the river).\n> 3. **The Bedroom in Arles** (1888): inside the Yellow House, and you must be able to actually walk in through the front door. The room is trapezoidal (one wall is slanted), with pale violet-blue walls, a reddish-brown floor with green strokes, a yellow wooden bed with a scarlet coverlet and lemon-yellow pillows, two rush-seated chairs, a blue jug on the small table by the window, a blue door, and a few small pictures, a mirror and a towel on the walls.\n> 4. **Starry Night Over the Rhône** (1888): the riverbank east of town. The near bank is a gently sloping lawn (with pink-violet strokes), with two or three small boats moored and a couple out for a stroll. On the far bank, a row of silhouetted buildings with lit windows; a line of gas lamps along the embankment whose light draws yellow-orange reflection columns on the water. The Big Dipper in the sky.\n> 5. **Wheatfield with Crows** (1890): the wheatfield west of town. Three red-earth paths (left, centre, right) branch from a junction, with green grassy verges. The wheat is tens of thousands of golden and ochre brushstroke sprites swaying in the wind. The sky is deep blue and churning, with two elongated white clouds and twenty or thirty crows circling and flapping.\n> 6. **The Starry Night** (1889): a small hill southwest of town. On the summit, a flame-shaped cypress about 17 m tall (made of thousands of dark-green, olive and brown-black strokes). From the summit, looking northeast, you overlook the whole town, the church steeple and the blue Alpilles in the distance; the sky has a huge double swirl, stars with concentric halos, and an orange crescent moon.\n> Terrain: the town is flat; the wheatfield rolls gently; a ring of hills closes off the horizon, lower to the west, with a mountain range to the north. The world boundary is a circle, and the river cannot be waded. All buildings have collision. Fill the town with procedurally generated blocks of buildings (cream, ochre, salmon-pink, pale blue and pale violet walls, terracotta pitched roofs, coloured shutters, about 40% of windows lit at night), plus street lamps, trees in the square and passers-by.\n>\n> ## 2. Style: it must look painted, not filtered\n> 1. **Per-pixel procedural brushstrokes in world space.** Write one `ShaderMaterial` for all static geometry.\n>    - Do a triplanar projection by the normal's dominant axis to get planar coordinates, then dice them into a grid by \"cell size,\" with each cell owning one stroke. Each stroke has a random offset, a length (half-length of 0.6–1.0 cells), a width (length / aspect ratio) and an angle (base angle + jitter + an optional noise flow field); the width tapers along the length, and the shape is a round-ended capsule.\n>    - Use two interleaved grids and find, in a 3×3 neighbourhood, the highest-priority covering stroke (the topmost), while also recording the runner-up.\n>    - **Compute lighting at the world position of the stroke's centre**, so pools of light are quantized into blocks of solid-colour strokes.\n>    - Each stroke: a colour picked from a 3-colour palette by hash, with jitter; a raised highlight, bristle marks, thick at the start and thin at the end; an optional dark outline (for cobblestones). The stroke's antialiased edge blends into the runner-up stroke, not into a dark gap.\n> 2. **Two-level LOD**: when a stroke cell is smaller than about 4 pixels on screen, fade to a coarse stroke layer 4× larger, and only further out fade to the average colour. Judge LOD by the geometric mean of the two directional derivatives, so ground at grazing angles doesn't flatten too early.\n> 3. **Every vertex carries a palette and stroke parameters** (3 colours, cell size, aspect ratio, angle, jitter, emission, flow field, outline, size). Merge all buildings into one mesh drawn in a single call.\n> 4. **Night grade**: at night, apply a hue shift (toward blue, violet and green) only to the ambient part, while the lamp-lit parts stay warm. This is \"a night scene without black.\" Lamp falloff should be steep so the other side of the street isn't lit orange too.\n> 5. **The sky**:\n>    - First render a colour field and a direction field into equirectangular RTs (colour 1024×512, direction 512×256; direction stored as double-angle vectors so axial directions can blend). The colour field includes gradients, horizontal rippling bands, several swirls with spiral bands, concentric halos around stars, the crescent moon and the wheatfield clouds; the direction field is a horizontal flow plus tangential flow around the swirls, stars and moon.\n>    - The sky-sphere shader divides it into rows by latitude, with the number of cells per row varying with cos(latitude), and closes the seam with a longitude modulo. Each stroke takes the colour at its centre and its angle from the direction field. Star cores and the crescent are layered on analytically, with the star cores twinkling slightly.\n> 6. **Sprite strokes**: wheat, grass, cypresses, tree crowns and passers-by are all instanced cylindrical-billboard strokes — tapered capsules with bristle marks, swaying in the wind, lit per instance. Passers-by are built from a dozen or so strokes: legs, coat, arms, head, hat brim. Gas-lamp halos are segmented concentric arcs of strokes, from the inside out white, yellow, orange, yellow-green. Crows are flapping M-shaped strokes.\n> 7. **Water**: also laid with strokes (long horizontal strokes, stretched 2.2× in depth). Each stroke's colour = deep blue + reflection from the sky colour field + gas-lamp reflection columns computed by \"aligning the camera-to-lamp azimuth.\" The reflections fade as the camera rises.\n> 8. **Post-processing**:\n>    - Sample depth snapped to texel centres, and draw hand-drawn Prussian-blue outlines from the depth Laplacian and discontinuities. Add slight jitter to the colour sampling separately.\n>    - Saturation around 1.14, a woven canvas texture with grain, a slight vignette.\n>\n> ## 3. \"Walk into a painting, and it becomes that painting\"\n> Each painting has a centre and inner/outer radii (the bedroom uses the room's bounding box). Blend a set of atmosphere parameters by camera position: how much it's night, zenith colour, horizon colour, swirl strength, stars, moon, Big Dipper, clouds, turbulence, sun direction and colour, sky light, ground light, fog, lamp strength, ground colour. Interpolate smoothly over time.\n> - The café, the Rhône and The Starry Night are at night; the Yellow House and the bedroom are daytime under a cobalt sky; the wheatfield is a gloomy, churning day.\n> - Pass only the nearest 8 lamps into the shader at a time.\n>\n> ## 4. Interaction and interface\n> - WASD or arrow keys to walk, Shift to walk faster, Q/E to turn. Drag the mouse to look around; click to lock the pointer. On phones, the left half of the screen is a virtual joystick and dragging on the right half looks around. Collision uses segments plus circles, with a slight walking bob.\n> - Each painting has a \"painter's viewpoint\" (position + look-at point + FOV), with an easel standing beside it whose canvas shows that painting's palette.\n>   - Number keys 1–6 or the 6 colour-swatch buttons at the bottom: fly over the rooftops to the easel. During the flight, look in the direction of travel first, and line up with the original's composition on landing. Entering or leaving the bedroom must pass through the doorway.\n> - T for an auto tour (7.5 seconds per stop; any input interrupts it). F for frame mode: overlay a gold frame and nameplate at the current painting's true aspect ratio, darkening outside the frame. H hides the UI; M toggles ambient sound (synthesized with WebAudio: wind, river, crickets, café chatter, mixed by zone).\n> - On entering a zone, a beige museum label appears bottom-left: the Chinese name, original title, year, place and collection, plus a line from Van Gogh's letters in Chinese translation. It hides itself after a few seconds. A round minimap sits at the top right.\n> - An opening in which \"the town paints itself\": first a beige canvas, then strokes land one by one over about 3.4 seconds (strokes appear progressively by hash threshold, sprites and halos too). The opening UI overlays the left side of the picture: the large title 「走进梵高的小镇」, a short description, two buttons — \"Start walking\" and \"Follow the tour\" — and key help. The background camera drifts slowly.\n> - At the top of the page, a thin 34 px top bar: on the left, 「← 三方对照」 linking to `../../compare/index.html`; in the middle, the work's name and a small tag 「Opus 5.5 · 独立逆向」; on the right, 「原作 @petergostev ↗」 linking to the original post. No horizontal overflow on a 390 px-wide screen.\n> - Performance: reduce sprite counts when software rendering or a phone is detected; adapt the internal render resolution by frame time (0.45–1.5). Provide debug parameters `?vp=<id>`, `?t=<seconds>`, `?scale=`, `?q=`, `?frames=N` (stop after rendering N frames, for screenshots) and `?cover` (hide all UI).\n>\n> ## 5. Deliverables\n> `index.html`, `js/*.js`, `vendor/three/`, relative paths only, statically hostable. No errors of any kind in the console.", "summary": "Three.js r186 + 全手写着色器：笔触固定在世界空间逐像素生成，光照按笔触量化；六个画区缝成一块地理，走进哪个画区天色就变成哪幅画", "summary_en": "Three.js r186 + fully hand-written shaders: brushstrokes fixed in world space and generated per pixel, with lighting quantized per stroke; six painting zones sewn into one geography, and the sky turns into whichever painting you walk into", "caveat": "这一件的起跑线和第一版相同：只有原帖的一句话描述和社区转述（点名了《星月夜》《卧室》《夜间露天咖啡座》三幅），看不到原作也没有源码；另外三幅（黄房子、罗纳河上的星夜、麦田群鸦）是子代理按「能不能缝成同一座镇」推断的。心得里没有报告任何隔离泄漏，是六组里最干净的一组盲测。", "caveat_en": "Same starting line as the first version: only the original post's one-line description and community write-ups (which name The Starry Night, The Bedroom and Café Terrace at Night) — no view of the original and no source. The other three paintings (The Yellow House, Starry Night Over the Rhône, Wheatfield with Crows) were inferred by the subagent by asking whether they could be sewn into the same town. Its notes report no isolation leaks: the cleanest blind test of the six."}, "orbital-core": {"notes": "<h1>轨道能量核心 · 独立逆向笔记<\/h1>\n<h2>我对原作的理解（它的核心卖点是什么）<\/h2>\n<p>Orbital Core Showcase 其实是一件工作流演示，只是穿着产品页的外衣：GPT-6 Astra 自己在 Blender 里建了一个「能量核心」模型，导出 GLB，写好 Three.js 查看器，再部署到 Cloudflare Workers。观众记住的是三件事：<\/p>\n<ol>\n<li><strong>一件像样的「物件」<\/strong>：一颗发光的球，两道互相垂直的环，一个金属底座。东西不复杂，但它是从 Blender 出来的，有资产感。<\/li>\n<li><strong>产品展示页的排版<\/strong>：深蓝夜色、细网格、胶片颗粒，左边一行很大的衬线标题「能量不被容纳。」，右边一张参数表（状态 / 核心频率 / 轨道偏移），左下三个模式按钮（轨道 / 脉冲 / 静止），整体是编辑部杂志的调子。<\/li>\n<li><strong>可以把玩<\/strong>：拖拽旋转、滚轮缩放，模型自己慢慢转，切到「脉冲」会跳动。<\/li>\n<\/ol>\n<p>所以要还原的不只是模型，而是「一个被认真做出来的实物，放在一个安静、克制的展示台上」这种感觉。<\/p>\n<h2>逆向推断：从有限资料里推出了哪些关键机制，依据是什么<\/h2>\n<p>资料来源（原帖和 workers.dev demo 在这个环境里都打不开）：<\/p>\n<ul>\n<li>社区整理的 awesome-gpt-6-astra README（raw.githubusercontent.com 可访问）写着：「Blender, Three.js, GLB」「modeling an energy core, two rings and a metal base … rotation, zoom, automatic orbit and pulse controls」，并且给出了<strong>作者公开的代码仓库<\/strong>链接。<\/li>\n<li>作者仓库 <code>wangruofeng/orbital-core-showcase<\/code> 的 README、<code>index.html<\/code>、<code>src/main.js<\/code>、<code>src/style.css<\/code> 和 <code>public/model.glb<\/code> 都能从 raw.githubusercontent.com 拉到。它们是原作本身的公开资料，不是别人的临摹，所以我读了。我还用自己拉下来的 three 在本地把原作跑了一遍，截图作为对照基准（只放在 /tmp，没进输出目录）。<\/li>\n<\/ul>\n<p>从这些资料推出的结论：<\/p>\n<table>\n<thead>\n<tr>\n<th>推断<\/th>\n<th>依据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>模型只有 4 个节点：<code>Energy_Core<\/code>（r=0.8 的球）、<code>Ring_X<\/code> / <code>Ring_Y<\/code>（主半径约 1.23、管半径 0.075 的圆环，两者用 90° 四元数摆成互相垂直）、<code>Platform<\/code>（r=1.65、高 0.32 的圆柱）<\/td>\n<td>用 Node 解析 GLB 的 JSON chunk：节点、旋转四元数、各 accessor 的 min/max 包围盒<\/td>\n<\/tr>\n<tr>\n<td>材质只有三种：<code>Blue_Emission<\/code>（emissive (0.005,0.22,1)，KHR emissive_strength 4）、<code>Dark_Metal<\/code> / <code>Platform_Metal<\/code>（金属度 0.8、粗糙度 0.25 的深蓝灰）<\/td>\n<td>GLB materials 段<\/td>\n<\/tr>\n<tr>\n<td>查看器里发光材质被整个换成 <code>MeshStandardMaterial(emissive 0x0068ff, 1.85)<\/code>；<strong>没有环境贴图，没有辉光后期<\/strong>；ACES，曝光 1.3；四盏灯（半球光、主光、蓝色 rim 点光、底部 underglow）<\/td>\n<td>main.js<\/td>\n<\/tr>\n<tr>\n<td>「脉冲」＝模型整体按 sin(4.8t) 做 ±4.2% 缩放并加快自转；「静止」＝关掉自动旋转；参数表数字由 sin 驱动<\/td>\n<td>main.js 的 tick()<\/td>\n<\/tr>\n<tr>\n<td><code>SIGNAL / OFF<\/code> 按钮只切换文字，没有任何声音<\/td>\n<td>main.js 的点击处理<\/td>\n<\/tr>\n<tr>\n<td>把原作跑起来以后，核心在 ACES 下被压成一块泛白的浅蓝圆盘，环是没有细节的黑色管子<\/td>\n<td>本地渲染截图<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>结论是：原作的「Blender 感」主要来自<strong>资产流程<\/strong>，渲染本身相当朴素。这也就是我可以超过它的地方。<\/p>\n<h2>实现思路与关键技术决策（为什么这么选）<\/h2>\n<p><strong>1. 不加载 GLB，而是用 JS 做一个「Blender 修改器栈」。<\/strong> 环境里没有 Blender，而硬表面模型的精髓（倒角、分段、封口、卡箍、凹槽）用程序化扫掠反而能做得更细。我写了 <code>sweepProfile()<\/code>：二维截面绕 Y 轴扫掠，相当于 Blender 的 Spin/Screw。它有三个关键点：\n   - <strong>每条截面边独立成带、独立法线<\/strong>：倒角面不会被平滑掉，会成为一条清晰的高光线。这正是 Blender 里「Bevel + Auto Smooth」那种硬表面观感的来源。\n   - <strong>可指定角度区间并自动封口<\/strong>（<code>ShapeUtils.triangulateShape<\/code>），所以环能切成 12 段 / 10 段、段间留缝。\n   - <strong>按顶点法线自动修正三角形绕序<\/strong>，任何方向的截面都不会出现翻面。<\/p>\n<p><strong>2. 把「两个相交的圆环」改成真正的万向节。<\/strong> 原作的两个环同半径、互相穿插，只能一起转。我让外环（R 1.42）绕竖直轴转（方位 α），内环（R 1.16）用两根阶梯钛销挂在外环 ±X 处绕水平轴翻（俯仰 β），整个万向架再带 0.2 rad 倾角和缓慢进动。两道环一直以不同的节奏交错，运动本身就有机械逻辑。<\/p>\n<p><strong>3. 用「缝里透光」表达能量。<\/strong> 每道环外表面有一条凹槽，槽底是一条连续的 HDR 发光导轨；环体中心还埋了一条发光「脊」，被分段外壳挡住，<strong>只从 22 条切缝里透出来<\/strong>。于是金属是暗的，光是从结构里漏出来的，比把整个环刷成自发光更像实物。<\/p>\n<p><strong>4. 核心是一颗「活」的等离子体，不是一个 emissive 球。<\/strong> 3D simplex 噪声，fbm 做域扭曲生成对流胞，再用 <code>pow(1-|n|, 9)<\/code> 生成亮丝；三段色（深蓝→钴蓝→白热）直接输出 HDR 值。外面两层 BackSide 加法菲涅耳壳做日冕和大气。另加一个测地约束笼（icosphere(1) 的 120 条边做 InstancedMesh 支杆、42 个钛节点、12 颗 LED），让核心有被「约束」的叙事，也让比例和细节密度对得上产品渲染。<\/p>\n<p><strong>5. 材质靠环境光照出来。<\/strong> 我在一个小场景里摆了顶部柔光箱、左侧冷蓝灯条、右侧白灯条、背后地平线蓝光，外加一小块暖色反光板，用 <code>PMREMGenerator.fromScene<\/code> 烘成一张「迷你 HDRI」。所有金属用 <code>MeshPhysicalMaterial<\/code>（metalness 1）；Canvas 画的拉丝贴图做 roughnessMap，UV 的 u 沿圆周，所以基座呈现车削金属的放射状各向异性高光（anisotropy），环上有 clearcoat。钛合金销和卡箍用暖灰金属，外加几颗琥珀色 LED，在一片冷蓝里给出点缀。<\/p>\n<p><strong>6. 后期按「渲染器」而不是「网页特效」来做。<\/strong> HalfFloat + MSAA×4 的 render target，<code>UnrealBloomPass<\/code> 阈值 0.95，只让 HDR 发光体溢光，不让整张图发糊。ACES 输出，最后一道自定义 pass 做边缘轻微色散、暗角和颗粒抖动（顺便压掉暗部渐变的色带）。核心里的点光源投射阴影（立方体阴影贴图），环、笼的影子落在基座上；地面上改用烘焙式的径向接触阴影。<\/p>\n<p><strong>7. 保留原作的版式语言，但每个元素都接上真数据。<\/strong> 参数表里的 α、β 是万向架的真实角度，「场强输出」就是驱动光强的那个 energy 值，下面的小示波器画的是 energy 的历史曲线。<\/p>\n<h2>和「常规做法」相比，我做了哪些不一样的尝试<\/h2>\n<ul>\n<li><strong>拆解视图（第 4 个模式）<\/strong>：万向架回正，外环抬到上方、内环落到下方，两环都转平，笼子放大，核心上浮，相机目标上移，然后浮出 5 个带引线的中文标注（附尺寸规格）。环的标注锚点每帧在 32 个采样点里挑屏幕上最外侧的一个，所以转动时引线始终挂在环的边缘；在手机上会夹紧在视口内。这是产品页里最有「说明书」感的一招。<\/li>\n<li><strong>心跳式脉冲<\/strong>：原作的脉冲是 sin 缩放。我用「咚-哒」双峰包络（1.25 s 周期）驱动能量；每一拍地面扩散一圈冲击波，声音里出一记低频 thump，示波器上能看到双峰。<\/li>\n<li><strong>声音是真的<\/strong>：原作的 <code>SIGNAL / OFF<\/code> 是摆设。这里用 WebAudio 现场合成：两支微失谐的锯齿波过共振低通，加次低频正弦，加高频颤音微光；滤波截止频率和音高随能量、转速实时变化。<\/li>\n<li><strong>开场点火<\/strong>：相机从远处低角度缓入 3.4 秒，核心在前 2 秒内从暗到亮。时间按真实时钟计，慢设备上也一定能播完；用户一拖动就立刻交出控制。<\/li>\n<li><strong>构图<\/strong>：用 <code>camera.setViewOffset<\/code> 平移投影中心，而不是移动模型或目标点。桌面上把物体推向右侧给标题让位，手机上略微下移避开标题；旋转中心依然在模型上。<\/li>\n<li><strong>拿 Blender 的 AgX 做过对比<\/strong>：AgX 是 Blender 4.x 的默认视图变换。在这套单色蓝调里，它会把钴蓝洗成灰雾，最后选了 ACES（<code>?tm=agx<\/code> 可切回去看）。<\/li>\n<li><strong>标题用中文衬线<\/strong>：只从 Noto Serif SC 里取出标题 9 个字所在的 6 个 unicode-range 切片（268 KB），不用把整套几十 MB 的字体搬进来。<\/li>\n<li><strong>自适应分辨率<\/strong>：帧率低于 30 就逐步把 pixelRatio 降到 1。<\/li>\n<\/ul>\n<h2>踩过的坑与修正过程<\/h2>\n<ol>\n<li><strong>一开局就是黑的<\/strong>：点火和相机开场最初跟着被钳制过的 dt 走，无头 swiftshader 每帧要好几秒，结果核心永远停在「点火中」。后来把真实时钟（开场、点火、能量平滑）和模拟时钟（转动）分开。<\/li>\n<li><strong>整张图泛白<\/strong>：第一版用 AgX、曝光 1.55，核心点光强度 28，渲出来几乎是一张白底蓝雾。之后把曝光降到 1.0，点光降到 11，等离子色板整体降档，辉光强度和半径也收了，再改用 ACES。<\/li>\n<li><strong>地平线有一条硬线<\/strong>：地面半径只有 40，雾还没吃透；天穹在地平线上方又加了一条亮带，两者相接的地方出现一条暗缝。最后把地面扩到 160，天穹在地平线处的颜色和雾色完全一致，去掉亮带。<\/li>\n<li><strong>地面阴影很脏<\/strong>：地面接收点光阴影以后，远处出现大片三角形的黑影（卡箍、支杆投出来的）。改成地面不接收阴影，基座下贴一张径向渐变的「烘焙 AO」贴片。<\/li>\n<li><strong>等离子像迪斯科球<\/strong>：噪声频率太高，缩小以后是一颗灰白颗粒球。于是降低域扭曲频率，把亮丝的指数提高到 9。<\/li>\n<li><strong>发射透镜是一块白饼<\/strong>：纯色 Basic 材质加辉光以后成了过曝的平盘。改成菲涅耳透镜 shader：同心阶梯纹缓慢外流，中心亮斑收小。<\/li>\n<li><strong>粒子凑近后变成大光斑<\/strong>：<code>gl_PointSize<\/code> 随 1/z 放大没有上限，加了上限。<\/li>\n<li><strong>一个参数签名写错<\/strong>：环境灯板函数写成 <code>(w, h, rgb, pos)<\/code>，调用时传的却是 <code>([w,h], rgb, pos)<\/code>，第一次运行直接抛「pos is not iterable」。<\/li>\n<li><strong><code>bloom.setSize(w,h)<\/code> 覆盖了 composer 按 DPR 计算的尺寸<\/strong>：高分屏上辉光分辨率会减半，已删除。<\/li>\n<li><strong>手机上的标注被裁掉<\/strong>：左右两侧的标签伸出了 390px 视口，加了夹紧逻辑。<\/li>\n<li><strong>封面上两道环看起来共面<\/strong>：某些 β 角下内环正好转到和外环同一平面，「双环」就不见了。<code>?cover<\/code> 会把万向架冻结在 α=0.35、β=2.55 这个两环明显交叉的姿态。<\/li>\n<\/ol>\n<h2>自评：和原作相比，哪里可能追平或超越，哪里还差<\/h2>\n<p><strong>可能超越的：<\/strong>\n- 模型细节密度：分段机加工环、倒角高光、切缝透光、钛销与卡箍、测地笼、刻度盘微缩字、72 片散热鳍。原作是球、两个圆环、一个圆柱。\n- 光照与材质：有环境反射、各向异性车削金属、HDR 辉光、会投影的核心光源。原作没有环境贴图，也没有辉光，核心泛白。\n- 交互深度：多了拆解视图和标注、心跳脉冲和冲击波、真实合成音效，参数表接的是真实数据，还有键盘快捷键、双击复位和开场点火。\n- 版式：保留了原作的编辑部风格，并补上中文衬线标题和竖屏专门布局。<\/p>\n<p><strong>还差的：<\/strong>\n- <strong>它毕竟不是 Blender 资产<\/strong>。原作最大的叙事是「AI 操作 Blender 建模再导出 GLB」，这一点我在流程上没有复现，只在观感上做了模拟。拿不出 <code>.blend<\/code> 文件，也没有真实的路径追踪 GI、焦散和 AO，这些都是用贴片、辉光和环境图近似出来的。\n- 无头 swiftshader 下只有个位数帧率（点光立方体阴影、MSAA、物理材质都不便宜），我没有在真 GPU 上实测。自适应 DPR 只是兜底，性能余量没有经过验证。\n- 等离子 shader 在极近距离下能看出噪声结构的重复。\n- 这个环境只有文泉驿黑体，截图里的中文正文仍是黑体；标题的衬线是靠自带切片才保证下来的。<\/p>\n<h2>如果重来一次会怎么做<\/h2>\n<ul>\n<li>在 Node 里用同一套 <code>sweepProfile<\/code> 生成真正的 <code>.glb<\/code>（带 KHR_materials_emissive_strength、各向异性扩展），页面只负责加载。这样资产可以回流到 Blender，流程也更贴近原作的故事。<\/li>\n<li>用烘焙的方式做 AO / 光照贴图：离线把核心点光的柔和阴影烘进基座纹理，运行时去掉立方体阴影，性能能省一大截。<\/li>\n<li>从第一版就把「真实时钟 vs 模拟时钟」「曝光预算」定死，免得在泛白和发黑之间来回调。<\/li>\n<li>拆解视图做成可拖动的时间轴（0→1 的滑杆），让用户自己控制拆到几成，而不只是一个开关。<\/li>\n<li>给每个部件加 hover 高亮（描边 pass）和点击聚焦的相机动画。<\/li>\n<\/ul>\n<h2>资料使用与隔离声明<\/h2>\n<ul>\n<li>没有读取 <code>astra-vs-opus/<\/code> 下除本目录以外的任何文件，没有看它的 git 历史，也没有读 <code>website-gallery/<\/code>。<\/li>\n<li>有一次 WebSearch 的结果列表里出现了一条指向「website-showcase-sites 仓库 PR」的链接，搜索工具附带的自动摘要里有一句概括（提到菲涅耳光晕壳、双环、拆解视图之类的词）。<strong>我没有打开那个链接<\/strong>，但那句摘要确实进入了我的上下文。出于透明，在这里说明：拆解视图这个想法，和那句摘要出现的时间是先后挨着的。<\/li>\n<li>原作的公开源码（作者本人仓库）读过，也本地运行过，用于逆向推断；本作品的所有几何、shader、UI 代码都是重新写的，没有使用原作的 GLB 或代码。<\/li>\n<\/ul>\n<h2>模型标识<\/h2>\n<p>claude-opus-5-5<\/p>", "notes_en": "<h1>Orbital Energy Core · Independent Reverse-Engineering Notes<\/h1>\n<h2>How I read the original (what it is really selling)<\/h2>\n<p>Orbital Core Showcase is really a workflow demo dressed up as a product page: GPT-6 Astra built an \"energy core\" model in Blender by itself, exported a GLB, wrote a Three.js viewer and deployed it to Cloudflare Workers. What viewers remember comes down to three things:<\/p>\n<ol>\n<li><strong>A convincing \"object\"<\/strong>: a glowing sphere, two mutually perpendicular rings and a metal base. It isn't complicated, but it came out of Blender and feels like an asset.<\/li>\n<li><strong>Product-showcase layout<\/strong>: deep navy night, a fine grid, film grain, a very large serif headline on the left — 「能量不被容纳。」 (\"Energy will not be contained.\") — a spec table on the right (Status / Core frequency / Orbital offset), and three mode buttons bottom-left (Orbit / Pulse / Still). The overall tone is an editorial magazine.<\/li>\n<li><strong>You can play with it<\/strong>: drag to rotate, scroll to zoom, the model slowly turns by itself, and switching to \"Pulse\" makes it throb.<\/li>\n<\/ol>\n<p>So what has to be recreated isn't just the model, but the feeling of \"a carefully made physical object on a quiet, restrained display stand.\"<\/p>\n<h2>Reverse inference: which key mechanisms I deduced from limited material, and why<\/h2>\n<p>Sources (neither the original post nor the workers.dev demo would open in this environment):<\/p>\n<ul>\n<li>The community-maintained awesome-gpt-6-astra README (reachable via raw.githubusercontent.com) says: \"Blender, Three.js, GLB\", \"modeling an energy core, two rings and a metal base … rotation, zoom, automatic orbit and pulse controls\", and links to <strong>the author's public code repository<\/strong>.<\/li>\n<li>The README, <code>index.html<\/code>, <code>src/main.js<\/code>, <code>src/style.css<\/code> and <code>public/model.glb<\/code> from the author's repo <code>wangruofeng/orbital-core-showcase<\/code> could all be fetched from raw.githubusercontent.com. They are the original work's own public material, not someone else's copy, so I read them. I also ran the original locally with a three.js I had fetched myself and took screenshots as a reference baseline (kept only in /tmp, not in the output directory).<\/li>\n<\/ul>\n<p>Conclusions drawn from this material:<\/p>\n<table>\n<thead>\n<tr>\n<th>Inference<\/th>\n<th>Evidence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The model has only 4 nodes: <code>Energy_Core<\/code> (a sphere, r=0.8), <code>Ring_X<\/code> / <code>Ring_Y<\/code> (tori with a major radius of about 1.23 and a tube radius of 0.075, set perpendicular to each other with a 90° quaternion) and <code>Platform<\/code> (a cylinder, r=1.65, height 0.32)<\/td>\n<td>Parsing the GLB's JSON chunk in Node: nodes, rotation quaternions, and the min/max bounds of each accessor<\/td>\n<\/tr>\n<tr>\n<td>There are only three materials: <code>Blue_Emission<\/code> (emissive (0.005,0.22,1), KHR emissive_strength 4) and <code>Dark_Metal<\/code> / <code>Platform_Metal<\/code> (a dark blue-grey with metalness 0.8, roughness 0.25)<\/td>\n<td>The GLB's materials section<\/td>\n<\/tr>\n<tr>\n<td>In the viewer, the emissive material is replaced wholesale with <code>MeshStandardMaterial(emissive 0x0068ff, 1.85)<\/code>; <strong>no environment map, no bloom post-processing<\/strong>; ACES at exposure 1.3; four lights (hemisphere, key, a blue rim point light, a bottom underglow)<\/td>\n<td>main.js<\/td>\n<\/tr>\n<tr>\n<td>\"Pulse\" = the whole model scales ±4.2% by sin(4.8t) and spins faster; \"Still\" = auto-rotation off; the numbers in the spec table are driven by sin<\/td>\n<td><code>tick()<\/code> in main.js<\/td>\n<\/tr>\n<tr>\n<td>The <code>SIGNAL / OFF<\/code> button only toggles its label; there is no sound at all<\/td>\n<td>The click handler in main.js<\/td>\n<\/tr>\n<tr>\n<td>Running the original, the core is crushed by ACES into a washed-out pale-blue disc, and the rings are featureless black tubes<\/td>\n<td>Local render screenshots<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The conclusion: the original's \"Blender feel\" comes mainly from the <strong>asset pipeline<\/strong>; the rendering itself is fairly plain. That's exactly where I could surpass it.<\/p>\n<h2>Implementation approach and key technical decisions (and why)<\/h2>\n<p><strong>1. No GLB — a \"Blender modifier stack\" in JS instead.<\/strong> There's no Blender in this environment, and the essence of hard-surface modelling (bevels, segmentation, caps, clamps, grooves) can actually be done more finely with procedural sweeps. I wrote <code>sweepProfile()<\/code>: a 2D profile swept around the Y axis, the equivalent of Blender's Spin/Screw. Three key points:\n   - <strong>Every profile edge becomes its own band with its own normals<\/strong>: bevel faces aren't smoothed away and become crisp highlight lines. That's precisely where the hard-surface look of Blender's \"Bevel + Auto Smooth\" comes from.\n   - <strong>An angular range can be specified, with automatic caps<\/strong> (<code>ShapeUtils.triangulateShape<\/code>), so the rings can be cut into 12 / 10 segments with gaps between them.\n   - <strong>Triangle winding is corrected automatically from the vertex normals<\/strong>, so no profile, whatever its orientation, ends up with flipped faces.<\/p>\n<p><strong>2. \"Two intersecting tori\" turned into a real gimbal.<\/strong> In the original, the two rings share a radius and pass through each other, so they can only turn together. My outer ring (R 1.42) turns about the vertical axis (azimuth α); the inner ring (R 1.16) hangs from the outer ring at ±X on two stepped titanium pins and flips about the horizontal axis (pitch β); and the whole gimbal carries a 0.2 rad tilt and a slow precession. The two rings keep crossing at different rhythms, so the motion itself has mechanical logic.<\/p>\n<p><strong>3. Energy expressed as \"light leaking through the seams.\"<\/strong> Each ring has a groove in its outer surface, with a continuous HDR light rail at the bottom; a glowing \"spine\" is also buried in the ring's core, hidden by the segmented shell and <strong>showing only through 22 slits<\/strong>. So the metal is dark and the light leaks out of the structure — much more like a real object than painting the whole ring emissive.<\/p>\n<p><strong>4. The core is \"living\" plasma, not an emissive sphere.<\/strong> 3D simplex noise, with fbm domain warping to create convection cells, and <code>pow(1-|n|, 9)<\/code> to create bright filaments; a three-stop palette (deep blue → cobalt → white-hot) output directly as HDR values. Outside it, two additive BackSide Fresnel shells form a corona and atmosphere. I also added a geodesic containment cage (the 120 edges of icosphere(1) as InstancedMesh struts, 42 titanium nodes, 12 LEDs), giving the core a \"contained\" narrative and bringing the proportions and detail density in line with a product render.<\/p>\n<p><strong>5. Materials brought out by environment lighting.<\/strong> In a small scene I placed an overhead softbox, a cool-blue light strip on the left, a white strip on the right, a blue horizon glow behind, plus a small warm bounce card, and baked it with <code>PMREMGenerator.fromScene<\/code> into a \"mini HDRI.\" All metals use <code>MeshPhysicalMaterial<\/code> (metalness 1); a brushed texture drawn on a Canvas serves as the roughnessMap, with UV u running around the circumference, so the base shows the radial anisotropic highlights of turned metal (anisotropy), and the rings get clearcoat. Titanium pins and clamps are warm grey metal, plus a few amber LEDs as accents in a sea of cool blue.<\/p>\n<p><strong>6. Post-processing done like a renderer, not a web effect.<\/strong> A HalfFloat + MSAA×4 render target, with <code>UnrealBloomPass<\/code> at a threshold of 0.95 so only HDR emitters bloom and the whole image doesn't go soft. ACES output, then a final custom pass for slight chromatic aberration at the edges, vignette and grain dithering (which also removes banding in dark gradients). The point light inside the core casts shadows (cube shadow map), so the rings and cage cast shadows on the base; the ground uses a baked-style radial contact shadow instead.<\/p>\n<p><strong>7. The original's layout language kept, but every element wired to real data.<\/strong> α and β in the spec table are the gimbal's actual angles, \"Field output\" is the very energy value that drives the light intensity, and the small oscilloscope below plots energy's history.<\/p>\n<h2>What I tried differently from the \"usual approach\"<\/h2>\n<ul>\n<li><strong>An exploded view (a 4th mode)<\/strong>: the gimbal returns to neutral, the outer ring lifts above and the inner ring drops below, both rings rotate flat, the cage expands, the core floats up and the camera target rises; then 5 Chinese callouts with leader lines (and dimensions) float in. Each frame, the ring callouts' anchors pick the outermost on-screen point out of 32 samples, so the leader lines stay attached to the ring edges as they turn; on phones they're clamped inside the viewport. It's the most \"instruction manual\" move on the product page.<\/li>\n<li><strong>A heartbeat pulse<\/strong>: the original's pulse is a sine scale. I drive the energy with a \"lub-dub\" double-peaked envelope (1.25 s period); each beat sends a shockwave ring across the ground and a low thump through the audio, and you can see the double peak on the oscilloscope.<\/li>\n<li><strong>The sound is real<\/strong>: the original's <code>SIGNAL / OFF<\/code> is decoration. Here WebAudio synthesizes live: two slightly detuned sawtooth waves through a resonant low-pass, plus a sub-bass sine, plus a high shimmering tremolo; the filter cutoff and pitch follow energy and rotation speed in real time.<\/li>\n<li><strong>An ignition opening<\/strong>: the camera eases in from a distant low angle over 3.4 seconds while the core goes from dark to bright within the first 2 seconds. Timing uses the real clock, so it always completes even on slow devices, and control is handed over as soon as the user drags.<\/li>\n<li><strong>Composition<\/strong>: <code>camera.setViewOffset<\/code> shifts the projection centre instead of moving the model or target. On desktop the object is pushed right to make room for the headline; on phones it's shifted slightly down to clear the headline; the rotation centre stays on the model.<\/li>\n<li><strong>Compared against Blender's AgX<\/strong>: AgX is Blender 4.x's default view transform. In this monochrome blue scheme it washes cobalt out into grey haze, so I chose ACES in the end (<code>?tm=agx<\/code> switches back for comparison).<\/li>\n<li><strong>A Chinese serif headline<\/strong>: only the 6 unicode-range slices of Noto Serif SC containing the headline's 9 characters (268 KB), rather than shipping the full multi-megabyte font.<\/li>\n<li><strong>Adaptive resolution<\/strong>: below 30 fps, pixelRatio steps down toward 1.<\/li>\n<\/ul>\n<h2>Pitfalls and how I fixed them<\/h2>\n<ol>\n<li><strong>Black from the very start<\/strong>: ignition and the camera opening initially followed a clamped dt; headless SwiftShader takes several seconds per frame, so the core stayed \"igniting\" forever. I then separated the real clock (opening, ignition, energy smoothing) from the simulation clock (rotation).<\/li>\n<li><strong>The whole image washed out<\/strong>: the first version used AgX at exposure 1.55 with the core's point light at 28, rendering what was almost white with blue haze. I then lowered exposure to 1.0 and the point light to 11, stepped the whole plasma palette down, pulled in bloom strength and radius, and switched to ACES.<\/li>\n<li><strong>A hard line on the horizon<\/strong>: the ground's radius was only 40, not enough for the fog to swallow it, and the sky dome added a bright band above the horizon, leaving a dark seam where they met. I extended the ground to 160, matched the dome's horizon colour exactly to the fog colour, and removed the band.<\/li>\n<li><strong>Dirty ground shadows<\/strong>: once the ground received point-light shadows, big triangular black shadows appeared in the distance (cast by the clamps and struts). The ground now doesn't receive shadows; a radial-gradient \"baked AO\" decal sits under the base instead.<\/li>\n<li><strong>The plasma looked like a disco ball<\/strong>: the noise frequency was too high, and at a distance it became a grey-white grainy ball. I lowered the domain-warp frequency and raised the filament exponent to 9.<\/li>\n<li><strong>The emitter lens was a white pancake<\/strong>: a flat Basic material under bloom became an overexposed disc. I replaced it with a Fresnel-lens shader: concentric stepped rings slowly flowing outward, with a smaller hotspot at the centre.<\/li>\n<li><strong>Particles became big blobs up close<\/strong>: <code>gl_PointSize<\/code> scaled with 1/z without limit; I added a cap.<\/li>\n<li><strong>A wrong parameter signature<\/strong>: the environment light-panel function was written as <code>(w, h, rgb, pos)<\/code> but called with <code>([w,h], rgb, pos)<\/code>, and the first run threw \"pos is not iterable\" straight away.<\/li>\n<li><strong><code>bloom.setSize(w,h)<\/code> overrode the DPR-aware size the composer had computed<\/strong>: on high-DPI screens the bloom resolution was halved. Removed.<\/li>\n<li><strong>Callouts clipped on phones<\/strong>: labels on the left and right stuck out of the 390 px viewport; I added clamping.<\/li>\n<li><strong>The two rings looked coplanar on the cover image<\/strong>: at some β angles the inner ring turns into the same plane as the outer ring, and the \"double ring\" disappears. <code>?cover<\/code> freezes the gimbal at α=0.35, β=2.55, a pose where the two rings clearly cross.<\/li>\n<\/ol>\n<h2>Self-assessment: where it may match or beat the original, and where it falls short<\/h2>\n<p><strong>Where it may surpass the original:<\/strong>\n- Model detail density: segmented machined rings, bevel highlights, light through the slits, titanium pins and clamps, the geodesic cage, micro-text on the dial, 72 cooling fins. The original is a sphere, two tori and a cylinder.\n- Lighting and materials: environment reflections, anisotropic turned metal, HDR bloom, a shadow-casting core light. The original has no environment map and no bloom, and its core washes out.\n- Depth of interaction: the exploded view with callouts, the heartbeat pulse and shockwaves, genuinely synthesized sound, a spec table wired to real data, plus keyboard shortcuts, double-click to reset and the ignition opening.\n- Layout: keeps the original's editorial style, adding a Chinese serif headline and a dedicated portrait layout.<\/p>\n<p><strong>Where it falls short:<\/strong>\n- <strong>It's not a Blender asset, after all.<\/strong> The original's biggest story is \"AI drives Blender, models, then exports a GLB,\" and I didn't reproduce that as a process, only simulated it visually. There's no <code>.blend<\/code> file to show, and no real path-traced GI, caustics or AO — those are approximated with decals, bloom and an environment map.\n- Headless SwiftShader managed only single-digit frame rates (point-light cube shadows, MSAA and physical materials aren't cheap), and I didn't measure on a real GPU. Adaptive DPR is only a fallback; the performance headroom is unverified.\n- At very close range, the plasma shader shows repetition in the noise structure.\n- This environment only has WenQuanYi's sans-serif, so Chinese body text in the screenshots is still sans; the headline's serif is guaranteed only by the bundled slices.<\/p>\n<h2>What I'd do if I started over<\/h2>\n<ul>\n<li>Use the same <code>sweepProfile<\/code> in Node to generate a real <code>.glb<\/code> (with KHR_materials_emissive_strength and the anisotropy extension), and have the page only load it. The asset could then flow back into Blender, and the process would track the original's story more closely.<\/li>\n<li>Do AO / light maps by baking: bake the soft shadows of the core's point light into the base texture offline and drop the cube shadows at runtime, saving a lot of performance.<\/li>\n<li>Lock down \"real clock vs. simulation clock\" and the \"exposure budget\" from the first version, to avoid swinging back and forth between washed out and too dark.<\/li>\n<li>Make the exploded view a draggable timeline (a 0→1 slider), letting users decide how far to take it apart, rather than just a toggle.<\/li>\n<li>Add hover highlighting (an outline pass) and a click-to-focus camera animation for each part.<\/li>\n<\/ul>\n<h2>Use of sources and isolation statement<\/h2>\n<ul>\n<li>I did not read any file under <code>astra-vs-opus/<\/code> outside this directory, did not look at its git history, and did not read <code>website-gallery/<\/code>.<\/li>\n<li>Once, a WebSearch results list included a link to \"a PR in the website-showcase-sites repository,\" and the search tool's auto-generated summary included a one-line synopsis (mentioning things like Fresnel glow shells, double rings and an exploded view). <strong>I did not open that link<\/strong>, but that summary did enter my context. For transparency, I'm noting it here: the idea of an exploded view came right around the time that summary appeared.<\/li>\n<li>I read the original's public source (the author's own repository) and ran it locally for reverse inference; all geometry, shader and UI code in this piece was written from scratch, and none of the original's GLB or code is used.<\/li>\n<\/ul>\n<h2>Model identifier<\/h2>\n<p>claude-opus-5-5<\/p>", "prompt": "# 一次性生成 Prompt：轨道能量核心（Orbital Core）\n\n> 用途：让一个代码模型在一次回复里生成本作品的完整静态站点。\n\n---\n\n请用 **Three.js（r181，ES Module + importmap，本地 `vendor/` 目录，不用 CDN、不用构建工具）** 做一个单页 3D 产品展示网页，主角是一件「双环能量核心」。目标是：看起来像一件在 Blender 里精细建模、用 Cycles/Eevee 渲过的硬表面产品，而不是一个球加两个甜甜圈。界面文字全部用中文。\n\n## 文件结构\n```\nindex.html        入口（importmap: \"three\" → ./vendor/three/three.module.min.js，\"three/addons/\" → ./vendor/three/addons/）\ncss/style.css\njs/model.js       程序化建模：导出 buildOrbitalCore() → { root, parts, uniforms, materials }\njs/main.js        渲染器、环境光照、后期、相机、交互、模式状态机、UI 联动\njs/audio.js       WebAudio 合成的核心嗡鸣\nvendor/           three.module.min.js + three.core.min.js + OrbitControls / EffectComposer / RenderPass / UnrealBloomPass / OutputPass / ShaderPass 及其依赖；字体 woff2\n```\n\n## 模型（全部程序化，不加载外部模型）\n写一个 `sweepProfile(profile, {phi0, phi1, steps, closed, caps})`：把二维截面 `[(r, y)…]` 绕 Y 轴扫掠（等同 Blender 的 Spin/Screw 修改器）。**每条截面边单独生成一条带状面、拥有自己的法线**，这样倒角面会成为清晰的高光线；可选在 phi0/phi1 处用 `ShapeUtils.triangulateShape` 封端；按顶点法线自动修正三角形绕序。UV 的 u 沿圆周方向，便于做「车削金属」拉丝。\n\n1. **等离子核心**：半径 0.5 的球，ShaderMaterial，3D simplex 噪声 + 域扭曲 fbm 生成对流胞，再叠 `pow(1-|noise|, 9)` 的亮丝；深蓝→钴蓝→白热三段色，输出 HDR（>1）供辉光使用；边缘加一点日冕亮边。外面套两层 BackSide 加法混合的菲涅耳光晕球（0.86、1.35）。\n2. **测地约束笼**：`IcosahedronGeometry(0.66, 1)` 去重顶点、提取 120 条边 → InstancedMesh 细圆柱支杆 + 42 个八面体钛合金节点 + 12 个五度顶点上的小 LED。整个笼缓慢自转。\n3. **陀螺架双环（重点）**：外环 R=1.42 竖直、随万向架绕 Y 转（方位 α）；内环 R=1.16 由两根阶梯钛销挂在外环 ±X 处，绕 X 轴翻转（俯仰 β）——是真正能转的万向节，而不是两个相交的圆环。每道环：\n   - 截面是带 0.014 倒角的矩形，外表面开一条凹槽；\n   - 环体切成 12/10 段，段间留 0.03 rad 缝，每段两端封口；\n   - 凹槽里有一条连续的发光导轨，环体中心有一条「脊」发光条，**只从切缝里透出来**，所以每条缝都是一道蓝光；\n   - 在 0°/90°/180°/270° 放加厚的钛合金卡箍，上面各有三颗 LED（两冷一暖琥珀色点缀）。\n   - 万向架整体再倾斜 ~0.2 rad，并带一点缓慢进动。\n4. **悬浮基座**：一条带台阶、倒角、环形凹槽的截面扫掠成整体；凹槽内发光环；中心是菲涅耳纹发射透镜（同心阶梯 shader）；台面上叠一张 Canvas 画的刻度盘（2° 细刻度、10°/30° 长刻度、环形微缩字 `ORBITAL CORE · SPECIMEN 01 …`、4 个三角索引），加法混合，随 α 慢转；侧面 72 片散热鳍（InstancedMesh）；台阶立面 24 条状态灯缝；从透镜到核心有一束带流动条纹的加法光柱。\n5. **地台**：大圆形暗色地面 + 放射渐变的「烘焙 AO」接触阴影贴片 + 一张加法混合的地面特效 shader（基座下的光池、每 1.45 单位一圈的虚线测量环、外圈细刻度、脉冲模式下的扩散冲击波）。\n\n## 材质与光照（「Blender 质感」的关键）\n- 程序化拉丝贴图：Canvas 上画几千条沿 u 方向的随机灰线 → 作为 roughnessMap；环体与基座用 `MeshPhysicalMaterial`，`metalness 1`，环体带 clearcoat，基座开 `anisotropy`，得到车削金属那种放射状高光。\n- 自己搭一个迷你「HDRI 棚」：在一个场景里放暗色渐变天球 + 顶部大柔光箱 + 左侧冷蓝灯条 + 右侧白灯条 + 背后地平线蓝光 + 一小块暖色反光板，用 `PMREMGenerator.fromScene` 烘成 `scene.environment`。\n- 核心内放一盏投射阴影的点光源（强度随能量变化），让环、笼的影子落到基座上；再加一盏冷白主光和一盏蓝色轮廓光。\n- 背景是一个与 FogExp2 同色的天穹 shader，地面在远处无缝溶进去，不能出现地平线硬边。\n- 后期：`EffectComposer`（HalfFloat、MSAA 4x 的 render target）→ `UnrealBloomPass`（强度 ~0.45、半径 0.4、阈值 0.95，只让 HDR 发光体溢光）→ `OutputPass`（ACES）→ 自定义 ShaderPass：边缘轻微色散 + 暗角 + 胶片颗粒抖动（顺便消除暗部色带）。\n\n## 交互与状态机\n- OrbitControls：阻尼、禁平移、限制俯仰不钻到地下；距离按视口宽高比自动计算（竖屏更远），用 `camera.setViewOffset` 在桌面把模型略微推向右侧给标题让位，手机上略微下移。\n- 开场：相机从远处低角度 3.4 秒缓入，核心在 0.35–2 秒间「点火」（按真实时间计，慢设备也能播完）；用户一拖动就立刻交出控制权。双击或按 R 平滑复位。\n- 四个模式（按钮 + 键盘 1–4）：\n  - **轨道**：α、β 慢转，相机自动环绕，核心轻微呼吸；\n  - **脉冲**：转速加快，能量按「咚-哒」双峰心跳包络跳动（1.25 s 周期），每一拍地面扩散一圈冲击波、声音里出一记低频 thump；\n  - **静止**：所有转速阻尼归零，核心待机微光，状态灯变琥珀色；\n  - **拆解**：万向架回正，外环抬到上方、内环落到下方并都转平，笼子放大，核心上浮，相机目标上移；出现 5 个带引线的 HTML 标注（等离子核心 / 测地约束笼 / 外环·方位环 / 内环·俯仰环 / 悬浮基座，附尺寸规格），锚点每帧投影，环类标注自动取屏幕上最外侧的点，标注在手机上夹紧在视口内。\n- 所有速度、能量、拆解进度都用指数阻尼平滑，切换模式没有跳变。\n- 自适应分辨率：帧率低于 30 时逐步把 pixelRatio 降到 1。\n\n## UI（叠在画布上）\n- 最顶部一条 34px 细顶栏：左「← 三方对照」、中「轨道能量核心」+ 小胶囊标签、右「原作 @作者 ↗」。\n- 左上品牌「ORBITAL / OBJECTS」+ 小轨道图标；右上「样本 01 / DUAL-RING CONTAINMENT」。\n- 左侧大标题（衬线体，第二行斜体渐变字）：「两道轨道 / 一颗恒星。」+ 一段短说明。\n- 右侧实时参数表：状态、核心频率（THz）、外环方位 α、内环俯仰 β、场强输出 %，底下是一条画出能量历史的小示波器。\n- 左下四个模式按钮（带小图形符号和键位提示），页脚操作提示 + 声音开关（WebAudio：两支微失谐锯齿波过共振低通 + 次低频正弦 + 高频微光颤音，滤波截止随能量和转速变化）。\n- 背景加 76px 细网格（遮罩渐隐）和 SVG 噪点颗粒。\n- ≤740px：标题移到上方、隐藏说明段，参数表变成三列横条，四个按钮平分一行；390px 宽不能横向溢出。\n- 字体：Instrument Serif（标题）+ IBM Plex Mono（数据），woff2 放 vendor，中文回退到系统宋体/黑体。\n\n## 质量要求\n- 控制台零报错；WebGL 创建失败时显示中文提示。\n- 所有发光色用 HDR 值，靠辉光而不是把漫反射调亮来「发光」。\n- 暗部要深（钴蓝-近黑），不要整体泛白发灰。", "prompt_en": "# One-Shot Generation Prompt: Orbital Energy Core (Orbital Core)\n\n> Purpose: have a code model generate the complete static site for this piece in a single reply.\n\n---\n\nUsing **Three.js (r181, ES modules + an import map, a local `vendor/` directory, no CDN, no build tools)**, build a single-page 3D product showcase whose hero is a \"dual-ring energy core.\" The goal: it should look like a hard-surface product finely modelled in Blender and rendered in Cycles/Eevee, not a sphere with two doughnuts. All UI text in Chinese.\n\n## File structure\n```\nindex.html        entry point (importmap: \"three\" → ./vendor/three/three.module.min.js, \"three/addons/\" → ./vendor/three/addons/)\ncss/style.css\njs/model.js       procedural modelling: exports buildOrbitalCore() → { root, parts, uniforms, materials }\njs/main.js        renderer, environment lighting, post-processing, camera, interaction, mode state machine, UI wiring\njs/audio.js       the core's hum, synthesized with WebAudio\nvendor/           three.module.min.js + three.core.min.js + OrbitControls / EffectComposer / RenderPass / UnrealBloomPass / OutputPass / ShaderPass and their dependencies; woff2 fonts\n```\n\n## The model (fully procedural; no external models loaded)\nWrite a `sweepProfile(profile, {phi0, phi1, steps, closed, caps})`: sweep a 2D profile `[(r, y)…]` around the Y axis (equivalent to Blender's Spin/Screw modifier). **Generate a separate band of faces with its own normals for each profile edge**, so bevel faces become crisp highlight lines; optionally cap the ends at phi0/phi1 with `ShapeUtils.triangulateShape`; correct triangle winding automatically from the vertex normals. UV u runs around the circumference, for \"turned metal\" brushing.\n\n1. **Plasma core**: a sphere of radius 0.5 with a ShaderMaterial — 3D simplex noise + domain-warped fbm to create convection cells, layered with bright filaments from `pow(1-|noise|, 9)`; a three-stop palette of deep blue → cobalt → white-hot, output as HDR (>1) to feed the bloom; a slight corona rim at the edge. Wrap it in two additively blended BackSide Fresnel halo spheres (0.86, 1.35).\n2. **Geodesic containment cage**: `IcosahedronGeometry(0.66, 1)`, dedupe the vertices and extract the 120 edges → thin cylindrical struts as an InstancedMesh + 42 octahedral titanium nodes + small LEDs on the 12 five-valent vertices. The whole cage slowly rotates.\n3. **Gyroscopic double ring (the key part)**: the outer ring, R=1.42, stands vertical and turns about Y with the gimbal (azimuth α); the inner ring, R=1.16, hangs from the outer ring at ±X on two stepped titanium pins and flips about the X axis (pitch β) — a gimbal that really turns, not two intersecting tori. Each ring:\n   - has a rectangular section with a 0.014 bevel and a groove cut into its outer face;\n   - is cut into 12/10 segments with 0.03 rad gaps between them, each segment capped at both ends;\n   - has a continuous glowing rail in the groove and a glowing \"spine\" strip at the ring's core that **shows only through the slits**, so every slit is a line of blue light;\n   - carries thickened titanium clamps at 0°/90°/180°/270°, each with three LEDs (two cool, one warm amber accent).\n   - The whole gimbal also tilts by ~0.2 rad, with a slow precession.\n4. **Levitation base**: one profile with steps, bevels and a ring groove, swept into a single body; a glowing ring in the groove; a Fresnel-patterned emitter lens at the centre (a concentric-step shader); on the deck, a dial drawn on a Canvas (fine 2° ticks, long 10°/30° ticks, a ring of micro-text `ORBITAL CORE · SPECIMEN 01 …`, 4 triangular index marks), additively blended and slowly turning with α; 72 cooling fins around the side (InstancedMesh); 24 status-light slits on the step risers; and an additive beam with flowing stripes from the lens up to the core.\n5. **Floor**: a large round dark floor + a radial-gradient \"baked AO\" contact-shadow decal + an additively blended floor-effects shader (a pool of light under the base, a dashed measuring ring every 1.45 units, fine ticks on the outer ring, and an expanding shockwave in Pulse mode).\n\n## Materials and lighting (the key to the \"Blender look\")\n- A procedural brushed texture: draw a few thousand random grey lines along u on a Canvas → use as the roughnessMap; rings and base use `MeshPhysicalMaterial` with `metalness 1`, the rings with clearcoat, the base with `anisotropy` enabled, for the radial highlights of turned metal.\n- Build your own mini \"HDRI studio\": in a scene, place a dark gradient sky sphere + a big overhead softbox + a cool-blue light strip on the left + a white light strip on the right + a blue horizon glow behind + a small warm bounce card, and bake it with `PMREMGenerator.fromScene` into `scene.environment`.\n- Put a shadow-casting point light inside the core (intensity following energy), so the rings and cage cast shadows onto the base; add a cool-white key light and a blue rim light.\n- The background is a sky-dome shader the same colour as a FogExp2, with the floor dissolving seamlessly into it in the distance — no hard horizon line.\n- Post: `EffectComposer` (a HalfFloat, MSAA 4x render target) → `UnrealBloomPass` (strength ~0.45, radius 0.4, threshold 0.95, so only HDR emitters bloom) → `OutputPass` (ACES) → a custom ShaderPass: slight chromatic aberration at the edges + vignette + film-grain dithering (which also removes banding in the darks).\n\n## Interaction and state machine\n- OrbitControls: damping, panning disabled, pitch limited so you can't go under the floor; distance computed automatically from the viewport aspect ratio (further in portrait); use `camera.setViewOffset` to push the model slightly right on desktop to make room for the headline, and slightly down on phones.\n- Opening: the camera eases in from a distant low angle over 3.4 seconds, and the core \"ignites\" between 0.35 and 2 seconds (timed by the real clock so it completes even on slow devices); control is handed over as soon as the user drags. Double-click or R to reset smoothly.\n- Four modes (buttons + keys 1–4):\n  - **Orbit**: α and β turn slowly, the camera orbits automatically, the core breathes slightly;\n  - **Pulse**: rotation speeds up, energy beats with a \"lub-dub\" double-peaked heartbeat envelope (1.25 s period), and each beat sends a shockwave ring across the floor and a low thump through the audio;\n  - **Still**: all rotation speeds damp to zero, the core idles with a faint glow, and the status lights turn amber;\n  - **Exploded**: the gimbal returns to neutral, the outer ring lifts above and the inner ring drops below, both rotating flat; the cage expands, the core floats up, the camera target rises; 5 HTML callouts with leader lines appear (plasma core / geodesic containment cage / outer ring · azimuth ring / inner ring · pitch ring / levitation base, with dimensions), their anchors projected every frame, ring callouts automatically taking the outermost on-screen point, and callouts clamped inside the viewport on phones.\n- All speeds, energy and explode progress are smoothed with exponential damping, so switching modes never jumps.\n- Adaptive resolution: below 30 fps, step pixelRatio down toward 1.\n\n## UI (layered over the canvas)\n- A thin 34 px top bar at the very top: 「← 三方对照」 on the left, 「轨道能量核心」 + a small pill tag in the middle, 「原作 @author ↗」 on the right.\n- Brand 「ORBITAL / OBJECTS」 + a small orbit icon top-left; 「样本 01 / DUAL-RING CONTAINMENT」 (Specimen 01) top-right.\n- A large headline on the left (serif, the second line in italic gradient type): 「两道轨道 / 一颗恒星。」 (\"Two orbits / one star.\") + a short description.\n- A live spec table on the right: status, core frequency (THz), outer-ring azimuth α, inner-ring pitch β, field output %, with a small oscilloscope below plotting energy history.\n- Four mode buttons bottom-left (with small glyphs and key hints), a footer with controls hints + a sound toggle (WebAudio: two slightly detuned sawtooth waves through a resonant low-pass + a sub-bass sine + a high shimmering tremolo, with the filter cutoff following energy and rotation speed).\n- A 76 px fine grid in the background (with a fading mask) and SVG noise grain.\n- ≤740 px: the headline moves to the top and the description is hidden, the spec table becomes a three-column strip, and the four buttons share one row equally; no horizontal overflow at 390 px wide.\n- Fonts: Instrument Serif (headline) + IBM Plex Mono (data), woff2 files in vendor, with Chinese falling back to system serif/sans.\n\n## Quality requirements\n- Zero console errors; show a Chinese notice if WebGL creation fails.\n- All glow colours use HDR values and \"glow\" through bloom, not by brightening the diffuse colour.\n- Darks must be deep (cobalt to near-black); the image must not wash out to white or grey overall.", "summary": "程序化扫掠的硬表面 + PBR + 辉光后期；两道环做成可独立转动的万向节，四种模式（轨道/脉冲/静止/拆解）+ WebAudio 声音", "summary_en": "Procedurally swept hard-surface geometry + PBR + bloom post-processing; the two rings become a gimbal that turns on independent axes, with four modes (Orbit / Pulse / Still / Exploded) + WebAudio sound", "caveat": "这一件 5.5 的起跑线比第一版高：它找到了原作者公开的代码仓库，读过原作的 HTML/JS、解析过原作的 GLB 模型（发现原作只有 1 球 2 环 1 底座共 4 个节点、3 种材质），并在本地跑过原作——所以版式明显参照了原作，属于「看过原作的重制 + 升级」；它没有复用原作的代码和模型。另有一处隔离泄漏：某次搜索结果的自动摘要里出现过第一版 PR 的描述（提到拆解视图），它没打开链接，已在心得里自己交代。", "caveat_en": "Opus 5.5 started this one from a higher line than the first version: it found the original author's public code repository, read the original's HTML/JS, parsed its GLB model (finding just 4 nodes — 1 sphere, 2 rings, 1 base — and 3 materials) and ran the original locally. So the layout clearly follows the original: this is a remake-plus-upgrade by someone who has seen the original, though it reuses none of the original's code or model. There was also one isolation leak: an auto-generated summary in a search result mentioned the first version's PR description (including the exploded view). It didn't open the link, and disclosed this itself in its notes.", "origShot": "原作截图：用作者公开仓库的代码在本地运行后截取", "origShot_en": "Original screenshot: captured by running the code from the author's public repository locally"}, "brandenburg-piano": {"notes": "<h1>勃兰登堡钢琴 · 独立逆向笔记<\/h1>\n<blockquote>\n<p>原作：Derya Unutmaz（@DeryaTR_）用 GPT-6 Astra 生成的 <em>Brandenburg Piano<\/em>（brandenburg-piano.vercel.app）。\n本版：从零重做，没有看过任何人的临摹版本，也打不开原作页面（环境屏蔽了 x.com 与 vercel）。<\/p>\n<\/blockquote>\n<h2>1. 我对原作的理解（核心卖点）<\/h2>\n<p>能拿到的公开资料只有几句话，但信息量其实很集中：<\/p>\n<ul>\n<li>页面标题是 <strong>「Brandenburg Piano — J. S. Bach」<\/strong>；搜索引擎摘要写着 <strong>\"a playable concert grand and Bach's complete Brandenburg Concertos, rendered from the orchestral score\"<\/strong>。<\/li>\n<li>作者原话大意是：让模型做一架<strong>能弹的<\/strong>虚拟钢琴，把<strong>六首勃兰登堡协奏曲全部<\/strong>塞进去，模型约 11 分钟完成。<\/li>\n<li>社区整理的一句话介绍是 \"Virtual piano with built-in performances of Bach's Brandenburg Concertos\"，并注明「音乐的准确性和完整性未经独立核实」。<\/li>\n<\/ul>\n<p>所以它的卖点有三层：\n1. <strong>一件乐器<\/strong>：一架音乐会三角钢琴，你自己也能弹。\n2. <strong>一套完整的曲库<\/strong>：不是几段旋律，而是「全部六首」。\n3. <strong>一个“翻译”动作<\/strong>：从<strong>乐队总谱<\/strong>折叠成一架钢琴。这是最有意思的一点——勃兰登堡协奏曲本来是十几件乐器的合奏，把它“渲染”到一架钢琴上，本身就是一件需要想清楚的事。<\/p>\n<p>社区那句「准确性未经核实」也提示了一个显而易见的弱点：一个 LLM 在 11 分钟里“凭记忆”写出六首协奏曲的全部音符，几乎不可能是真的。所以本次重做的第一目标不是“看起来像”，而是<strong>让每一个音都真的来自巴赫的总谱，并且可以被核查<\/strong>。<\/p>\n<h2>2. 逆向推断：从有限资料推出的关键机制<\/h2>\n<table>\n<thead>\n<tr>\n<th>推断<\/th>\n<th>依据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>有一个可交互的钢琴键盘，鼠标/键盘都能弹<\/td>\n<td>\"playable\"、\"virtual piano\"<\/td>\n<\/tr>\n<tr>\n<td>内置播放器：选曲 → 自动演奏，琴键随之按下<\/td>\n<td>\"built-in performances\"、\"All 6 Concertos are built in and can be played directly on the piano\"<\/td>\n<\/tr>\n<tr>\n<td>曲库按“协奏曲 → 乐章”组织，覆盖六首<\/td>\n<td>\"complete Brandenburg Concertos\"、\"all six\"<\/td>\n<\/tr>\n<tr>\n<td>演奏内容是乐队总谱的<strong>全部声部<\/strong>落到钢琴上，而不是单旋律<\/td>\n<td>\"rendered from the orchestral score\"<\/td>\n<\/tr>\n<tr>\n<td>纯前端、静态托管、Web Audio 发声<\/td>\n<td>部署在 vercel、11 分钟生成，不可能带服务端合成<\/td>\n<\/tr>\n<tr>\n<td>视觉上强调“音乐会三角钢琴”<\/td>\n<td>\"concert grand\" 这个措辞；推特预览是一段视频（缩略图拿不到）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>我拿不到的：原作的具体视觉（2D 还是 3D）、音色是合成还是采样、乐谱是模型手写还是解析文件。这些我都按“如果我要把这件事做到最好会怎么做”来决定，并在第 5 节写明哪些是有意识的偏离。<\/p>\n<h2>3. 实现思路与关键技术决策<\/h2>\n<p><strong>整体架构（无构建步骤，ES Module + importmap）<\/strong><\/p>\n<pre><code>index.html            页面骨架、顶栏、启动层、出处对话框\ncss/app.css           音乐厅风格 UI（桌面三栏 / 手机底部抽屉）\njs/stage.js           three.js 三维三角钢琴 + 音符“光轨” + 火花 + 体积光 + 泛光\njs/audio.js           采样钢琴引擎（4 力度层 + 制音器释放声 + 程序生成混响 + 总线压缩）\njs/player.js          前瞻调度器、倍速、静音/独奏后的动态去重\njs/main.js            UI 粘合、指针/键盘/Web MIDI 输入、总谱声部带、密度进度条\ndata/*.json           由 tools/build_data.py 从 **kern 乐谱生成的演奏数据（每乐章一个文件，按需加载）\nvendor/               three.js、Salamander 采样、字体（全部本地，无 CDN）\n<\/code><\/pre>\n<p><strong>关键决策<\/strong><\/p>\n<ol>\n<li><strong>真实乐谱 + 离线预处理<\/strong>。浏览器端不解析乐谱，而是离线用 Python 把 Humdrum <code>**kern<\/code> 解析成 <code>[起始ms, 时值ms, 音高, 力度, 声部, 标记]<\/code> 的扁平整数数组。好处：页面每个乐章只需 <code>fetch<\/code> 一个不超过 250 KB 的 JSON 就能开始（19 个乐章文件合计约 2.6 MB，gzip 后约为 1/4），按乐章懒加载并预取下一乐章。<\/li>\n<li><strong>“演奏”在构建时渲染，而不是在播放时机械地念谱<\/strong>。构建脚本做了：\n   - 速度曲线：每个乐章一个常见演奏速度；乐章结尾渐慢；延长记号前的小渐慢与延长；\n   - 力度模型：声部角色（独奏组 / 合奏 / 低音 / 通奏）× 拍位强弱 × 外声部突出（最高音 +12%、最低音 +5%）× 织体密度补偿；\n   - 句法：连线内连奏、连线尾略收、低音区八分音符“巴洛克式”断开、跳音 50%；\n   - 装饰音：kern 里的 <code>T<\/code>/<code>t<\/code>（全音/半音颤音）按巴洛克习惯<strong>从上方辅助音开始<\/strong>实时展开成真实的音符，时值只占 78%，最后落回主音；\n   - 反复：严格按该版的展开表（<code>*&gt;[A,B,C,B,…]<\/code>）展开；第一号第四乐章按巴赫的要求把小步舞曲在三重奏 I、波兰舞曲、三重奏 II 之间<strong>反始四次<\/strong>（反始时省略内部反复），并在进度条上标出段落。<\/li>\n<li><strong>乐队 → 钢琴的“折叠”规则在播放端做<\/strong>：同一时刻、同一音高的多件乐器只击一次键（取最强者，并略微加重），这样既不会出现同键连击的“机关枪”，又能在你<strong>静音或独奏某个声部<\/strong>时实时重算——关掉双簧管，原本被它“代表”的齐奏音会自动交给小提琴。<\/li>\n<li><strong>采样钢琴而不是振荡器<\/strong>。用 Salamander Grand Piano V3（CC BY 3.0）的 4 个力度层（v4/v8/v12/v15，每小三度一个采样，移调不超过 ±1 半音）+ 88 个制音器释放噪声。为了控制体积，我把采样截到 5–11 秒并加 1.5 秒淡出、重编码到 96 kbps，四层合计约 11 MB；<strong>中力度层先载入<\/strong>（约 2.8 MB），其余三层在后台补齐，所以点击后 1–2 秒就能开始。解码后自动检测每个采样的真正起音点，抵消 MP3 编码器延迟，保证现场弹奏的响应。<\/li>\n<li><strong>Web Audio 调度用“前瞻 + 独立时钟”<\/strong>：一个 Blob Worker 每 25 ms 发一次 tick，调度未来 220 ms 内的音符；这样切到后台标签页（rAF 被冻结）时演奏也不会断。视觉时间减去 <code>outputLatency<\/code>，让光和声音对齐。<\/li>\n<li><strong>3D 而不是 2D 卷帘<\/strong>：原作强调 “concert grand”，我用 three.js 从零建模了一架比例接近 2.7 m 音乐会三角琴的钢琴：S 形弯曲侧板、可开合琴盖和支杆、铸铁板（带开孔）、云杉音板、88 根琴弦（低音区为斜向交叉的铜缠弦）、调音钉、70 个会抬起的制音器、88 个带支点转动的琴键、三条腿和踏板琴箱。音符不是从天上掉下来，而是<strong>沿着自己那根琴弦从琴尾滑向琴键<\/strong>——到达“击弦线”时琴键按下、琴弦被点亮成该乐器的颜色、迸出火花，松键后琴弦余辉按制音器是否落下而衰减（最高音区没有制音器，余辉更长）。<\/li>\n<li><strong>四个机位<\/strong>：演奏者（默认，能同时看到琴键、琴弦和光轨）、观众席（经典琴盖侧影）、俯瞰（像竖琴一样的琴弦全景）、自动运镜。琴盖会在“看进琴肚子”的机位里升起并淡出。所有机位都按可用区域（扣掉两侧面板和底部走带）自动求取距离，并用 <code>setViewOffset<\/code> 把钢琴放在空白区域的正中。<\/li>\n<\/ol>\n<h2>4. 乐谱数据的来源、许可与处理过程<\/h2>\n<p><strong>来源<\/strong>：CCARH（斯坦福大学人文计算研究中心）的 MuseData / Humdrum 版《勃兰登堡协奏曲》，GitHub 仓库 <code>musedata/humdrum-bach-brandenburg<\/code>（通过 git 读取）。它据 1871 年巴赫协会版（BG 第 19 卷，Wilhelm Rust 编）逐音录入，并经过人工校对和“校听”。全部 21 个 <code>.krn<\/code> 文件、约 11.4 万个音符（所有声部合计）都被用上了。<\/p>\n<p><strong>我也检查过的替代来源<\/strong>：Mutopia Project（公有领域 / CC BY）在 GitHub 上只有第一号第 1、2 乐章、第二号第 1 乐章、第五号第 3 乐章的 LilyPond 源码；<code>npostavs/music-bach-brandenburg<\/code> 是这几份 Mutopia 文件的衍生；<code>musicologyman-lilypond<\/code> 只有第六号；music21 自带语料里没有勃兰登堡协奏曲。要“完整六首”，CCARH 是唯一齐全且学术上最可靠的来源。<\/p>\n<p><strong>许可（请务必注意）<\/strong>：巴赫的音乐本身在公有领域，但 CCARH 在仓库的 <code>LICENSE.txt<\/code> 中对其<strong>编码数据<\/strong>声明了版权（© 1994 CCARH），并附有一份较严格的使用协议：要求在使用时署名/致谢（第 6、7 条），同时写有“仅限个人与学术研究”、“不得用于公开表演或录音”、“不得嵌入分发的教学材料”等条款。我的处理：\n- 在页面的「乐谱与音色出处」对话框和本文件中按其第 6、7 条完整署名；\n- 数据文件里只保留经过重新计算的演奏数据（时间、音高、力度、声部编号），不包含 CCARH 的原始编码文本；\n- <strong>但这并不能消除许可上的不确定性<\/strong>。美国法下单纯的音高/时值事实能否受版权保护本身有争议，而协议条款是否约束从公开 GitHub 仓库获取数据的人也不清楚。<strong>如果要正式公开发布，建议先向 CCARH 确认，或者把可替换的乐章换成 Mutopia 的公有领域版本<\/strong>（构建脚本的数据接口是通用的，换源只需要写一个 LilyPond→MIDI→同格式 JSON 的适配）。<\/p>\n<p><strong>处理过程<\/strong>（脚本见 <code>tools/build_data.py<\/code>，对着 CCARH 仓库运行即可逐字节重建 <code>data/<\/code>）：\n1. 自写 Humdrum 解析器：支持多声部分裂/合并（<code>*^<\/code>/<code>*v<\/code>/<code>*x<\/code>）、和弦、附点与 <code>%<\/code> 有理时值、连音线 <code>[ _ ]<\/code>、连线 <code>( )<\/code>、颤音 <code>T/t<\/code>、延长 <code>;<\/code>、跳音 <code>'<\/code>、<code>sfz<\/code>，以及段落标签与展开表。每一行的时间由“所有声部中最早结束的音”推进。\n2. <strong>自检<\/strong>：逐个文件比对解析出的音符数与原文件的音符记号数（完全一致，个别跨分裂声部的连音线差 2–9 个）；逐小节检查每个小节的实际时值是否等于拍号规定的时值——21 个文件里只有终止小节和弱起小节不满，其余全部吻合。\n3. 核对移调乐器：确认该版的圆号、小号、高音小提琴都已写成<strong>实际音高<\/strong>（例如小号声部出现的音恰好是 F 调自然小号的泛音列：F4 A4 C5 … C6 D6 E♭6 E6 F6 G6），因此没有再做移调。\n4. 第三号的第二乐章（Adagio）在该版里写在第一乐章文件末尾，只有<strong>两个带延长记号的和弦<\/strong>（E 小调的弗里吉亚半终止：C–E–A 上的 iv⁶ → B 大三和弦）。我把它切成独立的一个乐章，照原样演奏，不加现代演奏者常补的华彩。\n5. 每个乐章的速度是我按常见演奏速度设定的（原谱大多没有速度记号，CCARH 文件里的 <code>*MM<\/code> 值是校听用的，并不可信），总时长约 88 分钟，接近常见录音的 90 分钟左右。<\/p>\n<h2>5. 和「常规做法」相比，我做了哪些不一样的尝试<\/h2>\n<ul>\n<li><strong>常规做法<\/strong>：Synthesia 式的 2D 瀑布流 + 一排平面琴键，音符用单色或按左右手着色。\n  <strong>我的做法<\/strong>：音符沿着真实三角钢琴内部的琴弦流动，<strong>按乐队里的原乐器着色<\/strong>（小号是白金、竖笛天蓝、双簧管青绿、圆号金黄、小提琴琥珀、中提琴玫瑰、古大提琴淡紫、羽管键琴紫罗兰……），琴弦、琴键、火花都用同一种颜色，你能“看见”哪件乐器在说话。<\/li>\n<li><strong>总谱 → 钢琴面板<\/strong>：右侧把每个声部画成一条独立的小卷帘，和三维钢琴同步滚动。这是“rendered from the orchestral score”这句话的可视化：上面是乐队，下面是它被折叠后的一架钢琴。点声部名静音，点「独」只听它——比如独奏第二号的小号，或者只听第五号里羽管键琴的华彩。<\/li>\n<li><strong>静音后动态重新折叠<\/strong>（见第 3 节第 3 点），而不是简单地把声部的音删掉。<\/li>\n<li><strong>颤音是真的被“演奏”出来的<\/strong>：光轨上显示为一根细长的主音条，但琴键和声音是上方辅助音与主音的快速交替。<\/li>\n<li><strong>组曲式的第四乐章<\/strong>：大多数实现会把 Menuetto / Trio / Polacca 当成四个独立小文件，我按巴赫写在谱上的“Menuetto da capo”要求把它们拼成一个完整乐章，并在标题、进度条上随段落切换。<\/li>\n<li><strong>钢琴的物理细节<\/strong>：同键重复时先“止住”上一根弦再击下一次；最高音区没有制音器所以余音更长；释放时播放真实的制音器落下声；低音区八分音符更断开，模拟通奏低音的“呼吸”。<\/li>\n<li><strong>可以一起弹<\/strong>：演奏进行时你照样可以用鼠标（支持划奏/多点触控）、电脑键盘（A–; 两个八度，Z/X 移八度，Shift 加重）或 <strong>Web MIDI 键盘<\/strong>（含延音踏板）在同一架琴上加入，你弹的音是暖白色的，会从琴键<strong>逆向<\/strong>飞回琴弦深处。<\/li>\n<li><strong>性能自适应<\/strong>：检测到连续掉帧时自动降低渲染分辨率，再不行就关掉泛光；手机默认关闭 MSAA、降低像素比。<\/li>\n<\/ul>\n<h2>6. 踩过的坑与修正过程<\/h2>\n<ol>\n<li><strong>琴肚子里什么都看不见<\/strong>。第一版渲染出来，琴盖和侧板都对，里面却是一片地板颜色。逐个给子物体上纯色才发现：我用“法线平均”做的多边形内缩在直角处自交，导致内衬那一圈环形挤出的<strong>洞没有被三角化<\/strong>，变成了一块盖住整个琴肚子的实心板。改成对贝塞尔轮廓本身做参数化内缩（每段控制点沿近似法线平移），并把侧板做成前端开口的 U 形，问题消失。<\/li>\n<li><strong>铸铁板看起来像一面黑镜子<\/strong>。高金属度在很暗的环境贴图里只反射黑色。把金属度降到 0.6、提亮基色，并把音板压暗，开孔才读得出“孔”的感觉。<\/li>\n<li><strong>泛光把整个键盘烧白<\/strong>。UnrealBloom 阈值 0.82 时，被聚光灯照亮的白键也超过阈值。把阈值提到 1.25，只让 HDR 的音符、被点亮的琴弦、火花和击弦线越过它。右侧琴颊上的一块“白光”是清漆对聚光灯的镜面反射，给琴颊/键床换了粗糙度更高的漆面。<\/li>\n<li><strong>离线测音量时前 13 秒异常小声<\/strong>。原因是测试脚本一次性调度了全部音符，触发了复音上限，把最早的音提前掐掉了——真实播放不会这样，但我借机把测试改成用 <code>OfflineAudioContext.suspend()<\/code> 分段调度，得到了可信的电平：稀疏乐章约 −22 dBFS RMS，全奏约 −17 dBFS，峰值 0.5–0.73，无削波、无爆音（相邻采样最大跳变 0.048）。<\/li>\n<li><strong>第三号第二乐章“不见了”<\/strong>。README 里的乐章表和实际文件对不上（第一号第 4–7 个文件其实是 Menuetto / Trio I / Polacca / Trio II），第三号的两个和弦藏在第一乐章文件末尾的 <code>!! Adagio<\/code> 注释后面。改为按文件内容而不是 README 识别乐章。<\/li>\n<li><strong>Headless Chromium 的 SwiftShader 每帧要 1–5 秒<\/strong>，截图直接超时。加了 <code>?freeze<\/code> 调试参数和 <code>__bp.still(ms)<\/code>：把播放头放到指定位置，只渲染几帧再截图；音频相关的测试则用 <code>?norender<\/code> 跑，避免被渲染拖慢调度。<\/li>\n<li><strong>Web Audio 参数安全<\/strong>：测试时给 <code>AudioParam<\/code> 和 <code>AudioBufferSourceNode<\/code> 打了补丁，任何非有限值、负时间或异常都会被记录。跑完 19 个乐章的播放、跳转、倍速、静音、暂停、结尾自动连播，记录为 0；控制台 0 报错。<\/li>\n<\/ol>\n<h2>7. 自评<\/h2>\n<p><strong>可能追平或超越的地方<\/strong>\n- <strong>乐谱的真实性和完整性<\/strong>：19 个乐章（含第三号的两和弦柔板和完整的第一号舞曲组）全部来自学术版总谱，所有声部、所有反复，可逐小节核查。这正是社区对原作存疑的地方。\n- <strong>“从总谱渲染”这件事是可见、可玩的<\/strong>：乐器着色、声部卷帘、静音/独奏后的动态折叠。\n- <strong>钢琴本身<\/strong>：真实采样、多力度层、制音器声、同弦重击处理；三维琴体有足够的细节，演奏时琴键、琴弦、制音器都在动。\n- <strong>细节打磨<\/strong>：机位自适应构图、手机抽屉式布局、MIDI 输入、后台播放不断、键盘快捷键。<\/p>\n<p><strong>还差的地方<\/strong>\n- <strong>演奏的“人味”<\/strong>有限：力度和速度是规则生成的，没有真正的乐句弧线、没有左右手的角色分配；全奏段落把 10 多个声部塞进一架钢琴时，内声部会显得拥挤——真正的钢琴改编会删减和重排，而我选择了“一个音都不删”。\n- <strong>速度是我定的<\/strong>，不同听众会有不同偏好（提供了 50%–140% 的滑杆）。\n- <strong>加载体积<\/strong>约 18 MB（其中采样 11 MB），首屏只需中力度层，但在弱网下仍要等几秒。\n- <strong>数据许可<\/strong>存在不确定性（见第 4 节）。\n- 三维琴体是程序化建模，近看仍能看出几何简化（琴腿、踏板琴箱、琴盖没有铰链细节）。<\/p>\n<h2>8. 如果重来一次<\/h2>\n<ul>\n<li>先花时间把 <strong>Mutopia 的公有领域 LilyPond 源<\/strong>接进来（本地装 LilyPond → MIDI），能用公有领域版本的乐章优先用它，CCARH 只补缺，把许可风险降到最低。<\/li>\n<li>在构建阶段做一个真正的<strong>“钢琴改编器”<\/strong>：按音域把声部分配给左右手，限制同时发声数，删去八度重复里过密的部分，让它听起来更像钢琴家会弹的改编，而不仅是“所有乐器的叠加”；同时保留“原样总谱”模式做对照。<\/li>\n<li>做一个“跟弹 / 练习”模式：选一个声部静音，让用户用 MIDI 键盘弹它，按时值打分。<\/li>\n<li>采样改为 Opus 并按需分片流式加载，进一步压缩首屏。<\/li>\n<li>在三维场景里加一段乐谱投影（把当前小节的五线谱渲染成纹理放在谱架位置）。<\/li>\n<\/ul>\n<h2>9. 模型标识<\/h2>\n<p>claude-opus-5-5<\/p>", "prompt": "# 一次性生成本作品的完整 Prompt\n\n> 下面是我会交给一个具备终端、网络（npm / GitHub / PyPI）和浏览器测试能力的编码模型的完整指令。\n\n---\n\n请做一个纯静态网页作品：**《勃兰登堡钢琴》（Brandenburg Piano）**——一架可以弹奏的三维音乐会三角钢琴，内置巴赫六首《勃兰登堡协奏曲》（BWV 1046–1051）的**全部乐章**，每个音都必须来自真实的总谱数据，并由乐队总谱“折叠”到这一架钢琴上演奏。界面文字用中文。\n\n## 硬性约束\n- 无构建步骤：`index.html` + ES Module + importmap，全部相对路径，**不得依赖任何 CDN**。第三方库用 `npm pack` 拉下来，把用到的文件放进 `vendor/`（three.js 只拷 `three.module.js`、`three.core.js` 以及 EffectComposer / RenderPass / UnrealBloomPass / OutputPass 及其依赖的 shader）。\n- 浏览器要求用户点击后才能发声：做一个启动层，点击后创建 `AudioContext`、开始载入采样。\n- 顶部细顶栏：左 `← 三方对照`（链到 `../../compare/index.html`），中间作品中文名 + 小标签「Opus 5.5 · 独立逆向」，右 `原作 @DeryaTR_ ↗`（链到 https://x.com/DeryaTR_/status/2096090915790069857）。\n- 手机 390px 宽不得横向溢出；控制台零报错；Web Audio 不得出现非有限参数或负的开始时间。\n\n## 1. 乐谱数据（最重要）\n1. `git clone https://github.com/musedata/humdrum-bach-brandenburg`（CCARH 据 1871 年巴赫协会版录入的 Humdrum `**kern`，21 个文件，约 11.4 万个音符）。注意它的 README 乐章表与文件不对应：`bwv1046d/e/f/g` 分别是 Menuetto / Trio I / Polacca / Trio II；第三号的两和弦 Adagio 写在 `bwv1048a.krn` 末尾 `!! Adagio` 注释之后。\n2. 用 Python 写一个 kern 解析器：支持 `*^ *v *x *-` 声部分裂合并、空格分隔的和弦、附点与 `%` 有理时值、连音线 `[ _ ]`（按“声部+音高”合并）、连线 `( )`、`T`/`t` 颤音、`;` 延长、`'` 跳音、`z`；段落标签 `*>A` 与展开表 `*>[A,B,…]`。每一数据行的时间 = 上一行时间 + 所有声部中最早结束的剩余时值。kern 音高：`c`=C4，`cc`=C5，`C`=C3，`CC`=C2，`#`/`-`/`n` 为升降还原。\n3. 自检：解析出的音符数 = 文件中的音符记号数；每个小节的时值 = 拍号时值（只允许终止和弱起小节例外）。该版的小号、圆号、高音小提琴已经是实际音高，不要再移调。\n4. 生成 19 个乐章：第一号 I、II、III、IV（IV = Menuetto → Trio I → Menuetto → Polacca → Menuetto → Trio II → Menuetto，反始时省略内部反复，段间停 0.9 秒，记录段落标记）；第二号 I–III；第三号 I、II（两和弦 Adagio）、III；第四、五、六号各 I–III。\n5. 在构建时“演奏”：每乐章设定常见演奏速度（四分音符 BPM，例如 1046/I 96、1048/I 104、1048/III 116、1049/I 96、1049/III 204、1050/I 98、1050/II 44、1051/III 140）；结尾 4 拍渐慢（时值 ×1+0.55x²）、延长记号 ×1.9、终止和弦多留 2.2 秒；力度 = 78 × 角色（独奏 1.0 / 合奏 0.84 / 低音 0.9 / 通奏 0.88）× 拍位强弱 × 外声部加权（最高音 ×1.12、最低音 ×1.05）× 密度补偿，加 ±2.5 随机；时值系数：连线内 1.0、连线尾 0.86、跳音 0.5、十六分 0.9、八分 0.8（低音 0.72）、四分 0.84、更长 0.92；颤音从上方辅助音开始、每音约 60–66 ms、占 78% 时值后落回主音（主音条仅用于显示，标记 flag=1；展开的音 flag=2）。\n6. 输出 `data/<id>.json`：`{id, concerto, title, zh, parts:[{code, la, zh, fam, color, role}], dur, bars:[[ms, 小节号]], marks:[[ms, 段名, 中文]], notes:[t,d,midi,vel,part,flag, …]}` 和 `data/index.json`。每个声部要有中文名和一种颜色：小提琴系琥珀/橙、中提琴玫瑰、大提琴酒红、低音维奥隆深紫红、羽管键琴/通奏紫罗兰、双簧管青绿、竖笛天蓝、长笛冰蓝、巴松橄榄、圆号金黄、小号白金、古大提琴淡紫、臂中提琴粉。\n7. 在 NOTES 与页面“出处”对话框里写明：数据 © 1994 CCARH（其协议要求署名，并含非商业/非公开表演等限制条款，存在许可不确定性），巴赫作品本身属公有领域；速度、力度、句法是演奏诠释而非乐谱内容。\n\n## 2. 声音\n- 采样：`npm pack @audio-samples/piano-mp3-velocity{4,8,12,15}@1.0.5` 与 `@audio-samples/piano-mp3-release@1.0.5`（Salamander Grand Piano V3，CC BY 3.0，Alexander Holm）。用 ffmpeg（可 `pip install imageio-ffmpeg`）裁到 5–11 秒并加 1.5 秒淡出，重编码 96 kbps，文件名里的 `#` 改成 `s`。\n- 引擎：中力度层先载入即可开播，其他层后台补齐；解码后检测每个采样的首个非静音点作为 `start()` 偏移；按力度选层（<50/74/97 分界），移调 ≤±1 半音；同键重击先 30 ms 止住上一根弦；释放用 `setTargetAtTime`，时间常数随音区从 0.18 s 降到 0.045 s，MIDI ≥ 89 无制音器（0.55 s）；释放时混入极轻的制音器噪声；最多 96 复音。\n- 总线：低架 +1.5 dB / 高架 −1.5 dB → 干声 + 程序生成的立体声卷积混响（2.6 s，逐渐变暗的噪声尾 + 早期反射，发送 0.26）→ 压缩器（−16 dB, 3.2:1）→ 主音量。\n- 调度：用 Blob Worker 每 25 ms tick，前瞻 220 ms；倍速 50%–140%（重新锚定时钟）；同一时刻同一音高的多件乐器只击一次键（取最强者 ×1.035），并在静音/独奏声部后**实时重新计算**；力度在播放端做 1.55 倍的动态扩展。视觉时间减去 `outputLatency`。\n\n## 3. 三维钢琴（three.js）\n- 单位米。88 键（白键宽 23.5 mm、可见长 150 mm；黑键 12.8×94 mm，按 C♯/D♯ 与 F♯/G♯/A♯ 分组微调位置），每键挂在后方支点上转动下沉。\n- 琴体轮廓用贝塞尔曲线：左侧直边、尾部圆弧、S 形弯曲侧板、右侧短直边；写一个“参数化内缩”函数（直接平移每段控制点，而不是对采样多边形做法线偏移，后者在直角处会自交导致带洞的挤出失败）得到内壁、铸铁板轮廓。侧板做成**前端开口的 U 形**以免挡住击弦线。\n- 部件：黑色钢琴漆（MeshPhysical，clearcoat）侧板与底板、深色云杉音板（Canvas 画木纹）、金色铸铁板（金属度 0.6，挖 4 个椭圆大孔 + 6 个圆孔）、音板上的弧形琴马、双排调音钉（Instanced）、88 根琴弦（低音 20 根为抬高并斜向交叉的铜缠弦）、70 个会抬起的制音器、键床/琴颊/谱架板（谱架板上用金色斜体写 “Joh. Seb. Bach · Six Concerts avec plusieurs instruments · 1721”）、带支杆的琴盖（铰链在左侧直边，开 0.56 rad）、三条带铜脚轮的琴腿、踏板琴箱和三个铜踏板。\n- 环境：自建 PMREM 环境（几块暖色柔光板 + 冷色轮廓光），暖色主聚光 + 冷色轮廓聚光 + 半球光；地面径向渐变与接触阴影；舞台体积光锥（自定义 shader，加法混合）；缓慢上升的尘埃粒子。\n- 音符光轨：Instanced 盒子（加法混合、横向渐变贴图、HDR 颜色），在琴弦上方沿各自琴弦从琴尾（3 秒前瞻，0.78 m/s）滑向击弦线；到达时琴键按下并发出乐器色的自发光、对应琴弦被点亮并按有无制音器衰减、制音器抬起、击弦线迸出火花；远处音符淡入。用户自己弹的音为暖白色，从琴键逆向飞回琴尾。\n- 后期：EffectComposer（HalfFloat + 4×MSAA）→ UnrealBloom（强度 0.75，半径 0.55，阈值 1.25，只让 HDR 元素发光）→ OutputPass（ACES）。\n- 机位：演奏者（默认）、观众席、俯瞰（相机 up = −Z）、自动运镜；平滑插值。琴盖只在观众席机位出现，其余机位升起并淡出。每个机位根据扣除侧栏与底栏后的可用区域，用一台临时相机把关键点（键盘两端、琴尾、弯曲侧板、腿）投影进 ±0.9 的 NDC 来求距离，再用 `setViewOffset` 把钢琴放到可用区域中心。\n- 性能自适应：平均帧时间持续 > 42 ms 就降像素比，最终关泛光；手机默认无 MSAA、像素比 1.25。\n\n## 4. 界面（中文，音乐厅气质）\n- 配色：近黑 #060507、羊皮纸 #efe6d2、金 #d9b56a；毛玻璃面板。字体：拉丁标题用 Cormorant Garamond（@fontsource，本地），中文标题用 Noto Serif SC 600（只拷贝覆盖页面用字的 unicode-range 分片），正文用系统无衬线。\n- 启动层：斜体大标题 “Brandenburg Piano”、中文“勃兰登堡钢琴”、一句说明、统计（6 首 / 19 个乐章 / 分钟数 / 音符数，从 index.json 计算）、主按钮「入场 · 从第一首开始」、次按钮「先自己弹两下」、采样载入进度条、「乐谱与音色出处」链接。启动层背后是观众席机位的钢琴；入场后镜头滑到演奏者视角。\n- 左栏「曲目单」：六首协奏曲（编号、调性、BWV、编制），乐章行显示罗马数字、原文速度标记（首乐章无标记者加方括号）、中文、时长、播放中的均衡器动画；底部是献辞日期与出处链接。\n- 中上「现在演奏」：No. · 调性 · BWV / 罗马数字 + 斜体标题 / 中文（原谱未标速度的注明）/ 组曲段落名。\n- 右栏「N 个声部 → 1 架钢琴」：每个声部一行（色点、中文名、独奏按钮），右侧是同步滚动的迷你卷帘（过去 1.2 s + 未来 4.8 s、小节线、当前线），发声时色点发光；点名字静音、点「独」只听它、「全部声部」复位；底部是该协奏曲简介。\n- 底部走带：上一/播放/下一、标题与时间、小节号、速度滑杆、机位分段按钮、连播开关、MIDI 按钮、音量；下方是可拖动的**音符密度进度条**（悬停显示时间/小节/段落，组曲段落画金线）；再下是键盘提示。\n- 输入：点/划 3D 琴键（Raycaster，多点触控、划奏），拖空白处轻微环绕；电脑键盘 A W S E D F T G Y H U J K O L P ; ' 两个八度，Z/X 移八度，Shift 加重；空格播放、←/→ 跳 5 秒、[ ] 换乐章、1–4 换机位；Web MIDI（含 CC64 延音）。\n- 960px 以下：侧栏变成底部抽屉（「曲目」「声部」「视角」按钮），走带换行；抽屉关闭时 `visibility:hidden`。\n- URL hash 记住乐章（`#1048-1`）；`?view=` 指定机位。\n\n## 5. 验证\n- 用 Playwright + SwiftShader（`--use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist --autoplay-policy=no-user-gesture-required`）跑：启动、点键、键盘弹奏、静音/独奏、换乐章、跳转、倍速、暂停、结尾自动连播，收集 console 与 pageerror；给 AudioParam / AudioBufferSourceNode 打补丁记录非法参数。\n- 用 `OfflineAudioContext` + `suspend()` 分段调度渲染 15–20 秒，检查 RMS（约 −17 至 −22 dBFS）、峰值 < 1、无爆音。\n- SwiftShader 很慢，给页面加 `?freeze` 与 `__bp.still(ms)` 调试钩子，定格到指定时刻再截图；截图 1440×900、390×844 亲眼检查构图、泛光、溢出。\n- 产出 `cover.jpg`（1400×875，隐藏顶栏，演奏中的演奏者视角）、`NOTES.md`、`PROMPT.md`。", "summary": "三角钢琴 + Salamander 真实钢琴采样；内置巴赫六首勃兰登堡协奏曲全部 19 个乐章的真实总谱（约 11.4 万个音符），音符沿琴弦流向琴键，九个声部可独奏 / 静音，支持 MIDI 键盘", "summary_en": "A grand piano + real Salamander piano samples; the actual full scores of all 19 movements of Bach's six Brandenburg Concertos (about 114,000 notes) built in, with notes flowing along the strings to the keys, nine voices that can be soloed or muted, and MIDI keyboard support", "caveat": "<b>不公开的只是作品本身<\/b>——代码，以及它内置的 CCARH 巴赫乐谱数据；prompt、心得和一张注明出处的截图照常公开。这一件用的是真实乐谱，不再是第一版的「巴赫风格」仿作：六首勃兰登堡协奏曲全部 19 个乐章、约 11.4 万个音符，数据来自斯坦福 CCARH 的 MuseData/Humdrum 电子版（据 1871 年巴赫协会版）。<b>为什么<\/b>：巴赫的音乐本身是公有领域，但这份电子乐谱是 CCARH 录入的，他们对录入数据主张版权；其授权只允许个人单用户使用与学术研究（第 4、5 条），不得公开表演（第 3 条），不得嵌入对外分发的材料（第 5 条）。把它放上公开网站让所有访客播放，超出了这份授权，而仓库作者无法向 CCARH 申请更宽的许可，所以作品本体不发布。可以合法公开的替代方案是改用 Mutopia 项目的公有领域乐谱，但它目前只有 4 个乐章。心得里没有报告隔离泄漏。", "caveat_en": "<b>Only the work itself is withheld<\/b> — its code and the CCARH Bach score data built into it. The prompt, the notes and one attributed screenshot are published as usual. This version uses real scores rather than the first version's Bach-style pastiche: all 19 movements of the six Brandenburg Concertos, about 114,000 notes, from Stanford CCARH's MuseData/Humdrum encoding (after the 1871 Bach-Gesellschaft edition). <b>Why<\/b>: Bach's music is in the public domain, but this digital score was encoded by CCARH, which claims copyright in the encoded data. Its license permits only personal, single-user and academic use (clauses 4 and 5), forbids public performance (clause 3) and forbids embedding in distributed materials (clause 5). Putting it on a public website for every visitor to play would exceed that license, and the repository's author has no way to obtain a broader license from CCARH, so the work itself is not released. A legally publishable alternative would be public-domain scores from the Mutopia Project, but it currently has only 4 of the movements. Its notes report no isolation leaks.", "held": "仅截图 · 作品本体不公开", "held_en": "Screenshot only · work not published", "heldShot": "静态截图，乐谱数据 © 1994 CCARH（斯坦福大学人文计算研究中心），据其授权第 7 条署名引用", "heldShot_en": "Static screenshot. Score data © 1994 CCARH (Center for Computer Assisted Research in the Humanities, Stanford University), cited with attribution under clause 7 of its license"}};
