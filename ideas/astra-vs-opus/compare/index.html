const t = k => (STR[k] ? STR[k][LANG] : k);
const L = (o, k) => (LANG === 'en' && o[k + '_en'] != null ? o[k + '_en'] : o[k]);
const wname = w => (LANG === 'en' ? w.en : w.zh);
function esc(s) { return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }
function intHref(h) { return storageOK ? h : h + (h.includes('?') ? '&' : '?') + 'lang=' + LANG; }

function applyStatic() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.title = t('title');
  document.querySelector('meta[name=description]').setAttribute('content', t('desc'));
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  const lb = document.getElementById('langBtn');
  lb.textContent = LANG === 'en' ? '中' : 'EN';
  document.querySelectorAll('a[data-int]').forEach(a => {
    if (!a.dataset.base) a.dataset.base = a.getAttribute('href');
    a.setAttribute('href', intHref(a.dataset.base));
  });
}

// ---------- 作品切换 ----------
const tabs = document.getElementById('tabs');
const ind = document.getElementById('ind');
const main = document.getElementById('main');
let current = null;

function buildTabs() {
  tabs.querySelectorAll('button').forEach(b => b.remove());
  WORKS.forEach(w => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.slug = w.slug;
    if ((V2[w.slug] || {}).held) b.classList.add('held');
    b.innerHTML = `<span class="d"></span>${esc(wname(w))}`;
    b.onclick = () => select(w.slug, true);
    tabs.appendChild(b);
  });
}
function moveInd(instant) {
  const b = tabs.querySelector('button.on');
  if (!b) return;
  if (instant) ind.style.transition = 'none';
  ind.style.width = b.offsetWidth + 'px';
  ind.style.transform = `translateX(${b.offsetLeft}px)`;
  if (instant) { ind.offsetWidth; ind.style.transition = ''; }
  const target = b.offsetLeft - (tabs.clientWidth - b.offsetWidth) / 2;
  tabs.scrollTo({ left: Math.max(0, target), behavior: instant || reduceMotion ? 'auto' : 'smooth' });
}

function originBlank(w) {
  return `<div class="blank"><q>${esc(w.quote[LANG])}</q><small>${w.demo ? t('blankDemo') : t('blankNone')}</small></div>`;
}

function select(slug, fromClick) {
  current = slug;
  [...tabs.querySelectorAll('button')].forEach(b => b.classList.toggle('on', b.dataset.slug === slug));
  moveInd(!fromClick);
  render();
  if (fromClick) {
    const top = main.getBoundingClientRect().top + scrollY - tabs.closest('.tabs').offsetHeight;
    if (scrollY > top) scrollTo({ top, behavior: reduceMotion ? 'auto' : 'smooth' });
  }
  try { history.replaceState(null, '', location.pathname + location.search + '#' + slug); } catch (e) {}
}

function render() {
  const w = WORKS.find(x => x.slug === current);
  const v2 = V2[w.slug] || {};
  const held = !!v2.held;
  const notes = LANG === 'en' && v2.notes_en ? v2.notes_en : v2.notes;
  const notesZhOnly = LANG === 'en' && v2.notes && !v2.notes_en;
  let promptBody = `<div class="pending">${t('promptNone')}</div>`;
  if (v2.prompt) {
    promptBody = (LANG === 'en' ? `<div class="plabel">${t('pOrig')}</div>` : '')
      + `<div class="clamp"><div class="md prompt">${esc(v2.prompt)}</div></div>
         <div class="more"><button type="button" data-more>${t('expand')}</button></div>`;
    if (LANG === 'en') promptBody += v2.prompt_en
      ? `<details class="tr"><summary>${t('pTrans')}</summary><div class="md prompt">${esc(v2.prompt_en)}</div></details>`
      : `<div class="note-only">${t('pNoTrans')}</div>`;
  }
  const origShot = L(v2, 'origShot');

  main.innerHTML = `
  <section class="work">
    <div class="work-head rise" style="--i:0">
      <div class="tt"><h2>${esc(wname(w))}</h2><span class="en">${LANG === 'en' ? '' : esc(w.en) + ' · '}${t('origBy')} ${esc(w.author)}</span></div>
      <span class="spacer"></span>
      <button class="bigbtn" type="button" id="theaterBtn">${t('theater')}</button>
    </div>

    <div class="seg rise" style="--i:1" role="tablist">
      <span class="knob"></span>
      <button type="button" class="on" data-go="0">${t('segA')}</button>
      <button type="button" data-go="1">Opus 5</button>
      <button type="button" data-go="2">Opus 5.5</button>
    </div>

    <div class="tri" id="tri">
      <article class="pane a rise" style="--i:1">
        <div class="ph"><span class="who">${t('wAstra')}</span><span class="sub">${esc(w.author)}</span>
          <a class="open" href="${w.demo || w.post}" target="_blank" rel="noopener">${t('openNew')}</a></div>
        <div class="stage" data-src="${w.demo}">${origShot
            ? `<img src="originals/${w.slug}.jpg" alt="${t('altOrig')}" loading="lazy">`
            : originBlank(w)}
          ${w.demo ? `<button class="load" type="button">${t('loadOrig')}</button>` : ''}</div>
        <div class="pd">${origShot ? `<span class="src">${esc(origShot)}</span>` : ''}<a href="${w.post}" target="_blank" rel="noopener">${t('post')}</a></div>
      </article>

      <article class="pane b rise" style="--i:2">
        <div class="ph"><span class="who">Opus 5</span><span class="sub">${t('wO5sub')}</span>
          <a class="open" href="${intHref(V1_URL(w.slug))}" target="_blank" rel="noopener">${t('openNew')}</a></div>
        <div class="stage" data-src="${V1_URL(w.slug)}">
          <img src="../assets/covers/${w.slug}.jpg" alt="${t('altO5')}" loading="lazy">
          <button class="load" type="button">${t('runLive')}</button></div>
        <div class="pd">${t('o5pd')}</div>
      </article>

      <article class="pane c rise" style="--i:3">
        <div class="ph"><span class="who">Opus 5.5</span><span class="sub">${t('wO55sub')}</span>
          ${held ? '' : `<a class="open" href="${intHref(V2_URL(w.slug))}" target="_blank" rel="noopener">${t('openNew')}</a>`}</div>
        <div class="stage" data-src="${V2_URL(w.slug)}">${held
          ? (v2.heldShot
              ? `<img src="held/${w.slug}.jpg" alt="${t('altHeld')}" loading="lazy"><span class="heldtag">${esc(L(v2, 'held'))}</span>`
              : `<div class="blank"><q>${esc(L(v2, 'held'))}</q><small>${t('heldBlank')}</small></div>`)
          : `<img src="../works-v2/${w.slug}/cover.jpg" alt="${t('altO55')}" loading="lazy" onerror="this.style.opacity=0">
          <button class="load" type="button">${t('runLive')}</button>`}</div>
        <div class="pd">${v2.heldShot ? `<span class="src">${esc(L(v2, 'heldShot'))}</span>` : ''}${v2.summary ? esc(L(v2, 'summary')) : t('o55pd')}</div>
      </article>
    </div>
    <div class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>

    ${v2.caveat ? `<div class="caveat rv"><span class="lab">${held ? t('cavHeld') : t('cavStart')}</span>${L(v2, 'caveat')}</div>` : ''}

    <div class="notes">
      <div class="card rv" style="--i:0">
        <h3><span class="dot"></span>${t('notesT')}${notesZhOnly ? `<span class="only">${t('zhOnly')}</span>` : ''}</h3>
        ${notes ? `<div class="clamp"${notesZhOnly ? ' lang="zh-CN"' : ''}><div class="md">${notes}</div></div>
          <div class="more"><button type="button" data-more>${t('expand')}</button></div>` : `<div class="pending">${t('notesNone')}</div>`}
      </div>
      <div class="card rv" style="--i:1">
        <h3><span class="dot"></span>${t('promptT')}${v2.prompt ? `<button type="button" data-copy>${t('copy')}</button>` : ''}</h3>
        ${promptBody}
      </div>
    </div>
  </section>`;

  wireWork(w, v2);
}

// 同一时间只实时运行一个窗口
function wireWork(w, v2) {
  const stages = [...main.querySelectorAll('.stage')];
  stages.forEach(st => { st._poster = st.innerHTML; });
  function restore(st) { if (st._live) { st.innerHTML = st._poster; st._live = false; bindLoad(st); } }
  function bindLoad(st) {
    const btn = st.querySelector('.load');
    if (!btn) return;
    btn.addEventListener('click', () => {
      stages.forEach(o => o !== st && restore(o));
      const f = document.createElement('iframe');
      f.src = st.dataset.src;
      f.allow = 'autoplay; fullscreen';
      f.title = wname(w);
      const stop = document.createElement('button');
      stop.className = 'unload'; stop.type = 'button'; stop.textContent = t('unload');
      stop.addEventListener('click', () => restore(st));
      st.innerHTML = '';
      st.appendChild(f); st.appendChild(stop);
      st._live = true;
    });
  }
  stages.forEach(bindLoad);

  main.querySelector('#theaterBtn').addEventListener('click', () => { stages.forEach(restore); openTheater(w); });

  const cp = main.querySelector('[data-copy]');
  if (cp) cp.addEventListener('click', () => {
    const done = () => { cp.textContent = t('copied'); setTimeout(() => cp.textContent = t('copy'), 1500); };
    try { navigator.clipboard.writeText(v2.prompt).then(done, () => {}); } catch (e) {}
  });

  main.querySelectorAll('[data-more]').forEach(b => {
    const clamp = b.closest('.card').querySelector('.clamp');
    // 内容本身不长就不需要「展开」
    requestAnimationFrame(() => { if (clamp.scrollHeight <= clamp.clientHeight + 4) { clamp.classList.add('open'); b.parentNode.remove(); } });
    b.addEventListener('click', () => {
      const open = clamp.classList.toggle('open');
      b.textContent = open ? t('collapse') : t('expand');
      if (!open) { const top = clamp.closest('.card').getBoundingClientRect().top + scrollY - 80; if (scrollY > top) scrollTo({ top }); }
    });
  });

  // 手机：胶囊 + 横滑分页 + 指示点
  const tri = main.querySelector('#tri');
  const seg = main.querySelector('.seg');
  const knob = seg.querySelector('.knob');
  const segBtns = [...seg.querySelectorAll('button')];
  const dots = [...main.querySelectorAll('.dots i')];
  const panes = [...tri.children];
  const COLORS = ['var(--astra)', 'var(--o5)', 'var(--o55)'];
  let idx = 0;
  function setIdx(i) {
    idx = i;
    knob.style.transform = `translateX(${i * 100}%)`;
    seg.style.setProperty('--kc', COLORS[i]);
    main.querySelector('.dots').style.setProperty('--kc', COLORS[i]);
    segBtns.forEach((b, j) => { b.classList.toggle('on', j === i); b.setAttribute('aria-selected', j === i); });
    dots.forEach((d, j) => d.classList.toggle('on', j === i));
  }
  segBtns.forEach((b, i) => b.addEventListener('click', () => {
    const p = panes[i];
    tri.scrollTo({ left: p.offsetLeft - (tri.clientWidth - p.offsetWidth) / 2, behavior: reduceMotion ? 'auto' : 'smooth' });
    setIdx(i);
  }));
  let raf = 0;
  tri.addEventListener('scroll', () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const c = tri.scrollLeft + tri.clientWidth / 2;
      let best = 0, bd = Infinity;
      panes.forEach((p, i) => { const d = Math.abs(p.offsetLeft + p.offsetWidth / 2 - c); if (d < bd) { bd = d; best = i; } });
      if (best !== idx) setIdx(best);
    });
  }, { passive: true });
  setIdx(0);

  observeReveal();
}

// 滚动揭示
let io = null;
function observeReveal() {
  const els = main.querySelectorAll('.rv');
  if (reduceMotion || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
  if (!io) io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -6% 0px' });
  els.forEach(e => io.observe(e));
}

// ---------- 三窗同开 ----------
const theater = document.getElementById('theater');
const thGrid = document.getElementById('thGrid');
let theaterSlug = null;
function openTheater(w) {
  theaterSlug = w.slug;
  const v2 = V2[w.slug] || {};
  document.getElementById('thTitle').textContent = wname(w);
  thGrid.innerHTML = `
    <div class="col a"><div class="lab">${t('wAstra')}<a href="${w.demo || w.post}" target="_blank" rel="noopener">${t('openShort')}</a></div>
      ${w.demo ? `<iframe src="${w.demo}" allow="autoplay; fullscreen" title="${esc(t('wAstra'))}"></iframe>` : `<div style="position:relative">${originBlank(w)}</div>`}</div>
    <div class="col b"><div class="lab">Opus 5<a href="${intHref(V1_URL(w.slug))}" target="_blank" rel="noopener">${t('openShort')}</a></div>
      <iframe src="${V1_URL(w.slug)}" allow="autoplay; fullscreen" title="Opus 5"></iframe></div>
    <div class="col c"><div class="lab">Opus 5.5${v2.held ? '' : `<a href="${intHref(V2_URL(w.slug))}" target="_blank" rel="noopener">${t('openShort')}</a>`}</div>
      ${v2.held
        ? (v2.heldShot ? `<div class="held-img"><img src="held/${w.slug}.jpg" alt="${t('altHeld')}"><span class="heldtag">${esc(L(v2, 'held'))}</span></div>`
                       : `<div style="position:relative"><div class="blank"><q>${esc(L(v2, 'held'))}</q></div></div>`)
        : `<iframe src="${V2_URL(w.slug)}" allow="autoplay; fullscreen" title="Opus 5.5"></iframe>`}</div>`;
  theater.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('thClose').focus();
}
function closeTheater() { theater.hidden = true; thGrid.innerHTML = ''; theaterSlug = null; document.body.style.overflow = ''; }
document.getElementById('thClose').addEventListener('click', closeTheater);
addEventListener('keydown', e => { if (e.key === 'Escape' && !theater.hidden) closeTheater(); });

// ---------- 数字滚动 ----------
function countUp() {
  document.querySelectorAll('[data-count]').forEach((el, i) => {
    const n = +el.dataset.count;
    if (reduceMotion) { el.textContent = n; return; }
    const t0 = performance.now() + 250 + i * 90, dur = 900;
    el.textContent = 0;
    (function step(now) {
      const p = Math.min(1, Math.max(0, (now - t0) / dur));
      el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    })(performance.now());
  });
}

// ---------- 切换语言（不刷新） ----------
function setLang(l) {
  LANG = l;
  lsSet('avo-lang', l);
  try {
    const u = new URL(location.href);
    if (u.searchParams.has('lang') || !storageOK) { u.searchParams.set('lang', l); history.replaceState(null, '', u); }
  } catch (e) {}
  applyStatic();
  buildTabs();
  [...tabs.querySelectorAll('button')].forEach(b => b.classList.toggle('on', b.dataset.slug === current));
  moveInd(true);
  const y = scrollY;
  render();
  main.querySelectorAll('.rise').forEach(e => e.style.animation = 'none');
  main.querySelectorAll('.rv').forEach(e => e.classList.add('in'));
  scrollTo(0, y);
  if (!theater.hidden && theaterSlug) {
    const w = WORKS.find(x => x.slug === theaterSlug);
    document.getElementById('thTitle').textContent = wname(w);
    document.querySelectorAll('#theater [data-i18n]').forEach(el => el.innerHTML = t(el.dataset.i18n));
  }
}
document.getElementById('langBtn').addEventListener('click', () => setLang(LANG === 'en' ? 'zh' : 'en'));

// 入场动画结束后移除，避免 fill-mode 盖住悬停位移
document.addEventListener('animationend', e => { if (e.animationName === 'rise') e.target.classList.remove('rise'); });
document.addEventListener('visibilitychange', () => document.documentElement.classList.toggle('paused', document.hidden));
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => moveInd(true), 120); });

// ---------- 启动 ----------
applyStatic();
buildTabs();
const start = (location.hash || '').slice(1);
select(WORKS.some(w => w.slug === start) ? start : WORKS[0].slug, false);
countUp();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => moveInd(true));
</script>
