<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ferrofluid</title>
<meta name="description" content="An interactive ferrofluid sculpture: drag the magnets and a pool of black magnetic liquid rises into Rosensweig spikes and ridges." />
<style>
  :root {
    --bg: #030405;
    --ink: #eceef3;
    --dim: rgba(236, 238, 243, .58);
    --faint: rgba(236, 238, 243, .32);
    --line: rgba(255, 255, 255, .13);
    --glass: rgba(12, 13, 17, .55);
    --amber: #ffa04a;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; -webkit-tap-highlight-color: transparent; }
  #fade { position: fixed; inset: 0; background: var(--bg); z-index: 9; pointer-events: none; transition: opacity 1.8s cubic-bezier(.4,0,.2,1); }
  #fade.gone { opacity: 0; }
  .hud { position: fixed; z-index: 4; pointer-events: none; user-select: none; -webkit-user-select: none; }
  .tl { top: max(22px, env(safe-area-inset-top)); left: 26px; }
  .t1 { font: 600 12px/1 var(--mono); letter-spacing: .46em; color: var(--ink); }
  .t2 { margin-top: 9px; font: italic 400 15px/1.3 var(--serif); color: var(--dim); }
  .t2 span { font-style: normal; color: var(--faint); font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; margin-left: 4px; }
  .tr { top: max(24px, env(safe-area-inset-top)); right: 26px; display: flex; align-items: center; gap: 10px; font: 500 10.5px/1 var(--mono); letter-spacing: .2em; color: var(--dim); }
  .bar { width: 92px; height: 2px; background: var(--line); position: relative; overflow: hidden; border-radius: 2px; }
  .bar i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, #ffa04a, #46d2ff 55%, #ff4f9e); }
  #fv { min-width: 34px; text-align: right; color: var(--ink); }
  .hint { left: 26px; bottom: max(24px, env(safe-area-inset-bottom)); display: flex; gap: 12px; align-items: center; padding: 10px 18px 10px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: opacity 1s ease; color: var(--ink); }
  .hint svg { flex: none; color: var(--amber); animation: nudge 2.4s ease-in-out infinite; }
  .hint b { display: block; font: 600 13px/1.2 var(--sans); letter-spacing: .01em; }
  .hint span { display: block; margin-top: 3px; font: 400 11.5px/1.3 var(--sans); color: var(--dim); }
  .hint.dim { opacity: .42; }
  .hint.dim svg { animation: none; }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(4px) rotate(8deg); } 60% { transform: translateX(-3px) rotate(-6deg); } }
  .br { right: 26px; bottom: max(26px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 16px; font: 500 10.5px/1 var(--mono); letter-spacing: .2em; color: var(--dim); }
  #mode { transition: color .6s; white-space: nowrap; }
  #mode.hands { color: var(--amber); }
  #snd { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); color: var(--ink); font: 500 10.5px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; cursor: pointer; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: border-color .3s, background .3s; }
  #snd:hover { border-color: rgba(255,255,255,.32); }
  #snd:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  #snd[aria-pressed="true"] { border-color: rgba(255,160,74,.6); }
  #snd .w { opacity: .25; transition: opacity .3s; }
  #snd[aria-pressed="true"] .w { opacity: 1; }
  .tag { position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; display: flex; align-items: center; gap: 6px; font: 600 9.5px/1 var(--mono); letter-spacing: .24em; color: #fff; opacity: 0; transition: opacity .8s ease; white-space: nowrap; will-change: transform; }
  .tag i { display: block; width: 22px; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.8)); }
  .tag em { font-style: normal; padding: 5px 9px; border: 1px solid rgba(255,255,255,.4); border-radius: 999px; background: rgba(0,0,0,.35); }
  .tag.on { opacity: 1; }
  #fail { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; padding: 24px; font: 400 15px/1.5 var(--serif); color: var(--dim); background: var(--bg); }
  #fail[hidden] { display: none; }
  @media (max-width: 640px) {
    .tl { left: 18px; top: max(18px, env(safe-area-inset-top)); }
    .t2 { font-size: 13.5px; }
    .tr { display: none; }
    .hint { left: 16px; right: 16px; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 48px); padding: 9px 14px 9px 10px; }
    .hint b { font-size: 12.5px; }
    .hint span { font-size: 11px; }
    .br { left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); justify-content: space-between; gap: 10px; }
    #mode { font-size: 9.5px; letter-spacing: .16em; }
  }
</style>

<body>
<canvas id="c" tabindex="0" aria-label="Interactive ferrofluid pool. Drag the glowing magnets to raise spikes in the liquid."></canvas>

<header class="hud tl">

<div class="hud hint" id="hint" role="note">
  <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
    <circle cx="16" cy="16" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="1.6" fill="currentColor"/>
    <path d="M4.5 16h5M22.5 16h5M16 4.5v5M16 22.5v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M7 13.5 4.5 16 7 18.5M25 13.5 27.5 16 25 18.5M13.5 7 16 4.5 18.5 7M13.5 25 16 27.5 18.5 25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M3 8v4h3l4 3.5v-11L6 8H3z" fill="currentColor"/><path class="w" d="M13 7.2a4 4 0 0 1 0 5.6M15.2 5a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span id="sndt">Sound off</span>
  </button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ------------------------------------------------------------------ *
 *  constants
 * ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);
const canvas = $('c');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth01 = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

const R = 5.0;                  // pool radius (world units)
const L = 2 * (R + 0.25);       // simulated square domain
const LIFT = 0.62;              // magnets float this far above their "field height"
const COARSE = matchMedia('(pointer: coarse)').matches;
const SMALL = Math.min(innerWidth, innerHeight) < 700;
const N = (COARSE || SMALL) ? 256 : 360;        // simulation + mesh resolution
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MAX_PR = Math.min(window.devicePixelRatio || 1, 2);   // DPR capped at 2

/* critically damped spring (stable for any dt) */
function damp(cur, tgt, vel, omega, dt) {
  const x = omega * dt;
  const e = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
  const ch = cur - tgt;
  const tmp = (vel + omega * ch) * dt;
  return [tgt + (ch + tmp) * e, (vel - omega * tmp) * e];
}

/* ------------------------------------------------------------------ *
 *  GLSL
 * ------------------------------------------------------------------ */
const QUAD_VS = /* glsl */`
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

// Ferrofluid height simulation.
// state.r = spike/mound layer height, .g = its velocity
// state.b = free-surface wave height,  .a = its velocity
const SIM_FS = /* glsl */`
varying vec2 vUv;
uniform sampler2D uState;
uniform vec4 uMag[3];       // x, z, field height, on
uniform vec4 uMagPrev[3];
uniform vec4 uLat[3];       // lattice spacing, lattice rotation
uniform float uDt, uFrameDt, uTime, uL, uR, uTex, uWob;
uniform vec4 uPoke;         // x, z, strength, radius

float th(float x){ float e = exp(-2.0 * abs(x)); return sign(x) * (1.0 - e) / (1.0 + e); }

float fieldOf(vec2 x, vec4 m){
  vec2 d = x - m.xy;
  float hc = m.z + 0.6;
  float d2 = dot(d, d) + hc * hc;
  return m.w * 2.5 * hc / (d2 * sqrt(d2));
}
float fieldAll(vec2 x){ return fieldOf(x, uMag[0]) + fieldOf(x, uMag[1]) + fieldOf(x, uMag[2]); }
float fieldPrev(vec2 x){ return fieldOf(x, uMagPrev[0]) + fieldOf(x, uMagPrev[1]) + fieldOf(x, uMagPrev[2]); }

float moundOf(float B){ return 0.40 * th(0.75 * B); }
float ampOf(float B){ return 0.55 * th(1.8 * max(B - 0.30, 0.0)) + 0.2 * sqrt(max(B - 1.0, 0.0)); }
// concave-flanked Rosensweig cone: (1-d)^1.75
float prof(float d){ float k = max(1.0 - d, 0.0); return k * sqrt(k * sqrt(k)); }

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 rot2(vec2 v, float a){ float c = cos(a), s = sin(a); return vec2(c * v.x - s * v.y, s * v.x + c * v.y); }

// offset to the nearest point of a hexagonal lattice (xy) and that point (zw)
vec4 hexCell(vec2 q, float a){
  vec2 r = vec2(1.0, 1.7320508) * a;
  vec2 h = 0.5 * r;
  vec2 A = mod(q, r) - h;
  vec2 B = mod(q - h, r) - h;
  vec2 o = dot(A, A) < dot(B, B) ? A : B;
  return vec4(o, q - o);
}

// chain of spikes bridging two magnets
float ridgeOf(vec2 x, vec4 ma, vec4 mb, float ba, float bb, float aR){
  vec2 ab = mb.xy - ma.xy;
  float Lab = max(length(ab), 1e-3);
  vec2 dir = ab / Lab;
  float t = clamp(dot(x - ma.xy, dir), 0.0, Lab);
  float dp = length(x - (ma.xy + dir * t));
  float bal = 4.0 * ba * bb / ((ba + bb) * (ba + bb) + 1e-6);
  float g = sqrt(ba * bb) * bal * sqrt(bal) * (1.0 - smoothstep(1.5, 4.4, Lab));
  float u = (t - 0.5 * Lab) / aR;
  float du = (fract(u + 0.5) - 0.5) * aR;
  float dd = length(vec2(du, dp)) / (0.5 * aR);
  float A = 0.55 * th(2.4 * max(g - 0.10, 0.0));
  return A * prof(dd) + 0.12 * th(3.0 * g) * exp(-dp * dp / 0.12);
}

void main(){
  vec2 x = (vUv - 0.5) * uL;
  float r = length(x);
  vec4 s = texture2D(uState, vUv);

  float Bi[3];
  Bi[0] = fieldOf(x, uMag[0]);
  Bi[1] = fieldOf(x, uMag[1]);
  Bi[2] = fieldOf(x, uMag[2]);
  float Bt = Bi[0] + Bi[1] + Bi[2];

  // --- Rosensweig spike lattices, one per magnet, blended by field dominance
  float S = 0.0, W = 0.0;
  for (int i = 0; i < 3; i++) {
    vec4 m = uMag[i];
    float a = uLat[i].x, ang = uLat[i].y;
    vec2 q = rot2(x - m.xy, -ang);
    vec4 hc = hexCell(q, a);
    vec2 cellQ = hc.zw;
    float id = hash12(floor(cellQ * (2.0 / a) + 0.5) + float(i) * 37.0);
    float d0 = length(hc.xy) / (0.5 * a);
    vec2 wob = uWob * 0.07 * a * vec2(sin(uTime * 1.9 + id * 6.283), cos(uTime * 1.5 + id * 11.7)) * max(1.0 - d0, 0.0);
    float d = length(hc.xy - wob) / (0.5 * a);
    vec2 cw = m.xy + rot2(cellQ, ang);
    float A = ampOf(fieldAll(cw)) * (1.0 + uWob * 0.08 * sin(uTime * 2.6 + id * 6.283));
    float w = Bi[i] * Bi[i] * Bi[i] + 1e-6;
    S += w * A * prof(d);
    W += w;
  }
  S /= W;

  // --- ridges: spike chains between neighbouring magnets
  float rg = ridgeOf(x, uMag[0], uMag[1], Bi[0], Bi[1], 0.5 * (uLat[0].x + uLat[1].x));
  rg = max(rg, ridgeOf(x, uMag[0], uMag[2], Bi[0], Bi[2], 0.5 * (uLat[0].x + uLat[2].x)));
  rg = max(rg, ridgeOf(x, uMag[1], uMag[2], Bi[1], Bi[2], 0.5 * (uLat[1].x + uLat[2].x)));

  // --- bulk mound + the trough it drains from
  float broad = 0.0;
  for (int i = 0; i < 3; i++) {
    vec2 dd = x - uMag[i].xy;
    float hc = uMag[i].z + 0.6;
    broad += uMag[i].w * exp(-dot(dd, dd) / 6.5) / (hc * hc);
  }
  float mound = moundOf(Bt) - 0.09 * th(broad);

  float edgeK = 1.0 - smoothstep(uR - 1.1, uR - 0.15, r);
  float calm = 1.0 - smoothstep(uR - 0.6, uR, r);
  float idle = 0.012 * (sin(x.x * 1.6 + uTime * 0.55) * sin(x.y * 1.3 - uTime * 0.41) + 0.6 * sin((x.x - x.y) * 2.3 + uTime * 0.8)) * calm;
  float men = smoothstep(uR - 0.5, uR, r);
  float T = (mound + max(S, rg)) * edgeK + idle + 0.07 * men * men;

  // --- spike layer: stiff when rising (instability snaps up), softer when relaxing
  float hs = s.x, vs = s.y, hw = s.z, vw = s.w;
  float up = step(hs, T);
  float K = mix(230.0, 640.0, up);
  float Dm = mix(9.0, 13.5, up);
  vs += (K * (T - hs) - Dm * vs) * uDt;
  hs += vs * uDt;

  // --- free-surface waves (ripples from moving mounds, collapsing spikes and pokes)
  float dx = uL * uTex;
  float wl = texture2D(uState, vUv - vec2(uTex, 0.0)).z;
  float wr = texture2D(uState, vUv + vec2(uTex, 0.0)).z;
  float wd = texture2D(uState, vUv - vec2(0.0, uTex)).z;
  float wu = texture2D(uState, vUv + vec2(0.0, uTex)).z;
  float lap = (wl + wr + wd + wu - 4.0 * hw) / (dx * dx);
  float dM = (moundOf(Bt) - moundOf(fieldPrev(x))) / max(uFrameDt, 1e-3);
  float exc = -0.9 * dM * edgeK - 0.12 * vs;
  vw += (1.15 * lap - 1.5 * vw - 2.5 * hw + exc) * uDt;
  vec2 pd = x - uPoke.xy;
  vw -= uPoke.z * exp(-dot(pd, pd) / (uPoke.w * uPoke.w));
  hw += vw * uDt;
  if (r > uR - 0.03) { hw = 0.0; vw = 0.0; }

  gl_FragColor = vec4(hs, clamp(vs, -40.0, 40.0), clamp(hw, -0.6, 0.6), vw);
}
`;

// gradient (xy), curvature (z) and total height (w) for rendering
const NRM_FS = /* glsl */`
varying vec2 vUv;
uniform sampler2D uState;
uniform float uTex, uDx;
float H(vec2 uv){ vec4 s = texture2D(uState, uv); return s.x + s.z; }
void main(){
  float c = H(vUv);
  float l = H(vUv - vec2(uTex, 0.0));
  float r = H(vUv + vec2(uTex, 0.0));
  float d = H(vUv - vec2(0.0, uTex));
  float u = H(vUv + vec2(0.0, uTex));
  gl_FragColor = vec4((r - l) / (2.0 * uDx), (u - d) / (2.0 * uDx), (l + r + d + u - 4.0 * c) / (uDx * uDx), c);
}
`;

const GRAIN = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uAspect: { value: 1 } },
  vertexShader: /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uAspect; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 p = vUv - 0.5; p.x *= max(uAspect, 1.0); p.y *= max(1.0 / uAspect, 1.0) * 0.8;
      float v = 1.0 - smoothstep(0.38, 1.05, length(p));
      c.rgb *= mix(0.45, 1.0, v);
      c.rgb += (h(vUv * 917.0 + fract(uTime * 0.37) * 61.0) - 0.5) * 0.022;
      gl_FragColor = vec4(c.rgb, 1.0);
    }`
};

/* ------------------------------------------------------------------ *
 *  main
 * ------------------------------------------------------------------ */
function start(renderer) {
  let PR = MAX_PR;
  renderer.setPixelRatio(PR);
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.02;
  renderer.setClearColor(0x030405, 1);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030405);
  scene.fog = new THREE.FogExp2(0x030405, 0.018);

  const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 200);
  const camTarget = new THREE.Vector3(0, 0.35, 0);

  /* ---------------- procedural studio environment (reflections) ---------------- */
  function buildEnv() {
    const es = new THREE.Scene();
    const sg = new THREE.SphereGeometry(40, 48, 24);
    const cols = [];
    const p = sg.attributes.position;
    const top = new THREE.Color(0.030, 0.034, 0.046), hor = new THREE.Color(0.011, 0.012, 0.017), bot = new THREE.Color(0.001, 0.001, 0.0015);
    for (let i = 0; i < p.count; i++) {
      const y = p.getY(i) / 40;
      const c = y > 0 ? hor.clone().lerp(top, Math.pow(y, 0.7)) : hor.clone().lerp(bot, Math.min(1, -y * 3));
      cols.push(c.r, c.g, c.b);
    }
    sg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    es.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    const hdr = (hex, k) => new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k), side: THREE.DoubleSide });
    const ring = (rad, y, tube, hex, k) => {
      const m = new THREE.Mesh(new THREE.TorusGeometry(rad, tube, 8, 180), hdr(hex, k));
      m.rotation.x = Math.PI / 2; m.position.y = y; es.add(m);
    };
    ring(20, 12.5, 0.16, '#ffffff', 3.2);
    ring(20, 18.5, 0.34, '#dfe8ff', 2.2);
    ring(6.5, 17, 0.22, '#ffffff', 5.0);
    const box = (w, h, az, el, dist, hex, k) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), hdr(hex, k));
      m.position.set(Math.sin(az) * Math.cos(el) * dist, Math.sin(el) * dist, Math.cos(az) * Math.cos(el) * dist);
      m.lookAt(0, 0, 0); es.add(m);
    };
    box(9, 15, 2.2, 0.32, 24, '#ff8a3d', 1.5);
    box(9, 15, -2.15, 0.38, 24, '#3da8ff', 1.8);
    box(24, 2.0, Math.PI, 0.95, 21, '#ffffff', 2.4);
    box(24, 1.0, 0.0, 0.88, 21, '#ffffff', 1.6);
    box(6, 20, 0.9, 0.25, 26, '#b9c6ff', 0.55);
    const fl = new THREE.Mesh(new THREE.CircleGeometry(39, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
    fl.rotation.x = -Math.PI / 2; fl.position.y = -3; es.add(fl);
    const pm = new THREE.PMREMGenerator(renderer);
    const rt = pm.fromScene(es, 0.02);
    pm.dispose();
    es.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    return rt.texture;
  }
  scene.environment = buildEnv();

  /* ---------------- GPU simulation ---------------- */
  const canFloat = renderer.extensions.has('EXT_color_buffer_float');
  const mkRT = (type, filter) => new THREE.WebGLRenderTarget(N, N, {
    type, format: THREE.RGBAFormat, minFilter: filter, magFilter: filter,

    }
  }

  // warm start: the pool is already alive on the very first frame
  computeFields(1);
  MAGS.forEach((m) => { m.a = 0.5 - 0.16 * clamp((m.Bc - 0.3) / 1.4, 0, 1); });
  writeMagUniforms();
  for (let k = 0; k < 30; k++) { simU.uTime.value = k / 60; simStep(1 / 60, 1 / 60, 0); }
  normalPass();

  /* ---------------- interaction ---------------- */
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const tmpV = new THREE.Vector3();
  function rayPlane(cx, cy, y) {
    ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const o = raycaster.ray.origin, d = raycaster.ray.direction;
    if (Math.abs(d.y) < 1e-4) return null;
    const t = (y - o.y) / d.y;
    if (t < 0) return null;
    return new THREE.Vector2(o.x + d.x * t, o.z + d.z * t);
  }
  function clampPool(v) { const l = v.length(), mx = R - 1.0; if (l > mx) v.multiplyScalar(mx / l); return v; }
  function pick(cx, cy) {
    let best = null, bd = 1e9;
    const vf = Math.tan((camera.fov * Math.PI) / 360);
    for (const m of MAGS) {
      if (m.drag !== null) continue;
      tmpV.set(m.pos.x, m.h + LIFT, m.pos.y);
      const dist = camera.position.distanceTo(tmpV);
      tmpV.project(camera);
      const sx = (tmpV.x * 0.5 + 0.5) * innerWidth, sy = (-tmpV.y * 0.5 + 0.5) * innerHeight;
      const rpx = (0.42 / (dist * vf)) * (innerHeight / 2);
      const thr = Math.max(rpx * 1.5, COARSE ? 36 : 22);
      const d = Math.hypot(sx - cx, sy - cy);
      if (d < thr && d < bd) { bd = d; best = m; }
    }
    return best;
  }
  function takeControl() {
    if (autoW > 0) for (const m of MAGS) { m.hold.copy(m.pos); m.userH = m.h; }
    lastMag = performance.now();
  }
  function firstGrab() {
    if (hintDone) return;
    hintDone = true;
    $('hint').classList.add('dim');
    $('tag').classList.remove('on');
  }
  function poke(x, z, s) { pokeQ = { x, z, s }; }

  const ptrs = new Map();
  canvas.addEventListener('pointerdown', (e) => {
    lastAny = performance.now();
    const m = pick(e.clientX, e.clientY);
    if (m) {
      e.stopImmediatePropagation();
      e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      takeControl();
      m.drag = e.pointerId;
      m.dragY = m.h + LIFT;
      const hit = rayPlane(e.clientX, e.clientY, m.dragY) || m.pos.clone();
      m.grabOff.copy(hit).sub(m.pos);
      m.dragTarget.copy(m.pos);
      m.userH = 0.95;
      ptrs.set(e.pointerId, { m, x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 });
      canvas.style.cursor = 'grabbing';
      firstGrab();
      sound.grab(m.i);
    } else {
      ptrs.set(e.pointerId, { m: null, x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 });
    }
  }, { capture: true });

  canvas.addEventListener('pointermove', (e) => {
    const p = ptrs.get(e.pointerId);
    if (p) {
      p.moved = Math.max(p.moved, Math.hypot(e.clientX - p.x, e.clientY - p.y));
      if (p.m) {
        const hit = rayPlane(e.clientX, e.clientY, p.m.dragY);
        if (hit) { hit.sub(p.m.grabOff); clampPool(hit); p.m.dragTarget.copy(hit); }
        lastMag = performance.now();
      }
    } else if (e.pointerType === 'mouse') {
      hoverState.m = pick(e.clientX, e.clientY);
      canvas.style.cursor = hoverState.m ? 'grab' : '';
    }
  });
  function release(e) {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    ptrs.delete(e.pointerId);
    if (p.m) {
      p.m.drag = null;
      p.m.hold.copy(p.m.pos);
      lastMag = performance.now();
      canvas.style.cursor = e.pointerType === 'mouse' ? 'grab' : '';
    } else if (e.type === 'pointerup' && p.moved < 6 && performance.now() - p.t < 400) {
      const hit = rayPlane(e.clientX, e.clientY, 0.0);
      if (hit && hit.length() < R - 0.2) { poke(hit.x, hit.y, 1.1); sound.plip(0.8); }
    }
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && !ptrs.size) { hoverState.m = null; canvas.style.cursor = ''; } });
  canvas.addEventListener('wheel', (e) => {
    lastAny = performance.now();
    let m = hoverState.m;
    if (!m) for (const p of ptrs.values()) if (p.m) { m = p.m; break; }
    if (!m) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    takeControl();
    m.userH = clamp(m.userH + e.deltaY * 0.0022, 0.85, 3.0);
  }, { capture: true, passive: false });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  if (COARSE) $('hint2').textContent = 'tap the pool to ripple it · pinch to zoom';

  /* ---------------- sound (only after a click) ---------------- */
  const sound = (() => {
    let ctx = null, on = false, N_ = null;
    function init() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      const master = ctx.createGain(); master.gain.value = 0;
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 3;
      master.connect(comp); comp.connect(ctx.destination);
      // procedural reverb impulse
      const len = Math.floor(ctx.sampleRate * 3.2);
      const ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8); }
      const conv = ctx.createConvolver(); conv.buffer = ir;
      const wet = ctx.createGain(); wet.gain.value = 0.34; conv.connect(wet); wet.connect(master);
      // drone
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240; lp.Q.value = 3;
      const droneG = ctx.createGain(); droneG.gain.value = 0.14;
      lp.connect(droneG); droneG.connect(master); droneG.connect(conv);
      [[55, 'sine', 0.5], [82.41, 'sine', 0.3], [110.3, 'triangle', 0.18], [164.6, 'sine', 0.08]].forEach(([f, t, g]) => {
        const o = ctx.createOscillator(); o.type = t; o.frequency.value = f;
        const og = ctx.createGain(); og.gain.value = g; o.connect(og); og.connect(lp); o.start();
      });
      // magnetic hum while dragging
      const hum = ctx.createOscillator(); hum.type = 'sawtooth'; hum.frequency.value = 110;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 7;
      const humG = ctx.createGain(); humG.gain.value = 0;
      hum.connect(bp); bp.connect(humG); humG.connect(master); humG.connect(conv); hum.start();
      // crackle when spikes erupt
      const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const nd = nb.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() < 0.02 ? (Math.random() * 2 - 1) : (Math.random() * 2 - 1) * 0.15;
      const ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
      const crG = ctx.createGain(); crG.gain.value = 0;
      ns.connect(hp); hp.connect(crG); crG.connect(master); crG.connect(conv); ns.start();
      N_ = { master, conv, lp, droneG, hum, humG, crG };
      return true;
    }
    function set(v) {
      if (v && !ctx && !init()) return false;
      on = v;
      const t = ctx.currentTime;
      if (on) { ctx.resume(); N_.master.gain.cancelScheduledValues(t); N_.master.gain.setTargetAtTime(0.75, t, 0.5); }
      else { N_.master.gain.cancelScheduledValues(t); N_.master.gain.setTargetAtTime(0, t, 0.15); }
      return true;
    }
    function update(e, de, dragSpeed) {
      if (!on || !ctx) return;
      const t = ctx.currentTime, en = clamp(e / 3, 0, 1);
      N_.lp.frequency.setTargetAtTime(160 + 1100 * en, t, 0.15);
      N_.droneG.gain.setTargetAtTime(0.09 + 0.11 * en, t, 0.3);
      N_.hum.frequency.setTargetAtTime(92 + 40 * en, t, 0.2);
      N_.humG.gain.setTargetAtTime(Math.min(0.08, dragSpeed * 0.012), t, 0.08);
      N_.crG.gain.setTargetAtTime(Math.min(0.22, Math.max(0, de) * 0.05), t, 0.05);
    }
    function blip(f0, f1, dur, g) {
      if (!on || !ctx) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const a = ctx.createGain(); a.gain.setValueAtTime(0.0001, t); a.gain.exponentialRampToValueAtTime(g, t + 0.01); a.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(a); a.connect(N_.master); a.connect(N_.conv); o.start(t); o.stop(t + dur + 0.05);
    }
    return {
      toggle() { return set(!on) ? on : false; },
      update,
      plip(k) { blip(720 * (0.9 + Math.random() * 0.25), 260, 0.35, 0.18 * k); },
      grab(i) { blip([98, 123.5, 146.8][i] * 2, [98, 123.5, 146.8][i], 0.5, 0.22); }
    };
  })();
  $('snd').addEventListener('click', () => {
    const v = sound.toggle();
    $('snd').setAttribute('aria-pressed', v ? 'true' : 'false');
    $('sndt').textContent = v ? 'Sound on' : 'Sound off';
  });

  /* ---------------- resize & adaptive quality ---------------- */
  function setPR(v) {
    PR = v;
    renderer.setPixelRatio(PR);
    composer.setPixelRatio(PR);
    dustU.uPR.value = PR;
  }
  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
    frameCamera();
  });
  let ema = 16, perfT = 0;

  /* ---------------- per-frame update ---------------- */
  const tagEl = $('tag'), modeEl = $('mode'), barEl = $('bar'), fvEl = $('fv');
  let modeText = '', hud = 0;

  function update(dt, now) {
    let dragging = 0;
    for (const m of MAGS) if (m.drag !== null) dragging++;
    const idle = now - lastMag > 5000 && dragging === 0;
    autoW = idle ? Math.min(1, autoW + dt / 2.5) : Math.max(0, autoW - dt * 5);
    const aw = smooth01(autoW);
    tau += dt * aw * SPEED;

    let dragSpeed = 0;
    for (const m of MAGS) {
      m.prev.copy(m.pos); m.prevH = m.h;
      let tx, tz, th;
      if (m.drag !== null) {
        tx = m.dragTarget.x; tz = m.dragTarget.y; th = m.userH - 0.08;
      } else {
        const c = choreo(m.i, tau);
        tx = m.hold.x + (c.x - m.hold.x) * aw;
        tz = m.hold.y + (c.z - m.hold.y) * aw;
        th = m.userH + (c.h - m.userH) * aw;
        if (aw > 0.5) chName = c.name;
      }
      const w = m.drag !== null ? 20 : 3.2;
      [m.pos.x, m.vel.x] = damp(m.pos.x, tx, m.vel.x, w, dt);
      [m.pos.y, m.vel.y] = damp(m.pos.y, tz, m.vel.y, w, dt);
      [m.h, m.vh] = damp(m.h, th, m.vh, 7, dt);
      if (m.drag !== null) dragSpeed += m.vel.length();
    }
    // like poles: magnets keep a little distance from each other
    for (let a = 0; a < 3; a++) for (let b = a + 1; b < 3; b++) {
      const A = MAGS[a], B = MAGS[b];
      let dx = B.pos.x - A.pos.x, dz = B.pos.y - A.pos.y, d = Math.hypot(dx, dz);
      const min = 1.08;
      if (d < 1e-4) { dx = 1; dz = 0; d = 1e-4; }
      if (d < min) {
        const push = min - d, ux = dx / d, uz = dz / d;
        const fa = A.drag !== null ? 0 : (B.drag !== null ? 1 : 0.5);
        const fb = B.drag !== null ? 0 : (A.drag !== null ? 1 : 0.5);
        A.pos.x -= ux * push * fa; A.pos.y -= uz * push * fa;
        B.pos.x += ux * push * fb; B.pos.y += uz * push * fb;
      }
    }
    for (const m of MAGS) {
      clampPool(m.pos);
      if (autoW <= 0 && m.drag === null) m.hold.copy(m.pos);
    }

    computeFields(dt);
    writeMagUniforms();

    // gentle droplets while the autopilot dances
    if (aw > 0.9) {
      nextDrop -= dt;
      if (nextDrop <= 0) {
        nextDrop = 2.5 + Math.random() * 4;
        const a = Math.random() * TAU, r = 1.0 + Math.random() * (R - 1.6);
        poke(Math.cos(a) * r, Math.sin(a) * r, 0.55);
        sound.plip(0.35);
      }
    }

    // magnet visuals
    const tSec = now / 1000;
    for (const m of MAGS) {
      const hov = hoverState.m === m ? 1 : 0, drg = m.drag !== null ? 1 : 0;
      m.glow += ((hov * 0.6 + drg) - m.glow) * Math.min(1, dt * 8);
      m.spin += dt * (0.35 + m.vel.length() * 0.4);
      m.outer.position.set(m.pos.x, m.h + LIFT + 0.03 * Math.sin(tSec * 1.3 + m.i * 2.0), m.pos.y);
      m.outer.rotation.set(clamp(m.vel.y * 0.05, -0.3, 0.3), 0, clamp(-m.vel.x * 0.05, -0.3, 0.3));
      m.inner.rotation.y = m.spin;
      const s = 1 + 0.06 * m.glow;
      m.inner.scale.setScalar(s);
      m.ringMat.color.copy(m.col).multiplyScalar(3.2 + 3.0 * m.glow + 1.2 * clamp(m.Bc - 0.3, 0, 1.5));
      m.coreMat.color.copy(m.col).multiplyScalar(0.6 + 0.8 * m.glow);
      m.light.position.set(m.pos.x, m.h + LIFT - 0.38, m.pos.y);
      m.light.intensity = 4.0 + 5.0 * m.glow;
      m.lines.material.uniforms.uAlpha.value = (0.08 + 0.12 * clamp(m.Bc, 0, 1.5)) * (1 + 1.8 * m.glow);
      updateLines(m);
      // "grab me" pulse until the first drag
      const ph = (tSec * 0.8 + m.i * 0.33) % 1;
      m.hintRing.scale.setScalar(1 + ph * 0.9);
      m.hintMat.opacity = hintK * (1 - ph) * 0.55;
    }
    hintK += ((hintDone ? 0 : 1) - hintK) * Math.min(1, dt * 1.5);
    if (inlayMatRef) inlayMatRef.color.setRGB(1.0, 0.77, 0.54).multiplyScalar(1.1 + 0.9 * clamp(energy / 3, 0, 1));

    // camera drifts slowly when nobody is around
    controls.autoRotate = !REDUCED && now - lastAny > 6000 && ptrs.size === 0;

    // audio
    sound.update(energy, (energy - energyPrev) / Math.max(dt, 1e-3), dragSpeed);

    // HUD
    if (!hintDone && simTime > 1.2) {
      const m = MAGS[0];
      tmpV.set(m.pos.x, m.h + LIFT, m.pos.y).project(camera);
      const sx = (tmpV.x * 0.5 + 0.5) * innerWidth, sy = (-tmpV.y * 0.5 + 0.5) * innerHeight;
      tagEl.style.transform = `translate(${(sx + 18).toFixed(1)}px, ${(sy - 9).toFixed(1)}px)`;
      tagEl.classList.add('on');
    }
    if ((hud++ & 3) === 0) {
      barEl.style.transform = `scaleX(${clamp(fieldMax / 2.5, 0, 1).toFixed(3)})`;
      fvEl.textContent = fieldMax.toFixed(2);
      const txt = autoW > 0.5 ? `AUTOPILOT · ${chName.toUpperCase()}` : 'HANDS ON';
      if (txt !== modeText) { modeText = txt; modeEl.textContent = txt; modeEl.classList.toggle('hands', autoW <= 0.5); }
    }
  }
  var inlayMatRef = inlayMat;

  /* ---------------- loop ---------------- */
  let last = performance.now(), frames = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const raw = Math.max(0.0001, (now - last) / 1000);
    last = now;
    const dt = Math.min(0.05, raw);
    simTime += dt;

    update(dt, now);

    const nSub = Math.max(1, Math.min(6, Math.round(dt * 120)));
    const h = dt / nSub;
    if (pokeQ) { simU.uPoke.value.x = pokeQ.x; simU.uPoke.value.y = pokeQ.z; simU.uPoke.value.w = 0.28; }
    for (let k = 0; k < nSub; k++) {
      simU.uTime.value = simTime - dt + h * (k + 1);
      simStep(h, dt, k === 0 && pokeQ ? pokeQ.s : 0);
    }
    pokeQ = null;
    normalPass();

    lineU.uTime.value = simTime;
    dustU.uTime.value = simTime;
    grain.uniforms.uTime.value = simTime;
    controls.update(dt);
    composer.render(dt);

    if (frames++ === 0) $('fade').classList.add('gone');

    // adaptive resolution: keep it smooth on weaker GPUs
    ema = ema * 0.94 + raw * 1000 * 0.06;
    perfT += raw;
    if (perfT > 2.5 && frames > 30) {
      perfT = 0;
      if (ema > 30 && PR > 1) setPR(Math.max(1, PR - 0.25));
      else if (ema < 14 && PR < MAX_PR) setPR(Math.min(MAX_PR, PR + 0.25));
    }
  }
  requestAnimationFrame(loop);
}

/* ------------------------------------------------------------------ *
 *  boot
 * ------------------------------------------------------------------ */
let renderer = null;
try {
  const probe = document.createElement('canvas').getContext('webgl2');
  if (probe) renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  renderer = null;
}
if (renderer) start(renderer);
else { $('fail').hidden = false; $('fade').classList.add('gone'); }
</script>
</body>
</html>
