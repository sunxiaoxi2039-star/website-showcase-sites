<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ferrofluid</title>
<meta name="description" content="An interactive ferrofluid sculpture: drag the magnets and a pool of black magnetic liquid rises into Rosensweig spikes and ridges." />
<link rel="icon" href="data:," />
<style>
  :root {
    --bg: #040507;
    --ink: #eceef3;
    --dim: rgba(236, 238, 243, .58);
    --faint: rgba(236, 238, 243, .30);
    --line: rgba(255, 255, 255, .12);
    --glass: rgba(10, 11, 15, .52);
    --amber: #ffa04a;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; -webkit-tap-highlight-color: transparent; }
  #fade { position: fixed; inset: 0; background: var(--bg); z-index: 9; pointer-events: none; transition: opacity 2.2s cubic-bezier(.4,0,.2,1); }
  #fade.gone { opacity: 0; }
  .hud { position: fixed; z-index: 4; pointer-events: none; user-select: none; -webkit-user-select: none; }
  .tl { top: max(24px, env(safe-area-inset-top)); left: 28px; }
  .t1 { font: 600 12px/1 var(--mono); letter-spacing: .5em; color: var(--ink); }
  .t2 { margin-top: 10px; font: italic 400 15px/1.3 var(--serif); color: var(--dim); display: flex; align-items: baseline; gap: 10px; }
  .t2 span { font-style: normal; color: var(--faint); font-family: var(--mono); font-size: 10px; letter-spacing: .18em; padding-left: 10px; border-left: 1px solid var(--line); }
  .tr { top: max(26px, env(safe-area-inset-top)); right: 28px; display: flex; align-items: center; gap: 10px; font: 500 10px/1 var(--mono); letter-spacing: .22em; color: var(--dim); }
  .bar { width: 96px; height: 2px; background: var(--line); position: relative; overflow: hidden; border-radius: 2px; }
  .bar i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, #ffa04a, #46d2ff 55%, #ff4f9e); }
  #fv { min-width: 34px; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  .hint { left: 28px; bottom: max(26px, env(safe-area-inset-bottom)); display: flex; gap: 12px; align-items: center; padding: 10px 18px 10px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: opacity 1.2s ease; color: var(--ink); }
  .hint svg { flex: none; color: var(--amber); animation: nudge 2.4s ease-in-out infinite; }
  .hint b { display: block; font: 600 13px/1.2 var(--sans); letter-spacing: .01em; }
  .hint span { display: block; margin-top: 3px; font: 400 11.5px/1.3 var(--sans); color: var(--dim); }
  .hint.dim { opacity: .38; }
  .hint.dim svg { animation: none; }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(4px) rotate(8deg); } 60% { transform: translateX(-3px) rotate(-6deg); } }
  .br { right: 28px; bottom: max(28px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 18px; font: 500 10px/1 var(--mono); letter-spacing: .22em; color: var(--dim); }
  .mw { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
  #mode { transition: color .6s; white-space: nowrap; }
  #mode.hands { color: var(--amber); }
  .seg { width: 100%; min-width: 60px; height: 1px; background: var(--line); position: relative; overflow: hidden; transition: opacity .8s; }
  .seg i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); background: rgba(236, 238, 243, .55); }
  .seg.off { opacity: 0; }
  #snd { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); color: var(--ink); font: 500 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; cursor: pointer; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: border-color .3s, background .3s; }
  #snd:hover { border-color: rgba(255,255,255,.32); }
  #snd:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  #snd[aria-pressed="true"] { border-color: rgba(255,160,74,.6); }
  #snd .w { opacity: .25; transition: opacity .3s; }
  #snd[aria-pressed="true"] .w { opacity: 1; }
  .tag { position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; display: flex; align-items: center; gap: 6px; font: 600 9.5px/1 var(--mono); letter-spacing: .24em; color: #fff; opacity: 0; transition: opacity .8s ease; white-space: nowrap; will-change: transform; }
  .tag i { display: block; width: 22px; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.8)); }
  .tag em { font-style: normal; padding: 5px 9px; border: 1px solid rgba(255,255,255,.4); border-radius: 999px; background: rgba(0,0,0,.4); }
  .tag.on { opacity: 1; }
  .tag.flip { flex-direction: row-reverse; }
  .tag.flip i { background: linear-gradient(270deg, rgba(255,255,255,0), rgba(255,255,255,.8)); }
  #fail { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; padding: 24px; font: 400 15px/1.5 var(--serif); color: var(--dim); background: var(--bg); }
  #fail[hidden] { display: none; }
  @media (max-width: 640px) {
    .tl { left: 18px; top: max(18px, env(safe-area-inset-top)); }
    .t2 { font-size: 13.5px; }
    .tr { display: none; }
    .hint { left: 16px; right: 16px; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 52px); padding: 9px 14px 9px 10px; }
    .hint b { font-size: 12.5px; }
    .hint span { font-size: 11px; }
    .br { left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); justify-content: space-between; gap: 10px; }
    .mw { align-items: flex-start; }
    #mode { font-size: 9.5px; letter-spacing: .16em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint svg { animation: none; }
    #fade { transition-duration: .5s; }
    .tag, .hint { transition-duration: .2s; }
  }
</style>

<body>
<canvas id="c" tabindex="0" aria-label="Interactive ferrofluid pool. Drag the glowing magnets to raise spikes in the liquid. Keyboard: keys 1 to 3 pick a magnet, arrow keys move it, plus and minus change its strength, space drops a ripple, Escape returns to autopilot."></canvas>

<header class="hud tl">
  <div class="t1">FERROFLUID</div>
  <div class="t2">a study in magnetic liquid <span>N° 04</span></div>

  <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">

    <circle cx="16" cy="16" r="1.6" fill="currentColor"/>
    <path d="M4.5 16h5M22.5 16h5M16 4.5v5M16 22.5v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M7 13.5 4.5 16 7 18.5M25 13.5 27.5 16 25 18.5M13.5 7 16 4.5 18.5 7M13.5 25 16 27.5 18.5 25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="mw"><span id="mode">AUTOPILOT · ORBIT</span><span class="seg" id="segw"><i id="seg"></i></span></div>
  <button id="snd" type="button" aria-pressed="false" aria-label="Toggle sound">
    <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M3 8v4h3l4 3.5v-11L6 8H3z" fill="currentColor"/><path class="w" d="M13 7.2a4 4 0 0 1 0 5.6M15.2 5a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span id="sndt">Sound off</span>
  </button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ------------------------------------------------------------------ *
 *  constants
 * ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);
const canvas = $('c');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth01 = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

const R = 5.0;                  // pool radius (world units)
const L = 2 * (R + 0.25);       // simulated square domain
const LIFT = 0.72;              // magnets float this far above their "field height"
const COARSE = matchMedia('(pointer: coarse)').matches;
const TOUCHY = COARSE || matchMedia('(hover: none)').matches || innerWidth < 640;
const SMALL = Math.min(innerWidth, innerHeight) < 700;
const N = (COARSE || SMALL) ? 256 : 360;        // simulation + mesh resolution
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MAX_PR = Math.min(window.devicePixelRatio || 1, COARSE ? 1.75 : 2);   // DPR cap
const QS = new URLSearchParams(location.search);
const T_START = QS.has('t') && Number.isFinite(+QS.get('t')) ? +QS.get('t') : 0;   // ?t=16 jumps to a moment of the dance

/* critically damped spring (stable for any dt); velocity comes back through DV */
let DV = 0;
function damp(cur, tgt, vel, omega, dt) {
  const x = omega * dt;
  const e = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
  const ch = cur - tgt;
  const tmp = (vel + omega * ch) * dt;
  DV = (vel - omega * tmp) * e;
  return tgt + (ch + tmp) * e;
}

/* ------------------------------------------------------------------ *
 *  GLSL
 * ------------------------------------------------------------------ */
const QUAD_VS = /* glsl */`
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

// Ferrofluid height simulation.
// state.r = spike/mound layer height, .g = its velocity
// state.b = free-surface wave height,  .a = its velocity
const SIM_FS = /* glsl */`
varying vec2 vUv;
uniform sampler2D uState;
uniform vec4 uMag[3];       // x, z, field height, on
uniform vec4 uMagPrev[3];
uniform vec4 uLat[3];       // lattice spacing, lattice rotation
uniform float uDt, uFrameDt, uTime, uL, uR, uTex, uWob;
uniform vec4 uPoke;         // x, z, strength, radius

float th(float x){ float e = exp(-2.0 * abs(x)); return sign(x) * (1.0 - e) / (1.0 + e); }

// normal field of a small magnet held hc above the pool; falls off fast (cos^4.5)
// so every magnet raises its own crown and the rest of the pool stays a mirror
float fieldOf(vec2 x, vec4 m){
  vec2 d = x - m.xy;
  float hc = m.z + 0.6;
  float h2 = hc * hc;
  float q = h2 / (dot(d, d) + h2);
  return m.w * 2.5 / h2 * q * q * sqrt(sqrt(q));
}
float fieldPrev(vec2 x){ return fieldOf(x, uMagPrev[0]) + fieldOf(x, uMagPrev[1]) + fieldOf(x, uMagPrev[2]); }

float moundOf(float B){ return 0.40 * th(0.75 * B); }
// Rosensweig instability is subcritical: spikes jump up with a finite height once B passes Bc
float ampOf(float B){
  float g = smoothstep(0.30, 0.37, B);
  return min(g * (0.16 + 0.70 * th(1.5 * max(B - 0.30, 0.0))) + 0.15 * sqrt(max(B - 1.0, 0.0)), 0.95);
}
// concave-flanked Rosensweig cone
float prof(float d){ float k = max(1.0 - d, 0.0); return pow(k, 1.9); }

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 rot2(vec2 v, float a){ float c = cos(a), s = sin(a); return vec2(c * v.x - s * v.y, s * v.x + c * v.y); }

// offset to the nearest point of a hexagonal lattice (xy) and that point (zw)
vec4 hexCell(vec2 q, float a){
  vec2 r = vec2(1.0, 1.7320508) * a;
  vec2 h = 0.5 * r;
  vec2 A = mod(q, r) - h;
  vec2 B = mod(q - h, r) - h;
  vec2 o = dot(A, A) < dot(B, B) ? A : B;
  return vec4(o, q - o);
}

// chain of spikes bridging two magnets
float ridgeOf(vec2 x, vec4 ma, vec4 mb, float ba, float bb, float aR){
  vec2 ab = mb.xy - ma.xy;
  float Lab = max(length(ab), 1e-3);
  vec2 dir = ab / Lab;
  float t = clamp(dot(x - ma.xy, dir), 0.0, Lab);
  float dp = length(x - (ma.xy + dir * t));
  float bal = 4.0 * ba * bb / ((ba + bb) * (ba + bb) + 1e-6);
  float g = sqrt(ba * bb) * bal * sqrt(bal) * (1.0 - smoothstep(1.4, 3.6, Lab));
  float u = (t - 0.5 * Lab) / aR;
  float du = (fract(u + 0.5) - 0.5) * aR;
  float dd = length(vec2(du, dp)) / (0.5 * aR);
  float A = 0.62 * th(2.4 * max(g - 0.06, 0.0));
  return A * prof(dd) + 0.12 * th(3.0 * g) * exp(-dp * dp / 0.10);
}

void main(){
  vec2 x = (vUv - 0.5) * uL;
  float r = length(x);
  vec4 s = texture2D(uState, vUv);

  float Bi[3];
  Bi[0] = fieldOf(x, uMag[0]);
  Bi[1] = fieldOf(x, uMag[1]);
  Bi[2] = fieldOf(x, uMag[2]);
  float Bt = Bi[0] + Bi[1] + Bi[2];

  // --- Rosensweig spike lattices, one per magnet, blended by (sharp) field dominance
  float S = 0.0, W = 0.0;
  for (int i = 0; i < 3; i++) {
    vec4 m = uMag[i];
    float a = uLat[i].x, ang = uLat[i].y;
    vec2 q = rot2(x - m.xy, -ang);
    vec4 hc = hexCell(q, a);
    vec2 cellQ = hc.zw;
    float id = hash12(floor(cellQ * (2.0 / a) + 0.5) + float(i) * 37.0);
    float d0 = length(hc.xy) / (0.5 * a);
    vec2 wob = uWob * 0.07 * a * vec2(sin(uTime * 1.9 + id * 6.283), cos(uTime * 1.5 + id * 11.7)) * max(1.0 - d0, 0.0);
    float d = length(hc.xy - wob) / (0.5 * a);
    vec2 cw = m.xy + rot2(cellQ, ang);
    float Bc = fieldOf(cw, uMag[0]) + fieldOf(cw, uMag[1]) + fieldOf(cw, uMag[2]);
    float A = ampOf(Bc) * (1.0 + uWob * 0.08 * sin(uTime * 2.6 + id * 6.283));
    float w = Bi[i] * Bi[i] * Bi[i];
    w = w * w + 1e-9;
    // young spikes at the rim of a crown are thin needles with flat liquid between them
    float wid = mix(0.6, 1.0, smoothstep(0.12, 0.6, A));
    S += w * A * prof(d / wid);
    W += w;
  }
  S /= W;

  // --- ridges: spike chains between neighbouring magnets
  float rg = ridgeOf(x, uMag[0], uMag[1], Bi[0], Bi[1], 0.5 * (uLat[0].x + uLat[1].x));
  rg = max(rg, ridgeOf(x, uMag[0], uMag[2], Bi[0], Bi[2], 0.5 * (uLat[0].x + uLat[2].x)));
  rg = max(rg, ridgeOf(x, uMag[1], uMag[2], Bi[1], Bi[2], 0.5 * (uLat[1].x + uLat[2].x)));

  // --- bulk mound + the trough it drains from
  float broad = 0.0;
  for (int i = 0; i < 3; i++) {
    vec2 dd = x - uMag[i].xy;
    float hc = uMag[i].z + 0.6;
    broad += uMag[i].w * exp(-dot(dd, dd) / 6.5) / (hc * hc);
  }
  float mound = moundOf(Bt) - 0.09 * th(broad);

  float edgeK = 1.0 - smoothstep(uR - 1.1, uR - 0.15, r);
  float calm = 1.0 - smoothstep(uR - 0.6, uR, r);
  float idle = 0.014 * (sin(x.x * 1.6 + uTime * 0.55) * sin(x.y * 1.3 - uTime * 0.41) + 0.6 * sin((x.x - x.y) * 2.3 + uTime * 0.8)) * calm;
  float men = smoothstep(uR - 0.5, uR, r);
  float T = (mound + max(S, rg)) * edgeK + idle + 0.07 * men * men;

  // --- spike layer: stiff when rising (instability snaps up), softer when relaxing
  float hs = s.x, vs = s.y, hw = s.z, vw = s.w;
  float up = step(hs, T);
  float K = mix(230.0, 640.0, up);
  float Dm = mix(9.0, 13.5, up);
  if (uDt < 0.012) {            // normal frame rate: semi-implicit, lively overshoot
    vs += (K * (T - hs) - Dm * vs) * uDt;
  } else {                       // very slow device: implicit step, stable for any dt, so spikes still relax
    vs = (vs + uDt * K * (T - hs)) / (1.0 + uDt * Dm + uDt * uDt * K);
  }
  hs += vs * uDt;

  // --- free-surface waves (ripples from moving mounds, collapsing spikes and pokes)
  float dx = uL * uTex;
  float wl = texture2D(uState, vUv - vec2(uTex, 0.0)).z;
  float wr = texture2D(uState, vUv + vec2(uTex, 0.0)).z;
  float wd = texture2D(uState, vUv - vec2(0.0, uTex)).z;
  float wu = texture2D(uState, vUv + vec2(0.0, uTex)).z;
  float lap = (wl + wr + wd + wu - 4.0 * hw) / (dx * dx);
  float dM = (moundOf(Bt) - moundOf(fieldPrev(x))) / max(uFrameDt, 1e-3);
  float exc = -0.9 * dM * edgeK - 0.12 * vs;
  float hW = min(uDt, 1.0 / 60.0);   // explicit wave step stays inside its CFL limit
  vw += (1.15 * lap - 1.5 * vw - 2.5 * hw + exc) * hW;
  vec2 pd = x - uPoke.xy;
  vw -= uPoke.z * exp(-dot(pd, pd) / (uPoke.w * uPoke.w));
  hw += vw * hW;
  if (r > uR - 0.03) { hw = 0.0; vw = 0.0; }

  gl_FragColor = vec4(hs, clamp(vs, -40.0, 40.0), clamp(hw, -0.6, 0.6), vw);
}
`;

// gradient (xy), curvature (z) and total height (w) for rendering
const NRM_FS = /* glsl */`
varying vec2 vUv;
uniform sampler2D uState;
uniform float uTex, uDx;
float H(vec2 uv){ vec4 s = texture2D(uState, uv); return s.x + s.z; }
void main(){
  float c = H(vUv);
  float l = H(vUv - vec2(uTex, 0.0));
  float r = H(vUv + vec2(uTex, 0.0));
  float d = H(vUv - vec2(0.0, uTex));
  float u = H(vUv + vec2(0.0, uTex));
  gl_FragColor = vec4((r - l) / (2.0 * uDx), (u - d) / (2.0 * uDx), (l + r + d + u - 4.0 * c) / (uDx * uDx), c);
}
`;

// final grade, in display space: lens fringe, vignette, split tone, soft S-curve, grain
const GRADE = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uAspect: { value: 1 }, uCA: { value: 0.008 }, uGrain: { value: 0.024 } },
  vertexShader: /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uTime, uAspect, uCA, uGrain; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 p = vUv - 0.5;
      vec2 q = p; q.x *= uAspect;
      vec2 off = p * dot(q, q) * uCA;
      vec3 c = vec3(texture2D(tDiffuse, vUv - off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv + off).b);
      vec2 v = p; v.x *= max(uAspect, 1.0); v.y *= max(1.0 / uAspect, 1.0) * 0.82;
      c *= mix(0.42, 1.0, 1.0 - smoothstep(0.36, 1.04, length(v)));
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c *= mix(vec3(0.90, 0.97, 1.12), vec3(1.05, 1.0, 0.94), smoothstep(0.04, 0.55, l));
      c = clamp(c, 0.0, 1.0);
      c = mix(c, c * c * (3.0 - 2.0 * c), 0.16);
      c += (h(vUv * 917.0 + fract(uTime * 0.37) * 61.0) - 0.5) * uGrain;
      gl_FragColor = vec4(c, 1.0);
    }`
};

/* ------------------------------------------------------------------ *
 *  main
 * ------------------------------------------------------------------ */
function start(renderer) {
  performance.mark('ff:start');
  let PR = MAX_PR;
  const BG = 0x040507;
  renderer.setPixelRatio(PR);
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.setClearColor(BG, 1);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.FogExp2(BG, 0.02);

  const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 200);

  const crt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: COARSE ? 0 : (MAX_PR > 1.25 ? 2 : 4) });

  const controls = new OrbitControls(camera, canvas);

  const tmpV = new THREE.Vector3(), OFF = new THREE.Vector3(), SPH = new THREE.Spherical();

      m.flare *= Math.exp(-dt * 3.5);
      m.spin += dt * (0.35 + m.vel.length() * 0.4);
      m.outer.position.set(m.pos.x, m.h + LIFT + 0.03 * Math.sin(animTime * 1.3 + m.i * 2.0), m.pos.y);
      m.outer.rotation.set(clamp(m.vel.y * 0.05, -0.3, 0.3), 0, clamp(-m.vel.x * 0.05, -0.3, 0.3));
      m.inner.rotation.y = m.spin;
      const s = 1 + 0.06 * m.glow + 0.05 * m.flare;
      m.inner.scale.setScalar(s);
      m.ringMat.color.copy(m.col).multiplyScalar(3.2 + 3.0 * m.glow + 4.0 * m.flare + 1.2 * clamp(m.Bc - 0.3, 0, 1.5));
      m.coreMat.color.copy(m.col).multiplyScalar(0.6 + 0.8 * m.glow + m.flare);
      m.light.position.set(m.pos.x, m.h + LIFT - 0.26, m.pos.y);
      m.light.intensity = 2.0 + 3.0 * m.glow + 5.0 * m.flare;
      m.lines.material.uniforms.uAlpha.value = (0.08 + 0.12 * clamp(m.Bc, 0, 1.5)) * (1 + 1.8 * m.glow + 2.0 * m.flare);
      updateLines(m);
      // "grab me" pulse until the first drag (a still halo when motion is reduced)
      const ph = REDUCED ? 0.3 : (animTime * 0.8 + m.i * 0.33) % 1;
      m.hintRing.scale.setScalar(1 + ph * 0.9);
      m.hintMat.opacity = hintK * (1 - ph) * 0.42;
    }
    hintK += ((hintDone ? 0 : 1) - hintK) * Math.min(1, dt * 1.5);
    inlayMat.color.setRGB(1.0, 0.77, 0.54).multiplyScalar(0.5 + 0.55 * clamp(energy / 3, 0, 1));

    // camera: when nobody is around it drifts slowly and breathes in and out
    const camIdle = !REDUCED && now - lastAny > 6000 && ptrs.size === 0;
    controls.autoRotate = camIdle;
    if (camIdle) {
      camT += dt;
      const k = Math.min(1, dt * 0.35);
      OFF.copy(camera.position).sub(controls.target); SPH.setFromVector3(OFF);
      SPH.phi += (basePolar + 0.07 * Math.sin(camT * 0.13) - SPH.phi) * k;
      SPH.radius += (baseDist * (1 + 0.04 * Math.sin(camT * 0.09 + 1.3)) - SPH.radius) * k;
      OFF.setFromSpherical(SPH); camera.position.copy(controls.target).add(OFF);
    }

    // audio
    sound.update(energy, (energy - energyPrev) / Math.max(dt, 1e-3), dragSpeed);

    // HUD
    if (!hintDone && now - bootT > 1500) {
      const m = MAGS[0];
      tmpV.set(m.pos.x, m.h + LIFT, m.pos.y).project(camera);
      const sx = (tmpV.x * 0.5 + 0.5) * innerWidth, sy = (-tmpV.y * 0.5 + 0.5) * innerHeight;
      if (!tagW) tagW = tagEl.offsetWidth || 96;
      const flip = sx + 20 + tagW > innerWidth - 10;   // keep the tag on screen on narrow phones
      tagEl.classList.toggle('flip', flip);
      tagEl.style.transform = `translate(${(flip ? sx - 20 - tagW : sx + 20).toFixed(1)}px, ${(sy - 9).toFixed(1)}px)`;
      tagEl.classList.add('on');
    }
    if ((hud++ & 3) === 0) {
      barEl.style.transform = `scaleX(${clamp(fieldMax / 2.5, 0, 1).toFixed(3)})`;
      fvEl.textContent = fieldMax.toFixed(2);
      const auto = autoW > 0.5;
      const txt = auto ? `AUTOPILOT · ${chName.toUpperCase()}` : 'HANDS ON';
      if (txt !== modeText) { modeText = txt; modeEl.textContent = txt; modeEl.classList.toggle('hands', !auto); segW.classList.toggle('off', !auto); }
      const lt = ((tau % SEG) + SEG) % SEG;
      segEl.style.transform = `scaleX(${(lt / SEG).toFixed(3)})`;
    }
  }

  /* ---------------- loop ---------------- */
  // Two clocks: the choreography follows wall time (so even a very slow GPU still sees the
  // dance move), the physics takes bounded, stable sub-steps.
  let last = performance.now(), frames = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const raw = Math.max(0.0001, (now - last) / 1000);
    last = now;
    const dtA = Math.min(1.0, raw);
    const dtS = Math.min(0.25, raw);
    simTime += dtS;
    animTime += dtA;

    update(dtA, now);

    const nSub = Math.max(1, Math.min(raw > 0.1 ? 4 : 8, Math.round(dtS * 120)));   // very slow frames: a few large implicit steps
    const h = dtS / nSub;
    if (pokeQ) { simU.uPoke.value.x = pokeQ.x; simU.uPoke.value.y = pokeQ.z; simU.uPoke.value.w = 0.28; }
    for (let k = 0; k < nSub; k++) {
      simU.uTime.value = simTime - dtS + h * (k + 1);
      simStep(h, dtA, k === 0 && pokeQ ? pokeQ.s : 0);
    }
    pokeQ = null;
    normalPass();

    lineU.uTime.value = REDUCED ? animTime * 0.3 : animTime;
    if (!REDUCED) dustU.uTime.value = animTime;
    grade.uniforms.uTime.value = animTime;
    controls.update(dtA);
    composer.render(dtA);

    if (frames++ === 0) { $('fade').classList.add('gone'); performance.mark('ff:first-frame'); }

    // adaptive resolution: keep it smooth on weaker GPUs
    ema = ema * 0.94 + raw * 1000 * 0.06;
    perfT += raw;
    if (perfT > 2.5 && frames > 30) {
      perfT = 0;
      if (ema > 30 && PR > 1) setPR(Math.max(1, PR - 0.25));
      else if (ema < 14 && PR < MAX_PR) setPR(Math.min(MAX_PR, PR + 0.25));
    }
  }
  requestAnimationFrame(loop);
}

/* ------------------------------------------------------------------ *
 *  boot
 * ------------------------------------------------------------------ */
let renderer = null;
try {
  const probe = document.createElement('canvas').getContext('webgl2');
  if (probe) renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  renderer = null;
}
if (renderer) start(renderer);
else { $('fail').hidden = false; $('fade').classList.add('gone'); }
</script>
</body>
</html>
