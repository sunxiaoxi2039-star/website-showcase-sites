<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ============================================================
//  余白 / Yohaku — 36 s, 1080x1920 (9:16), fixed 1/30 s steps.
//  Everything procedural: glass = Canvas2D, stone = GLSL, sound = WebAudio.
//  The window, the floor projection, the light shafts, the dust and
//  the light grains all read the SAME glass texture + the SAME block mask.
// ============================================================
const FPS=30, DUR=36, ZG=-0.5, WY0=2, SPR=15-5*Math.sqrt(3);
const COLS=7, ROWS=11, CELL=10/7, GRID_H=CELL*ROWS;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const sstep5=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*t*(t*(t*6-15)+10);};
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const h2=(a,b)=>{const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s);};
const SRGB2LIN=new Float32Array(256);for(let i=0;i<256;i++){const c=i/255;SRGB2LIN[i]=c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}

// ---------------- stained glass (one image, used everywhere) ----------------
const GW=1024, GH=1536, GS=GW/10;
function paintGlass(){
  const cv=document.createElement('canvas');cv.width=GW;cv.height=GH;
  const g=cv.getContext('2d');
  const R=mulberry(20260926);
  g.setTransform(GS,0,0,-GS,GW/2,GH);            // meters, y up, window-local
  const LEAD='#0a0807', LW=0.058;
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const jit=(h,a)=>{const c=hex(h),k=1+(R()-.5)*2*a,s=(R()-.5)*a*46;return `rgb(${clamp(c[0]*k+s,0,255)|0},${clamp(c[1]*k,0,255)|0},${clamp(c[2]*k-s,0,255)|0})`;};
  const fill=(P,c,a=.08)=>{g.fillStyle=jit(c,a);g.fill(P);};
  const lead=(P,w=LW)=>{g.lineWidth=w;g.strokeStyle=LEAD;g.lineJoin='round';g.lineCap='round';g.stroke(P);};
  const pc=(P,c,a=.08,w=LW)=>{fill(P,c,a);lead(P,w);};
  const poly=(pts,close=true)=>{const P=new Path2D();P.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)P.lineTo(pts[i][0],pts[i][1]);if(close)P.closePath();return P;};
  const circ=(x,y,r)=>{const P=new Path2D();P.arc(x,y,r,0,Math.PI*2);return P;};
  const ell=(x,y,rx,ry)=>{const P=new Path2D();P.ellipse(x,y,rx,ry,0,0,Math.PI*2);return P;};
  const star=(x,y,r,n=5)=>{const p=[];for(let i=0;i<n*2;i++){const a=Math.PI/2+i*Math.PI/n,rr=i%2?r*.45:r;p.push([x+rr*Math.cos(a),y+rr*Math.sin(a)]);}return poly(p);};
  // symmetric closed shape: right half from an axis point to an axis point, then mirrored
  const sym=(st,segs)=>{const P=new Path2D();P.moveTo(st[0],st[1]);const pts=[st];
    for(const s of segs){if(s[0]==='L'){P.lineTo(s[1],s[2]);pts.push([s[1],s[2]]);}else{P.bezierCurveTo(s[1],s[2],s[3],s[4],s[5],s[6]);pts.push([s[5],s[6]]);}}

    P.closePath();return P;};
  const archP=ins=>{const P=new Path2D(),r=10-ins,a1=Math.acos(5/r);P.moveTo(-5+ins,ins);P.lineTo(5-ins,ins);P.lineTo(5-ins,SPR);P.arc(-5,SPR,r,0,a1,false);P.arc(5,SPR,r,Math.PI-a1,Math.PI,false);P.closePath();return P;};

  g.save();g.clip(archP(0));

  pc(poly([[-5.6,-.5],...mw,[5.6,-.5]]),'#1e6b34',.05);

  lead(poly([[-5.6,.52],[-2,.6],[0,.5],[2,.6],[5.6,.52]],false),.045);
  for(let k=0;k<8;k++){const x=.35+k*.56,y=.3+h2(k,3)*.5,c=['#c21d33','#f2c645','#efe9dc','#8a3fb0'][k%4];
    for(const s of[-1,1]){for(let p=0;p<5;p++){const a=p*1.2566+k;pc(circ(s*x+.1*Math.cos(a)*s,y+.1*Math.sin(a),.075),c,.06,.025);}pc(circ(s*x,y,.05),'#f4d35a',.04,.02);}}
  // --- rose window ---
  const RX=0,RY=12.1,RR=1.66;
  pc(circ(RX,RY,RR+.22),'#e3a83a',.05);

  for(let k=0;k<12;k++){
    const a0=k*Math.PI/6+Math.PI/12,a1=a0+Math.PI/6,am=(a0+a1)/2;
    const P=new Path2D();P.moveTo(RX+.5*Math.cos(a0),RY+.5*Math.sin(a0));P.arc(RX,RY,RR,a0,a1,false);P.arc(RX,RY,.5,a1,a0,true);P.closePath();
    pc(P,k%2?'#1f47b5':'#ad1830',.08);
    pc(poly([[.62,0],[1.02,.13],[1.5,0],[1.02,-.13]].map(([r,da])=>[RX+r*Math.cos(am+da),RY+r*Math.sin(am+da)])),k%2?'#f1c24b':'#e9e2cc',.06);
  }
  pc(circ(RX,RY,.5),'#e7b23c',.05);pc(circ(RX,RY,.3),'#b3172d',.05);pc(star(RX,RY,.2,6),'#f6dc84',.04,.03);
  // --- mandorla of light ---
  const MY0=1.35,MY1=10.1,MW=1.9;
  const mandP=ins=>{const P=new Path2D(),cc=(MW-ins)/.75;P.moveTo(0,MY0+ins*1.5);P.bezierCurveTo(cc,MY0+1.3,cc,MY1-1.3,0,MY1-ins*1.5);P.bezierCurveTo(-cc,MY1-1.3,-cc,MY0+1.3,0,MY0+ins*1.5);P.closePath();return P;};
  pc(mandP(0),'#a51629',.04);
  g.save();g.clip(mandP(.17));
  const MC=[0,6.0],MP=['#f3c24c','#e39a2f','#f7d983'];
  for(let k=0;k<32;k++){const a0=k*Math.PI/16,a1=a0+Math.PI/16,sI=k<16?Math.min(k,15-k):Math.min(k-16,31-k);
    pc(poly([MC,[MC[0]+9*Math.cos(a0),MC[1]+9*Math.sin(a0)],[MC[0]+9*Math.cos(a1),MC[1]+9*Math.sin(a1)]]),MP[sI%3],.06);}

  for(let k=0;k<12;k++){const a=k*Math.PI/6+Math.PI/12;pc(circ(.74*Math.cos(a),HY+.74*Math.sin(a),.055),'#b3172d',.04,.025);}
  const mantle=sym([0,9.62],[['C',.52,9.64,.68,9.1,.66,8.45],['C',.7,7.95,1.1,7.72,1.17,6.95],['C',1.24,5.6,1.28,3.5,1.42,2.08],['C',1.0,1.9,.45,1.93,0,1.97]]);
  pc(mantle,'#1b3d9f',.05);
  const robe=sym([0,7.8],[['C',.3,7.62,.44,6.3,.5,4.9],['C',.56,3.7,.66,2.7,.74,2.02],['C',.48,1.98,.24,1.99,0,2.0]]);
  pc(robe,'#a8162b',.05);
  for(const s of[-1,1]){lead(poly([[s*.95,6.6],[s*1.02,4.8],[s*1.15,2.2]],false),.045);lead(poly([[s*.8,7.2],[s*.78,4.5],[s*.92,2.1]],false),.04);lead(poly([[s*.2,6.5],[s*.26,4.2],[s*.36,2.05]],false),.04);}
  g.save();g.clip(mantle);g.lineWidth=.26;g.strokeStyle=LEAD;g.stroke(mantle);g.lineWidth=.16;g.strokeStyle='#e9b848';g.stroke(mantle);g.restore();lead(mantle);
  pc(ell(0,8.72,.44,.56),'#e9e4d6',.03);
  pc(ell(0,8.74,.3,.4),'#f1d9bf',.02);
  grisaille(()=>{for(const s of[-1,1]){g.moveTo(s*.2,8.83);g.quadraticCurveTo(s*.12,8.78,s*.05,8.83);g.moveTo(s*.21,8.9);g.quadraticCurveTo(s*.13,8.95,s*.05,8.9);}
    g.moveTo(.01,8.84);g.lineTo(.03,8.66);g.lineTo(-.01,8.64);g.moveTo(-.05,8.54);g.quadraticCurveTo(0,8.52,.05,8.54);});
  pc(poly([[-.4,9.28],[-.43,9.74],[-.27,9.52],[-.14,9.82],[0,9.56],[.14,9.82],[.27,9.52],[.43,9.74],[.4,9.28]]),'#f0c24a',.04,.045);
  for(const x of[-.22,0,.22])pc(circ(x,9.4,.05),'#b3172d',.03,.02);
  pc(poly([[0,7.5],[.12,7.2],[.11,6.85],[-.11,6.85],[-.12,7.2]]),'#f1d9bf',.02,.045);lead(poly([[0,7.47],[0,6.87]],false),.03);
  {const cr=new Path2D();cr.arc(0,2.45,1.1,Math.PI+.42,-.42,false);cr.arc(0,2.95,1.383,-.7577,Math.PI+.7577,true);cr.closePath();pc(cr,'#f0c75a',.04);}
  // --- two angels with spread wings (the left one is an exact mirror) ---
  const feather=(bx,by,ang,len,wid,c1,c2)=>{const dx=Math.sin(ang),dy=Math.cos(ang),nx=dy,ny=-dx,tx=bx+dx*len,ty=by+dy*len;
    const P=new Path2D();P.moveTo(bx,by);P.quadraticCurveTo(bx+dx*len*.5+nx*wid,by+dy*len*.5+ny*wid,tx,ty);P.quadraticCurveTo(bx+dx*len*.5-nx*wid,by+dy*len*.5-ny*wid,bx,by);P.closePath();
    fill(P,c1,.07);g.save();g.clip(P);const tp=circ(tx,ty,len*.34);fill(tp,c2,.05);lead(tp,.045);g.restore();lead(P);lead(poly([[bx,by],[bx+dx*len*.6,by+dy*len*.6]],false),.03);};
  const angel=()=>{
    for(let k=5;k>=0;k--)feather(.28,6.5,.12+k*.155,2.55-k*.2,.2,k%2?'#d98526':'#eab842',k>=3?'#b51f2f':'#efe8d6');
    for(let k=3;k>=0;k--)feather(-.28,6.5,-.1-k*.16,2.35-k*.22,.19,k%2?'#d98526':'#eab842',k>=2?'#b51f2f':'#efe8d6');
    pc(circ(0,7.38,.47),'#f2c44e',.04);lead(circ(0,7.38,.36),.035);
    pc(sym([0,6.98],[['C',.3,6.98,.46,6.72,.5,6.3],['C',.58,5.0,.72,3.4,.86,2.3],['C',.5,2.2,.25,2.22,0,2.25]]),'#e7e2d4',.04);
    for(const s of[-1,1]){lead(poly([[s*.3,4.0],[s*.42,3.1],[s*.56,2.3]],false),.04);lead(poly([[s*.08,4.0],[s*.12,3.0],[s*.16,2.25]],false),.035);}
    pc(sym([0,6.92],[['C',.28,6.92,.41,6.66,.45,6.3],['C',.5,5.5,.56,4.6,.62,4.05],['C',.36,3.92,.16,3.98,0,4.02]]),'#2c8a50',.06);
    pc(sym([0,6.05],[['L',.28,6.35],['L',.44,6.56],['L',.49,6.25],['L',.2,5.72],['L',0,5.62]]),'#3a9a5c',.05);
    pc(poly([[0,6.15],[.09,5.9],[.07,5.62],[-.07,5.62],[-.09,5.9]]),'#f1d9bf',.02,.045);lead(poly([[0,6.12],[0,5.64]],false),.028);
    pc(poly([[-.5,5.05],[.52,5.25],[.53,5.1],[-.49,4.9]]),'#e9b848',.04,.045);
    pc(circ(0,7.36,.3),'#c9802a',.05);
    pc(ell(0,7.3,.2,.26),'#f1d9bf',.02);
    grisaille(()=>{for(const s of[-1,1]){g.moveTo(s*.13,7.35);g.quadraticCurveTo(s*.08,7.31,s*.03,7.35);}g.moveTo(.0,7.33);g.lineTo(.015,7.23);g.moveTo(-.035,7.16);g.lineTo(.035,7.16);});
    pc(circ(-.45,2.15,.34),'#cfd8e8',.05);pc(circ(.45,2.15,.34),'#cfd8e8',.05);pc(circ(0,2.0,.42),'#e2e8f2',.04);
  };
  for(const s of[-1,1]){g.save();g.translate(3.1*s,0);if(s<0)g.scale(-1,1);angel();g.restore();}
  // --- ruby border with jewels (symmetric sampling of the right half) ---
  {const band=new Path2D();band.addPath(archP(0));band.addPath(archP(.5));g.fillStyle=jit('#a3152a',.03);g.fill(band,'evenodd');
   const ins=.25,r=10-ins,a1=Math.acos(5/r),half=[[0,ins],[5-ins,ins],[5-ins,SPR]];
   for(let i=1;i<=40;i++){const a=a1*i/40;half.push([-5+r*Math.cos(a),SPR+r*Math.sin(a)]);}
   const L=[0];for(let i=1;i<half.length;i++)L.push(L[i-1]+Math.hypot(half[i][0]-half[i-1][0],half[i][1]-half[i-1][1]));
   const tot=L[L.length-1],n=Math.round(tot/.72),stp=tot/n;
   const at=s=>{let i=1;while(i<L.length-1&&L[i]<s)i++;const k=(s-L[i-1])/(L[i]-L[i-1]||1),p=half[i-1],q=half[i];return[lerp(p[0],q[0],k),lerp(p[1],q[1],k),q[0]-p[0],q[1]-p[1]];};
   for(let j=0;j<=n;j++){const s=j*stp;for(const m of[-1,1]){if(m<0&&(j===0||j===n))continue;
     const[x,y]=at(Math.min(s,tot-1e-4)),[, ,tx,ty]=at(Math.min(s,tot-1e-4));pc(circ(m*x,y,.13),j%2?'#2a58c0':'#f0c24a',.04,.04);
     const[x2,y2,t2x,t2y]=at(Math.min(s+stp*.5,tot-1e-4));if(j<n){const l=Math.hypot(t2x,t2y)||1,nx=-t2y/l,ny=t2x/l;lead(poly([[m*(x2-nx*.26),y2-ny*.26],[m*(x2+nx*.26),y2+ny*.26]],false),.045);}}}
   lead(archP(.5));lead(archP(.02),.09);}
  g.restore();

  // --- glass body: grisaille halo along the leads, cylinder-glass streaks, mottling ---
  g.setTransform(1,0,0,1,0,0);
  const img=g.getImageData(0,0,GW,GH),d=img.data,N=GW*GH;
  const m=new Float32Array(N),tmp=new Float32Array(N);
  for(let i=0;i<N;i++){const j=i*4;m[i]=d[j+3]>0&&(d[j]+d[j+1]+d[j+2])<70?1:0;}
  const bb=(a,b,w,h,r)=>{const k=1/(2*r+1);
    for(let y=0;y<h;y++){const o=y*w;let s=0;for(let x=-r;x<=r;x++)s+=a[o+clamp(x,0,w-1)];for(let x=0;x<w;x++){b[o+x]=s*k;s+=a[o+Math.min(x+r+1,w-1)]-a[o+Math.max(x-r,0)];}}
    for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=b[clamp(y,0,h-1)*w+x];for(let y=0;y<h;y++){a[y*w+x]=s*k;s+=b[Math.min(y+r+1,h-1)*w+x]-b[Math.max(y-r,0)*w+x];}}};
  bb(m,tmp,GW,GH,5);bb(m,tmp,GW,GH,4);
  const grid=(cw)=>{const gx=Math.ceil(GW/cw)+2,gy=Math.ceil(GH/cw)+2,a=new Float32Array(gx*gy);for(let i=0;i<a.length;i++)a[i]=R();
    return(x,y)=>{const fx=x/cw,fy=y/cw,ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);

  const dry=AC.createGain();dry.gain.value=.7;dry.connect(master);
  const route=(node,a,b)=>{const g1=AC.createGain();g1.gain.value=a;node.connect(g1);g1.connect(dry);const g2=AC.createGain();g2.gain.value=b;node.connect(g2);g2.connect(rev);};
  const coldG=AC.createGain();coldG.gain.value=0;route(coldG,.6,.8);
  const coldF=AC.createBiquadFilter();coldF.type='lowpass';coldF.frequency.value=900;coldF.connect(coldG);
  for(const f of[110,164.81,246.94,329.63])for(const dt of[-3,3]){const o=AC.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=dt;const g=AC.createGain();g.gain.value=.06;o.connect(g);g.connect(coldF);o.start();}
  const warmG=AC.createGain();warmG.gain.value=0;route(warmG,.55,.9);
  const warmF=AC.createBiquadFilter();warmF.type='lowpass';warmF.frequency.value=500;warmF.Q.value=.6;warmF.connect(warmG);
  for(const f of[146.83,220,293.66,369.99,440,554.37])for(const dt of[-4,4]){const o=AC.createOscillator();o.type='triangle';o.frequency.value=f;o.detune.value=dt+(AR()-.5)*3;const g=AC.createGain();g.gain.value=.035;o.connect(g);g.connect(warmF);o.start();}
  const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=AR()*2-1;}
  AU={route,coldG,warmG,warmF,nb};
}
function sThud(w,vol){
  const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(140,w);o.frequency.exponentialRampToValueAtTime(42,w+.25);
  const g=AC.createGain();g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(vol,w+.006);g.gain.exponentialRampToValueAtTime(.0001,w+.45);
  o.connect(g);AU.route(g,.9,.35);o.start(w);o.stop(w+.5);
  const n=AC.createBufferSource();n.buffer=AU.nb;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
  const ng=AC.createGain();ng.gain.setValueAtTime(vol*.5,w);ng.gain.exponentialRampToValueAtTime(.0001,w+.09);
  n.connect(f);f.connect(ng);AU.route(ng,.8,.3);n.start(w,AR()*1.5);n.stop(w+.12);
}
function sChime(w,fr,vol,dur=2.6,ratio=2.76){
  const c=AC.createOscillator();c.frequency.value=fr;const m=AC.createOscillator();m.frequency.value=fr*ratio;
  const mg=AC.createGain();mg.gain.setValueAtTime(fr*1.1,w);mg.gain.exponentialRampToValueAtTime(fr*.02,w+dur*.6);m.connect(mg);mg.connect(c.frequency);
  const g=AC.createGain();g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(vol,w+.004);g.gain.exponentialRampToValueAtTime(.0001,w+dur);
  c.connect(g);AU.route(g,.5,1);c.start(w);m.start(w);c.stop(w+dur+.1);m.stop(w+dur+.1);
}
function sGrind(w){
  const n=AC.createBufferSource();n.buffer=AU.nb;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=260;f.Q.value=3;
  const g=AC.createGain();g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(.16,w+.35);g.gain.linearRampToValueAtTime(0,w+.65);
  const l=AC.createOscillator();l.frequency.value=19;const lg=AC.createGain();lg.gain.value=.08;l.connect(lg);lg.connect(g.gain);
  n.connect(f);f.connect(g);AU.route(g,.8,.4);n.start(w);n.stop(w+.7);l.start(w);l.stop(w+.7);
}
const PENTA=[587.33,659.25,739.99,880,987.77,1174.66,1318.51,1479.98,1760];
const EVENTS=[];
for(const b of blocks)EVENTS.push({t:b.a,f:w=>sThud(w,.24*(1-.45*b.i/NB))});
EVENTS.push({t:14.6,f:w=>sGrind(w)});
EVENTS.push({t:15.25,f:w=>sChime(w,1318.51,.12,5.5,3.5)});
for(let k=0;k<5;k++)EVENTS.push({t:15.9+k*.14,f:w=>sChime(w,PENTA[[8,6,7,5,8][k]],.035,2.2)});
for(const b of blocks)if(b.i>0)EVENTS.push({t:b.S,f:w=>sChime(w,PENTA[(b.cell.c*3+b.cell.r*2)%PENTA.length],.045,2.6)});
[587.33,739.99,880,1174.66].forEach((fr,k)=>EVENTS.push({t:33.2+k*.12,f:w=>sChime(w,fr,.07,6,2)}));
EVENTS.sort((a,b)=>a.t-b.t);
function audioFrame(t,prev){
  if(!AC||!audioOn)return;
  const now=AC.currentTime;
  AU.coldG.gain.setTargetAtTime(sstep(0,2.5,t)*(1-sstep(9.8,11,t))*.5,now,.08);
  AU.warmG.gain.setTargetAtTime(sstep(15.2,20,t)*(1-sstep(34.2,36,t))*.55,now,.12);
  AU.warmF.frequency.setTargetAtTime(500+2800*sstep(15,30,t),now,.25);
  if(prev!==null&&t>prev&&t-prev<.5)for(const e of EVENTS)if(e.t>prev&&e.t<=t)e.f(now+.02);
}

// ---------------- words ----------------
const LINES=[[4.0,7.0],[7.2,10.2],[11.0,14.0],[14.3,17.3],[17.6,21.0],[22.5,26.5]].map(([s,e],i)=>({s,e,el:document.getElementById('L'+i)}));
const finalEl=document.getElementById('final'),barEl=document.getElementById('bar');
let U_PX=5;
function updateText(t){
  for(const L of LINES){const a=sstep(L.s,L.s+.9,t)*(1-sstep(L.e-.9,L.e,t));
    L.el.style.opacity=a.toFixed(3);L.el.style.filter=a<.999?`blur(${((1-a)*U_PX*.8).toFixed(2)}px)`:'none';L.el.style.transform=`translateY(${((1-a)*U_PX*.8).toFixed(2)}px)`;}
  const f=sstep(33.3,34.9,t);finalEl.style.opacity=f.toFixed(3);finalEl.style.filter=f<.999?`blur(${((1-f)*U_PX*1.2).toFixed(2)}px)`:'none';
  barEl.style.width=(t/DUR*100).toFixed(2)+'%';
}

// ---------------- one frame = pure function of t ----------------
function renderFrame(f){
  const t=f/FPS;
  const colorize=sstep(11.6,13.4,t),grade=sstep(14.8,24,t);
  U.uColorize.value=colorize;U.uTime.value=t;
  const st=updateBlocks(t,colorize),a=st.avg;
  U.uAmb.value.set(.006+a[0]*.05,.006+a[1]*.05,.007+a[2]*.05);
  U.uBounce.value.set(a[0]*1.4,a[1]*1.4,a[2]*1.4);
  U.uWin.value.set(a[0]*.6,a[1]*.6,a[2]*.6);
  blockMat.uniforms.uFill.value=.01+.045*st.open;
  grMat.uniforms.uT.value=t;duMat.uniforms.uT.value=t;duMat.uniforms.uDustI.value=lerp(1.1,1.7,colorize);
  setCamera(t);
  const dark=sstep(10.4,11.6,t)*(1-sstep(13.9,14.8,t));
  renderPost(t,f,{volI:lerp(.06,.12,colorize),volK:1-.4*sstep(29,32,t),expo:(1-.25*dark)*(1+.6*sstep(31,34,t)),
    bloomK:.35+.25*grade+.6*sstep(32.5,34.5,t),grade,veil:.78*sstep(32.6,34.8,t)});
  updateText(t);
}

// ---------------- sizing ----------------
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight,u=Math.min(vw/100,vh/177.7778);U_PX=u;
  document.documentElement.style.setProperty('--u',u+'px');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  let W=u*100*dpr,H=u*177.7778*dpr;const s=Math.min(1,1080/W,1920/H);
  W=Math.max(16,Math.round(W*s));H=Math.max(16,Math.round(H*s));
  if(W!==RW||H!==RH||!rtScene){RW=W;RH=H;renderer.setSize(W,H,false);allocRT(W,H);
    const px=H/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));grMat.uniforms.uPx.value=px;duMat.uniforms.uPx.value=px;}
  if(curFrame>=0)renderFrame(curFrame);
}

// ---------------- playback: fixed 1/30 s steps ----------------
let playing=false,clock0=0,tBase=0,curFrame=-1;
const btnSnd=document.getElementById('snd'),btnAgain=document.getElementById('again');
function show(f){const prev=curFrame>=0?curFrame/FPS:null;curFrame=f;renderFrame(f);if(playing)audioFrame(f/FPS,prev);}
function play(from){
  if(from!==undefined)tBase=from;else tBase=curFrame>=0&&curFrame<DUR*FPS?curFrame/FPS:0;
  curFrame=-1;clock0=performance.now();playing=true;btnAgain.style.display='none';
  if(AC&&audioOn)AC.resume();
}
function pause(){playing=false;if(AC&&AC.state==='running')AC.suspend();}
function seek(t){pause();const f=clamp(Math.round(t*FPS),0,DUR*FPS);curFrame=f;renderFrame(f);
  return new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));}
function tick(now){
  requestAnimationFrame(tick);
  if(!playing)return;
  let f=Math.floor(((now-clock0)/1000+tBase)*FPS);
  if(f>=DUR*FPS){f=DUR*FPS;show(f);playing=false;btnAgain.style.display='';if(AC&&audioOn)setTimeout(()=>{if(!playing&&AC.state==='running')AC.suspend();},3000);return;}
  if(f!==curFrame)show(f);
}
btnSnd.addEventListener('click',()=>{initAudio();audioOn=true;AC.resume();btnSnd.classList.add('gone');play(0);});
btnAgain.addEventListener('click',()=>{if(AC&&audioOn)AC.resume();play(0);});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();playing?pause():play();}
  else if(e.code==='ArrowRight'||e.code==='ArrowLeft'){pause();const f=clamp((curFrame<0?0:curFrame)+(e.code==='ArrowRight'?1:-1),0,DUR*FPS);curFrame=f;renderFrame(f);}
  else if(e.code==='KeyR'){play(0);}
});
window.addEventListener('resize',resize);

window.yohaku={
  seek,play:()=>play(),pause,
  frame:n=>{pause();curFrame=n;renderFrame(n);return cvs.toDataURL('image/png');},
  get t(){return Math.max(curFrame,0)/FPS;}
};

resize();
const qs=new URLSearchParams(location.search);
if(qs.has('t')){seek(parseFloat(qs.get('t'))||0);}
else{renderFrame(0);curFrame=0;play(qs.has('from')?clamp(parseFloat(qs.get('from'))||0,0,DUR-.1):0);}
requestAnimationFrame(tick);
</script>
