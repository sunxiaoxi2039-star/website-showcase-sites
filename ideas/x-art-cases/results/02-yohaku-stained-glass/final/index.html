import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ============================================================
//  余白 / Yohaku — 36 s, 1080x1920 (9:16), fixed 1/30 s steps.
//  Everything procedural: glass = Canvas2D, stone = GLSL, sound = WebAudio.
//  The window, the floor projection, the light shafts, the dust and
//  the light grains all read the SAME glass texture + the SAME block mask.
// ============================================================
const FPS=30, DUR=36, ZG=-0.5, WY0=2, SPR=15-5*Math.sqrt(3);
const COLS=7, ROWS=11, CELL=10/7, GRID_H=CELL*ROWS;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const sstep5=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*t*(t*(t*6-15)+10);};
const lerp=(a,b,t)=>a+(b-a)*t;
// 精修：reduced-motion 与 URL 参数在最前面读，后面的镜头/文字/播放都要用

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---------------- stained glass (one image, used everywhere) ----------------
const GW=1024, GH=1536, GS=GW/10;
function paintGlass(){
  const cv=document.createElement('canvas');cv.width=GW;cv.height=GH;
  const g=cv.getContext('2d');
  const R=mulberry(20260926);
  g.setTransform(GS,0,0,-GS,GW/2,GH);            // meters, y up, window-local
  const LEAD='#0a0807', LW=0.058;
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const jit=(h,a)=>{const c=hex(h),k=1+(R()-.5)*2*a,s=(R()-.5)*a*46;return `rgb(${clamp(c[0]*k+s,0,255)|0},${clamp(c[1]*k,0,255)|0},${clamp(c[2]*k-s,0,255)|0})`;};
  const fill=(P,c,a=.08)=>{g.fillStyle=jit(c,a);g.fill(P);};

  const pc=(P,c,a=.08,w=LW)=>{fill(P,c,a);lead(P,w);};
  const poly=(pts,close=true)=>{const P=new Path2D();P.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)P.lineTo(pts[i][0],pts[i][1]);if(close)P.closePath();return P;};
  const circ=(x,y,r)=>{const P=new Path2D();P.arc(x,y,r,0,Math.PI*2);return P;};

  g.save();g.clip(archP(0));
  // --- heaven: blue quarry diaper with rosettes and stars (mirror-symmetric) ---
  // 复评二轮：天空菱格由“电光蓝”压到钴蓝，四档明度随机；空菱格里加灰绘小十字花（中世纪菱格窗的手绘纹），不再像矢量剪贴画
  g.fillStyle='#0d1f52';g.fillRect(-6,-1,12,17);

    const cx=i*dq*2+(j&1?dq:0),cy=j*dq;if(Math.abs(cx)>5.8)continue;
    const r=h2(Math.abs(cx)*3.7,cy*5.1),r2=h2(Math.abs(cx)*1.3+9,cy*2.3);

  // --- meadow ---
  const mw=[];for(let x=-5.4;x<=5.41;x+=.3)mw.push([x,1.02+.16*Math.cos(x*1.7)+.08*Math.cos(x*3.3)]);

  for(let k=0;k<8;k++){const x=.35+k*.56,y=.3+h2(k,3)*.5,c=['#c21d33','#f2c645','#efe9dc','#8a3fb0'][k%4];

    pc(P,k%2?'#1f47b5':'#ad1830',.08);
    pc(poly([[.62,0],[1.02,.13],[1.5,0],[1.02,-.13]].map(([r,da])=>[RX+r*Math.cos(am+da),RY+r*Math.sin(am+da)])),k%2?'#e3ad3a':'#d6ccae',.06);
  }
  pc(circ(RX,RY,.5),'#e7b23c',.05);pc(circ(RX,RY,.3),'#b3172d',.05);pc(star(RX,RY,.2,6),'#f6dc84',.04,.03);
  // --- mandorla of light ---
  const MY0=1.35,MY1=10.1,MW=1.9;
  const mandP=ins=>{const P=new Path2D(),cc=(MW-ins)/.75;P.moveTo(0,MY0+ins*1.5);P.bezierCurveTo(cc,MY0+1.3,cc,MY1-1.3,0,MY1-ins*1.5);P.bezierCurveTo(-cc,MY1-1.3,-cc,MY0+1.3,0,MY0+ins*1.5);P.closePath();return P;};

  g.save();g.clip(mandP(.17));
  const MC=[0,6.0],MP=['#e0a42e','#c47a1c','#ecbc4c'];
  for(let k=0;k<32;k++){const a0=k*Math.PI/16,a1=a0+Math.PI/16,sI=k<16?Math.min(k,15-k):Math.min(k-16,31-k);
    pc(poly([MC,[MC[0]+9*Math.cos(a0),MC[1]+9*Math.sin(a0)],[MC[0]+9*Math.cos(a1),MC[1]+9*Math.sin(a1)]]),MP[sI%3],.06);}
  g.restore();lead(mandP(.17));lead(mandP(0));
  // --- Madonna ---
  const HY=8.8;
  pc(circ(0,HY,.84),'#f2c44e',.04);lead(circ(0,HY,.64),.04);
  for(let k=0;k<12;k++){const a=k*Math.PI/6+Math.PI/12;pc(circ(.74*Math.cos(a),HY+.74*Math.sin(a),.055),'#b3172d',.04,.025);}
  const mantle=sym([0,9.62],[['C',.52,9.64,.68,9.1,.66,8.45],['C',.7,7.95,1.1,7.72,1.17,6.95],['C',1.24,5.6,1.28,3.5,1.42,2.08],['C',1.0,1.9,.45,1.93,0,1.97]]);
  pc(mantle,'#1b3d9f',.05);
  const robe=sym([0,7.8],[['C',.3,7.62,.44,6.3,.5,4.9],['C',.56,3.7,.66,2.7,.74,2.02],['C',.48,1.98,.24,1.99,0,2.0]]);
  pc(robe,'#a8162b',.05);
  for(const s of[-1,1]){lead(poly([[s*.95,6.6],[s*1.02,4.8],[s*1.15,2.2]],false),.045);lead(poly([[s*.8,7.2],[s*.78,4.5],[s*.92,2.1]],false),.04);lead(poly([[s*.2,6.5],[s*.26,4.2],[s*.36,2.05]],false),.04);}
  g.save();g.clip(mantle);g.lineWidth=.26;g.strokeStyle=LEAD;g.stroke(mantle);g.lineWidth=.16;g.strokeStyle='#e9b848';g.stroke(mantle);g.restore();lead(mantle);
  // 精修：蓝头巾 + 象牙内纱 + 更大的脸；灰绘五官加粗（眉、杏眼、瞳、鼻、唇、下颌阴影），俯视地面时也读得出是一张脸
  const face=(cx,cy,S)=>{g.save();g.strokeStyle='rgba(58,30,16,0.95)';g.lineCap='round';g.lineJoin='round';g.lineWidth=.03*S;g.beginPath();
    for(const s of[-1,1]){g.moveTo(cx+s*.22*S,cy+.13*S);g.quadraticCurveTo(cx+s*.13*S,cy+.2*S,cx+s*.04*S,cy+.14*S);

    g.moveTo(cx+.02*S,cy+.13*S);g.lineTo(cx+.04*S,cy-.08*S);g.lineTo(cx-.025*S,cy-.1*S);g.stroke();

  pc(ell(0,8.76,.53,.65),'#2a50ba',.04);
  pc(ell(0,8.72,.4,.51),'#d6cbae',.03);
  pc(ell(0,8.69,.32,.42),'#e5bf98',.02);
  face(0,8.69,1);
  pc(poly([[-.4,9.28],[-.43,9.74],[-.27,9.52],[-.14,9.82],[0,9.56],[.14,9.82],[.27,9.52],[.43,9.74],[.4,9.28]]),'#f0c24a',.04,.045);

  pc(poly([[0,7.5],[.12,7.2],[.11,6.85],[-.11,6.85],[-.12,7.2]]),'#f1d9bf',.02,.045);lead(poly([[0,7.47],[0,6.87]],false),.03);
  {const cr=new Path2D();cr.arc(0,2.45,1.1,Math.PI+.42,-.42,false);cr.arc(0,2.95,1.383,-.7577,Math.PI+.7577,true);cr.closePath();pc(cr,'#f0c75a',.04);}
  // --- two angels with spread wings (the left one is an exact mirror) ---
  const AX=3.1;
  // 精修：经典“举翼”剪影——从肩后升起、翼尖高过头顶、外缘一路垂到腰际；三层色带（红覆羽 / 金次级羽 / 钴蓝与象牙相间的飞羽），

  const WP=[.1,6.6],WA=[-1.22,1.62],WN=11;
  const wingP=(()=>{const P=new Path2D();P.moveTo(.18,6.2);
    P.bezierCurveTo(.02,7.4,.1,8.7,.42,9.5);P.bezierCurveTo(.78,9.0,.98,8.1,1.04,7.2);

  // 复评三轮：镜头下到地面、转成俯拍时曝光收一半——地上的彩光不再顶到色调曲线的肩部（原先一片死平、看不出石纹），
  // 33 秒起再一路推亮进白场，终点亮度与原先一致
  PR.expo=(1-.12*sstep(4,11,t))*(1-.25*dark)*lerp(1,.5,sstep(26.8,29.6,t))*(1+1.9*sstep(32.2,34.8,t));
  PR.bloomK=.24+.16*grade+.5*sstep(33,35,t);PR.grade=grade;
  PR.veil=.6*(1-sstep(0,2.8,t))+.9*sstep(33,35.2,t);   // 复评三轮：白场推到 0.9，终点是亮白而不是灰雾
  renderPost(t,f,PR);
  updateText(t);
}

// ---------------- sizing ----------------
// 精修：画布铺满视口；片子（≤1080×1920）居中，uRect 告诉合成 pass 片框在哪；Q 为自适应画质系数
let Q=1,CW=0,CH=0,FX=0,FY=0;
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight,u=Math.min(vw/100,vh/177.7778);U_PX=u;
  document.documentElement.style.setProperty('--u',u+'px');
  document.body.classList.toggle('wide',(vw-u*100)/2>=220);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const k=dpr*Math.min(1,1080/(u*100*dpr),1920/(u*177.7778*dpr))*Q;
  const W=Math.max(16,Math.round(u*100*k)),H=Math.max(16,Math.round(u*177.7778*k));
  const cw=Math.max(W,Math.round(vw*k)),ch=Math.max(H,Math.round(vh*k));
  if(cw!==CW||ch!==CH){CW=cw;CH=ch;renderer.setSize(CW,CH,false);}
  FX=Math.round((CW-W)/2);FY=Math.round((CH-H)/2);compMat.uniforms.uRect.value.set(FX,FY,W,H);
  if(W!==RW||H!==RH||!rtScene){RW=W;RH=H;allocRT(W,H);
    const px=H/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));grMat.uniforms.uPx.value=px;duMat.uniforms.uPx.value=px;}
  volMat.uniforms.uSteps.value=Q<.9?30:40;
  if(curFrame>=0)renderFrame(curFrame);
}

// ---------------- playback: fixed 1/30 s steps ----------------
let playing=false,clock0=0,tBase=0,curFrame=-1,pendingSeek=null,resumeAfter=false,stillMode=false,idleT=0,wasPlaying=false,lastTick=0;
const STILL_T=24.5,LAST=DUR*FPS;
const btnSnd=document.getElementById('snd'),btnAgain=document.getElementById('again'),btnGo=document.getElementById('go');
// 精修：鼠标/触摸 3.2 s 不动就隐去按钮与光标（只在播放时），画面不再被常驻按钮遮住
function poke(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>{if(playing)document.body.classList.add('idle');},3200);}
function show(f){const prev=curFrame>=0?curFrame/FPS:null;curFrame=f;renderFrame(f);if(playing)audioFrame(f/FPS,prev);}
function play(from){
  if(from!==undefined)tBase=from;else tBase=curFrame>=0&&curFrame<LAST?curFrame/FPS:0;
  curFrame=-1;clock0=lastTick=performance.now();playing=true;btnAgain.style.display='none';btnGo.style.display='none';
  if(AC&&audioOn)AC.resume();poke();
}
function pause(){playing=false;if(AC&&AC.state==='running')AC.suspend();document.body.classList.remove('idle');const end=curFrame>=LAST;btnGo.style.display=end?'none':'inline-block';btnAgain.style.display=end?'inline-block':'none';}
function seek(t){const f=clamp(Math.round(t*FPS),0,LAST);curFrame=f;pause();renderFrame(f);
  return new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));}
// 自适应画质：播放时每 45 帧看一次平均帧间隔，>42 ms 降 0.15（最低 0.6），连续三次 <21 ms 再升；?hq 锁定满画质
let qAcc=0,qN=0,qLast=0,qGood=0;const qLock=QS.has('hq');
function adapt(now){
  if(qLock||!playing||document.hidden){qLast=0;return;}
  if(qLast){const d=now-qLast;if(d<500){qAcc+=d;qN++;}}qLast=now;
  if(qN<45)return;const m=qAcc/qN;qAcc=0;qN=0;
  if(m>42&&Q>.6){Q=Math.max(.6,+(Q-.15).toFixed(2));qGood=0;resize();}
  else if(m<21&&Q<1){if(++qGood>=3){Q=Math.min(1,+(Q+.1).toFixed(2));qGood=0;resize();}}
  else qGood=0;
}
function tick(now){
  requestAnimationFrame(tick);
  if(pendingSeek!==null){const f=clamp(Math.round(pendingSeek*FPS),0,LAST);pendingSeek=null;if(f!==curFrame){curFrame=f;renderFrame(f);}}
  adapt(now);
  if(!playing)return;
  // 精修收尾：在后台标签页打开、或 rAF 被浏览器停掉很久时，把这段空档从时钟里扣掉——
  // 原先按墙钟算帧号，页面在后台打开，切回来时片子已经跳到中段甚至结尾
  if(now-lastTick>250)clock0+=now-lastTick-1000/FPS;
  lastTick=now;
  let f=Math.floor(((now-clock0)/1000+tBase)*FPS);
  if(f>=LAST){f=LAST;show(f);playing=false;document.body.classList.remove('idle');btnAgain.style.display='inline-block';btnGo.style.display='none';
    if(AC&&audioOn)setTimeout(()=>{if(!playing&&AC.state==='running')AC.suspend();},3000);return;}
  if(f!==curFrame)show(f);
}
// 进度条：按下/拖动即时预览（在 rAF 里合并），松手后若原本在播就从该处继续
const xToT=x=>{const r=trackEl.getBoundingClientRect();return clamp((x-r.left)/Math.max(r.width,1),0,1)*DUR;};
seekEl.addEventListener('pointerdown',e=>{e.preventDefault();try{seekEl.setPointerCapture(e.pointerId);}catch(_){}
  seekEl.classList.add('drag');resumeAfter=playing||resumeAfter;stillMode=false;
  if(playing){playing=false;if(AC&&AC.state==='running')AC.suspend();}pendingSeek=xToT(e.clientX);});
seekEl.addEventListener('pointermove',e=>{if(seekEl.classList.contains('drag'))pendingSeek=xToT(e.clientX);});
const endDrag=e=>{if(!seekEl.classList.contains('drag'))return;seekEl.classList.remove('drag');pendingSeek=null;
  const f=clamp(Math.round(xToT(e.clientX)*FPS),0,LAST);curFrame=f;renderFrame(f);
  if(resumeAfter&&f<LAST)play(f/FPS);else pause();resumeAfter=false;};
seekEl.addEventListener('pointerup',endDrag);seekEl.addEventListener('pointercancel',endDrag);
btnSnd.addEventListener('click',()=>{initAudio();audioOn=true;AC.resume();btnSnd.classList.add('gone');stillMode=false;play(0);});
btnAgain.addEventListener('click',()=>{if(AC&&audioOn)AC.resume();play(0);});
btnGo.addEventListener('click',()=>{if(stillMode){stillMode=false;play(0);}else play();});
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='BUTTON'&&(e.code==='Space'||e.code==='Enter'))return;
  if(e.code==='Space'){e.preventDefault();stillMode=false;playing?pause():play();}
  else if(e.code==='ArrowRight'||e.code==='ArrowLeft'){e.preventDefault();const f=clamp((curFrame<0?0:curFrame)+(e.code==='ArrowRight'?1:-1)*(e.shiftKey?FPS:1),0,LAST);curFrame=f;pause();renderFrame(f);}
  else if(e.code==='KeyR'){stillMode=false;play(0);}
});
// 复评四轮：点画面切换播放/暂停，触屏上也能停下来细看；界面已隐去时第一下只唤出界面，不打断播放
const stageEl=document.getElementById('stage');let tapWake=false;
stageEl.addEventListener('pointerdown',()=>{tapWake=document.body.classList.contains('idle');});
stageEl.addEventListener('click',e=>{if(tapWake||e.target.closest('button,#seek'))return;
  if(stillMode){stillMode=false;play(0);}else if(playing)pause();else play();});
for(const ev of['pointermove','pointerdown','keydown','touchstart'])window.addEventListener(ev,poke,{passive:true});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){wasPlaying=playing;if(playing)pause();}
  else if(wasPlaying){wasPlaying=false;play();}});
window.addEventListener('resize',resize);

window.yohaku={
  seek,play:()=>play(),pause,
  frame:n=>{pause();curFrame=n;renderFrame(n);return cvs.toDataURL('image/png');},
  clean:on=>{document.body.classList.toggle('clean',on!==false);},
  get rect(){return{x:FX,y:CH-FY-RH,w:RW,h:RH,cw:CW,ch:CH};},
  get q(){return Q;},
  get t(){return Math.max(curFrame,0)/FPS;}
};

resize();
if(QS.has('clean'))document.body.classList.add('clean');
if(QS.has('t')){seek(parseFloat(QS.get('t'))||0);}
else if(RM&&!QS.has('from')){stillMode=true;seek(STILL_T);}   // 减少动态：先给一张静止的好画面，由观众自己按“再生”
else{renderFrame(0);curFrame=0;play(QS.has('from')?clamp(parseFloat(QS.get('from'))||0,0,DUR-.1):0);}
requestAnimationFrame(tick);
</script>
</body>
</html>
