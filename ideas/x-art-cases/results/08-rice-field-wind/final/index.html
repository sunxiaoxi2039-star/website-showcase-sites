<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verdant — A Sea of Green</title>
<meta name="description" content="A procedural rice field moving with the wind. Nothing to do. Just follow the breeze.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.2.5/300.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.2.5/400-italic.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.2.5/600.css">
<style>
:root{
  --ink:#f3f0e4; --ink-dim:rgba(243,240,228,.7); --ink-faint:rgba(243,240,228,.46);
  --panel:rgba(15,33,21,.5); --line:rgba(236,240,220,.14);
  --accent:#e6e0c2; --accent-ink:#1b3020;
  --display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#aeb9b7 linear-gradient(180deg,#bcc6c8 0%,#aab6b3 30%,#6f7f5a 35%,#3b5129 48%,#22331a 100%) fixed;overflow:hidden;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.2s ease;touch-action:none}
canvas#c.ready{opacity:1}
#hud{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(16px,2.8vw,38px);padding-bottom:max(clamp(16px,2.8vw,38px),env(safe-area-inset-bottom));pointer-events:none}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:600;letter-spacing:.5em;font-size:14px;color:var(--ink);text-shadow:0 1px 14px rgba(20,30,20,.3)}
.brand svg{width:17px;height:17px;flex:0 0 auto;filter:drop-shadow(0 1px 6px rgba(20,30,20,.3))}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
.title{min-width:0;position:relative}
.title::before{content:"";position:absolute;left:-70px;right:-90px;top:-60px;bottom:-44px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 34% 62%,rgba(9,22,11,.44),rgba(9,22,11,.18) 50%,rgba(9,22,11,0) 72%)}
.eyebrow{width:44px;height:1px;background:var(--ink-dim);margin:0 0 18px 5px;box-shadow:0 1px 6px rgba(8,20,10,.4)}
.title h1{font-family:var(--display);font-weight:300;font-size:clamp(50px,7.3vw,114px);line-height:.88;margin:0 0 .2em;letter-spacing:-.012em;text-shadow:0 2px 30px rgba(10,26,12,.36)}
.title p{margin:0 0 0 4px;font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(18px,1.6vw,23px);letter-spacing:.01em;color:rgba(244,241,230,.92);text-shadow:0 1px 2px rgba(8,20,10,.5),0 0 18px rgba(8,20,10,.5)}
.panel{pointer-events:auto;width:318px;flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 14px 11px;
  backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);box-shadow:0 18px 50px rgba(6,18,10,.24),inset 0 1px 0 rgba(255,255,255,.06)}
.group{margin-bottom:13px}
.label{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);margin:0 2px 7px}
.label span{letter-spacing:.02em;text-transform:none;font-family:var(--display);font-style:italic;font-size:15px;color:var(--ink)}
.seg{display:flex;gap:3px;background:rgba(0,0,0,.2);border-radius:10px;padding:3px}
.seg button,.row button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink);font:500 12.5px/1 var(--sans);padding:9px 6px;border-radius:7px;cursor:pointer;transition:background .3s,color .3s,box-shadow .3s;white-space:nowrap}
.seg button:hover{background:rgba(255,255,255,.08)}
.seg button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 10px rgba(0,0,0,.14)}
.row{display:flex;gap:8px;margin-top:2px}
.row button{border:1px solid var(--line);background:rgba(255,255,255,.05)}
.row button:hover{background:rgba(255,255,255,.11)}
.row button[aria-pressed="true"]{background:rgba(230,224,194,.2);border-color:rgba(230,224,194,.42)}
.keys{margin:10px 2px 0;font-size:10px;letter-spacing:.06em;color:var(--ink-faint);text-align:center}
.keys b{font-weight:600;color:var(--ink-dim)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer;--p:45%}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p),rgba(255,255,255,.22) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);margin-top:-6.5px;box-shadow:0 0 0 5px rgba(230,224,194,.16);transition:box-shadow .2s}
input[type=range]:active::-webkit-slider-thumb{box-shadow:0 0 0 8px rgba(230,224,194,.2)}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:rgba(255,255,255,.22)}
input[type=range]::-moz-range-progress{height:3px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nogl{position:fixed;inset:0;display:none;place-items:center;font-family:var(--display);font-size:20px;color:#1c3221;text-align:center;padding:24px}
/* intro: the landscape fades up first, then the words settle in */
.brand,.eyebrow,.title h1,.title p,.panel{animation:rise 1.5s cubic-bezier(.2,.7,.2,1) both}
.brand{animation-delay:.2s}.eyebrow{animation-delay:.35s}.title h1{animation-delay:.45s}.title p{animation-delay:.75s}.panel{animation-delay:.9s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (hover:none){.keys{display:none}}
@media (max-width:720px){
  .bottom{flex-direction:column;align-items:stretch;gap:14px}
  .eyebrow{margin-bottom:12px;width:34px}
  .title h1{font-size:44px}
  .title p{font-size:17px}
  .panel{width:100%;padding:10px 10px 10px;border-radius:14px;display:grid;grid-template-columns:50px 1fr;column-gap:8px;row-gap:7px;align-items:center}
  .group{display:contents}
  .label{margin:0 0 0 2px;font-size:9.5px;letter-spacing:.16em}
  .label span{display:none}
  .seg button,.row button{font-size:12px;padding:9px 4px}
  .row{grid-column:1 / -1;margin-top:1px}
  .keys{display:none}
}
@media (max-height:560px) and (min-width:721px){ .title h1{font-size:50px} .group{margin-bottom:8px} .keys{display:none} .eyebrow{margin-bottom:8px} }
@media (prefers-reduced-motion:reduce){
  canvas#c{transition:opacity .4s linear}
  .brand,.eyebrow,.title h1,.title p,.panel{animation:fade .5s linear both;animation-delay:0s}
  .seg button,.row button{transition:none}
}
</style>
</head>
<body>
<canvas id="c" aria-label="A procedural rice field moving in the wind"></canvas>
<div class="nogl">This scene needs WebGL. Try a recent desktop or mobile browser.</div>
<div id="hud">
  <header class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22C12 14 13.5 8 20 3c-1 7-3.6 11.6-8 13.4M12 22c0-5-1.3-8.6-6.5-11.5.4 4.6 2.6 7.6 6.5 9" fill="none" stroke="#f3f0e4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>VERDANT</span>
  </header>
  <div class="bottom">
    <div class="title">
      <div class="eyebrow" aria-hidden="true"></div>
      <h1>A sea of green</h1>
      <p>Nothing to do. Just follow the breeze.</p>
    </div>
    <aside class="panel" aria-label="Scene controls">
      <div class="group">
        <div class="label">Light</div>
        <div class="seg" data-group="light" role="group" aria-label="Light">
          <button type="button" data-v="morning" aria-pressed="false">Morning</button>
          <button type="button" data-v="afternoon" class="on" aria-pressed="true">Afternoon</button>
          <button type="button" data-v="golden" aria-pressed="false">Golden Hour</button>
        </div>
      </div>
      <div class="group">
        <div class="label">View</div>
        <div class="seg" data-group="view" role="group" aria-label="View">
          <button type="button" data-v="open" class="on" aria-pressed="true">Open Field</button>
          <button type="button" data-v="among" aria-pressed="false">Among the Rice</button>
        </div>
      </div>
      <div class="group">
        <label class="label" for="wind">Wind <span id="windVal">Breeze</span></label>
        <input id="wind" type="range" min="0" max="100" value="45" aria-label="Wind strength">
      </div>
      <div class="row">
        <button type="button" id="pause" aria-pressed="false">Pause</button>
        <button type="button" id="sound" aria-pressed="false">Sound off</button>
      </div>
      <div class="keys" aria-hidden="true"><b>Space</b> pause · <b>1 2 3</b> light · <b>V</b> view</div>
    </aside>
  </div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ---------- renderer & basics ---------- */
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (err) {
  document.querySelector('.nogl').style.display = 'grid';
  throw err;
}
const NARROW = Math.min(innerWidth, innerHeight) < 720 && innerWidth < 900;
const PR = Math.min(window.devicePixelRatio || 1, NARROW ? 1.5 : 1.75); // pixel-ratio cap
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // the composite pass does tone map + grade + gamma
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0x9fb0b2, 1);

// software rasterisers (CI / headless) get a fixed full-res frame; real GPUs get adaptive resolution
let SOFT = false;
try {
  const gl = renderer.getContext(), ext = gl.getExtension('WEBGL_debug_renderer_info');
  SOFT = /swiftshader|llvmpipe|software|basic render/i.test(String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER)));
} catch (e) { /* ignore */ }
const ADAPT = !SOFT && !/quality=high/.test(location.search);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 3000);
const ASPECT0 = innerWidth / innerHeight;
const DEG = Math.PI / 180, TAU = Math.PI * 2;
const mqRM = matchMedia('(prefers-reduced-motion: reduce)');
let RM = mqRM.matches;

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R = rng(20260926);
const rand = (a, b) => a + (b - a) * R();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
// wind blows mostly across the frame (left → right, slightly away), so the waves travel laterally
const WIND_DIR = new THREE.Vector2(1, -0.36).normalize();

/* ---------- shared uniforms (one object, referenced by every scene material) ---------- */
const U = {
  uPhase: { value: 0 }, uTime: { value: 0 }, uStrength: { value: 0.6 },
  uWindDir: { value: WIND_DIR.clone() }, uCloudShift: { value: new THREE.Vector2() },
  uSunDir: { value: new THREE.Vector3(0.5, 0.6, -0.3).normalize() },
  uSunColor: { value: new THREE.Color() }, uSkyAmb: { value: new THREE.Color() }, uGroundAmb: { value: new THREE.Color() },
  uZenith: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() },
  uFogColor: { value: new THREE.Color() }, uFogDensity: { value: 0.0035 }, uExposure: { value: 0.92 },
  uMist: { value: 0 }, uInscatter: { value: 0.05 }, uCloudShadow: { value: 0.4 },
};

const GLSL_COMMON = /* glsl */`
uniform float uPhase, uTime, uStrength, uFogDensity, uExposure, uMist, uInscatter, uCloudShadow;
uniform vec2 uWindDir, uCloudShift;
uniform vec3 uSunDir, uSunColor, uSkyAmb, uGroundAmb, uZenith, uHorizon, uFogColor;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
  return mix(mix(hash12(i), hash12(i + vec2(1., 0.)), u.x), mix(hash12(i + vec2(0., 1.)), hash12(i + vec2(1., 1.)), u.x), u.y); }
float vnoise3(vec3 p){ vec3 i = floor(p), f = fract(p); vec3 u = f * f * (3. - 2. * f);
  float a = hash13(i), b = hash13(i + vec3(1.,0.,0.)), c = hash13(i + vec3(0.,1.,0.)), d = hash13(i + vec3(1.,1.,0.));
  float e = hash13(i + vec3(0.,0.,1.)), f1 = hash13(i + vec3(1.,0.,1.)), g = hash13(i + vec3(0.,1.,1.)), h = hash13(i + vec3(1.,1.,1.));
  return mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y), mix(mix(e, f1, u.x), mix(g, h, u.x), u.y), u.z); }
float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p + vec2(3.1, 7.7); a *= .5; } return s; }
float fbm3(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 3; i++){ s += a * vnoise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p + vec2(3.1, 7.7); a *= .5; } return s * 1.143; }
// Large travelling gust field: long waves rolling downwind, broken up by drifting noise patches.
float gustField(vec2 p){
  vec2 w = uWindDir; vec2 q = vec2(-w.y, w.x);
  float s = dot(p, w), c = dot(p, q);
  float w1 = sin(s * .17 - uPhase + sin(c * .043 + 1.3) * 2.1 + c * .018);
  float w2 = sin(s * .38 - uPhase * 1.63 + c * .1 + sin(s * .047) * 1.4 + 2.);
  float n = vnoise(vec2(s * .07 - uPhase * .45, c * .075));
  float g = .5 + .32 * w1 + .15 * w2;
  g *= .45 + 1.05 * n;
  return clamp(g, 0., 1.25);
}
// Drifting cloud shadows (~200 m patches moving downwind at a few m/s); only the sun term is shaded.
float cloudShade(vec2 xz){
  vec2 p = xz * .0042 + uCloudShift * 3.1;
  float n = vnoise(p) * .55 + vnoise(p * 2.13 + 5.2) * .3 + vnoise(p * 4.7 + 1.7) * .15;
  return 1. - uCloudShadow * smoothstep(.46, .68, n);
}
// fog colour picks up the sun when looking towards it (in-scattering)
vec3 fogTint(vec3 V){ float s = max(dot(V, uSunDir), 0.); return uFogColor + uSunColor * uInscatter * (pow(s, 6.) + pow(s, 40.) * .8); }
vec3 applyFog(vec3 col, vec3 wp){
  vec3 dv = wp - cameraPosition; float d = length(dv); vec3 V = dv / max(d, 1e-4);
  float f = 1. - exp(-pow(d * uFogDensity, 1.65));
  float mist = uMist * exp(-max(wp.y + .3, 0.) * .4) * (1. - exp(-d * .018)); // low ground mist
  f += (1. - f) * clamp(mist, 0., .95);
  return mix(col, fogTint(V), f);
}
vec3 finish(vec3 c){ return max(c * uExposure, 0.); } // linear HDR out; tone mapping happens in post
`;
const withU = extra => Object.assign({}, U, extra || {});

/* ---------- sky dome ---------- */
const skyMat = new THREE.ShaderMaterial({
  uniforms: withU(), depthWrite: false, depthTest: false, side: THREE.BackSide,
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.); gl_Position = p.xyww; }`,
  fragmentShader: GLSL_COMMON + /* glsl */`
    varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir);
      float h = d.y;
      vec3 col = mix(uHorizon, uZenith, pow(smoothstep(-.03, .75, h), .62));
      vec3 sd3 = normalize(uSunDir);
      float sd = max(dot(d, sd3), 0.);
      float lowSun = 1. - smoothstep(.05, .6, sd3.y);
      col += uSunColor * (pow(sd, 6.) * (.05 + .16 * lowSun) + pow(sd, 48.) * .12 + smoothstep(.9993, .9998, sd) * 1.6);
      col += uSunColor * .07 * lowSun * (1. - smoothstep(0., .22, h)) * pow(sd * .5 + .5, 3.);
      if (h > 0.){
        vec2 cp = d.xz / (h + .12) * 1.4 + uCloudShift;
        vec2 toSun = normalize(sd3.xz + vec2(1e-4));
        float c1 = fbm(cp * .55), c2 = fbm(cp * 1.7 + 4.);
        float dens = c1 * .78 + c2 * .32;
        float cov = smoothstep(.5, .86, dens) * smoothstep(.015, .2, h);
        // density a little way towards the sun: where it thins out, this side of the cloud is lit
        float dS = fbm((cp + toSun * .22) * .55) * .78 + c2 * .32;
        float edge = clamp((dens - dS) * 3. + .5, 0., 1.);
        vec3 lit = uHorizon * .97 + uSunColor * (.08 + .2 * pow(sd, 3.));
        vec3 shade = mix(uZenith, uHorizon, .5) * .8;
        vec3 cc = mix(shade, lit, clamp(edge * .75 + smoothstep(.35, .95, c2) * .35, 0., 1.));
        cc += uSunColor * pow(sd, 10.) * (1. - smoothstep(.5, .85, dens)) * .45; // silver lining near the sun
        col = mix(col, cc, cov * .8);
        float ci = fbm3(vec2(cp.x * .5 + cp.y * .12, cp.y * 2.2) * .5 + 11.); // faint high cirrus streaks
        col = mix(col, uHorizon * 1.06 + uSunColor * .04, smoothstep(.55, .8, ci) * smoothstep(.1, .45, h) * .2 * (1. - cov));
      }
      col = mix(col, fogTint(d), (1. - smoothstep(-.02, .1, h)) * .85);
      gl_FragColor = vec4(finish(col), 1.);
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1400, 48, 24), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);

/* ---------- layered hills: four ridges, each one lighter and bluer (aerial perspective) ---------- */
function hillStrip(radius, baseY, amp, seed, tint, haze, rough) {
  const r = rng(seed);
  const ph = [r() * 50, r() * 50, r() * 50, r() * 50];
  const cols = 520, span = 170 * DEG;
  const pos = [], top = [], idx = [];
  for (let i = 0; i <= cols; i++) {
    const u = i / cols, a = -span / 2 + span * u;
    const n = 0.5 * Math.sin(u * 7.3 + ph[0]) + 0.27 * Math.sin(u * 17.9 + ph[1]) + 0.15 * Math.sin(u * 41.3 + ph[2]) + 0.08 * Math.sin(u * 97.1 + ph[3])
      + rough * (0.05 * Math.sin(u * 203 + ph[0] * 2) + 0.03 * Math.sin(u * 431 + ph[1] * 3));
    const y = baseY + amp * (0.58 + 0.42 * n);
    const x = Math.sin(a) * radius, z = -Math.cos(a) * radius + 9;
    pos.push(x, -40, z, x, y, z);
    top.push(0, 1);
  }
  for (let i = 0; i < cols; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aTop', new THREE.Float32BufferAttribute(top, 1));
  g.setIndex(idx);
  const m = new THREE.ShaderMaterial({
    uniforms: withU({ uHaze: { value: haze }, uTint: { value: new THREE.Color(tint) } }),
    side: THREE.DoubleSide,
    vertexShader: /* glsl */`
      attribute float aTop; varying vec3 vW; varying float vTop;
      void main(){ vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; vTop = aTop; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: GLSL_COMMON + /* glsl */`
      uniform float uHaze; uniform vec3 uTint; varying vec3 vW; varying float vTop;
      void main(){
        float n = fbm(vW.xz * .012 + vec2(vW.y * .02, 0.));
        float n2 = vnoise(vW.xy * .06);
        vec3 base = uTint * (.72 + .5 * n) * (.9 + .2 * n2);
        float up = clamp(vTop, 0., 1.);
        float sh = cloudShade(vW.xz);
        vec3 lit = base * (uSkyAmb * .85 + uSunColor * max(uSunDir.y, .08) * .55 * sh * (.65 + .35 * up));
        vec3 V = normalize(vW - cameraPosition);
        vec3 ft = fogTint(V);
        const vec3 LW = vec3(.2126, .7152, .0722);
        vec3 haze = mix(ft, uZenith * (dot(ft, LW) / max(dot(uZenith, LW), 1e-3)), .16); // aerial perspective leans blue, not darker
        float mist = (1. - smoothstep(0., .55, up)) * (.16 + uMist * .45);
        float fT = 1. - exp(-pow(225. * uFogDensity, 1.65));           // fog at the back of the tree line

function ribbonBuilder() {
  const P = [], N = [], UV = [], K = [], I = [];
  const t = new THREE.Vector3(), nn = new THREE.Vector3();
  return {
    add(pts, widths, sides, kind) {
      const n = pts.length, start = P.length / 3;
      for (let i = 0; i < n; i++) {
        const p = pts[i], s = sides[i], w = widths[i] * 0.5;
        t.subVectors(pts[Math.min(i + 1, n - 1)], pts[Math.max(i - 1, 0)]).normalize();
        nn.crossVectors(s, t).normalize();
        P.push(p.x - s.x * w, p.y - s.y * w, p.z - s.z * w, p.x + s.x * w, p.y + s.y * w, p.z + s.z * w);
        N.push(nn.x, nn.y, nn.z, nn.x, nn.y, nn.z);
        const v = i / (n - 1);
        UV.push(0, v, 1, v);
        K.push(kind, kind);
      }
      for (let i = 0; i < n - 1; i++) { const a = start + i * 2; I.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    },
    build() {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(UV, 2));
      g.setAttribute('aKind', new THREE.Float32BufferAttribute(K, 1));
      g.setIndex(I);
      return g;
    },
  };
}
// integrate a curve whose elevation angle eases from e0 to e1 (arching / drooping)

    pts.push(p.clone());
  }

}

function buildHill(seed, tillers, panProb) {
  const r = rng(seed), rb = ribbonBuilder();

      const laz = az + (r() - 0.5) * 2.6, len = 0.5 + r() * 0.34;
      const pts = arc(lb, laz, len, (70 + r() * 14) * DEG, (-8 - r() * 50) * DEG, 7, 1.9);
      rb.add(pts, leafW(0.015 + r() * 0.007, 7), sidesFor(pts, laz, (r() - 0.5) * 1.4), 0);
    }

      const lb = pointAlong(stem, hasPan ? 0.62 + r() * 0.12 : 0.9 + r() * 0.08), laz = az + (r() - 0.5) * 1.1;
      const len = hasPan ? 0.28 + r() * 0.14 : 0.42 + r() * 0.2;
      const pts = arc(lb, laz, len, 84 * DEG, (hasPan ? 40 + r() * 26 : 10 + r() * 40) * DEG, 6, 1.6);
      rb.add(pts, leafW(0.016, 6), sidesFor(pts, laz, 0.5), 0);

      const rach = arc(top, paz, 0.22 + r() * 0.08, 78 * DEG, (-55 - r() * 25) * DEG, 7, 1.15);

const windEl = document.getElementById('wind'), windVal = document.getElementById('windVal');
let windTouched = false;
if (RM) windEl.value = 25; // reduced motion: a calmer default
let windTarget = windEl.value / 100, windS = windTarget, paused = false;
function syncWindUI() {
  const v = +windEl.value;
  windEl.style.setProperty('--p', v + '%');
  windVal.textContent = v < 6 ? 'Still' : v < 28 ? 'Calm' : v < 58 ? 'Breeze' : v < 82 ? 'Gusty' : 'Strong';
}
function setWind(v) { windEl.value = clamp(Math.round(v), 0, 100); windTarget = windEl.value / 100; syncWindUI(); }
windEl.addEventListener('input', () => { windTouched = true; windTarget = windEl.value / 100; syncWindUI(); });
syncWindUI();
const onRM = e => { RM = e.matches; if (RM) { par.tx = par.ty = 0; if (!windTouched) setWind(25); } else if (!windTouched) setWind(45); };
if (mqRM.addEventListener) mqRM.addEventListener('change', onRM); else if (mqRM.addListener) mqRM.addListener(onRM);
function select(group, v, instant) {
  const seg = document.querySelector(`.seg[data-group="${group}"]`);
  if (!seg || !seg.querySelector(`[data-v="${v}"]`)) return;
  seg.querySelectorAll('button').forEach(x => { const on = x.dataset.v === v; x.classList.toggle('on', on); x.setAttribute('aria-pressed', String(on)); });
  if (group === 'light') setLight(v, instant); else setView(v, instant);
}
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) select(seg.dataset.group, b.dataset.v);
}));
const pauseBtn = document.getElementById('pause');
function togglePause() {
  paused = !paused;
  pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  pauseBtn.setAttribute('aria-pressed', String(paused));
}
pauseBtn.addEventListener('click', togglePause);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const inField = e.target instanceof HTMLButtonElement || e.target instanceof HTMLInputElement;
  if (e.code === 'Space') { if (!inField) { e.preventDefault(); togglePause(); } return; }
  if (e.key === '1') select('light', 'morning');
  else if (e.key === '2') select('light', 'afternoon');
  else if (e.key === '3') select('light', 'golden');
  else if (e.key === 'v' || e.key === 'V') select('view', viewName === 'open' ? 'among' : 'open');
});
const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('click', () => {
  const on = audio.toggle();
  soundBtn.textContent = on ? 'Sound on' : 'Sound off';
  soundBtn.setAttribute('aria-pressed', String(on));
});

/* ---------- loop ---------- */
let last = performance.now(), phase = 0, flutter = 0, clouds = 0, simT = 0, breath = 1, ready = false;
let ftN = 0, frameNo = 0, slowRuns = 0, upBlockUntil = 0, drops = 0;
const ftBuf = new Float32Array(45);
const tmpDir = new THREE.Vector3(), tmpPos = new THREE.Vector3();
function frame(now) {
  const rawMs = now - last; last = now;
  const dt = Math.min(rawMs / 1000, 0.1);
  frameNo++;
  windS += (windTarget - windS) * (1 - Math.exp(-dt * 1.6));
  if (!paused) {
    simT += dt;
    // slow "breathing" of the wind: gusts swell and settle over ~10–30 s
    breath = 1 + (RM ? 0.4 : 1) * (0.16 * Math.sin(simT * 0.23) + 0.1 * Math.sin(simT * 0.61 + 1.3));
    phase += dt * (0.3 + windS * 1.15) * (RM ? 0.6 : 1) * (0.8 + 0.2 * breath);
    flutter += dt * (0.55 + windS * 1.1) * (RM ? 0.5 : 1);
    clouds += dt * (0.004 + windS * 0.012) * (RM ? 0.6 : 1);
  }
  U.uPhase.value = phase; U.uTime.value = flutter; U.uStrength.value = (0.1 + windS * 1.25) * breath;
  U.uCloudShift.value.set(-WIND_DIR.x * clouds, -WIND_DIR.y * clouds);

  if (lightT < 1) { lightT = Math.min(1, lightT + dt / (RM ? 1.2 : 2.4)); applyLight(lightT); }

  const to = VIEWS[viewName];
  if (viewT < 1) viewT = Math.min(1, viewT + dt / (RM ? 1.6 : 2.8));
  const e = ease(viewT);
  camState.pos.lerpVectors(viewFrom.pos, to.pos, e);
  camState.pos.y += Math.sin(Math.PI * e) * 0.35 * viewArc * (viewT < 1 ? 1 : 0);
  camState.pitch = lerp(viewFrom.pitch, to.pitch, e);
  camState.yaw = lerp(viewFrom.yaw, to.yaw, e);

  const kp = 1 - Math.exp(-dt * 2.2);
  par.x += (par.tx - par.x) * kp; par.y += (par.ty - par.y) * kp;
  const pScale = viewName === 'among' ? 0.5 : 1;
  const yaw = (camState.yaw + par.x * 1.1) * DEG, pitch = (camState.pitch - par.y * 0.55) * DEG;
  tmpPos.copy(camState.pos);
  tmpPos.x += par.x * 0.16 * pScale; tmpPos.y -= par.y * 0.05 * pScale;
  camera.position.copy(tmpPos);
  tmpDir.set(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  camera.lookAt(tmpPos.x + tmpDir.x, tmpPos.y + tmpDir.y, tmpPos.z + tmpDir.z);
  sky.position.copy(camera.position);

  renderFrame();
  if (!ready) { ready = true; canvas.classList.add('ready'); }

  // adaptive resolution on real GPUs. It looks at the median frame of each 45-frame window, so a few
  // hitches (tab switch, GC, a screenshot) never count; the scale drops only after two slow windows in
  // a row, and climbs back once frames sit comfortably on vsync again.
  if (ADAPT && frameNo > 90 && !document.hidden && rawMs < 250) {
    ftBuf[ftN++] = rawMs;
    if (ftN === ftBuf.length) {
      const med = ftBuf.slice().sort()[ftN >> 1];
      slowRuns = med > 24 ? slowRuns + 1 : 0;
      if (slowRuns >= 2 && rScale > 0.6) {
        rScale = Math.max(0.6, rScale * 0.87); sizeTargets(); slowRuns = 0;
        drops++; upBlockUntil = now + 8000 * drops; // back off harder each time it has to drop again
      } else if (med < 18.5 && rScale < 1 && now > upBlockUntil) {
        rScale = Math.min(1, rScale / 0.87); sizeTargets(); upBlockUntil = now + 4000;
      }
      ftN = 0;
    }
  }

  if (audio.on) {
    const cx = camera.position.x, cz = camera.position.z;
    const g = (gustJS(cx + 3, cz - 4, phase) + gustJS(cx - 2, cz - 9, phase) + gustJS(cx + 5, cz - 15, phase)) / 3;
    audio.update(paused ? 0.25 : g, windS, flutter);
  }
}
renderer.setAnimationLoop(frame);

// small hook for automated checks; the scene never needs it
window.__verdant = {
  setLight: (n, instant) => select('light', n, instant), setView: (n, instant) => select('view', n, instant), togglePause, setWind,
  get riceCount() { return riceCount; },
  get info() { return { soft: SOFT, adapt: ADAPT, scale: rScale, samples: SAMPLES, float: floatOK, light: lightName, view: viewName, frames: frameNo }; },
};
</script>
</body>
</html>
