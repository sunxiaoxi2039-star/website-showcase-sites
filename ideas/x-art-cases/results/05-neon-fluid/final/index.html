<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050508">
<title>Eulerian Neon Fluid</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%2300F0FF%22/%3E%3C/svg%3E">
<style>
:root{--c0:#00F0FF;--c1:#FF007F;--c2:#7B2BFF;--c3:#FFB000;--ink:#eef0ff;--ink2:rgba(238,240,255,.64);--ink3:rgba(238,240,255,.38)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050508;overscroll-behavior:none;touch-action:none}
body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#fluid{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;background:#050508}
.glass{background:linear-gradient(155deg,rgba(255,255,255,.09),rgba(255,255,255,.025) 48%,rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.10);box-shadow:0 22px 60px -18px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(22px) saturate(175%);backdrop-filter:blur(22px) saturate(175%)}
#hud{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:min(256px,calc(100vw - 32px));padding:14px 16px 12px;border-radius:20px;z-index:4;transition:opacity .65s ease,transform .65s cubic-bezier(.2,.8,.2,1),filter .65s ease}
#hud::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(125deg,var(--c0),transparent 28%,transparent 64%,var(--c1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none}
#hud.off{opacity:0;transform:translateY(14px) scale(.965);filter:blur(6px);pointer-events:none}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.brand{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:650;letter-spacing:.3em;white-space:nowrap}
.orb{display:block;width:9px;height:9px;border-radius:50%;background:conic-gradient(var(--c0),var(--c1),var(--c2),var(--c3),var(--c0));box-shadow:0 0 12px var(--c0),0 0 3px #fff inset}
#themeName{font-size:10.5px;font-weight:600;letter-spacing:.04em;background:linear-gradient(90deg,var(--c0),var(--c1));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;margin-top:11px}
.row span{font-size:11px;color:var(--ink2);letter-spacing:.02em}
.row output{font:500 10.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink)}
.row input{grid-column:1/-1;margin-top:4px}
input[type=range]{--fill:50%;-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;touch-action:none;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--c0),var(--c1)) 0 0/var(--fill) 100% no-repeat,rgba(255,255,255,.13)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5.5px;border-radius:50%;background:#fff;border:none;box-shadow:0 0 0 4px rgba(255,255,255,.10),0 0 14px 1px var(--c0);transition:transform .15s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(255,255,255,.32),0 0 14px 1px var(--c0)}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:rgba(255,255,255,.13)}
input[type=range]::-moz-range-progress{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--c0),var(--c1))}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:none;box-shadow:0 0 0 4px rgba(255,255,255,.10),0 0 14px 1px var(--c0)}
.btns{display:grid;grid-template-columns:1.32fr 1fr;gap:8px;margin-top:14px}
button{-webkit-appearance:none;appearance:none;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit;font-size:9.5px;font-weight:650;line-height:1;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:background .25s,border-color .25s,box-shadow .25s,transform .12s}
button:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.24);box-shadow:0 0 22px -6px var(--c0),inset 0 0 12px -6px var(--c1)}
button:active{transform:scale(.965)}
button:focus-visible{outline:1px solid var(--c0);outline-offset:2px}
button.pulse{animation:pulse .5s ease}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--c1)}100%{box-shadow:0 0 0 14px transparent}}
.sw{display:block;width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--c0) 0 25%,var(--c1) 25% 50%,var(--c2) 50% 75%,var(--c3) 75%);box-shadow:0 0 8px -1px var(--c1)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:3px 8px;margin-top:11px;font:500 9px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink3);letter-spacing:.03em;white-space:nowrap}
.foot .keys{margin-left:auto}
#tab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:40px;height:40px;border-radius:50%;padding:0;z-index:3;opacity:0;pointer-events:none;transition:opacity .6s ease}
body.hud-off #tab{opacity:.6;pointer-events:auto}
body.hud-off #tab:hover{opacity:1}
#tab .orb{width:11px;height:11px}
#hint{position:fixed;left:50%;top:max(20px,env(safe-area-inset-top));transform:translateX(-50%);padding:9px 16px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;z-index:2;transition:opacity 1.2s ease,transform 1.2s ease;pointer-events:none}
#hint.gone{opacity:0;transform:translate(-50%,-8px)}
#fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;z-index:9;background:radial-gradient(40% 50% at 30% 40%,rgba(0,240,255,.16),transparent 70%),radial-gradient(45% 55% at 70% 60%,rgba(255,0,127,.16),transparent 70%),radial-gradient(35% 45% at 55% 30%,rgba(123,43,255,.14),transparent 70%),#050508;background-size:140% 140%;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0% 0%}to{background-position:100% 100%}}
#fail.show{display:flex}
#fail .card{max-width:440px;padding:22px 24px;border-radius:20px}
#fail h1{font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:10px}
#fail p{font-size:13px;line-height:1.6;color:var(--ink2);-webkit-user-select:text;user-select:text}
@media (max-width:520px){#hud{padding:12px 14px 10px;border-radius:18px}.row{margin-top:8px}.foot .keys{display:none}#hint{font-size:9px;letter-spacing:.18em;padding:8px 13px}}
@media (prefers-reduced-motion:reduce){#hud,#hint,#tab{transition:none}#fail{animation:none}}
</style>
</head>
<body>
<canvas id="fluid" aria-label="Interactive neon fluid simulation. Drag, flick or tap to inject glowing dye."></canvas>
<div id="hint" class="glass">Drag · flick · tap to pour light</div>
<section id="hud" class="glass" aria-label="Fluid controls">
  <div class="head"><div class="brand"><i class="orb"></i>NEON FLUID</div><span id="themeName">Cyberpunk</span></div>
  <label class="row"><span>Viscosity</span><output id="viscOut">0.10</output><input id="visc" type="range" min="0" max="1" step="0.01" value="0.10"></label>
  <label class="row"><span>Dye persistence</span><output id="persistOut">70%</output><input id="persist" type="range" min="0" max="1" step="0.01" value="0.7"></label>
  <label class="row"><span>Splat radius</span><output id="radiusOut">0.30</output><input id="radius" type="range" min="0.05" max="1" step="0.01" value="0.30"></label>
  <div class="btns"><button id="clearBtn" type="button">Clear Canvas</button><button id="themeBtn" type="button"><i class="sw"></i>Theme</button></div>
  <div class="foot"><span id="stats">starting…</span><span class="keys">H hud · T theme · C clear</span></div>
</section>
<button id="tab" class="glass" type="button" aria-label="Show controls"><i class="orb"></i></button>
<div id="fail" role="alert"><div class="card glass"><h1>Neon Fluid</h1><p id="failMsg"></p></div></div>
<script>
(function () {
'use strict';

/* ------------------------------------------------------------------ *
 *  Eulerian Neon Fluid — single-file GPU fluid (WebGL2 / WebGL1)
 *  Semi-Lagrangian advection, divergence, Jacobi pressure projection,
 *  vorticity confinement, implicit viscosity, curl-noise ambience,
 *  HDR dye with dual-filter bloom, ACES tone mapping and edge-driven
 *  chromatic aberration in the final composite.
 * ------------------------------------------------------------------ */

const canvas = document.getElementById('fluid');
const $ = (id) => document.getElementById(id);
const hud = $('hud'), tab = $('tab'), hint = $('hint'), failBox = $('fail');

const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
const LOW = coarse || Math.min(window.innerWidth, window.innerHeight) < 600;
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const cfg = {
  SIM_RES: LOW ? 128 : 200,
  DYE_RES: LOW ? 640 : 1024,
  BLOOM_RES: LOW ? 224 : 320,
  BLOOM_LEVELS: 6,
  PRESSURE_ITERS: 24,
  PRESSURE_DECAY: 0.8,
  VISC_ITERS: 14,
  CURL: 28,
  VEL_DISSIPATION: 0.18,
  BLOOM_THRESHOLD: 0.3,
  BLOOM_KNEE: 0.8,
  BLOOM_AMT: 1.35,
  EXPOSURE: 1.2,
  CA: 1.0,
  viscosity: 0.10,
  persistence: 0.7,
  radius: 0.30
};

/* ---------------------------- themes ----------------------------- */
const THEMES = [
  // `cool`: how fast each channel of old dye fades relative to the persistence setting. Green goes
  // a little faster, so fading gold cools toward ember orange-red and fading cyan toward deep blue
  // instead of both turning into brown or teal-grey mud; fresh light keeps its true hue.
  // `shadow`: the hue thin, aging smoke settles into (linear, brightest channel = 1). Mixed washes
  // would otherwise average out to a dusty lavender; instead they sink into deep ultraviolet,
  // ember crimson or abyssal blue, and only fresh, dense dye shows its true neon colour.
  { name: 'Cyberpunk',           hex: ['#00F0FF', '#FF007F', '#7B2BFF', '#FFB000'], cool: [1.0, 1.25, 1.0], shadow: [0.32, 0.05, 1.0] },
  { name: 'Thermal Inferno',     hex: ['#FF2A00', '#FF8A00', '#FFD23F', '#C4005A'], cool: [1.0, 1.3, 1.15], shadow: [1.0, 0.06, 0.12] },
  { name: 'Bioluminescent Deep', hex: ['#00FFD0', '#0070FF', '#62FF4A', '#B04DFF'], cool: [1.2, 1.1, 1.0], shadow: [0.02, 0.3, 1.0] }
];
function hexToLin(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.pow(v / 255, 2.2));
}
THEMES.forEach((t) => { t.lin = t.hex.map(hexToLin); });
let themeIdx = 0;
const pal = THEMES[0].lin.map((c) => c.slice());
const cool = THEMES[0].cool.slice();
const shadow = THEMES[0].shadow.slice();

// Hold each palette colour, then ease into the next; writes into `out` (no per-splat allocations).
function paletteAt(phase, out) {
  const k = ((phase % 4) + 4) % 4;
  const i = Math.floor(k);
  let f = Math.min(1, Math.max(0, (k - i - 0.22) / 0.56));
  f = f * f * (3 - 2 * f);
  const a = pal[i], b = pal[(i + 1) % 4];
  out[0] = a[0] + (b[0] - a[0]) * f; out[1] = a[1] + (b[1] - a[1]) * f; out[2] = a[2] + (b[2] - a[2]) * f;
  return out;
}
const _col = [0, 0, 0];

/* ---------------------------- shaders ---------------------------- */
const PREC = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
precision highp sampler2D;
#else
precision mediump float;
precision mediump sampler2D;
#endif
`;
const VARY = 'varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;\n';
const FSH = PREC + VARY;

const NOISE = `
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p); vec2 f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i), b = hash(i + vec2(1.0, 0.0)), c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
`;
const BILERP = `
vec4 bilerp(sampler2D sam, vec2 uv, vec2 ts){
  vec2 st = uv / ts - 0.5;
  vec2 iuv = floor(st); vec2 fuv = fract(st);
  vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * ts);
  vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * ts);
  vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * ts);
  vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * ts);
  return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
}
`;

const baseVS = `precision highp float;
attribute vec2 aPosition;
${VARY}
uniform vec2 texelSize;
void main(){
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

const FS = {
  // Resample a field into a new texture while preserving on-screen scale (resize without stretching).
  copy: FSH + `
uniform sampler2D uTexture; uniform vec2 uScale; uniform vec4 uMul;
void main(){
  vec2 uv = (vUv - 0.5) * uScale + 0.5;
  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) { gl_FragColor = vec4(0.0); return; }
  gl_FragColor = texture2D(uTexture, uv) * uMul;
}`,
  clear: FSH + `
uniform sampler2D uTexture; uniform float value;
void main(){ gl_FragColor = value * texture2D(uTexture, vUv); }`,
  // Batched additive splats: every splat queued this frame is summed in ONE pass per target.
  // A splat is a capsule: the segment the brush travelled this frame, with a Gaussian cross-section
  // and stretched Gaussian end caps, so a stroke is one continuous ribbon at any frame rate instead
  // of a string of beads. On the dye pass it is broken into "bristles" by noise that is fine across
  // the stroke and slow along it; the arc-length offset keeps the bristles continuous frame to frame.
  // The dye pass also paints OVER what is there: the part of the old dye whose hue differs from the
  // new light is thinned in proportion to how much light lands, so a magenta stroke across old cyan
  // stays magenta instead of summing to lavender-white. Old dye of the same hue is kept, so a stroke
  // never dims itself. The thinning is exp(-k * total deposit), the same at any frame rate.
  splat: FSH + NOISE + `
uniform sampler2D uTarget; uniform float aspectRatio; uniform int uCount; uniform float uMode;
uniform vec4 uA[MAXS];   // xy start point, zw unit direction
uniform vec4 uB[MAXS];   // x radius, y end-cap stretch, z noise, w seed
uniform vec4 uC[MAXS];   // rgb dye, or xy velocity on the velocity pass
uniform vec4 uD[MAXS];   // x segment length, y arc-length offset
void main(){
  vec3 acc = vec3(0.0); float cov = 0.0;
  for (int i = 0; i < MAXS; i++) {
    if (i >= uCount) break;
    vec4 A = uA[i]; vec4 B = uB[i]; vec4 D = uD[i];
    vec2 p = vUv - A.xy; p.x *= aspectRatio;
    float along = dot(p, A.zw), across = dot(p, vec2(-A.w, A.z));
    float cap = along - clamp(along, 0.0, D.x);
    float e = (cap * cap / B.y + across * across) / B.x;
    if (e > 9.0) continue;
    float g = exp(-e);
    if (uMode > 0.5 && B.z > 0.0) {
      vec2 st = vec2(along + D.y, across) * inversesqrt(B.x);
      float n = vnoise(vec2(st.x * 0.9 + B.w * 3.1, st.y * 4.6 + B.w)) * 0.72 + vnoise(st * 1.6 - B.w * 1.7) * 0.28;
      g *= mix(1.0, smoothstep(0.16, 0.84, n) * 1.75, B.z);
    }
    acc += g * uC[i].xyz;
    cov += g * length(uC[i].xyz);
  }
  vec3 base = texture2D(uTarget, vUv).xyz;
  if (uMode > 0.5 && cov > 0.0) {
    vec3 cdir = acc / max(length(acc), 1e-6);
    vec3 same = cdir * max(dot(base, cdir), 0.0);
    base = mix(base, same, 1.0 - exp(-0.7 * cov));
  }
  gl_FragColor = vec4(base + acc, 1.0);
}`,
  advect: FSH + BILERP + `
uniform sampler2D uVelocity; uniform sampler2D uSource;
uniform vec2 uVelTexel; uniform vec2 uSrcTexel;
uniform float dt; uniform float dissipation; uniform float uMax; uniform vec3 uCool; uniform float uDrain;
void main(){
#ifdef MANUAL_FILTERING
  vec2 coord = vUv - dt * bilerp(uVelocity, vUv, uVelTexel).xy * uVelTexel;
  vec4 result = bilerp(uSource, coord, uSrcTexel);
#else
  vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * uVelTexel;
  vec4 result = texture2D(uSource, coord);
#endif
  result /= 1.0 + dissipation * dt * vec4(uCool, 1.0);
  // dye only: a small constant drain on top of the exponential fade, so thin old smoke actually
  // reaches black in finite time instead of hanging over the void as a murky veil; dense cores barely
  // notice. It is taken off the brightest channel and scales the colour as a whole, so hue is kept.
  if (uDrain > 0.0) {
    float mx = max(result.r, max(result.g, result.b));
    result.rgb *= max(mx - uDrain * dt, 0.0) / max(mx, 1e-5);
  }
  gl_FragColor = clamp(result, vec4(-uMax), vec4(uMax));
}`,
  divergence: FSH + `
uniform sampler2D uVelocity;
void main(){
  float L = texture2D(uVelocity, vL).x;
  float R = texture2D(uVelocity, vR).x;
  float T = texture2D(uVelocity, vT).y;
  float B = texture2D(uVelocity, vB).y;
  vec2 C = texture2D(uVelocity, vUv).xy;
  if (vL.x < 0.0) L = -C.x;
  if (vR.x > 1.0) R = -C.x;
  if (vT.y > 1.0) T = -C.y;
  if (vB.y < 0.0) B = -C.y;
  gl_FragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
}`,
  curl: FSH + `
uniform sampler2D uVelocity;
void main(){
  float L = texture2D(uVelocity, vL).y;
  float R = texture2D(uVelocity, vR).y;
  float T = texture2D(uVelocity, vT).x;
  float B = texture2D(uVelocity, vB).x;
  gl_FragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
}`,
  vorticity: FSH + `
uniform sampler2D uVelocity; uniform sampler2D uCurl; uniform float curl; uniform float dt;
void main(){
  float L = texture2D(uCurl, vL).x;
  float R = texture2D(uCurl, vR).x;
  float T = texture2D(uCurl, vT).x;
  float B = texture2D(uCurl, vB).x;
  float C = texture2D(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 0.0001;
  force *= curl * C;
  force.y *= -1.0;
  vec2 vel = texture2D(uVelocity, vUv).xy + force * dt;
  vel = clamp(vel, vec2(-3000.0), vec2(3000.0));
  gl_FragColor = vec4(vel, 0.0, 1.0);
}`,
  // Implicit viscous diffusion, solved with Jacobi iterations: (I - a*Laplacian) v = v0
  viscosity: FSH + `
uniform sampler2D uVelocity; uniform sampler2D uVelocity0; uniform float alpha;
void main(){
  vec2 L = texture2D(uVelocity, vL).xy;
  vec2 R = texture2D(uVelocity, vR).xy;
  vec2 T = texture2D(uVelocity, vT).xy;
  vec2 B = texture2D(uVelocity, vB).xy;
  vec2 x0 = texture2D(uVelocity0, vUv).xy;
  gl_FragColor = vec4((x0 + alpha * (L + R + T + B)) / (1.0 + 4.0 * alpha), 0.0, 1.0);
}`,
  pressure: FSH + `
uniform sampler2D uPressure; uniform sampler2D uDivergence;
void main(){
  float L = texture2D(uPressure, vL).x;
  float R = texture2D(uPressure, vR).x;
  float T = texture2D(uPressure, vT).x;
  float B = texture2D(uPressure, vB).x;
  float div = texture2D(uDivergence, vUv).x;
  gl_FragColor = vec4((L + R + B + T - div) * 0.25, 0.0, 0.0, 1.0);
}`,
  gradient: FSH + `
uniform sampler2D uPressure; uniform sampler2D uVelocity;
void main(){
  float L = texture2D(uPressure, vL).x;
  float R = texture2D(uPressure, vR).x;
  float T = texture2D(uPressure, vT).x;
  float B = texture2D(uPressure, vB).x;
  vec2 vel = texture2D(uVelocity, vUv).xy;
  vel -= vec2(R - L, T - B);
  gl_FragColor = vec4(vel, 0.0, 1.0);
}`,
  // Divergence-free ambient force: curl of a drifting fractal noise potential.
  ambient: FSH + NOISE + `

function step(dt) {
  flushSplats();

  let P;

  P = progs.ambient; P.bind();

  blit(velocity.write); velocity.swap();

    blit(velTmp);

  P = progs.divergence; P.bind();

  U3f(P, 'uCool', 1, 1, 1); U1f(P, 'uDrain', 0);

}

function render() {
  gl.disable(gl.BLEND);
  const n = bloomDown.length;
  let bloomTex = dye.read;
  if (n > 0) {
    let P = progs.prefilter; P.bind();
    const knee = cfg.BLOOM_THRESHOLD * cfg.BLOOM_KNEE + 0.0001;
    U3f(P, 'curve', cfg.BLOOM_THRESHOLD - knee, knee * 2, 0.25 / knee);
    U1f(P, 'threshold', cfg.BLOOM_THRESHOLD);
    U2f(P, 'uTexel', 1 / dyeW, 1 / dyeH);
    U1i(P, 'uTexture', dye.read.attach(0));
    blit(bloomDown[0]);
    P = progs.down; P.bind();
    for (let i = 1; i < n; i++) {
      const s = bloomDown[i - 1];
      U2f(P, 'uTexel', s.texelX, s.texelY);
      U1i(P, 'uTexture', s.attach(0));
      blit(bloomDown[i]);
    }
    bloomTex = bloomDown[n - 1];
    P = progs.up; P.bind();
    for (let i = n - 2; i >= 0; i--) {
      U2f(P, 'uTexel', bloomTex.texelX * 0.75, bloomTex.texelY * 0.75);
      U1i(P, 'uTexture', bloomTex.attach(0));
      U1i(P, 'uBase', bloomDown[i].attach(1));
      blit(bloomUp[i]);
      bloomTex = bloomUp[i];
    }
  }
  const P = progs.display; P.bind();

  U1i(P, 'uBloom', bloomTex.attach(1));
  U2f(P, 'uDyeTexel', 1 / dyeW, 1 / dyeH);
  U2f(P, 'uBloomTexel', bloomTex.texelX, bloomTex.texelY);
  U1f(P, 'uTime', REDUCED ? 0 : simTime);          // static grain under reduced motion
  U1f(P, 'uExposure', cfg.EXPOSURE);
  U1f(P, 'uBloomAmt', n > 0 ? cfg.BLOOM_AMT / n : 0);
  U1f(P, 'uCA', cfg.CA);
  U1f(P, 'uAspect', canvas.width / canvas.height);
  U3f(P, 'uBg', BG_LIN[0], BG_LIN[1], BG_LIN[2]);
  U3f(P, 'uShadow', shadow[0], shadow[1], shadow[2]);
  blit(null);
}

function intro() {
  addStroke({ cx: 0.44, cy: 0.34, a0: 205, a1: -12, r0: 0.34, r1: 0.27, dur: 1.7, phase: 0.0, dphase: 0.9, gain: 0.48, width: 0.53 });
  addStroke({ cx: 0.68, cy: 0.60, a0: 18, a1: -195, r0: 0.25, r1: 0.19, dur: 1.5, delay: 0.4, phase: 1.0, dphase: 0.85, gain: 0.47, width: 0.47 });
  addStroke({ cx: 0.60, cy: 0.46, a0: 90, a1: 610, r0: 0.17, r1: 0.02, dur: 1.5, delay: 0.95, phase: 2.05, dphase: 1.0, gain: 0.43, width: 0.31, stretch: 2 });
  addStroke({ cx: 0.44, cy: 0.93, a0: -114, a1: -66, r0: 0.78, dur: 0.9, delay: 1.3, phase: 3.0, dphase: 0.3, gain: 0.55, width: 0.22, stretch: 3.2, drag: 0.9 });

// Idle choreography: one gesture every few seconds, colours taken in palette order so gold and

  const roll = calm ? 0 : Math.random();

    const R = 0.15 + Math.random() * 0.16;
    addStroke({ cx, cy, a0: a, a1: a + dir * (120 + Math.random() * 110), r0: R, r1: R * (0.7 + Math.random() * 0.4),
      dur: (1.1 + Math.random() * 0.6) * slow, phase: ph, dphase: 0.9, gain: 0.45, width: 0.36 + Math.random() * 0.3, drag: calm ? 0.5 : 0.8 });

const wanderers = [
  { ax: 0.34, ay: 0.30, fx: 0.52, fy: 0.37, ph: 0.3, phase: 0.0 },
  { ax: 0.30, ay: 0.33, fx: 0.41, fy: 0.58, ph: 2.4, phase: 1.35 },
  { ax: 0.37, ay: 0.27, fx: 0.63, fy: 0.46, ph: 4.1, phase: 2.7 }

    // velocity is proportional to pointer speed, dye per unit of path is constant
    const steps = Math.max(1, Math.min(6, Math.ceil(dist / 0.07)));
    const vx = (dx / rdt) * simW * 0.95, vy = (dy / rdt) * simH * 0.95;
    const ix = (dx * aspect) / dist, iy = dy / dist, L = dist / steps;
    const ph0 = p.phase;
    p.phase += dist * 2.2;
    for (let s = 0; s < steps; s++) {
      const t = s / steps;
      paletteAt(ph0 + dist * 2.2 * (t + 0.5 / steps) + simTime * 0.12, _col);
      splat(sx + dx * t, sy + dy * t, vx, vy, _col, POINTER_DYE * density, rS, 0.42, ix, iy, stretch, p.seed, L, p.arc);
      p.arc += L;
    }
  }
}

/* ------------------------------ HUD ------------------------------ */
let hudTimer = 0, hudHover = false, hudHeld = false, hudPinnedOff = false, hintTimer = 0;

function hideHUD(force) {
  clearTimeout(hudTimer);
  let kbFocus = false;
  try { kbFocus = !!hud.querySelector(':focus-visible'); } catch (err) { kbFocus = false; }
  if (!force && (hudHover || hudHeld || kbFocus)) { hudTimer = setTimeout(hideHUD, 1500); return; }
  hud.classList.add('off');
  document.body.classList.add('hud-off');
}
function showHUD(ms) {
  if (hudPinnedOff || !running) return;
  hud.classList.remove('off');
  document.body.classList.remove('hud-off');
  clearTimeout(hudTimer);
  hudTimer = setTimeout(hideHUD, ms || 3000);
}
function toggleHUD() {
  if (hud.classList.contains('off')) { hudPinnedOff = false; showHUD(); }
  else { hudPinnedOff = true; hideHUD(true); }
}
hud.addEventListener('pointerenter', () => { hudHover = true; });
hud.addEventListener('pointerleave', () => { hudHover = false; hudHeld = false; showHUD(); });
hud.addEventListener('pointerdown', () => { hudHeld = true; });
window.addEventListener('pointerup', () => { if (hudHeld) { hudHeld = false; showHUD(); } });
window.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') showHUD(); }, { passive: true });
tab.addEventListener('click', () => { hudPinnedOff = false; showHUD(4000); });

function flashHint(text, ms) {
  hint.textContent = text;
  hint.classList.remove('gone');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hint.classList.add('gone'), ms || 5000);
}
function dismissHint() { clearTimeout(hintTimer); hint.classList.add('gone'); }

function bindSlider(id, key, show) {
  const el = $(id), out = $(id + 'Out');
  const update = () => {
    cfg[key] = parseFloat(el.value);
    out.textContent = show(cfg[key]);
    const pct = ((cfg[key] - parseFloat(el.min)) / (parseFloat(el.max) - parseFloat(el.min))) * 100;
    el.style.setProperty('--fill', pct.toFixed(1) + '%');
  };
  el.addEventListener('input', update);
  update();
}
bindSlider('visc', 'viscosity', (v) => v.toFixed(2));
bindSlider('persist', 'persistence', (v) => Math.round(v * 100) + '%');
bindSlider('radius', 'radius', (v) => v.toFixed(2));

function setTheme(i) {
  themeIdx = (i + THEMES.length) % THEMES.length;
  const t = THEMES[themeIdx];
  t.hex.forEach((h, k) => document.documentElement.style.setProperty('--c' + k, h));
  $('themeName').textContent = t.name;
}
let themeBurstIn = -1;
function cycleTheme() {
  setTheme(themeIdx + 1);
  themeBurstIn = 0.35;
  pulse($('themeBtn'));
}
function lerpPalette(dt) {
  const tgt = THEMES[themeIdx].lin, k = Math.min(1, dt * 2.6);
  for (let i = 0; i < 4; i++) for (let c = 0; c < 3; c++) pal[i][c] += (tgt[i][c] - pal[i][c]) * k;
  for (let c = 0; c < 3; c++) cool[c] += (THEMES[themeIdx].cool[c] - cool[c]) * k;
  for (let c = 0; c < 3; c++) shadow[c] += (THEMES[themeIdx].shadow[c] - shadow[c]) * k;
}
function pulse(btn) { btn.classList.remove('pulse'); void btn.offsetWidth; btn.classList.add('pulse'); }
function doClear() {
  if (!running) return;
  clearAll();
  pulse($('clearBtn'));
}
$('clearBtn').addEventListener('click', doClear);
$('themeBtn').addEventListener('click', cycleTheme);

window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'h') toggleHUD();
  else if (k === 't') { cycleTheme(); showHUD(); }
  else if (k === 'c') { doClear(); showHUD(); }
  else if (k === ' ' && !(e.target && e.target.tagName === 'BUTTON')) { e.preventDefault(); queuedBursts++; lastActivity = performance.now(); }
  else if (k !== 'tab') showHUD();
});

/* ------------------------------ loop ----------------------------- */
let lastNow = 0, fpsFrames = 0, fpsTime = 0;
const TIME_SCALE = REDUCED ? 0.4 : 1;           // reduced motion: the whole fluid moves at 40 % speed
const stats = $('stats');

function frame(now) {
  raf = requestAnimationFrame(frame);
  if (!running || gl.isContextLost()) return;
  const wall = lastNow ? (now - lastNow) / 1000 : 1 / 60;   // true frame time, for the fps readout
  const rdt = Math.min(Math.max(wall, 1 / 240), 1 / 12);
  lastNow = now;
  const dt = Math.min(rdt, 1 / 24) * TIME_SCALE;
  simTime += dt;

  syncSize();
  lerpPalette(rdt);
  if (themeBurstIn >= 0) {
    themeBurstIn -= rdt;
    if (themeBurstIn < 0) themeGesture();
  }
  ambience(now, dt);
  processInput(rdt);
  // strokes run on the same clock as the fluid: on a device that cannot hold 24 fps the whole piece
  // plays in slow motion but keeps its composition, instead of the brush outrunning the smoke
  updateStrokes(dt);
  step(dt);
  render();

  fpsFrames++; fpsTime += Math.min(wall, 2);       // unclamped, so a slow GPU reads as slow instead of a flat 12
  if (fpsTime >= 0.5) {
    stats.textContent = Math.round(fpsFrames / fpsTime) + ' fps · ' + simW + '×' + simH + ' · ' + (isGL2 ? 'gl2 ' : 'gl1 ') + fmt.name;
    fpsFrames = 0; fpsTime = 0;
  }
}

function fail(msg) {
  running = false;
  cancelAnimationFrame(raf);
  $('failMsg').textContent = msg;
  failBox.classList.add('show');
  hud.classList.add('off');
  hint.classList.add('gone');
  document.body.classList.remove('hud-off');
}

function start() {
  running = true;
  lastNow = 0;
  strokes.length = 0;
  updateUnits();
  intro();
  if (REDUCED) {
    // Reduced motion: no animated pour. The opening composition is settled off-screen so the page
    // opens on a finished still life that then only drifts slowly.
    for (let i = 0; i < 66; i++) { updateStrokes(1 / 30); step(1 / 30); simTime += 1 / 30; }
  }
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(frame);
}

canvas.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  running = false;
  cancelAnimationFrame(raf);
  flashHint('GPU context lost · restoring', 60000);
}, false);
canvas.addEventListener('webglcontextrestored', () => {
  velocity = dye = pressure = divergenceF = curlF = velTmp = null;
  bloomDown = []; bloomUp = [];
  try {
    if (initGL()) { start(); flashHint('Restored', 1600); }
  } catch (err) {
    fail('The GPU context came back but the fluid shaders could not be rebuilt: ' + (err && err.message ? err.message : err));
  }
}, false);

function boot() {
  gl = createContext();
  if (!gl) {
    fail('WebGL is not available in this browser, so the GPU fluid cannot run. A current Chrome, Safari or Firefox with hardware acceleration enabled will show the full simulation.');
    return;
  }
  try {
    if (!initGL()) return;
  } catch (err) {
    fail('The fluid shaders could not be compiled on this GPU: ' + (err && err.message ? err.message : err));
    return;
  }
  setTheme(0);
  start();
  showHUD(innerWidth <= 520 ? 2600 : 4500);
  hintTimer = setTimeout(() => hint.classList.add('gone'), 6500);
}

boot();
})();
</script>
</body>
</html>
