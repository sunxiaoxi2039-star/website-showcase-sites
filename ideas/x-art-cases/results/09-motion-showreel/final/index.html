<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Showreel 2026 · Motion Design</title>
<meta name="description" content="A 15-second, 100% procedural motion-graphics showreel. Canvas2D + WebAudio, no footage, no samples. Exportable to WebM.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
:root{--ink:#0d0d10;--paper:#f3efe6;--verm:#ff4b2b;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.ctl{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(66px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:2;transition:opacity .45s,transform .45s}
.ctl.idle,.ctl.clean{opacity:0;transform:translateY(6px);pointer-events:none}
.ctl button{font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--paper);background:rgba(13,13,16,.66);border:1px solid rgba(243,239,230,.28);padding:10px 14px;border-radius:999px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:background .2s,border-color .2s,color .2s}
.ctl button:hover{border-color:var(--verm)}
.ctl button:focus-visible{outline:2px solid var(--verm);outline-offset:2px}
.ctl button[aria-pressed="true"]{background:var(--verm);border-color:var(--verm);color:var(--ink)}
.ctl button[hidden]{display:none}
.ctl .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:8px;vertical-align:1px}
#rec .dot{background:var(--verm)}
#rec[aria-pressed="true"] .dot{background:var(--ink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#status{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translateX(-50%);font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--paper);background:rgba(13,13,16,.74);border:1px solid rgba(255,75,43,.75);padding:9px 14px;border-radius:999px;z-index:3;white-space:nowrap;display:none;pointer-events:none}
#status.on{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
@media (max-width:600px){.ctl{bottom:calc(58px + env(safe-area-inset-bottom));right:max(12px,env(safe-area-inset-right));gap:6px}.ctl button{padding:9px 10px;font-size:9.5px;letter-spacing:.1em}.ctl .dot{margin-right:6px}#status{font-size:9.5px;letter-spacing:.1em}}
@media (prefers-reduced-motion:reduce){.ctl{transition:none}#rec[aria-pressed="true"] .dot{animation:none}}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Procedural motion design showreel, 15 seconds, looping"></canvas>
<p class="sr" id="help">Fifteen-second procedural showreel. Click or tap for sound. Space pauses, S opens the storyboard, the arrow keys jump between scenes, and the timeline at the bottom can be dragged to scrub. Rec exports a WebM video with sound.</p>
<p class="sr" id="live" role="status" aria-live="polite"></p>
<div id="status" aria-hidden="true"></div>
<div class="ctl" id="ctl">
 <button id="grid" aria-pressed="false" title="Storyboard (S)">Board</button>
 <button id="pp" aria-pressed="false" title="Pause (Space)">Pause</button>
 <button id="snd" aria-pressed="false" title="Sound (M)"><span class="dot"></span>Sound off</button>
 <button id="rec" aria-pressed="false" title="Export the 15 s reel as WebM with sound" hidden><span class="dot"></span>Rec</button>
</div>
<script>
(()=>{
'use strict';
/* ---------- timeline: 128 BPM, 32 beats = 8 bars = exactly 15.0 s ---------- */
const TAU=Math.PI*2,BPM=128,BEAT=60/BPM,BAR=BEAT*4,DUR=BAR*8,STEP=BEAT/4;
const INK='#0d0d10',PAPER='#f3efe6',VERM='#ff4b2b',COB='#2b3dff',LEM='#e4ff3c';
const FF='"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif',MONO='"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace';
/* Archivo is a variable font with a real width axis (62%..125%) — driven through ctx.fontStretch */
const WD=['extra-condensed','condensed','semi-condensed','normal','semi-expanded','expanded'],WDV=[62,75,87,100,112,125];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const Q=new URLSearchParams(location.search),CLEAN=Q.has('clean');
const cv=document.getElementById('c'),main=cv.getContext('2d');
let c=main,W=0,H=0,S=0,DPR=1,vig=null,grain=[],dirty=true,inBoard=false,rec=null,glowC=null,glowS=0,ready=false;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;if(rec)DPR=Math.min(DPR,Math.max(1,1920/Math.max(W,H)));
 S=Math.min(W,H);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);vig=null;dirty=true}
addEventListener('resize',resize);

/* ---------- math & easing ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t,seg=(t,a,b)=>clamp((t-a)/(b-a)),fr=x=>x-Math.floor(x);
const eOutExpo=t=>t>=1?1:1-Math.pow(2,-10*t),eInExpo=t=>t<=0?0:Math.pow(2,10*t-10);
const eIOExpo=t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2;
const eIOCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eOutBack=t=>{const a=1.70158;return 1+(a+1)*Math.pow(t-1,3)+a*Math.pow(t-1,2)};
const eOutElastic=t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*TAU/3)+1;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};

/* ---------- drawing helpers ---------- */
function fill(col){c.fillStyle=col;c.fillRect(-60,-60,W+120,H+120)}
function font(px,w=800,st){c.font=`${w} ${px}px ${FF}`;c.fontStretch=st||'normal'}
function mono(px,w=500){c.font=`${w} ${px}px ${MONO}`;c.fontStretch='normal'}
function fitPx(str,maxW,w=800,st){font(100,w,st);return 100*maxW/(c.measureText(str).width||1)}
function rrect(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();if(c.roundRect)c.roundRect(x,y,Math.max(0,w),Math.max(0,h),r);else c.rect(x,y,w,h)}
/* kinetic type: per-glyph masked reveal / exit with stagger (o.wd = width axis keyword) */
function kin(str,x,y,px,t,o={}){
 const st=o.st??.04,du=o.du??.5,tr=o.tr??-.02,al=o.al||'left',from=o.from??1.05,ease=o.ease||eOutExpo,out=o.out??-9;
 font(px,o.w||800,o.wd);
 const ch=[...str],ws=ch.map(k=>c.measureText(k).width+px*tr),tw=ws.reduce((a,b)=>a+b,0)-px*tr;
 const x0=al==='center'?x-tw/2:al==='right'?x-tw:x;
 c.save();
 if(o.mask!==false){c.beginPath();c.rect(x0-px*.3,y-px*.84,tw+px*.6,px*1.06);c.clip()}
 c.textBaseline='alphabetic';c.textAlign='left';
 if(o.stroke){c.strokeStyle=o.col||PAPER;c.lineWidth=o.stroke}else c.fillStyle=o.col||PAPER;
 const draw=(k,xx,yy)=>o.stroke?c.strokeText(k,xx,yy):c.fillText(k,xx,yy);
 let cx=x0;
 for(let i=0;i<ch.length;i++){
  const j=o.rev?ch.length-1-i:i,p=ease(clamp((t-j*st)/du)),q=eInExpo(clamp((out-j*st*.6)/(du*.8)));
  if(p>0&&q<1){
   const dy=(1-p)*px*from-q*px*Math.abs(from)*1.1+(o.wy?o.wy(i):0);
   if(o.rot){c.save();c.translate(cx+ws[i]/2,y+dy);c.rotate((1-p)*o.rot);draw(ch[i],-ws[i]/2,0);c.restore()}
   else draw(ch[i],cx,y+dy);
  }
  cx+=ws[i];
 }
 c.restore();
 return{tw,x0};
}

/* ---------- 01 HELLO: dot -> line -> band -> full frame; the word flexes its width axis ---------- */
function s0(lt){
 const b=lt/BEAT,cx=W/2,cy=H/2;fill(INK);
 const g=eOutExpo(seg(b,0,1.6)),ga=.14*g*(1-seg(b,3.3,3.9));
 c.strokeStyle=`rgba(243,239,230,${ga})`;c.lineWidth=1;
 c.beginPath();c.moveTo(cx-W*.5*g,cy);c.lineTo(cx+W*.5*g,cy);c.moveTo(cx,cy-H*.5*g);c.lineTo(cx,cy+H*.5*g);c.stroke();
 for(let i=-12;i<=12;i++){if(!i)continue;const a=seg(b,.2+Math.abs(i)*.04,.5+Math.abs(i)*.04)*(1-seg(b,3.3,3.9));if(a<=0)continue;
  c.fillStyle=`rgba(243,239,230,${.35*a})`;c.fillRect(cx+i*S*.06-.5,cy-(i%4?3:7),1,i%4?6:14)}
 const pop=eOutBack(seg(b,.05,.6)),st=eIOExpo(seg(b,1,1.75)),op=eIOExpo(seg(b,2,2.7)),full=eIOExpo(seg(b,3.3,3.95));
 const r=S*.034*pop,lr=seg(b,.3,.95);
 if(pop>0&&st<1){const gl=c.createRadialGradient(cx,cy,0,cx,cy,r*6+1);gl.addColorStop(0,`rgba(243,239,230,${.22*(1-st)})`);gl.addColorStop(1,'rgba(243,239,230,0)');c.fillStyle=gl;c.fillRect(cx-r*6-1,cy-r*6-1,r*12+2,r*12+2)}
 if(lr>0&&st<1){c.strokeStyle=PAPER;c.lineWidth=2;c.globalAlpha=1-st;c.beginPath();c.arc(cx,cy,r*2.1+st*S*.1,-Math.PI/2,-Math.PI/2+TAU*eIOCubic(lr));c.stroke();c.globalAlpha=1}
 const lw=lerp(r*2,W+8,st);
 let bh=lerp(lerp(r*2,2,st),S*.34,op);bh=lerp(bh,H+8,full);
 c.fillStyle=PAPER;rrect(cx-lw/2,cy-bh/2,lw,bh,r*(1-st));c.fill();
 if(st>0&&st<1){const k=Math.sin(st*Math.PI);c.fillStyle=`rgba(243,239,230,${.3*k})`;c.fillRect(cx-lw*.64,cy-1,lw*1.28,2)}
 if(b>2.05){
  c.save();c.beginPath();c.rect(-60,cy-bh/2,W+120,bh);c.clip();
  const wi=Math.round(eIOCubic(seg(b,2.45,3.1))*5);
  const px=Math.min(fitPx('HELLO.',W*.8,900,'expanded'),S*.3);
  kin('HELLO.',cx,cy+px*.36,px,lt-2.12*BEAT,{al:'center',col:INK,st:.045,du:.55,out:lt-3.22*BEAT,tr:-.01,w:900,wd:WD[wi]});
  mono(Math.max(10,S*.016));c.fillStyle=INK;c.globalAlpha=seg(b,2.5,2.8)*(1-seg(b,3.15,3.35));
  const mx=Math.max(18,W*.04);c.textBaseline='alphabetic';
  c.textAlign='left';c.fillText('MOTION DESIGN — SHOWREEL',mx,cy-bh/2+24);
  c.textAlign='right';c.fillText(`WDTH ${WDV[wi]}  ·  2026`,W-mx,cy+bh/2-14);
  c.globalAlpha=1;c.restore();
 }
}

/* ---------- 02 KINETIC TYPE: I MAKE / THINGS / MOVE + bouncing ball ---------- */
function ballPos(bu,x0,tw,gy,px){const ph=bu*3,f=fr(ph),h=4*f*(1-f);return{x:x0+tw*(.06+.88*bu),y:gy-h*px*.85,h,f}}
function s1(lt){
 const b=lt/BEAT;fill(PAPER);
 const m=Math.max(18,W*.07),px=Math.min(fitPx('THINGS',W-m*2,800),H*.3),lh=px*.9,y1=H/2-px*.1,y2=y1+lh;
 if(b<2.4){
  const ex=eInExpo(seg(b,2,2.35));
  c.save();c.translate(0,-ex*H*.25);
  const r1=kin('I MAKE',m,y1,px,lt,{col:INK,st:.05,tr:-.02});
  kin('THINGS',m,y2,px,lt-BEAT*.95,{col:INK,st:.035,tr:-.02,from:1.15});
  const ul=eOutExpo(seg(b,1.4,1.9));
  if(ul>0){c.fillStyle=VERM;c.fillRect(m,y2+px*.1,(W-m*2)*ul,Math.max(3,px*.05))}
  mono(Math.max(10,px*.07));c.fillStyle=INK;c.textAlign='right';c.globalAlpha=seg(b,.6,.9);
  c.fillText('(SQUASH & STRETCH)',W-m,y1-px*.82);c.globalAlpha=1;
  const bu=seg(b,.4,1.9);
  if(bu>0&&bu<1){
   const gy=y1-px*.73,R=px*.085;
   for(let j=6;j>=1;j--){const q=ballPos(Math.max(0,bu-j*.016),m,r1.tw,gy,px);c.fillStyle=`rgba(255,75,43,${.22*(1-j/7)})`;c.beginPath();c.arc(q.x,q.y-R,R*.42,0,TAU);c.fill()}
   const p=ballPos(bu,m,r1.tw,gy,px),k=clamp(1-p.h*5),v=Math.abs(1-2*p.f);
   const sy=(1+.3*v*(1-k))*(1-.42*k),sx=1/Math.sqrt(sy)*(1+.1*k);
   /* contact shadow: widens and darkens as the ball lands */
   const sh=1-p.h;c.fillStyle=`rgba(13,13,16,${.06+.2*sh*sh})`;c.beginPath();c.ellipse(p.x,gy+R*.06,R*(.5+.8*sh),R*(.1+.12*sh),0,0,TAU);c.fill();
   const bg=c.createRadialGradient(p.x-R*.35,p.y-R*sy*1.45,R*.08,p.x,p.y-R*sy,R*1.25);bg.addColorStop(0,'#ffa48c');bg.addColorStop(.45,VERM);bg.addColorStop(1,'#c92a12');
   c.fillStyle=bg;c.beginPath();c.ellipse(p.x,p.y-R*sy,R*sx,R*sy,0,0,TAU);c.fill();
  }
  c.restore();
 }
 if(b>=1.95){
  const sl=eOutExpo(seg(b,1.95,2.3));
  c.save();c.beginPath();c.rect(-60,H+60-(H+120)*sl,W+120,(H+120)*sl);c.clip();fill(VERM);
  const mp=Math.min(fitPx('MOVE',W*.9,900,'extra-condensed'),H*.6),yb=H/2+mp*.36,t2=lt-BEAT*2.05,wv=seg(b,2.85,3.1);
  const wy=i=>Math.sin(lt*10-i*1.1)*mp*.06*wv,e=seg(b,2.9,3.15)*(1-seg(b,3.8,4.1));
  const base={al:'center',mask:false,w:900,wd:'extra-condensed',tr:.01,from:-1.4,ease:eOutBack,st:.06,du:.45};
  if(e>0)for(let k=5;k>=1;k--)kin('MOVE',W/2+k*mp*.03*e,yb+k*mp*.03*e,mp,t2,{...base,col:`rgba(13,13,16,${.55*(1-k/6)})`,stroke:1.5,wy:i=>wy(i+k*.4)});
  kin('MOVE',W/2,yb,mp,t2,{...base,col:INK,wy});
  c.restore();
 }
}

/* ---------- 03 SHAPE MORPH: arc-length resampled polygons (preallocated buffers) ---------- */
const NP=200;
function resample(vs,n){const L=[0];for(let i=0;i<vs.length;i++){const a=vs[i],b=vs[(i+1)%vs.length];L.push(L[i]+Math.hypot(b[0]-a[0],b[1]-a[1]))}
 const T=L[vs.length],o=new Float32Array(n*2);let j=0;
 for(let k=0;k<n;k++){const d=k/n*T;while(j<vs.length-1&&L[j+1]<d)j++;const a=vs[j],b=vs[(j+1)%vs.length],u=(d-L[j])/((L[j+1]-L[j])||1);o[k*2]=lerp(a[0],b[0],u);o[k*2+1]=lerp(a[1],b[1],u)}
 return o}
const reg=(n,r,a0)=>Array.from({length:n},(_,i)=>[Math.cos(a0+i*TAU/n)*r,Math.sin(a0+i*TAU/n)*r]);
const starV=(n,r1,r2,a0)=>Array.from({length:n*2},(_,i)=>{const r=i%2?r2:r1,a=a0+i*Math.PI/n;return[Math.cos(a)*r,Math.sin(a)*r]});
const SQ=.95,SHP=[resample(reg(128,1,-Math.PI/2),NP),resample([[0,-SQ],[SQ,-SQ],[SQ,SQ],[-SQ,SQ],[-SQ,-SQ]],NP),resample(reg(3,1.3,-Math.PI/2),NP),resample(starV(5,1.32,.55,-Math.PI/2),NP),resample(reg(128,1,-Math.PI/2),NP)];
const PA=new Float32Array(NP*2),PB=new Float32Array(NP*2);
function shapeAt(b,o){const i=clamp(Math.floor(b),0,3),f=eOutElastic(seg(b-i,0,.8)),P0=SHP[i],P1=SHP[i+1];for(let k=0;k<NP*2;k++)o[k]=P0[k]+(P1[k]-P0[k])*f;return o}
function poly(pts,cx,cy,r,a){const ca=Math.cos(a),sa=Math.sin(a);c.beginPath();for(let i=0;i<NP;i++){const x=pts[i*2],y=pts[i*2+1],X=cx+(x*ca-y*sa)*r,Y=cy+(x*sa+y*ca)*r;i?c.lineTo(X,Y):c.moveTo(X,Y)}c.closePath()}
function orbit(lt,cx,cy,R,side){
 const cols=[PAPER,COB,LEM],tl=-.38;
 if(side<0){c.strokeStyle='rgba(243,239,230,.12)';c.lineWidth=1;c.beginPath();c.ellipse(cx,cy,R*2.3,R*.5,tl,0,TAU);c.stroke()}
 for(let i=0;i<3;i++){const a=lt*2.2+i*TAU/3,z=Math.sin(a);if((z>=0?1:-1)!==side)continue;
  const ex=Math.cos(a)*R*2.3,ey=z*R*.5,x=cx+ex*Math.cos(tl)-ey*Math.sin(tl),y=cy+ex*Math.sin(tl)+ey*Math.cos(tl);
  c.globalAlpha=.55+.45*(z+1)/2;c.fillStyle=cols[i];shape3(i,x,y,S*.024*(1+z*.35),a*1.5);c.globalAlpha=1}
}
function s2(lt){
 const b=lt/BEAT,cx=W/2,cy=H/2,R=S*.19;fill(INK);
 const wp=Math.min(fitPx('SHAPE',W*1.15,800,'expanded'),H*.75);font(wp,800,'expanded');c.textAlign='center';c.textBaseline='alphabetic';
 c.strokeStyle='rgba(243,239,230,.09)';c.lineWidth=1.2;c.strokeText('SHAPE',cx+(.5-lt/BAR)*W*.2,cy+wp*.36);
 /* light: warm glow that breathes on every beat */
 const pulse=Math.exp(-fr(Math.max(0,b))*5),gg=c.createRadialGradient(cx,cy,R*.3,cx,cy,R*2.8);
 gg.addColorStop(0,`rgba(255,75,43,${.26+.2*pulse})`);gg.addColorStop(.5,`rgba(255,75,43,${.07+.05*pulse})`);gg.addColorStop(1,'rgba(255,75,43,0)');c.fillStyle=gg;c.fillRect(cx-R*2.8,cy-R*2.8,R*5.6,R*5.6);
 c.strokeStyle='rgba(243,239,230,.14)';c.lineWidth=1;c.setLineDash([2,6]);c.beginPath();c.arc(cx,cy,R*1.7,0,TAU);c.stroke();c.setLineDash([]);
 c.beginPath();c.moveTo(cx-R*2.6,cy);c.lineTo(cx+R*2.6,cy);c.moveTo(cx,cy-R*2.1);c.lineTo(cx,cy+R*2.1);c.stroke();
 const rot=x=>{x=Math.max(0,x);return(Math.floor(x)+eOutBack(seg(fr(x),0,.5)))*Math.PI/4};
 orbit(lt,cx,cy,R,-1);
 for(let k=6;k>=1;k--){const bb=b-k*.075;poly(shapeAt(bb,PA),cx,cy,R*(1+k*.075),rot(bb));c.strokeStyle=`rgba(243,239,230,${.5*(1-k/7)})`;c.lineWidth=1.2;c.stroke()}
 const sc=1+.09*Math.exp(-fr(Math.max(0,b))*7),pts=shapeAt(b,PB),ra=rot(b);
 /* body: key light from top-left, rim + specular inside a clip */
 poly(pts,cx,cy,R*sc,ra);
 const lg=c.createLinearGradient(cx-R,cy-R,cx+R,cy+R);lg.addColorStop(0,'#ff8a6b');lg.addColorStop(.5,VERM);lg.addColorStop(1,'#b8250f');c.fillStyle=lg;c.fill();
 c.save();c.clip();
 const hg=c.createRadialGradient(cx-R*.55,cy-R*.65,0,cx-R*.55,cy-R*.65,R*1.2);hg.addColorStop(0,'rgba(255,238,222,.42)');hg.addColorStop(1,'rgba(255,238,222,0)');c.fillStyle=hg;c.fillRect(cx-R*2,cy-R*2,R*4,R*4);
 c.strokeStyle='rgba(255,220,200,.5)';c.lineWidth=Math.max(1.5,R*.02);c.stroke();
 c.restore();
 const ua=seg(b,.15,.4)*(1-seg(b,3.35,3.6));
 if(ua>0){
  c.globalAlpha=ua;const ca=Math.cos(ra),sa=Math.sin(ra),tp=i=>{const q=((i%NP)+NP)%NP,x=pts[q*2],y=pts[q*2+1];return[cx+(x*ca-y*sa)*R*sc,cy+(x*sa+y*ca)*R*sc]};
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(let i=0;i<NP;i+=2){const p=tp(i);x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])}
  c.strokeStyle=PAPER;c.fillStyle=PAPER;c.lineWidth=1;c.setLineDash([4,4]);c.strokeRect(x0-8,y0-8,x1-x0+16,y1-y0+16);c.setLineDash([]);
  for(const h of [[x0-8,y0-8],[x1+8,y0-8],[x0-8,y1+8],[x1+8,y1+8]])c.fillRect(h[0]-3,h[1]-3,6,6);
  for(let k=0;k<8;k++){const i=k*NP/8,p=tp(i),a=tp(i+5),q=tp(i-5);let dx=a[0]-q[0],dy=a[1]-q[1];const l=Math.hypot(dx,dy)||1,hl=R*.2;dx=dx/l*hl;dy=dy/l*hl;

let idleT=0;
function wake(){ctl.classList.remove('idle');if(cv.style.cursor==='none')cv.style.cursor='';clearTimeout(idleT);
 if(!RM)idleT=setTimeout(()=>{if(!paused&&!board&&!rec&&!ctl.contains(document.activeElement)){ctl.classList.add('idle');if(!scrub&&!hover)cv.style.cursor='none'}},2600)}
function ui(){bS.innerHTML=`<span class="dot"></span>Sound ${soundLive()?'on':'off'}`;bS.setAttribute('aria-pressed',String(soundLive()));
 bP.textContent=paused?'Play':'Pause';bP.setAttribute('aria-pressed',String(paused));bB.setAttribute('aria-pressed',String(board&&!sheet));
 bR.hidden=!canRec;bR.innerHTML=`<span class="dot"></span>${rec?'Cancel':'Rec'}`;bR.setAttribute('aria-pressed',String(!!rec));
 dirty=true;wake()}
function toggleSound(){if(!A||!A.on)soundOn();else{muted=!muted;A.master.gain.setTargetAtTime(muted?0:.9,A.ac.currentTime,.03)}ui()}
function leaveSheet(){if(sheet){sheet=false;board=false}}
bS.addEventListener('click',e=>{e.stopPropagation();toggleSound()});
bP.addEventListener('click',e=>{e.stopPropagation();if(sheet){leaveSheet();setPause(false)}else setPause(!paused);ui()});
bB.addEventListener('click',e=>{e.stopPropagation();if(sheet)leaveSheet();else board=!board;ui()});
bR.addEventListener('click',e=>{e.stopPropagation();rec?stopExport(true):startExport()});
const nearBar=(x,y)=>!board&&!rec&&!CLEAN&&HG.pw>0&&y>HG.py-14&&y<HG.py+14&&x>HG.x0-10&&x<HG.x1+10;
const scrubTo=x=>seek(clamp((x-HG.x0)/HG.pw)*DUR*.9999);
let skipClick=false;
cv.addEventListener('pointerdown',e=>{if(nearBar(e.clientX,e.clientY)){scrub=true;skipClick=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}scrubTo(e.clientX);e.preventDefault()}else skipClick=false});
cv.addEventListener('pointermove',e=>{if(scrub){scrubTo(e.clientX);return}const h=nearBar(e.clientX,e.clientY);if(h!==hover){hover=h;cv.style.cursor=h?'ew-resize':''}});
const endScrub=()=>{scrub=false};cv.addEventListener('pointerup',endScrub);cv.addEventListener('pointercancel',endScrub);
cv.addEventListener('click',e=>{
 if(skipClick){skipClick=false;return}
 if(board){const i=cells.findIndex(([x,y,w,h])=>e.clientX>=x&&e.clientX<=x+w&&e.clientY>=y&&e.clientY<=y+h);
  if(i>=0){const was=sheet;seek(i*BAR);board=false;sheet=false;if(was)setPause(false);ui()}return}
 if(!A||!A.on)toggleSound();
});
for(const ev of['pointermove','pointerdown','keydown','touchstart'])addEventListener(ev,wake,{passive:true});
ctl.addEventListener('focusin',wake);
addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='BUTTON'&&(e.code==='Space'||e.code==='Enter'))return;
 if(e.code==='Escape'&&rec){stopExport(true);return}
 if(e.code==='Space'){e.preventDefault();if(sheet){leaveSheet();setPause(false)}else setPause(!paused)}
 else if(e.key==='m'||e.key==='M')toggleSound();
 else if(e.key==='s'||e.key==='S'){if(sheet)leaveSheet();else board=!board}
 else if(e.code==='ArrowRight'||e.code==='ArrowLeft'){leaveSheet();const bi=Math.floor((curT()%DUR)/BAR)+(e.code==='ArrowRight'?1:-1);seek(((bi+8)%8)*BAR)}
 else if(e.code==='Home'){leaveSheet();seek(0)}
 else return;
 ui();
});
if(CLEAN)ctl.classList.add('clean');

/* ---------- fonts (variable Archivo + JetBrains Mono, version-locked), then boot ---------- */
const CDN='https://cdn.jsdelivr.net/npm/';
const FACES=[['Archivo','@fontsource-variable/archivo@5.3.0/files/archivo-latin-wdth-normal.woff2',{weight:'100 900',stretch:'62% 125%',display:'block'}],
 ['JetBrains Mono','@fontsource/jetbrains-mono@5.3.0/files/jetbrains-mono-latin-500-normal.woff2',{weight:'500',display:'block'}],
 ['JetBrains Mono','@fontsource/jetbrains-mono@5.3.0/files/jetbrains-mono-latin-700-normal.woff2',{weight:'700',display:'block'}]];
function boot(){
 if(ready)return;ready=true;vig=null;glowC=null;
 seek(parseFloat(Q.get('t'))||0);
 if(RM&&!Q.has('play')){sheet=true;board=true;setPause(true)}
 else if(Q.has('freeze')||Q.has('pause'))setPause(true);
 ui();
}
const loads=FACES.map(([fam,p,d])=>{try{return new FontFace(fam,`url(${CDN}${p})`,d).load().then(f=>{document.fonts.add(f)},()=>{})}catch(e){return Promise.resolve()}});
Promise.race([Promise.all(loads),new Promise(r=>setTimeout(r,2500))]).then(boot,boot);

function loop(){
 requestAnimationFrame(loop);
 if(!ready){c=main;c.setTransform(DPR,0,0,DPR,0,0);fill(INK);const a=.35+.35*Math.sin(performance.now()/180);c.fillStyle=`rgba(243,239,230,${RM?.5:a})`;c.beginPath();c.arc(W/2,H/2,3,0,TAU);c.fill();return}
 const T=curT();
 if(rec){if(T>=DUR){stopExport(false)}else{const s=`● REC  00:${pad(Math.floor(T))} / 00:15  ·  ESC TO CANCEL`;if(stat.textContent!==s)stat.textContent=s;stat.classList.add('on')}}
 const Tm=((T%DUR)+DUR)%DUR;
 if(board){if(sheet&&!dirty)return;drawBoard(Tm);dirty=false}else draw(Tm);
}
resize();makeGrain();ui();requestAnimationFrame(loop);
window.__reel={seek:t=>{seek(t)},pause:()=>{setPause(true)},play:()=>{leaveSheet();setPause(false)},board:v=>{board=!!v;ui()},
 exportStart:startExport,cancelExport:()=>stopExport(true),get recording(){return !!rec},get ready(){return ready},get t(){return curT()}};
})();
</script>
</body>
